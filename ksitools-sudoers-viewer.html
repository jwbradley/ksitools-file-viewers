<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KSI Tools Sudoers Viewer</title>
<style id="appcss">
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:15px; line-height:1.5; background:#fff; color:#1f2328; }
header.bar { position:sticky; top:0; z-index:20; display:flex; gap:8px; align-items:center; padding:10px 16px; background:#f6f8fa; border-bottom:1px solid #d0d7de; flex-wrap:wrap; }
header.bar h1 { font-size:15px; margin:0; font-weight:600; }
header.bar .fname { color:#57606a; font-size:13px; flex:1; min-width:60px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
header.bar .meta { color:#57606a; font-size:12px; }
button, select, input[type=text], textarea { font:inherit; font-size:13px; padding:6px 12px; border:1px solid #d0d7de; border-radius:6px; background:#fff; color:#1f2328; }
button { cursor:pointer; } button:hover { background:#f3f4f6; } button:disabled { opacity:.45; cursor:default; }
#search { width:200px; }
#drop { max-width:900px; margin:36px auto 16px; padding:48px 24px; text-align:center; border:2px dashed #d0d7de; border-radius:12px; color:#57606a; cursor:pointer; }
#drop.hover { border-color:#0969da; background:rgba(9,105,218,.05); color:#0969da; }
#drop strong { display:block; font-size:18px; margin-bottom:6px; color:#1f2328; }
.hint { color:#8b949e; font-size:12px; }
.paste-box { max-width:900px; margin:0 auto 20px; padding:0 16px; }
.paste-box label { display:block; font-size:13px; color:#57606a; margin-bottom:6px; }
#paste, .tarea { width:100%; min-height:110px; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:12.5px; padding:10px; border:1px solid #d0d7de; border-radius:8px; resize:vertical; }
#notice { padding:7px 16px; font-size:12.5px; background:#fff8c5; color:#7a5c00; border-bottom:1px solid #f0c000; display:none; }
#err { max-width:900px; margin:24px auto; padding:16px 20px; border:1px solid #cf222e; border-radius:10px; background:rgba(207,34,46,.06); color:#cf222e; font-family:ui-monospace,monospace; font-size:13px; white-space:pre-wrap; display:none; }
#loading { position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px; background:rgba(255,255,255,.72); color:#57606a; }
#loading.show { display:flex; }
.spinner { width:38px; height:38px; border:4px solid #d0d7de; border-top-color:#0969da; border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

.badge { display:inline-block; font-size:10px; font-weight:600; padding:1px 7px; border-radius:999px; border:1px solid #d0d7de; margin-right:4px; margin-bottom:4px; }
.badge.bad { background:#ffebe9; border-color:#ff8182; color:#cf222e; }
.badge.warn { background:#fff8c5; border-color:#f0c000; color:#7a5c00; }
.badge.ok { background:#dafbe1; border-color:#4ac26b; color:#1a7f37; }
.badge.info { background:#ddf4ff; border-color:#54aeff; color:#0969da; }

.stats { display:none; flex-wrap:wrap; gap:8px; margin:8px 0 12px; padding:0 16px; }
.stat { border:1px solid #d0d7de; border-radius:8px; padding:8px 12px; font-size:12.5px; background:#f6f8fa; min-width:120px; max-width:320px; }
.stat b { display:block; font-size:14px; word-break:break-word; }
.stat .lbl { color:#57606a; font-size:11px; text-transform:uppercase; letter-spacing:.03em; }

.panel { max-width:1100px; margin:12px auto; padding:0 16px 40px; display:none; }
.panel.show { display:block; }
.card { border:1px solid #d0d7de; border-radius:10px; margin-bottom:12px; overflow:hidden; }
.card h2 { margin:0; padding:10px 14px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; background:#f6f8fa; border-bottom:1px solid #d0d7de; color:#57606a; }
.card .body { padding:12px 14px; }
.flags-row { display:flex; flex-wrap:wrap; gap:4px; align-items:center; }

table.grid { border-collapse:collapse; width:100%; font-size:12.5px; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; }
.grid th { position:sticky; top:53px; background:#f6f8fa; text-align:left; padding:8px 10px; border-bottom:1px solid #d0d7de; white-space:nowrap; z-index:5; }
.grid td { padding:6px 10px; border-bottom:1px solid #f0f2f4; vertical-align:top; word-break:break-word; }
.grid tr:hover td { background:rgba(175,184,193,.12); }
.grid tr { cursor:pointer; }
.grid tr.selected td { background:rgba(9,105,218,.1); }
.grid td.key { color:#0550ae; font-weight:600; white-space:nowrap; width:1%; }
.grid td.sec { color:#57606a; white-space:nowrap; width:1%; }
.grid td.ln { color:#8b949e; width:1%; text-align:right; font-variant-numeric:tabular-nums; }

pre.block { margin:0; padding:10px 12px; background:#f6f8fa; border-radius:8px; white-space:pre-wrap; word-break:break-word; max-height:28vh; overflow:auto; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:12px; }
.ctx-line { display:block; padding:1px 4px; border-radius:3px; }
.ctx-line.cur { background:rgba(9,105,218,.15); font-weight:600; }
.hit { background:#fff3c4; border-radius:3px; box-shadow:0 0 0 1px #f0c000; }

@media (prefers-color-scheme: dark) {
  body { background:#0d1117; color:#e6edf3; }
  header.bar { background:#161b22; border-bottom-color:#30363d; }
  header.bar .fname, header.bar .meta, .hint, .paste-box label, .stat .lbl { color:#8b949e; }
  button, select, input[type=text], textarea, #paste, .tarea { background:#21262d; color:#e6edf3; border-color:#30363d; }
  button:hover { background:#30363d; }
  #drop { border-color:#30363d; color:#8b949e; } #drop strong { color:#e6edf3; }
  #drop.hover { border-color:#4493f8; color:#4493f8; }
  .stat { background:#161b22; border-color:#30363d; }
  .card { border-color:#30363d; }
  .card h2 { background:#161b22; border-bottom-color:#30363d; color:#8b949e; }
  .grid th { background:#161b22; border-bottom-color:#30363d; }
  .grid td { border-bottom-color:#21262d; }
  .grid tr:hover td { background:rgba(110,118,129,.12); }
  .grid tr.selected td { background:rgba(31,111,235,.2); }
  .grid td.key { color:#79c0ff; }
  .grid td.sec { color:#8b949e; }
  .grid td.ln { color:#6e7681; }
  .badge { border-color:#30363d; }
  .badge.bad { background:#3d1418; border-color:#f85149; color:#ff7b72; }
  .badge.warn { background:#3a2f00; border-color:#b58900; color:#e3b341; }
  .badge.ok { background:#12261e; border-color:#238636; color:#3fb950; }
  .badge.info { background:#121d2f; border-color:#1f6feb; color:#58a6ff; }
  pre.block { background:#161b22; }
  .ctx-line.cur { background:rgba(31,111,235,.25); }
  .hit { background:#634c00; color:#ffe08a; box-shadow:0 0 0 1px #b58900; }
  #notice { background:#3a2f00; color:#e3b341; border-bottom-color:#b58900; }
  #err { border-color:#f85149; color:#ff7b72; background:rgba(248,81,73,.08); }
  #loading { background:rgba(13,17,23,.75); }
  .spinner { border-color:#30363d; border-top-color:#4493f8; }
}
</style>
</head>
<body>

<header class="bar">
  <h1>KSI Tools Sudoers Viewer</h1>
  <span class="fname" id="fname"></span>
  <span class="meta" id="meta"></span>
  <input type="text" id="search" placeholder="Filter who / host / cmd…" disabled>
  <button id="copy" disabled title="Copy a plain-English summary">Copy summary</button>
  <button id="savejson" disabled>Save .json</button>
  <button id="savecsv" disabled>Save .csv</button>
  <button id="pick" onclick="document.getElementById('file').click()">Open file</button>
</header>
<input type="file" id="file" accept=".sudoers,.conf,.txt,text/plain" style="display:none">

<div id="drop">
  <strong>Drop a sudoers file here</strong>
  or click to choose · /etc/sudoers · /etc/sudoers.d/*
  <div class="hint" style="margin-top:10px">Parsed locally for ops review. Nothing is uploaded.</div>
</div>

<div class="paste-box">
  <label for="paste">Or paste sudoers contents:</label>
  <textarea id="paste" class="tarea" spellcheck="false" placeholder="Defaults    env_reset&#10;root    ALL=(ALL:ALL) ALL&#10;%admin  ALL=(ALL) ALL&#10;&#10;Cmnd_Alias SHELLS = /bin/bash, /bin/sh, /bin/su&#10;joe     ALL=(root) NOPASSWD: /usr/bin/apt"></textarea>
  <div style="margin-top:8px"><button id="goBtn">Analyze paste</button></div>
</div>

<div id="err"></div>
<div id="notice"></div>
<div class="stats" id="stats"></div>
<div class="panel" id="panel"></div>

<div id="loading"><div class="spinner"></div><div id="loadingmsg">Loading…</div></div>

<script>
(function () {
'use strict';

const MAX_BYTES = 5 * 1024 * 1024;

const ALIAS_KW = ['User_Alias', 'Cmnd_Alias', 'Host_Alias', 'Runas_Alias'];
const TAG_TOKENS = ['NOPASSWD', 'PASSWD', 'NOEXEC', 'EXEC', 'SETENV', 'NOSETENV',
  'LOG_INPUT', 'NOLOG_INPUT', 'LOG_OUTPUT', 'NOLOG_OUTPUT', 'MAIL', 'NOMAIL',
  'FOLLOW', 'NOFOLLOW'];

// command tokens that are classic privilege-escalation vectors (shell escapes / su / editors)
const ESCALATION_RE = /(^|\/)(su|sudoedit|visudo|bash|sh|zsh|ksh|csh|tcsh|vi|vim|ex|less|more|find|awk|gawk|perl|python[0-9]?|ruby|nmap|env|tee|cp|mv|dd|cat|tar|zip|unzip|gzip|gunzip|chmod|chown|mount|umount|strace|ltrace|gdb|node)(\b|$)/i;

const drop = document.getElementById('drop');
const errBox = document.getElementById('err');
const noticeEl = document.getElementById('notice');
const fname = document.getElementById('fname');
const metaEl = document.getElementById('meta');
const pasteEl = document.getElementById('paste');
const fileInput = document.getElementById('file');
const searchIn = document.getElementById('search');
const loadingEl = document.getElementById('loading');
const loadingMsg = document.getElementById('loadingmsg');
const statsEl = document.getElementById('stats');
const panel = document.getElementById('panel');
const btns = {
  copy: document.getElementById('copy'),
  savejson: document.getElementById('savejson'),
  savecsv: document.getElementById('savecsv')
};

let currentName = 'sudoers';
let currentFileName = '';
let rawLines = [];
let state = null; // { summary, flags, aliases, defaults, rules, rows }

function showLoading(m) { loadingMsg.textContent = m || 'Loading…'; loadingEl.classList.add('show'); }
function hideLoading() { loadingEl.classList.remove('show'); }
function afterPaint(fn) { requestAnimationFrame(() => requestAnimationFrame(fn)); }
function showError(m) { errBox.style.display = 'block'; errBox.textContent = m; }
function clearError() { errBox.style.display = 'none'; errBox.textContent = ''; }
function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: type || 'text/plain' }));
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}
function csvEsc(v) {
  const s = String(v ?? '');
  return /["\n,]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function fmtBytes(n) {
  if (n >= 1024 * 1024) return (n / (1024 * 1024)).toFixed(1) + ' MB';
  if (n >= 1024) return (n / 1024).toFixed(1) + ' KB';
  return n + ' bytes';
}
function wireDrop(loadFn) {
  drop.onclick = () => fileInput.click();
  fileInput.onchange = () => { if (fileInput.files[0]) loadFn(fileInput.files[0]); fileInput.value = ''; };
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('hover'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('hover'); }));
  drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) loadFn(f); });
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => {
    if (e.target.closest && e.target.closest('#drop')) return;
    e.preventDefault();
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) loadFn(f);
  });
}

/** Join physical lines with trailing \ into logical lines; track start line. */
function logicalLines(text) {
  const phys = text.replace(/^﻿/, '').split(/\r\n|\n|\r/);
  rawLines = phys;
  const out = [];
  let buf = '';
  let start = 1;
  let continuing = false;
  for (let i = 0; i < phys.length; i++) {
    const ln = i + 1;
    const raw = phys[i];
    const trimmedEnd = raw.replace(/\s+$/, '');
    if (!continuing) {
      const t = raw.trim();
      if (!t || t.startsWith('#') || t.startsWith(';')) continue;
      start = ln;
      if (trimmedEnd.endsWith('\\')) {
        buf = trimmedEnd.slice(0, -1);
        continuing = true;
      } else {
        out.push({ line: ln, text: raw.trim() });
      }
    } else {
      if (trimmedEnd.endsWith('\\')) {
        buf += trimmedEnd.slice(0, -1);
      } else {
        buf += raw.trim();
        out.push({ line: start, text: buf.trim() });
        buf = '';
        continuing = false;
      }
    }
  }
  if (continuing && buf.trim()) out.push({ line: start, text: buf.trim() });
  return out;
}

/** Split a comma-separated list, respecting that items themselves contain no commas (true for sudoers). */
function splitList(s) {
  return String(s || '')
    .split(',')
    .map(x => x.trim())
    .filter(x => x.length);
}

/** Tokenize a sudoers RHS (the part after `=`): optional (runas), optional tags, then cmd list. */
function parseRhs(rhs) {
  let rest = String(rhs || '').trim();
  let runas = '';
  // (runas) group — may be (user), (user:group), (ALL:ALL), possibly nested spaces
  const m = /^\(([^)]*)\)\s*(.*)$/.exec(rest);
  if (m) {
    runas = m[1].trim();
    rest = m[2].trim();
  }
  // Leading tags (TAG:) repeated until a non-tag token appears
  const tags = [];
  let changed = true;
  while (changed) {
    changed = false;
    for (const tag of TAG_TOKENS) {
      const re = new RegExp('^' + tag + '\\s*:\\s*', 'i');
      if (re.test(rest)) {
        tags.push(tag);
        rest = rest.replace(re, '');
        changed = true;
        break;
      }
    }
  }
  const cmds = splitList(rest);
  return { runas, tags, cmds };
}

/**
 * Parse sudoers text.
 * Returns { aliases: {TYPE: {NAME: [members...], _lines:[...]}}, defaults: [{scope, setting, line}],
 *          rules: [{line, who, host, runas, tags, cmds, raw}] }
 */
function parseSudoers(text) {
  const logical = logicalLines(text);
  const aliases = { User_Alias: {}, Cmnd_Alias: {}, Host_Alias: {}, Runas_Alias: {} };
  const defaults = [];
  const rules = [];

  for (const item of logical) {
    const t = item.text;
    const line = item.line;

    // Alias definitions: KW NAME = a, b, c   (NAME list may also be "NAME1, NAME2 = ..." but rare; handle single name)
    let matched = false;
    for (const kw of ALIAS_KW) {
      const re = new RegExp('^' + kw + '\\b\\s+(.+?)\\s*=\\s*(.+)$', 'i');
      const m = re.exec(t);
      if (m) {
        const names = splitList(m[1]);
        const members = splitList(m[2]);
        for (const nm of names) {
          if (!aliases[kw][nm]) aliases[kw][nm] = { members: [], lines: [] };
          aliases[kw][nm].members.push(...members);
          aliases[kw][nm].lines.push(line);
        }
        matched = true;
        break;
      }
    }
    if (matched) continue;

    // Defaults (with optional scope specifier)
    const dm = /^Defaults(?:([:@>!])(\S+))?\s+(.+)$/.exec(t);
    if (dm) {
      const scopeMark = dm[1] || '';
      const scopeTarget = dm[2] || '';
      const scope = scopeMark ? scopeMark + scopeTarget : 'global';
      defaults.push({ line, scope, setting: dm[3].trim(), raw: t });
      continue;
    }
    // Bare "Defaults" with nothing else — malformed
    if (/^Defaults\b\s*$/i.test(t)) {
      defaults.push({ line, scope: 'global', setting: '(empty)', raw: t, malformed: true });
      continue;
    }

    // User rule: WHO  HOST = RHS   — but WHO may be a comma list, HOST may be a comma list
    // Strategy: find the FIRST `=` that is not inside parentheses. That splits (WHO HOST) from RHS.
    let eqIdx = -1;
    let depth = 0;
    for (let i = 0; i < t.length; i++) {
      const c = t[i];
      if (c === '(') depth++;
      else if (c === ')') depth = Math.max(0, depth - 1);
      else if (c === '=' && depth === 0) { eqIdx = i; break; }
    }
    if (eqIdx < 0) {
      // No '=' — malformed rule
      rules.push({ line, who: t, host: '', runas: '', tags: [], cmds: [], raw: t, malformed: true });
      continue;
    }
    const lhs = t.slice(0, eqIdx).trim();
    const rhs = t.slice(eqIdx + 1).trim();
    // Split LHS into WHO and HOST: WHO is the first token-list, HOST is the remainder.
    // We assume WHO is a single whitespace-delimited token group (comma list with no spaces inside),
    // and HOST is everything after the first whitespace run. This covers the common 90%.
    const ws = /\s+/.exec(lhs);
    let who, host;
    if (ws) {
      who = lhs.slice(0, ws.index).trim();
      host = lhs.slice(ws.index + ws[0].length).trim();
    } else {
      who = lhs;
      host = '';
    }
    const { runas, tags, cmds } = parseRhs(rhs);
    rules.push({ line, who, host, runas, tags, cmds, raw: t, malformed: false });
  }

  return { aliases, defaults, rules };
}

function aliasMembers(aliases, type, name) {
  const a = aliases[type] && aliases[type][name];
  return a ? a.members.slice() : null;
}

function buildSummary(parsed, filename) {
  const aliasCount =
    Object.keys(parsed.aliases.User_Alias).length +
    Object.keys(parsed.aliases.Cmnd_Alias).length +
    Object.keys(parsed.aliases.Host_Alias).length +
    Object.keys(parsed.aliases.Runas_Alias).length;
  const ruleCount = parsed.rules.length;
  const nopasswdCount = parsed.rules.filter(r => r.tags.map(t => t.toUpperCase()).includes('NOPASSWD')).length;
  const malformedCount = parsed.rules.filter(r => r.malformed).length +
    parsed.defaults.filter(d => d.malformed).length;

  // unique who / host / cmd counts (literal, not alias-resolved)
  const whoSet = new Set();
  const hostSet = new Set();
  const cmdSet = new Set();
  for (const r of parsed.rules) {
    for (const w of splitList(r.who)) whoSet.add(w);
    for (const h of splitList(r.host)) hostSet.add(h);
    for (const c of r.cmds) cmdSet.add(c);
  }

  return {
    filename: filename || '',
    aliasCount,
    defaultsCount: parsed.defaults.length,
    ruleCount,
    nopasswdCount,
    malformedCount,
    uniqueWho: whoSet.size,
    uniqueHost: hostSet.size,
    uniqueCmds: cmdSet.size
  };
}

function analyzeFlags(parsed) {
  const flags = [];
  const aliases = parsed.aliases;
  const seenDupAlias = new Set();

  // Duplicate alias name (same TYPE+NAME defined more than once across any lines)
  for (const type of ALIAS_KW) {
    for (const name of Object.keys(aliases[type])) {
      if (aliases[type][name].lines.length > 1 && !seenDupAlias.has(type + name)) {
        seenDupAlias.add(type + name);
        flags.push({
          level: 'info',
          label: 'duplicate ' + type.replace('_Alias', '') + ' ' + name,
          detail: name + ' defined ' + aliases[type][name].lines.length + ' times (lines ' + aliases[type][name].lines.join(', ') + ').'
        });
      }
    }
  }

  // Defaults heuristics
  for (const d of parsed.defaults) {
    const s = d.setting;
    if (d.malformed) {
      flags.push({ level: 'bad', label: 'malformed Defaults', detail: 'Line ' + d.line + ': empty Defaults statement.' });
      continue;
    }
    if (/^!authenticate\b/i.test(s) || /\b!authenticate\b/i.test(s)) {
      flags.push({ level: 'bad', label: '!authenticate', detail: 'Line ' + d.line + ': password authentication disabled via Defaults !authenticate.' });
    }
    if (/^visiblepw\b/i.test(s) || /(^|\s)visiblepw\b/i.test(s)) {
      flags.push({ level: 'bad', label: 'visiblepw', detail: 'Line ' + d.line + ': visiblepw set — passwords echo on terminals.' });
    }
    if (/env_keep\s*\+=/i.test(s) && /(LD_PRELOAD|LD_LIBRARY_PATH|LD_\*)/.test(s)) {
      flags.push({ level: 'warn', label: 'env_keep LD_*', detail: 'Line ' + d.line + ': keeping LD_* in env_keep enables library injection.' });
    }
    if (/env_keep\s*\+=\s*"[^"]*LD_/.test(s)) {
      flags.push({ level: 'warn', label: 'env_keep LD_*', detail: 'Line ' + d.line + ': keeping LD_* in env_keep enables library injection.' });
    }
  }

  // Rule heuristics
  for (const r of parsed.rules) {
    const whoList = splitList(r.who);
    const hostList = splitList(r.host);
    const cmdList = r.cmds;
    const tagSet = new Set(r.tags.map(t => t.toUpperCase()));
    const hasNopasswd = tagSet.has('NOPASSWD');
    const hasAllWho = whoList.includes('ALL');
    const hasAllHost = hostList.includes('ALL');
    const hasAllRunas = (r.runas || '').toUpperCase() === 'ALL' || (r.runas || '').toUpperCase() === 'ALL:ALL';
    const hasAllCmd = cmdList.includes('ALL');

    if (r.malformed) {
      flags.push({ level: 'bad', label: 'malformed rule', detail: 'Line ' + r.line + ': no "=" found; cannot parse as a user rule.' });
      continue;
    }

    // NOPASSWD: ALL
    if (hasNopasswd && hasAllCmd) {
      flags.push({
        level: 'bad',
        label: 'NOPASSWD: ALL',
        detail: 'Line ' + r.line + ': ' + r.who + ' can run ALL commands with no password.'
      });
    } else if (hasNopasswd) {
      flags.push({
        level: 'warn',
        label: 'NOPASSWD',
        detail: 'Line ' + r.line + ': ' + r.who + ' may run commands without a password: ' + cmdList.join(', ')
      });
    }

    // Blanket grant: ALL = (ALL) ALL
    if (hasAllWho && hasAllHost && hasAllRunas && hasAllCmd) {
      flags.push({
        level: 'warn',
        label: 'blanket grant',
        detail: 'Line ' + r.line + ': ALL ALL=(ALL) ALL — full sudo for everyone.'
      });
    }

    // Broad group with NOPASSWD
    if (hasNopasswd) {
      for (const w of whoList) {
        if (/^%(admin|wheel|sudo|staff)$/i.test(w)) {
          flags.push({
            level: 'warn',
            label: 'broad group NOPASSWD',
            detail: 'Line ' + r.line + ': ' + w + ' granted NOPASSWD — broad group with passwordless sudo.'
          });
          break;
        }
      }
    }

    // Shell escapes / escalation vectors in command list
    for (const c of cmdList) {
      if (c === 'ALL') continue;
      if (ESCALATION_RE.test(c)) {
        flags.push({
          level: 'warn',
          label: 'shell-escape cmd',
          detail: 'Line ' + r.line + ': command "' + c + '" is a classic privilege-escalation vector.'
        });
        break;
      }
    }

    // Wildcards in command path
    for (const c of cmdList) {
      if (c === 'ALL') continue;
      if (/[*?]/.test(c) && /\.\./.test(c)) {
        flags.push({
          level: 'warn',
          label: 'wildcard + ..',
          detail: 'Line ' + r.line + ': command "' + c + '" combines wildcards with ".." — bypass risk.'
        });
        break;
      } else if (/[*?]/.test(c)) {
        flags.push({
          level: 'warn',
          label: 'wildcard cmd',
          detail: 'Line ' + r.line + ': command "' + c + '" uses wildcards — verify scope.'
        });
        break;
      }
    }
  }

  if (!flags.length) {
    flags.push({ level: 'ok', label: 'no major flags', detail: 'Heuristic checks found nothing loud.' });
  }
  return flags;
}

function flattenRows(parsed) {
  // The "rule table" is the primary grid. Aliases and defaults are shown in their own cards.
  return parsed.rules.map(r => ({
    line: r.line,
    who: r.who,
    host: r.host,
    runas: r.runas,
    tags: r.tags.join(','),
    commands: r.cmds.join(', '),
    raw: r.raw,
    malformed: !!r.malformed
  }));
}

function plainSummary(st) {
  const s = st.summary;
  const lines = [];
  lines.push('KSI Tools Sudoers Viewer — summary');
  lines.push('File: ' + (s.filename || currentFileName || '(paste)'));
  lines.push('Aliases: ' + s.aliasCount + ' · Defaults: ' + s.defaultsCount + ' · User rules: ' + s.ruleCount);
  lines.push('NOPASSWD rules: ' + s.nopasswdCount + (s.malformedCount ? ' · malformed: ' + s.malformedCount : ''));
  lines.push('Distinct who: ' + s.uniqueWho + ' · distinct hosts: ' + s.uniqueHost + ' · distinct commands: ' + s.uniqueCmds);

  lines.push('');
  lines.push('Flags:');
  for (const f of st.flags) {
    lines.push('  [' + f.level + '] ' + f.label + (f.detail ? ' — ' + f.detail : ''));
  }
  return lines.join('\n');
}

function exportJson(st) {
  return {
    aliases: st.aliases,
    defaults: st.defaults.map(d => ({ line: d.line, scope: d.scope, setting: d.setting, raw: d.raw, malformed: !!d.malformed })),
    rules: st.rules.map(r => ({
      line: r.line,
      who: r.who,
      host: r.host,
      runas: r.runas,
      tags: r.tags,
      commands: r.cmds,
      raw: r.raw,
      malformed: !!r.malformed
    })),
    flags: st.flags.map(f => ({ level: f.level, label: f.label, detail: f.detail }))
  };
}

function highlight(text, q) {
  if (!q) return esc(text);
  const s = String(text ?? '');
  const low = s.toLowerCase();
  const idx = low.indexOf(q);
  if (idx < 0) return esc(s);
  return esc(s.slice(0, idx)) + '<span class="hit">' + esc(s.slice(idx, idx + q.length)) + '</span>' + esc(s.slice(idx + q.length));
}

function contextHtml(lineNo) {
  const i = lineNo - 1;
  const from = Math.max(0, i - 3);
  const to = Math.min(rawLines.length - 1, i + 3);
  let html = '';
  for (let n = from; n <= to; n++) {
    const cur = n === i ? ' cur' : '';
    html += '<span class="ctx-line' + cur + '">' + esc(String(n + 1).padStart(4, ' ')) + ' │ ' + esc(rawLines[n]) + '</span>';
  }
  return html;
}

function filteredRows() {
  if (!state) return [];
  const q = searchIn.value.trim().toLowerCase();
  if (!q) return state.rows;
  return state.rows.filter(r =>
    (r.who + ' ' + r.host + ' ' + r.runas + ' ' + r.tags + ' ' + r.commands).toLowerCase().includes(q)
  );
}

function aliasCardHtml(parsed) {
  let html = '<div class="card"><h2>Aliases</h2><div class="body" style="padding:0">';
  let any = false;
  html += '<table class="grid"><thead><tr><th>Line</th><th>Type</th><th>Name</th><th>Members</th></tr></thead><tbody>';
  for (const type of ALIAS_KW) {
    for (const name of Object.keys(parsed.aliases[type])) {
      any = true;
      const a = parsed.aliases[type][name];
      html += '<tr data-line="' + a.lines[0] + '">' +
        '<td class="ln">' + a.lines.join(',') + '</td>' +
        '<td class="sec">' + esc(type.replace('_Alias', '')) + '</td>' +
        '<td class="key">' + esc(name) + '</td>' +
        '<td>' + esc(a.members.join(', ')) + '</td></tr>';
    }
  }
  if (!any) {
    html += '<tr><td colspan="4" style="color:#8b949e;padding:16px">No alias definitions.</td></tr>';
  }
  html += '</tbody></table></div></div>';
  return html;
}

function defaultsCardHtml(parsed) {
  let html = '<div class="card"><h2>Defaults</h2><div class="body" style="padding:0">';
  html += '<table class="grid"><thead><tr><th>Line</th><th>Scope</th><th>Setting</th></tr></thead><tbody>';
  if (!parsed.defaults.length) {
    html += '<tr><td colspan="3" style="color:#8b949e;padding:16px">No Defaults statements.</td></tr>';
  } else {
    for (const d of parsed.defaults) {
      html += '<tr data-line="' + d.line + '">' +
        '<td class="ln">' + d.line + '</td>' +
        '<td class="sec">' + esc(d.scope) + (d.malformed ? ' <span class="badge bad">malformed</span>' : '') + '</td>' +
        '<td>' + esc(d.setting) + '</td></tr>';
    }
  }
  html += '</tbody></table></div></div>';
  return html;
}

function draw() {
  if (!state) return;
  const q = searchIn.value.trim().toLowerCase();
  const list = filteredRows();
  const s = state.summary;

  // stats cards
  const cards = [];
  cards.push({ lbl: 'Aliases', val: String(s.aliasCount) });
  cards.push({ lbl: 'Defaults', val: String(s.defaultsCount) });
  cards.push({ lbl: 'User rules', val: String(s.ruleCount) });
  cards.push({ lbl: 'NOPASSWD rules', val: String(s.nopasswdCount) });
  if (s.malformedCount) cards.push({ lbl: 'Malformed', val: String(s.malformedCount) });
  cards.push({ lbl: 'Distinct who', val: String(s.uniqueWho) });
  cards.push({ lbl: 'Distinct hosts', val: String(s.uniqueHost) });
  cards.push({ lbl: 'Distinct commands', val: String(s.uniqueCmds) });

  statsEl.style.display = 'flex';
  statsEl.innerHTML = cards.map(c =>
    '<div class="stat"><span class="lbl">' + esc(c.lbl) + '</span><b>' + esc(c.val) + '</b></div>'
  ).join('');

  const warnCount = state.flags.filter(f => f.level === 'bad' || f.level === 'warn').length;
  metaEl.textContent = s.ruleCount + ' rules · ' + s.aliasCount + ' aliases · ' + s.defaultsCount + ' defaults' +
    (warnCount ? ' · ' + warnCount + ' flag' + (warnCount === 1 ? '' : 's') : '') +
    (q ? ' · ' + list.length + ' shown' : '');

  // Notice bar — always show the syntax caveat when there is parsed content
  noticeEl.style.display = 'block';
  noticeEl.textContent = 'Heuristic parse of the common 90% of sudoers grammar; not a substitute for `visudo -c`.' +
    (warnCount ? ' ' + warnCount + ' flag(s) for ops review.' : '');

  let html = '';

  // Flags card
  html += '<div class="card"><h2>Flags</h2><div class="body"><div class="flags-row">';
  for (const f of state.flags) {
    html += '<span class="badge ' + esc(f.level) + '" title="' + esc(f.detail || '') + '">' + esc(f.label) + '</span>';
  }
  html += '</div>';
  html += '<ul style="margin:10px 0 0;padding-left:18px;font-size:12.5px;color:inherit">';
  for (const f of state.flags) {
    if (f.level === 'ok') continue;
    html += '<li><strong>' + esc(f.label) + '</strong> — ' + esc(f.detail || '') + '</li>';
  }
  html += '</ul></div></div>';

  // Rule table (primary)
  html += '<div class="card"><h2>Rule table</h2><div class="body" style="padding:0">';
  html += '<table class="grid"><thead><tr><th>Line</th><th>Who</th><th>Host</th><th>Runas</th><th>Tags</th><th>Commands</th></tr></thead><tbody id="tbody">';
  for (const r of list) {
    html += '<tr data-line="' + r.line + '">' +
      '<td class="ln">' + r.line + '</td>' +
      '<td class="key">' + highlight(r.who, q) + (r.malformed ? ' <span class="badge bad">malformed</span>' : '') + '</td>' +
      '<td class="sec">' + highlight(r.host, q) + '</td>' +
      '<td class="sec">' + highlight(r.runas, q) + '</td>' +
      '<td>' + highlight(r.tags, q) + '</td>' +
      '<td>' + highlight(r.commands, q) + '</td></tr>';
  }
  if (!list.length) {
    html += '<tr><td colspan="6" style="color:#8b949e;padding:16px">No rows match the filter.</td></tr>';
  }
  html += '</tbody></table></div></div>';

  // Aliases + Defaults cards
  html += aliasCardHtml(state.parsed);
  html += defaultsCardHtml(state.parsed);

  // Context card
  html += '<div class="card" id="ctxcard" style="display:none"><h2>Line context</h2><div class="body"><pre class="block" id="ctxpre"></pre></div></div>';

  panel.innerHTML = html;
  panel.classList.add('show');

  // Wire row clicks across all grids
  const tables = panel.querySelectorAll('table.grid');
  tables.forEach(tb => {
    const body = tb.querySelector('tbody');
    if (!body) return;
    body.addEventListener('click', e => {
      const tr = e.target.closest('tr[data-line]');
      if (!tr) return;
      tb.querySelectorAll('tr.selected').forEach(x => x.classList.remove('selected'));
      tr.classList.add('selected');
      const line = +tr.getAttribute('data-line');
      const card = document.getElementById('ctxcard');
      const pre = document.getElementById('ctxpre');
      if (card && pre) {
        card.style.display = 'block';
        pre.innerHTML = contextHtml(line);
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    });
  });
}

function render(text, name) {
  showLoading('Parsing sudoers…');
  afterPaint(() => {
    try {
      clearError();
      const parsed = parseSudoers(text);
      if (!parsed.rules.length && !parsed.defaults.length && !Object.values(parsed.aliases).some(o => Object.keys(o).length)) {
        throw new Error('No sudoers rules, aliases, or Defaults statements found.');
      }

      currentFileName = name || '(paste)';
      currentName = (name || 'sudoers').replace(/\.(sudoers|conf|txt)$/i, '');
      const summary = buildSummary(parsed, currentFileName);
      const flags = analyzeFlags(parsed);
      const rows = flattenRows(parsed);
      state = { summary, flags, aliases: parsed.aliases, defaults: parsed.defaults, rules: parsed.rules, rows, parsed };

      fname.textContent = currentFileName;
      document.title = currentName + ' — KSI Tools Sudoers Viewer';
      drop.style.display = 'none';
      document.querySelector('.paste-box').style.display = 'none';
      searchIn.disabled = false;
      Object.values(btns).forEach(b => b.disabled = false);
      searchIn.value = '';
      draw();
    } catch (e) {
      showError(e.message || String(e));
      statsEl.style.display = 'none';
      panel.classList.remove('show');
    }
    hideLoading();
  });
}

function loadFile(file) {
  if (!file) return;
  if (file.size > MAX_BYTES) {
    showError('That file is ' + fmtBytes(file.size) + ', over the ' + fmtBytes(MAX_BYTES) + ' limit for sudoers files.');
    return;
  }
  showLoading('Reading ' + file.name + '…');
  const r = new FileReader();
  r.onload = () => render(String(r.result || ''), file.name);
  r.onerror = () => { hideLoading(); showError('Could not read the file.'); };
  r.readAsText(file);
}

wireDrop(loadFile);
document.getElementById('goBtn').onclick = () => {
  const t = pasteEl.value;
  if (!t.trim()) { showError('Paste sudoers contents first.'); return; }
  render(t, '(paste)');
};
searchIn.addEventListener('input', () => { clearTimeout(searchIn._t); searchIn._t = setTimeout(draw, 120); });

btns.copy.onclick = async () => {
  if (!state) return;
  try {
    await navigator.clipboard.writeText(plainSummary(state));
    const old = btns.copy.textContent;
    btns.copy.textContent = 'Copied!';
    setTimeout(() => { btns.copy.textContent = old; }, 1200);
  } catch (e) {
    alert('Copy failed — browser blocked clipboard access.');
  }
};

btns.savejson.onclick = () => {
  if (!state) return;
  download(currentName + '.json', JSON.stringify(exportJson(state), null, 2), 'application/json');
};

btns.savecsv.onclick = () => {
  if (!state) return;
  const rows = filteredRows();
  const lines = ['line,who,host,runas,tags,commands'].concat(
    rows.map(r => [csvEsc(r.line), csvEsc(r.who), csvEsc(r.host), csvEsc(r.runas), csvEsc(r.tags), csvEsc(r.commands)].join(','))
  );
  download(currentName + '.csv', lines.join('\n'), 'text/csv');
};

})();
</script>
</body>
</html>
