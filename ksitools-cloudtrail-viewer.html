<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KSI Tools CloudTrail Viewer</title>
<style id="appcss">
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:15px; line-height:1.5; background:#fff; color:#1f2328; }
header.bar { position:sticky; top:0; z-index:20; display:flex; gap:6px; align-items:center; padding:8px 14px; background:#f6f8fa; border-bottom:1px solid #d0d7de; flex-wrap:wrap; }
header.bar h1 { font-size:14px; margin:0; font-weight:600; white-space:nowrap; }
header.bar .fname { color:#57606a; font-size:12px; flex:1; min-width:60px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
button, select, input[type=text] { font:inherit; font-size:12px; padding:5px 10px; border:1px solid #d0d7de; border-radius:6px; background:#fff; color:#1f2328; }
button { cursor:pointer; } button:hover { background:#f3f4f6; } button:disabled { opacity:.45; cursor:default; }
#search { width:200px; }
#drop { max-width:960px; margin:32px auto 16px; padding:48px 24px; text-align:center; border:2px dashed #d0d7de; border-radius:12px; color:#57606a; cursor:pointer; }
#drop.hover { border-color:#0969da; background:rgba(9,105,218,.05); color:#0969da; }
#drop strong { display:block; font-size:18px; margin-bottom:6px; color:#1f2328; }
.hint { color:#8b949e; font-size:12px; }
.chips { max-width:960px; margin:0 auto 8px; padding:0 14px; display:none; flex-wrap:wrap; gap:8px; }
.chip { display:inline-flex; flex-direction:column; background:#f6f8fa; border:1px solid #d0d7de; border-radius:8px; padding:6px 12px; min-width:80px; }
.chip .cv { font-size:18px; font-weight:700; line-height:1.2; color:#1f2328; }
.chip .cl { font-size:11px; color:#57606a; }
.chip.red .cv { color:#cf222e; }
.chip.orange .cv { color:#bc4c00; }
.hist { max-width:960px; margin:0 auto 8px; padding:0 14px; display:none; flex-wrap:wrap; gap:8px; }
.hbox { background:#f6f8fa; border:1px solid #d0d7de; border-radius:8px; padding:8px 12px; min-width:200px; max-width:300px; }
.hbox h3 { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:#57606a; margin:0 0 6px; }
.hrow { display:flex; align-items:center; gap:6px; margin-bottom:3px; font-size:12px; }
.hrow .hbar { flex:1; height:8px; background:#0969da; border-radius:4px; opacity:.7; min-width:2px; }
.hrow .hlabel { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:140px; color:#57606a; }
.hrow .hcount { color:#1f2328; font-weight:600; white-space:nowrap; }
.notice { max-width:960px; margin:0 auto 6px; padding:6px 14px; font-size:12px; background:#fff8c5; color:#7a5c00; border-radius:6px; display:none; }
.table-wrap { overflow:auto; padding-bottom:60px; display:none; }
table.grid { border-collapse:collapse; width:100%; font-size:12px; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; }
.grid th { position:sticky; top:42px; background:#f6f8fa; text-align:left; padding:7px 10px; border-bottom:1px solid #d0d7de; white-space:nowrap; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:#57606a; }
.grid td { padding:5px 10px; border-bottom:1px solid #f0f2f4; vertical-align:top; word-break:break-word; }
.grid tr:hover td { background:rgba(175,184,193,.12); }
.grid tr.selected td { background:rgba(9,105,218,.1); }
.grid td.err { color:#cf222e; }
.badge { display:inline-block; font-size:10px; font-weight:600; padding:1px 6px; border-radius:999px; border:1px solid #d0d7de; white-space:nowrap; }
.badge.bad { background:#ffebe9; border-color:#ff8182; color:#cf222e; }
.badge.ok { background:#dafbe1; border-color:#4ac26b; color:#1a7f37; }
.badge.blue { background:#ddf4ff; border-color:#54aeff; color:#0969da; }
.badge.gray { background:#f6f8fa; border-color:#d0d7de; color:#57606a; }
.badge.warn { background:#fff8c5; border-color:#f0c000; color:#7a5c00; }
.detail-wrap { max-width:960px; margin:0 auto; padding:0 14px 40px; display:none; }
.card { border:1px solid #d0d7de; border-radius:10px; margin-bottom:10px; overflow:hidden; }
.card-h { margin:0; padding:8px 14px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; background:#f6f8fa; border-bottom:1px solid #d0d7de; color:#57606a; display:flex; align-items:center; justify-content:space-between; }
.card-body { padding:10px 14px; }
table.kv { border-collapse:collapse; width:100%; font-size:12px; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; }
.kv td { padding:3px 8px; border-bottom:1px solid #f0f2f4; vertical-align:top; }
.kv td.k { color:#0550ae; width:1%; white-space:nowrap; font-weight:600; }
pre.block { margin:0; padding:10px 12px; background:#f6f8fa; border-radius:8px; white-space:pre-wrap; word-break:break-word; max-height:40vh; overflow:auto; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:12px; }
.mask-tag { font-size:10px; color:#8b949e; font-style:italic; }
.paste-area { max-width:960px; margin:0 auto 16px; padding:0 14px; }
.paste-area label { font-size:12px; color:#57606a; display:block; margin-bottom:4px; }
textarea#paste { width:100%; min-height:80px; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:12px; padding:8px; border:1px solid #d0d7de; border-radius:8px; resize:vertical; }
#err { max-width:960px; margin:20px auto; padding:14px 18px; border:1px solid #cf222e; border-radius:10px; background:rgba(207,34,46,.06); color:#cf222e; font-family:ui-monospace,monospace; font-size:12.5px; white-space:pre-wrap; display:none; }
#loading { position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px; background:rgba(255,255,255,.72); color:#57606a; }
#loading.show { display:flex; }
.spinner { width:38px; height:38px; border:4px solid #d0d7de; border-top-color:#0969da; border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
@media (prefers-color-scheme: dark) {
  body { background:#0d1117; color:#e6edf3; }
  header.bar { background:#161b22; border-bottom-color:#30363d; }
  header.bar .fname, .hint { color:#8b949e; }
  button, select, input[type=text], textarea#paste { background:#21262d; color:#e6edf3; border-color:#30363d; }
  button:hover { background:#30363d; }
  #drop { border-color:#30363d; color:#8b949e; } #drop strong { color:#e6edf3; }
  #drop.hover { border-color:#4493f8; color:#4493f8; }
  .chip, .hbox { background:#161b22; border-color:#30363d; }
  .chip .cv { color:#e6edf3; } .chip .cl { color:#8b949e; }
  .chip.red .cv { color:#ff7b72; } .chip.orange .cv { color:#e3a046; }
  .hbox h3 { color:#8b949e; } .hrow .hlabel { color:#8b949e; } .hrow .hcount { color:#e6edf3; }
  .notice { background:#3a2f00; color:#e3b341; }
  .grid th { background:#161b22; border-bottom-color:#30363d; color:#8b949e; }
  .grid td { border-bottom-color:#21262d; }
  .grid tr:hover td { background:rgba(110,118,129,.12); }
  .grid tr.selected td { background:rgba(31,111,235,.2); }
  .grid td.err { color:#ff7b72; }
  .badge { border-color:#30363d; }
  .badge.bad { background:#3d1418; border-color:#f85149; color:#ff7b72; }
  .badge.ok { background:#12261e; border-color:#238636; color:#3fb950; }
  .badge.blue { background:#121d2f; border-color:#1f6feb; color:#58a6ff; }
  .badge.gray { background:#21262d; border-color:#30363d; color:#8b949e; }
  .badge.warn { background:#3a2f00; border-color:#b58900; color:#e3b341; }
  .card { border-color:#30363d; }
  .card-h { background:#161b22; border-bottom-color:#30363d; color:#8b949e; }
  pre.block { background:#161b22; }
  .kv td { border-bottom-color:#21262d; } .kv td.k { color:#79c0ff; }
  #err { border-color:#f85149; color:#ff7b72; background:rgba(248,81,73,.08); }
  #loading { background:rgba(13,17,23,.75); }
  .spinner { border-color:#30363d; border-top-color:#4493f8; }
  .mask-tag { color:#6e7681; }
}
</style>
</head>
<body>

<header class="bar">
  <h1>KSI Tools CloudTrail Viewer</h1>
  <span class="fname" id="fname"></span>
  <input type="text" id="search" placeholder="event / user / IP / region…" disabled>
  <select id="svcSel" disabled><option value="">All services</option></select>
  <select id="errSel" disabled>
    <option value="all">All events</option>
    <option value="err">Errors only</option>
    <option value="ok">Success only</option>
  </select>
  <button id="maskBtn" disabled>Mask accounts</button>
  <button id="copy" disabled>Copy JSON</button>
  <button id="savecsv" disabled>Save CSV</button>
  <button id="pick" onclick="document.getElementById('file').click()">Open file</button>
</header>
<input type="file" id="file" accept=".json,.jsonl,.ndjson,.txt,application/json" style="display:none">

<div id="drop">
  <strong>Drop CloudTrail JSON / JSONL here</strong>
  <div class="hint" style="margin-top:8px">Accepts <code>{"Records":[…]}</code>, a JSON array, NDJSON, or Athena query export. <b>Nothing is uploaded.</b></div>
  <div class="hint" style="margin-top:4px">200 MB limit in memory. AWS account IDs masked by default.</div>
</div>

<div class="paste-area" id="pasteArea" style="display:none">
  <label>Or paste CloudTrail JSON / NDJSON:</label>
  <textarea id="paste" placeholder='{"Records":[…]} or one JSON object per line'></textarea>
  <button id="pasteBtn" style="margin-top:6px">Parse</button>
</div>

<div id="err"></div>
<div class="chips" id="chips"></div>
<div class="hist" id="hist"></div>
<div class="notice" id="notice"></div>

<div class="table-wrap" id="tablewrap">
  <table class="grid">
    <thead>
      <tr>
        <th>Time (UTC)</th>
        <th>Event Name</th>
        <th>Service</th>
        <th>Identity</th>
        <th>Source IP</th>
        <th>Region</th>
        <th>Error</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<div class="detail-wrap" id="detailWrap"></div>

<div id="loading"><div class="spinner"></div><div id="loadingMsg">Loading…</div></div>

<script>
// ===PARSER-START===
const CT_CRED_PARAMS = new Set(['password','secretaccesskey','secretkey','token','credential','accesskeyid']);

function ctMaskAccount(id) {
  if (!id) return '';
  const s = String(id);
  if (s.length < 8) return s;
  return s.slice(0, 4) + '••••' + s.slice(-2);
}

function ctSvcLabel(src) {
  if (!src) return '';
  return src.replace('.amazonaws.com', '').replace('.amazon.com', '');
}

function ctMaskParams(obj, depth) {
  if (!obj || typeof obj !== 'object' || depth > 4) return obj;
  if (Array.isArray(obj)) return obj.map(v => ctMaskParams(v, depth + 1));
  const out = {};
  for (const [k, v] of Object.entries(obj)) {
    const lk = k.toLowerCase().replace(/[-_]/g, '');
    if (CT_CRED_PARAMS.has(lk) || (typeof v === 'string' && CT_CRED_PARAMS.has(lk))) {
      out[k] = '✱✱✱ (masked)';
    } else {
      out[k] = ctMaskParams(v, depth + 1);
    }
  }
  return out;
}

function ctUserIdentity(uid) {
  if (!uid || typeof uid !== 'object') return { type: '', display: '', accountId: '', arn: '' };
  const type = String(uid.type || '');
  const accountId = String(uid.accountId || '');
  let display = '';
  if (uid.userName) display = String(uid.userName);
  else if (uid.principalId) display = String(uid.principalId).split(':').pop() || String(uid.principalId);
  else if (uid.invokedBy) display = String(uid.invokedBy);
  else if (type === 'Root') display = 'root';
  else if (type === 'AWSService') display = String(uid.invokedBy || type);
  else display = type;
  return { type, display, accountId, arn: String(uid.arn || '') };
}

function ctNormalizeEvent(raw, i) {
  const uid = ctUserIdentity(raw.userIdentity || {});
  const errorCode = String(raw.errorCode || raw.error_code || '');
  const errorMessage = String(raw.errorMessage || raw.error_message || '');
  const eventName = String(raw.eventName || raw.event_name || '');
  const eventSource = String(raw.eventSource || raw.event_source || '');
  const eventType = String(raw.eventType || '');
  const readOnly = raw.readOnly !== undefined ? raw.readOnly : (raw.readOnly === true);
  const managementEvent = raw.managementEvent !== undefined ? raw.managementEvent : true;
  const resources = Array.isArray(raw.resources) ? raw.resources : [];

  return {
    i,
    time: String(raw.eventTime || raw.event_time || ''),
    eventName,
    eventSource,
    svcLabel: ctSvcLabel(eventSource),
    eventType,
    readOnly: !!readOnly,
    managementEvent: !!managementEvent,
    uid,
    ip: String(raw.sourceIPAddress || raw.source_ip_address || ''),
    region: String(raw.awsRegion || raw.aws_region || ''),
    errorCode,
    errorMessage,
    requestId: String(raw.requestID || raw.requestId || ''),
    resources,
    raw,
  };
}

function parseCloudTrail(text) {
  const t = text.trim();
  if (!t) throw new Error('Empty input.');
  let records = [];
  const isJson = t.charAt(0) === '{' || t.charAt(0) === '[';
  if (isJson) {
    let data;
    try { data = JSON.parse(t); } catch (e) {
      // Might be NDJSON that starts with {
      const lines = t.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      if (lines.length > 1) {
        records = lines.map((l, idx) => {
          try { return JSON.parse(l); }
          catch (e2) { throw new Error('Line ' + (idx + 1) + ': ' + e2.message); }
        });
      } else throw e;
    }
    if (data !== undefined) {
      if (Array.isArray(data)) records = data;
      else if (Array.isArray(data.Records)) records = data.Records;
      else if (Array.isArray(data.events)) records = data.events;
      else if (data.eventName || data.eventTime) records = [data];
      else throw new Error('JSON has no Records/events array and is not a single event.');
    }
  } else {
    const lines = t.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    records = lines.map((l, idx) => {
      try { return JSON.parse(l); }
      catch (e) { throw new Error('Line ' + (idx + 1) + ': ' + e.message); }
    });
  }
  if (!records.length) throw new Error('No CloudTrail events found.');
  const hasCtFields = records.some(r =>
    r.eventName || r.eventTime || r.eventSource || r.userIdentity
  );
  if (!hasCtFields) throw new Error('Not a CloudTrail log — no eventName/eventTime/userIdentity fields found.');
  return records.map(ctNormalizeEvent);
}
// ===PARSER-END===

// ── UI state ─────────────────────────────────────────────────────────────────
let events = [], currentName = 'cloudtrail', maskAccounts = true;

const MAX_BYTES = 200 * 1024 * 1024, MAX_RENDER = 8000;

const $ = id => document.getElementById(id);
const drop = $('drop'), dropEl = drop;
const tbody = $('tbody'), tableWrap = $('tablewrap');
const detailWrap = $('detailWrap');
const errBox = $('err'), noticeEl = $('notice');
const fnameEl = $('fname');
const fileInput = $('file');
const searchIn = $('search'), svcSel = $('svcSel'), errSel = $('errSel');
const maskBtn = $('maskBtn');
const chipsEl = $('chips'), histEl = $('hist');
const loadingEl = $('loading'), loadingMsg = $('loadingMsg');
const pasteArea = $('pasteArea'), pasteEl = $('paste');

maskBtn.classList.add('toggle-on' in maskBtn ? '' : '');
maskBtn.style.background = '#0969da'; maskBtn.style.color = '#fff'; maskBtn.style.borderColor = '#0969da';

function showLoading(m) { loadingMsg.textContent = m || 'Loading…'; loadingEl.classList.add('show'); }
function hideLoading() { loadingEl.classList.remove('show'); }
function afterPaint(fn) { requestAnimationFrame(() => requestAnimationFrame(fn)); }
function showError(m) { errBox.style.display = 'block'; errBox.textContent = m; }
function clearError() { errBox.style.display = 'none'; }
function esc(s) { return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function displayUser(ev) {
  if (!maskAccounts) return ev.uid.display || ev.uid.type;
  return ev.uid.display || ev.uid.type;
}
function displayAccount(ev) {
  return maskAccounts ? ctMaskAccount(ev.uid.accountId) : (ev.uid.accountId || '');
}

function top5(arr, key) {
  const m = new Map();
  for (const x of arr) { const v = x[key] || ''; m.set(v, (m.get(v) || 0) + 1); }
  return [...m.entries()].sort((a, b) => b[1] - a[1]).slice(0, 5);
}

function buildChips(evs) {
  const total = evs.length;
  const errs = evs.filter(e => e.errorCode).length;
  const write = evs.filter(e => !e.readOnly).length;
  const svcs = new Set(evs.map(e => e.svcLabel)).size;
  const regions = new Set(evs.map(e => e.region)).size;
  const errPct = total ? Math.round(errs / total * 100) : 0;

  chipsEl.innerHTML = [
    `<div class="chip"><span class="cv">${total.toLocaleString()}</span><span class="cl">events</span></div>`,
    errs ? `<div class="chip red"><span class="cv">${errs.toLocaleString()}</span><span class="cl">errors (${errPct}%)</span></div>` :
           `<div class="chip"><span class="cv">0</span><span class="cl">errors</span></div>`,
    `<div class="chip"><span class="cv">${write.toLocaleString()}</span><span class="cl">write events</span></div>`,
    `<div class="chip"><span class="cv">${svcs}</span><span class="cl">services</span></div>`,
    `<div class="chip"><span class="cv">${regions}</span><span class="cl">regions</span></div>`,
  ].join('');
  chipsEl.style.display = 'flex';
}

function hBar(label, count, max) {
  const pct = max ? Math.round(count / max * 100) : 0;
  return `<div class="hrow"><span class="hlabel" title="${esc(label)}">${esc(label)}</span><div class="hbar" style="width:${pct}%"></div><span class="hcount">${count.toLocaleString()}</span></div>`;
}

function buildHist(evs) {
  const svcs = top5(evs, 'svcLabel');
  const evtypes = top5(evs, 'eventName');
  const users = top5(evs.map(e => ({ ...e, _user: e.uid.display || e.uid.type })), '_user');
  const regs = top5(evs, 'region');

  const maxSvc = svcs[0]?.[1] || 1, maxEvt = evtypes[0]?.[1] || 1;
  const maxUsr = users[0]?.[1] || 1, maxReg = regs[0]?.[1] || 1;

  histEl.innerHTML = [
    `<div class="hbox"><h3>Services</h3>${svcs.map(([l, c]) => hBar(l || '(unknown)', c, maxSvc)).join('')}</div>`,
    `<div class="hbox"><h3>Event Names</h3>${evtypes.map(([l, c]) => hBar(l || '(unknown)', c, maxEvt)).join('')}</div>`,
    `<div class="hbox"><h3>Identities</h3>${users.map(([l, c]) => hBar(l || '(unknown)', c, maxUsr)).join('')}</div>`,
    `<div class="hbox"><h3>Regions</h3>${regs.map(([l, c]) => hBar(l || '(global)', c, maxReg)).join('')}</div>`,
  ].join('');
  histEl.style.display = 'flex';
}

function buildSvcFilter(evs) {
  const svcs = [...new Set(evs.map(e => e.svcLabel))].filter(Boolean).sort();
  svcSel.innerHTML = '<option value="">All services</option>' +
    svcs.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
}

function filtered() {
  const q = searchIn.value.trim().toLowerCase();
  const svc = svcSel.value;
  const mode = errSel.value;
  return events.filter(e => {
    if (svc && e.svcLabel !== svc) return false;
    if (mode === 'err' && !e.errorCode) return false;
    if (mode === 'ok' && e.errorCode) return false;
    if (!q) return true;
    const user = (e.uid.display || e.uid.type || '').toLowerCase();
    const accountDisp = (maskAccounts ? ctMaskAccount(e.uid.accountId) : (e.uid.accountId || '')).toLowerCase();
    return (e.eventName + ' ' + e.svcLabel + ' ' + user + ' ' + accountDisp + ' ' + e.ip + ' ' + e.region + ' ' + e.errorCode).toLowerCase().includes(q);
  });
}

function eventBadge(e) {
  if (e.errorCode) return `<span class="badge bad">${esc(e.errorCode)}</span>`;
  return '<span class="badge ok">OK</span>';
}

function svcBadge(label) {
  const colors = { s3: 'orange', iam: 'bad', sts: 'warn', ec2: 'blue', rds: 'blue', lambda: 'blue', cloudtrail: 'gray' };
  const cls = colors[label.toLowerCase()] || 'gray';
  return `<span class="badge ${cls}">${esc(label)}</span>`;
}

function draw() {
  const list = filtered();
  const capped = list.length > MAX_RENDER ? list.slice(0, MAX_RENDER) : list;
  tbody.innerHTML = '';
  for (const e of capped) {
    const tr = document.createElement('tr');
    tr.dataset.i = e.i;
    if (e.errorCode) tr.style.background = 'rgba(207,34,46,.04)';
    const user = esc(e.uid.display || e.uid.type || '');
    const acct = displayAccount(e);
    const userCell = acct ? `${user} <span class="mask-tag">(${esc(acct)})</span>` : user;
    tr.innerHTML = `<td style="white-space:nowrap">${esc(e.time.replace('T', ' ').replace('Z', ''))}</td>` +
      `<td>${esc(e.eventName)}</td>` +
      `<td>${e.svcLabel ? svcBadge(e.svcLabel) : ''}</td>` +
      `<td>${userCell}</td>` +
      `<td>${esc(e.ip)}</td>` +
      `<td>${esc(e.region)}</td>` +
      `<td>${eventBadge(e)}</td>`;
    tbody.appendChild(tr);
  }
  noticeEl.style.display = list.length > MAX_RENDER ? 'block' : 'none';
  if (list.length > MAX_RENDER)
    noticeEl.textContent = 'Showing first ' + MAX_RENDER.toLocaleString() + ' of ' + list.length.toLocaleString() + ' matching events. All histogram counts cover the full set.';
}

function renderDetail(ev) {
  const uid = ev.uid;
  const masked = maskAccounts;
  const acctDisp = masked ? ctMaskAccount(uid.accountId) : (uid.accountId || '');

  const rawParams = ev.raw.requestParameters;
  const maskedParams = rawParams ? ctMaskParams(rawParams, 0) : null;
  const rawResp = ev.raw.responseElements;

  function kvRows(obj, maxKeys) {
    if (!obj || typeof obj !== 'object') return '<tr><td colspan="2" style="color:#8b949e">—</td></tr>';
    const entries = Object.entries(obj).slice(0, maxKeys || 30);
    return entries.map(([k, v]) => {
      const vs = typeof v === 'object' ? JSON.stringify(v) : String(v ?? '');
      return `<tr><td class="k">${esc(k)}</td><td>${esc(vs.length > 200 ? vs.slice(0, 200) + '…' : vs)}</td></tr>`;
    }).join('') + (Object.keys(obj).length > (maxKeys || 30) ? `<tr><td colspan="2" class="mask-tag">…${Object.keys(obj).length - (maxKeys || 30)} more fields</td></tr>` : '');
  }

  let resHtml = '';
  if (ev.resources.length) {
    resHtml = `<div class="card"><div class="card-h">Resources (${ev.resources.length})</div><div class="card-body">` +
      `<table class="kv">${ev.resources.map(r =>
        `<tr><td class="k">${esc(r.resourceType || r.type || 'resource')}</td><td>${esc(r.ARN || r.arn || r.resourceName || JSON.stringify(r))}</td></tr>`
      ).join('')}</table></div></div>`;
  }

  let errHtml = '';
  if (ev.errorCode) {
    errHtml = `<div class="card"><div class="card-h">Error</div><div class="card-body">` +
      `<table class="kv"><tr><td class="k">errorCode</td><td style="color:#cf222e">${esc(ev.errorCode)}</td></tr>` +
      (ev.errorMessage ? `<tr><td class="k">errorMessage</td><td>${esc(ev.errorMessage)}</td></tr>` : '') +
      `</table></div></div>`;
  }

  detailWrap.innerHTML =
    `<div class="card"><div class="card-h"><span>${esc(ev.eventName)} &mdash; ${esc(ev.time)}</span>` +
    `<small style="font-weight:normal;text-transform:none">req ${esc(ev.requestId)}</small></div>` +
    `<div class="card-body"><table class="kv">` +
    `<tr><td class="k">eventSource</td><td>${esc(ev.eventSource)}</td></tr>` +
    `<tr><td class="k">eventType</td><td>${esc(ev.eventType || '—')}</td></tr>` +
    `<tr><td class="k">readOnly</td><td>${ev.readOnly ? 'true' : '<b>false (write)</b>'}</td></tr>` +
    `<tr><td class="k">region</td><td>${esc(ev.region)}</td></tr>` +
    `<tr><td class="k">sourceIPAddress</td><td>${esc(ev.ip)}</td></tr>` +
    `</table></div></div>` +

    `<div class="card"><div class="card-h">User Identity${masked ? ' <span class="mask-tag">(accounts masked — toggle above)</span>' : ''}</div>` +
    `<div class="card-body"><table class="kv">` +
    `<tr><td class="k">type</td><td>${esc(uid.type)}</td></tr>` +
    (uid.display ? `<tr><td class="k">userName / principalId</td><td>${esc(uid.display)}</td></tr>` : '') +
    (uid.accountId ? `<tr><td class="k">accountId</td><td>${esc(acctDisp)}</td></tr>` : '') +
    (uid.arn ? `<tr><td class="k">arn</td><td style="word-break:break-all">${esc(uid.arn)}</td></tr>` : '') +
    (ev.raw.userIdentity?.sessionContext ? `<tr><td class="k">sessionContext</td><td>${esc(JSON.stringify(ev.raw.userIdentity.sessionContext).slice(0, 300))}</td></tr>` : '') +
    `</table></div></div>` +

    (maskedParams ? `<div class="card"><div class="card-h">Request Parameters <span class="mask-tag">(sensitive keys masked)</span></div>` +
    `<div class="card-body"><table class="kv">${kvRows(maskedParams, 20)}</table></div></div>` : '') +

    (rawResp ? `<div class="card"><div class="card-h">Response Elements</div>` +
    `<div class="card-body"><table class="kv">${kvRows(rawResp, 10)}</table></div></div>` : '') +

    resHtml + errHtml;

  detailWrap.style.display = 'block';
}

function setControls(on) {
  [searchIn, svcSel, errSel, maskBtn, $('copy'), $('savecsv')].forEach(el => el.disabled = !on);
}

function render(text, name) {
  showLoading('Parsing CloudTrail…');
  afterPaint(() => {
    try {
      events = parseCloudTrail(text);
      currentName = (name || 'cloudtrail').replace(/\.(json|jsonl|ndjson|txt)$/i, '');
      fnameEl.textContent = name || '';
      document.title = currentName + ' — KSI Tools CloudTrail';
      drop.style.display = 'none';
      pasteArea.style.display = 'none';
      tableWrap.style.display = 'block';
      detailWrap.style.display = 'none';
      clearError();
      buildSvcFilter(events);
      buildChips(events);
      buildHist(events);
      setControls(true);
      searchIn.value = ''; svcSel.value = ''; errSel.value = 'all';
      draw();
    } catch (e) { showError(e.message || String(e)); }
    hideLoading();
  });
}

function loadFile(file) {
  if (!file) return;
  if (file.size > MAX_BYTES) { showError('File too large (' + (file.size / 1024 / 1024).toFixed(0) + ' MB). Maximum is 200 MB.'); return; }
  showLoading('Reading file…');
  const r = new FileReader();
  r.onload = () => render(String(r.result || ''), file.name);
  r.readAsText(file);
}

// ── file / drop ───────────────────────────────────────────────────────────────
drop.onclick = () => fileInput.click();
fileInput.onchange = () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); fileInput.value = ''; };
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('hover'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('hover'); }));
drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) loadFile(f); });
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { if (e.target.closest('#drop')) return; e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) loadFile(f); });

// ── paste ─────────────────────────────────────────────────────────────────────
$('pasteBtn').onclick = () => { const t = pasteEl.value.trim(); if (t) render(t, 'paste'); };
// show paste area when drop zone is visible
drop.addEventListener('click', () => { pasteArea.style.display = 'block'; });

// ── filters ───────────────────────────────────────────────────────────────────
searchIn.oninput = draw; svcSel.onchange = draw; errSel.onchange = draw;

// ── mask toggle ───────────────────────────────────────────────────────────────
maskBtn.onclick = () => {
  maskAccounts = !maskAccounts;
  if (maskAccounts) { maskBtn.style.background = '#0969da'; maskBtn.style.color = '#fff'; maskBtn.style.borderColor = '#0969da'; maskBtn.textContent = 'Mask accounts'; }
  else { maskBtn.style.background = ''; maskBtn.style.color = ''; maskBtn.style.borderColor = ''; maskBtn.textContent = 'Show accounts'; }
  draw();
  // re-render detail if open
  const sel = tbody.querySelector('tr.selected');
  if (sel) {
    const ev = events.find(x => x.i === parseInt(sel.dataset.i, 10));
    if (ev) renderDetail(ev);
  }
};

// ── row click → detail ────────────────────────────────────────────────────────
tbody.onclick = e => {
  const tr = e.target.closest('tr'); if (!tr) return;
  const ev = events.find(x => x.i === parseInt(tr.dataset.i, 10)); if (!ev) return;
  tbody.querySelectorAll('tr.selected').forEach(r => r.classList.remove('selected'));
  tr.classList.add('selected');
  renderDetail(ev);
  detailWrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
};

// ── exports ───────────────────────────────────────────────────────────────────
function summaryRows() {
  return filtered().map(e => ({
    eventTime: e.time,
    eventName: e.eventName,
    eventSource: e.eventSource,
    userType: e.uid.type,
    userName: e.uid.display,
    accountId: maskAccounts ? ctMaskAccount(e.uid.accountId) : (e.uid.accountId || ''),
    sourceIPAddress: e.ip,
    awsRegion: e.region,
    readOnly: e.readOnly,
    errorCode: e.errorCode,
    errorMessage: e.errorMessage,
    requestId: e.requestId,
  }));
}

$('copy').onclick = async () => {
  await navigator.clipboard.writeText(JSON.stringify(summaryRows(), null, 2));
};
$('savecsv').onclick = () => {
  const keys = ['eventTime', 'eventName', 'eventSource', 'userType', 'userName', 'accountId', 'sourceIPAddress', 'awsRegion', 'readOnly', 'errorCode', 'errorMessage', 'requestId'];
  const escCsv = v => { const s = String(v ?? ''); return /["\n,]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const lines = [keys.join(',')].concat(summaryRows().map(r => keys.map(k => escCsv(r[k])).join(',')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv' }));
  a.download = currentName + '.csv';
  a.click();
};

// ── self-test ─────────────────────────────────────────────────────────────────
(function selfTest() {
  const SAMPLE = JSON.stringify({ Records: [
    { eventTime: '2024-03-01T10:00:00Z', eventName: 'GetObject', eventSource: 's3.amazonaws.com',
      awsRegion: 'us-east-1', sourceIPAddress: '1.2.3.4', readOnly: true,
      userIdentity: { type: 'IAMUser', userName: 'alice', accountId: '123456789012' },
      requestParameters: { bucketName: 'my-bucket', key: 'test.txt', password: 'hunter2' },
      requestID: 'req-001' },
    { eventTime: '2024-03-01T10:01:00Z', eventName: 'PutObject', eventSource: 's3.amazonaws.com',
      awsRegion: 'us-east-1', sourceIPAddress: '1.2.3.4', readOnly: false,
      userIdentity: { type: 'IAMUser', userName: 'bob', accountId: '123456789012' },
      errorCode: 'AccessDenied', errorMessage: 'Access Denied', requestID: 'req-002' },
    { eventTime: '2024-03-01T10:02:00Z', eventName: 'AssumeRole', eventSource: 'sts.amazonaws.com',
      awsRegion: 'us-east-1', sourceIPAddress: 'aws.internal', readOnly: false,
      userIdentity: { type: 'AssumedRole', principalId: 'AROA:session', accountId: '123456789012',
        arn: 'arn:aws:sts::123456789012:assumed-role/MyRole/session' }, requestID: 'req-003' },
  ]});

  try {
    const r = parseCloudTrail(SAMPLE);
    if (r.length !== 3) throw new Error('expected 3 events, got ' + r.length);
    if (r[0].eventName !== 'GetObject') throw new Error('eventName mismatch');
    if (r[0].svcLabel !== 's3') throw new Error('svcLabel mismatch: ' + r[0].svcLabel);
    if (r[0].uid.userName !== 'alice' && r[0].uid.display !== 'alice') {
      // display is derived from userName
    }
    if (r[0].uid.display !== 'alice') throw new Error('uid.display: ' + r[0].uid.display);
    if (r[0].uid.accountId !== '123456789012') throw new Error('accountId');
    if (ctMaskAccount('123456789012') !== '1234••••12') throw new Error('mask: ' + ctMaskAccount('123456789012'));
    if (!r[0].readOnly) throw new Error('readOnly expected true');
    if (r[1].readOnly) throw new Error('PutObject readOnly should be false');
    if (r[1].errorCode !== 'AccessDenied') throw new Error('errorCode');
    // credential masking
    const mp = ctMaskParams({ password: 'hunter2', bucketName: 'my-bucket' }, 0);
    if (mp.password !== '✱✱✱ (masked)') throw new Error('param mask: ' + mp.password);
    if (mp.bucketName !== 'my-bucket') throw new Error('bucketName should not be masked');
    // ARN identity
    if (!r[2].uid.arn.includes('MyRole')) throw new Error('arn not populated');
    // NDJSON
    const nd = [
      '{"eventTime":"2024-01-01T00:00:00Z","eventName":"DescribeInstances","eventSource":"ec2.amazonaws.com","awsRegion":"us-west-2","sourceIPAddress":"5.6.7.8","userIdentity":{"type":"IAMUser","userName":"ops"},"requestID":"r1"}',
    ].join('\n');
    const r2 = parseCloudTrail(nd);
    if (r2[0].svcLabel !== 'ec2') throw new Error('NDJSON svcLabel');
    // error on non-CloudTrail
    let threw = false;
    try { parseCloudTrail('{"foo":"bar"}'); } catch(e) { threw = true; }
    if (!threw) throw new Error('should throw on non-CT JSON');
    // empty input
    let threw2 = false;
    try { parseCloudTrail('  \n  '); } catch(e) { threw2 = true; }
    if (!threw2) throw new Error('should throw on empty');
  } catch (e) {
    console.error('CloudTrail viewer self-test FAILED:', e.message);
  }
})();

</script>
