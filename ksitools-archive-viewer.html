<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KSI Tools Archive Viewer</title>
<style id="appcss">
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.5; background:#fff; color:#1f2328; }
header.bar { position:sticky; top:0; z-index:20; display:flex; gap:10px; align-items:center;
  padding:10px 16px; background:#f6f8fa; border-bottom:1px solid #d0d7de; flex-wrap:wrap; }
header.bar h1 { font-size:15px; margin:0; font-weight:600; flex:0 0 auto; }
header.bar .fname { color:#57606a; font-size:13px; flex:1 1 auto;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:60px; }
header.bar .meta { color:#57606a; font-size:12px; flex:0 0 auto; }
button, #search { font:inherit; font-size:13px; padding:6px 12px; border:1px solid #d0d7de;
  border-radius:6px; background:#fff; color:#1f2328; }
button { cursor:pointer; } button:hover { background:#f3f4f6; } button:disabled { opacity:.45; cursor:default; }
#search { width:220px; } #search:disabled { opacity:.45; }
#drop { max-width:900px; margin:48px auto; padding:60px 24px; text-align:center;
  border:2px dashed #d0d7de; border-radius:12px; color:#57606a; cursor:pointer; }
#drop.hover { border-color:#0969da; background:rgba(9,105,218,.05); color:#0969da; }
#drop strong { display:block; font-size:18px; margin-bottom:6px; color:#1f2328; }
.hint { color:#8b949e; font-size:12px; }

.table-wrap { overflow:auto; padding-bottom:80px; display:none; }
table.arch { border-collapse:collapse; width:100%; font-size:12.5px;
  font-family:"Cascadia Code","Consolas",ui-monospace,monospace; }
.arch th { position:sticky; top:53px; z-index:5; background:#f6f8fa; text-align:left;
  padding:8px 10px; border-bottom:1px solid #d0d7de; font-weight:600; white-space:nowrap; cursor:pointer; }
.arch td { padding:5px 10px; border-bottom:1px solid #f0f2f4; vertical-align:top; }
.arch tr:hover td { background:rgba(175,184,193,.12); }
.arch tr.dir td.name { color:#0969da; font-weight:600; }
.arch td.name { word-break:break-all; }
.badge { display:inline-block; font-size:10px; padding:1px 6px; border-radius:999px;
  border:1px solid #d0d7de; color:#57606a; margin-left:6px; }

#notice { padding:7px 16px; font-size:12.5px; background:#fff8c5; color:#7a5c00;
  border-bottom:1px solid #f0c000; display:none; }
#err { max-width:900px; margin:40px auto; padding:16px 20px; border:1px solid #cf222e;
  border-radius:10px; background:rgba(207,34,46,.06); color:#cf222e;
  font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:13px; white-space:pre-wrap; display:none; }
#loading { position:fixed; inset:0; z-index:50; display:none; align-items:center;
  justify-content:center; flex-direction:column; gap:14px;
  background:rgba(255,255,255,.72); backdrop-filter:blur(1px); color:#57606a; font-size:14px; }
#loading.show { display:flex; }
.spinner { width:38px; height:38px; border:4px solid #d0d7de; border-top-color:#0969da;
  border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

@media (prefers-color-scheme: dark) {
  body { background:#0d1117; color:#e6edf3; }
  header.bar { background:#161b22; border-bottom-color:#30363d; }
  header.bar .fname, header.bar .meta { color:#8b949e; }
  button, #search { background:#21262d; color:#e6edf3; border-color:#30363d; }
  button:hover { background:#30363d; }
  #drop { border-color:#30363d; color:#8b949e; } #drop strong { color:#e6edf3; }
  #drop.hover { border-color:#4493f8; color:#4493f8; }
  .arch th { background:#161b22; border-bottom-color:#30363d; }
  .arch td { border-bottom-color:#21262d; }
  .arch tr:hover td { background:rgba(110,118,129,.12); }
  .arch tr.dir td.name { color:#58a6ff; }
  .badge { border-color:#30363d; color:#8b949e; }
  #notice { background:#3a2f00; color:#e3b341; border-bottom-color:#b58900; }
  #err { border-color:#f85149; color:#ff7b72; background:rgba(248,81,73,.08); }
  #loading { background:rgba(13,17,23,.75); color:#8b949e; }
  .spinner { border-color:#30363d; border-top-color:#4493f8; }
}
</style>
</head>
<body>
<header class="bar">
  <h1>KSI Tools Archive Viewer</h1>
  <span class="fname" id="fname"></span>
  <span class="meta" id="meta"></span>
  <input type="text" id="search" placeholder="Filter paths…" disabled>
  <button id="copy" disabled title="Copy file list as text">Copy list</button>
  <button id="savecsv" disabled>Save .csv</button>
  <button id="savejson" disabled>Save .json</button>
  <button id="pick" onclick="document.getElementById('file').click()">Open file</button>
</header>
<input type="file" id="file" accept=".zip,.tar,.tgz,.tar.gz,.jar,.war,.ear,.nupkg,application/zip,application/x-tar,application/gzip" style="display:none">
<div id="drop">
  <strong>Drop a ZIP, TAR, or .tar.gz archive here</strong>
  or click to choose · list members without uploading
  <div class="hint" style="margin-top:10px">ZIP / JAR / TAR / .tar.gz listing via browser DecompressionStream. Optional small text member preview. Nothing is uploaded.</div>
</div>
<div id="err"></div>
<div id="notice"></div>
<div class="table-wrap" id="tablewrap">
  <table class="arch">
    <thead>
      <tr>
        <th data-sort="name">Path</th>
        <th data-sort="size">Size</th>
        <th data-sort="csize">Compressed</th>
        <th data-sort="method">Method</th>
        <th data-sort="date">Date</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>
<div id="loading"><div class="spinner"></div><div id="loadingmsg">Loading…</div></div>

<script>
const drop = document.getElementById('drop');
const tableWrap = document.getElementById('tablewrap');
const tbody = document.getElementById('tbody');
const errBox = document.getElementById('err');
const noticeEl = document.getElementById('notice');
const fname = document.getElementById('fname');
const metaEl = document.getElementById('meta');
const fileInput = document.getElementById('file');
const searchIn = document.getElementById('search');
const loadingEl = document.getElementById('loading');
const loadingMsg = document.getElementById('loadingmsg');
const btns = {
  copy: document.getElementById('copy'),
  savecsv: document.getElementById('savecsv'),
  savejson: document.getElementById('savejson'),
};

let currentName = 'archive';
let entries = [];
let format = '';
let sortKey = 'name';
let sortDir = 1;
let zipState = null; // {u8, view, list with localOff} for preview
const MAX_BYTES = 512 * 1024 * 1024;
const MAX_RENDER = 50000;
const PREVIEW_MAX = 256 * 1024;

function showLoading(msg) { loadingMsg.textContent = msg || 'Loading…'; loadingEl.classList.add('show'); }
function hideLoading() { loadingEl.classList.remove('show'); }
function afterPaint(fn) { requestAnimationFrame(() => requestAnimationFrame(fn)); }
function showError(msg) {
  errBox.style.display = 'block'; errBox.textContent = msg;
  tableWrap.style.display = 'none';
  Object.values(btns).forEach(b => b.disabled = true);
  searchIn.disabled = true;
}
function clearError() { errBox.style.display = 'none'; errBox.textContent = ''; }
function fmtBytes(n) {
  if (n == null) return '—';
  if (n >= 1024 * 1024 * 1024) return (n / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
  if (n >= 1024 * 1024) return (n / (1024 * 1024)).toFixed(1) + ' MB';
  if (n >= 1024) return (n / 1024).toFixed(1) + ' KB';
  return n + ' B';
}
function u16(v, o) { return v.getUint16(o, true); }
function u32(v, o) { return v.getUint32(o, true); }
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
async function gunzip(u8) {
  if (typeof DecompressionStream === 'undefined')
    throw new Error('Browser lacks DecompressionStream (needed for gzip). Use a recent Chrome/Firefox/Edge/Safari.');
  return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
}
async function inflateRaw(u8) {
  if (typeof DecompressionStream === 'undefined')
    throw new Error('Browser lacks DecompressionStream (needed for deflate).');
  return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
}

function parseZip(buf) {
  const u8 = new Uint8Array(buf);
  const view = new DataView(buf);
  let eocd = -1;
  const maxScan = Math.min(u8.length, 0x10000 + 22);
  for (let i = u8.length - 22; i >= u8.length - maxScan && i >= 0; i--) {
    if (u8[i] === 0x50 && u8[i + 1] === 0x4b && u8[i + 2] === 0x05 && u8[i + 3] === 0x06) { eocd = i; break; }
  }
  let totalEntries, cdOffset, cdSize;
  if (eocd >= 0) {
    totalEntries = u16(view, eocd + 10);
    cdSize = u32(view, eocd + 12);
    cdOffset = u32(view, eocd + 16);
  } else {
    totalEntries = 0xffff; cdOffset = 0xffffffff; cdSize = 0xffffffff;
  }
  if (eocd < 0 || totalEntries === 0xffff || cdOffset === 0xffffffff) {
    let loc = -1;
    const from = eocd >= 0 ? eocd : u8.length;
    for (let i = from - 20; i >= Math.max(0, from - 0x10000); i--) {
      if (u8[i] === 0x50 && u8[i + 1] === 0x4b && u8[i + 2] === 0x06 && u8[i + 3] === 0x07) { loc = i; break; }
    }
    if (loc < 0) throw new Error(eocd < 0 ? 'Not a ZIP file (EOCD not found).' : 'ZIP64 fields present but locator missing.');
    const z64eocd = Number(view.getBigUint64(loc + 8, true));
    if (u32(view, z64eocd) !== 0x06064b50) throw new Error('Bad ZIP64 EOCD signature.');
    totalEntries = Number(view.getBigUint64(z64eocd + 32, true));
    cdSize = Number(view.getBigUint64(z64eocd + 40, true));
    cdOffset = Number(view.getBigUint64(z64eocd + 48, true));
  }
  if (cdOffset + 46 > u8.length) throw new Error('ZIP central directory offset out of range.');
  const list = [];
  let off = cdOffset;
  const decoder = new TextDecoder('utf-8', { fatal: false });
  for (let n = 0; n < totalEntries; n++) {
    if (u32(view, off) !== 0x02014b50) throw new Error('Bad central directory signature at entry ' + n);
    const method = u16(view, off + 10);
    const dosTime = u16(view, off + 12);
    const dosDate = u16(view, off + 14);
    let csize = u32(view, off + 20);
    let size = u32(view, off + 24);
    const nameLen = u16(view, off + 28);
    const extraLen = u16(view, off + 30);
    const commentLen = u16(view, off + 32);
    let localOff = u32(view, off + 42);
    const nameBytes = u8.subarray(off + 46, off + 46 + nameLen);
    const name = decoder.decode(nameBytes);
    let eoff = off + 46 + nameLen, eend = eoff + extraLen;
    while (eoff + 4 <= eend) {
      const id = u16(view, eoff), sz = u16(view, eoff + 2); eoff += 4;
      if (id === 0x0001) {
        let p = eoff;
        if (size === 0xffffffff) { size = Number(view.getBigUint64(p, true)); p += 8; }
        if (csize === 0xffffffff) { csize = Number(view.getBigUint64(p, true)); p += 8; }
        if (localOff === 0xffffffff) { localOff = Number(view.getBigUint64(p, true)); }
      }
      eoff += sz;
    }
    list.push({
      name,
      size,
      csize,
      method: methodName(method),
      methodCode: method,
      date: dosToDate(dosDate, dosTime),
      isDir: name.endsWith('/'),
      localOff,
    });
    off += 46 + nameLen + extraLen + commentLen;
  }
  zipState = { u8, view, list };
  return list.map(({ localOff, methodCode, ...rest }) => rest);
}
function methodName(m) {
  if (m === 0) return 'store';
  if (m === 8) return 'deflate';
  if (m === 12) return 'bzip2';
  if (m === 14) return 'lzma';
  if (m === 93) return 'zstd';
  if (m === 95) return 'xz';
  return 'method-' + m;
}
function dosToDate(dosDate, dosTime) {
  if (!dosDate && !dosTime) return '';
  const day = dosDate & 0x1f;
  const month = (dosDate >> 5) & 0xf;
  const year = ((dosDate >> 9) & 0x7f) + 1980;
  const sec = (dosTime & 0x1f) * 2;
  const min = (dosTime >> 5) & 0x3f;
  const hour = (dosTime >> 11) & 0x1f;
  try {
    return new Date(year, month - 1, day, hour, min, sec).toISOString().replace('T', ' ').slice(0, 19);
  } catch { return ''; }
}

function parseTar(buf) {
  const u8 = new Uint8Array(buf);
  if (u8.length >= 2 && u8[0] === 0x1f && u8[1] === 0x8b) {
    throw new Error('Internal: gzip should be inflated before parseTar.');
  }
  const decoder = new TextDecoder('utf-8', { fatal: false });
  const list = [];
  let off = 0;
  function readStr(start, len) {
    let end = start;
    const max = start + len;
    while (end < max && u8[end] !== 0) end++;
    return decoder.decode(u8.subarray(start, end)).trim();
  }
  function readOctal(start, len) {
    const s = readStr(start, len).replace(/\0/g, '').trim();
    if (!s) return 0;
    return parseInt(s, 8) || 0;
  }
  while (off + 512 <= u8.length) {
    let allZero = true;
    for (let i = 0; i < 512; i++) if (u8[off + i] !== 0) { allZero = false; break; }
    if (allZero) break;
    let name = readStr(off, 100);
    const size = readOctal(off + 124, 12);
    const mtime = readOctal(off + 136, 12);
    const typeflag = String.fromCharCode(u8[off + 156] || 48);
    const magic = readStr(off + 257, 6);
    const prefix = (magic.startsWith('ustar')) ? readStr(off + 345, 155) : '';
    if (prefix) name = prefix.replace(/\/?$/, '/') + name;
    const isDir = typeflag === '5' || name.endsWith('/');
    if (typeflag === '0' || typeflag === '\0' || typeflag === '5' || typeflag === '2' || typeflag === '1') {
      list.push({
        name: name || '(unnamed)',
        size: isDir ? 0 : size,
        csize: isDir ? 0 : size,
        method: 'tar',
        methodCode: 0,
        date: mtime ? new Date(mtime * 1000).toISOString().replace('T', ' ').slice(0, 19) : '',
        isDir,
        dataOffset: off + 512,
      });
    }
    const dataBlocks = Math.ceil(size / 512);
    off += 512 + dataBlocks * 512;
  }
  if (!list.length) throw new Error('No TAR members found (empty or unsupported variant).');
  zipState = { tarU8: u8, list };
  return list.map(({ dataOffset, methodCode, ...rest }) => rest);
}

async function detectAndParse(buf, name) {
  let u8 = new Uint8Array(buf);
  zipState = null;
  // gzip → inflate then tar (or zip rarely)
  if (u8.length >= 2 && u8[0] === 0x1f && u8[1] === 0x8b) {
    showLoading('Inflating gzip…');
    u8 = await gunzip(u8);
    buf = u8.buffer.slice(u8.byteOffset, u8.byteOffset + u8.byteLength);
    format = 'tar.gz';
    // after gunzip, usually tar
    if (u8.length >= 4 && u8[0] === 0x50 && u8[1] === 0x4b) {
      format = 'zip.gz';
      return parseZip(buf);
    }
    return parseTar(buf);
  }
  if (u8.length >= 4 && u8[0] === 0x50 && u8[1] === 0x4b) {
    format = 'zip';
    return parseZip(buf);
  }
  const lower = (name || '').toLowerCase();
  if (lower.endsWith('.tar') || lower.endsWith('.tar.gz') || lower.endsWith('.tgz') ||
      (u8.length > 262 && String.fromCharCode(...u8.subarray(257, 262)) === 'ustar')) {
    format = 'tar';
    return parseTar(buf);
  }
  try { format = 'zip'; return parseZip(buf); }
  catch (e1) {
    try { format = 'tar'; return parseTar(buf); }
    catch (e2) {
      throw new Error('Unrecognized archive. Supported: ZIP/JAR, TAR, .tar.gz.\nZIP: ' + e1.message + '\nTAR: ' + e2.message);
    }
  }
}

function filtered() {
  const q = searchIn.value.trim().toLowerCase();
  if (!q) return entries;
  return entries.filter(e => e.name.toLowerCase().includes(q));
}
function sorted(list) {
  const k = sortKey, d = sortDir;
  return list.slice().sort((a, b) => {
    if (k === 'name' && a.isDir !== b.isDir) return a.isDir ? -1 : 1;
    let av = a[k], bv = b[k];
    if (typeof av === 'string') av = av.toLowerCase();
    if (typeof bv === 'string') bv = bv.toLowerCase();
    if (av < bv) return -1 * d;
    if (av > bv) return 1 * d;
    return a.name.localeCompare(b.name) * d;
  });
}
function ensurePreviewPanel() {
  let p = document.getElementById('preview');
  if (!p) {
    p = document.createElement('div');
    p.id = 'preview';
    p.style.cssText = 'display:none;max-width:1000px;margin:12px auto 40px;padding:0 16px';
    p.innerHTML = '<div style="border:1px solid #d0d7de;border-radius:10px;overflow:hidden"><div id="previewTitle" style="padding:10px 14px;font-size:13px;font-weight:600;background:#f6f8fa;border-bottom:1px solid #d0d7de"></div><pre id="previewBody" style="margin:0;padding:12px;max-height:40vh;overflow:auto;font-size:12px;font-family:ui-monospace,monospace;white-space:pre-wrap;word-break:break-word"></pre></div>';
    tableWrap.after(p);
  }
  return p;
}
async function previewEntry(name) {
  const p = ensurePreviewPanel();
  const title = document.getElementById('previewTitle');
  const body = document.getElementById('previewBody');
  try {
    if (zipState && zipState.view) {
      const ent = zipState.list.find(e => e.name === name);
      if (!ent || ent.isDir) return;
      if (ent.size > PREVIEW_MAX) throw new Error('Member too large to preview (>' + PREVIEW_MAX + ' bytes).');
      if (ent.methodCode !== 0 && ent.methodCode !== 8) throw new Error('Compression method not supported for preview: ' + ent.methodCode);
      const off = ent.localOff;
      if (u32(zipState.view, off) !== 0x04034b50) throw new Error('Bad local header');
      const nameLen = u16(zipState.view, off + 26), extraLen = u16(zipState.view, off + 28);
      const dataStart = off + 30 + nameLen + extraLen;
      const comp = zipState.u8.subarray(dataStart, dataStart + ent.csize);
      let data = ent.methodCode === 0 ? comp : await inflateRaw(comp);
      body.textContent = new TextDecoder('utf-8', { fatal: false }).decode(data);
      title.textContent = 'Preview: ' + name + ' (' + fmtBytes(data.length) + ')';
      p.style.display = 'block';
    } else if (zipState && zipState.tarU8) {
      const ent = zipState.list.find(e => e.name === name);
      if (!ent || ent.isDir) return;
      if (ent.size > PREVIEW_MAX) throw new Error('Member too large to preview.');
      const data = zipState.tarU8.subarray(ent.dataOffset, ent.dataOffset + ent.size);
      body.textContent = new TextDecoder('utf-8', { fatal: false }).decode(data);
      title.textContent = 'Preview: ' + name + ' (' + fmtBytes(data.length) + ')';
      p.style.display = 'block';
    }
  } catch (e) {
    title.textContent = 'Preview: ' + name;
    body.textContent = e.message || String(e);
    p.style.display = 'block';
  }
}
function draw() {
  const list = sorted(filtered());
  const capped = list.length > MAX_RENDER;
  const drawList = capped ? list.slice(0, MAX_RENDER) : list;
  const frag = document.createDocumentFragment();
  for (const e of drawList) {
    const tr = document.createElement('tr');
    if (e.isDir) tr.className = 'dir';
    tr.style.cursor = e.isDir ? 'default' : 'pointer';
    tr.title = e.isDir ? '' : 'Click to preview small text members';
    tr.innerHTML =
      '<td class="name">' + esc(e.name) + (e.isDir ? '<span class="badge">dir</span>' : '') + '</td>' +
      '<td>' + (e.isDir ? '—' : fmtBytes(e.size)) + '</td>' +
      '<td>' + (e.isDir ? '—' : fmtBytes(e.csize)) + '</td>' +
      '<td>' + esc(e.method) + '</td>' +
      '<td>' + esc(e.date || '—') + '</td>';
    if (!e.isDir) tr.onclick = () => previewEntry(e.name);
    frag.appendChild(tr);
  }
  tbody.innerHTML = '';
  tbody.appendChild(frag);
  const files = entries.filter(e => !e.isDir);
  const total = files.reduce((s, e) => s + (e.size || 0), 0);
  const ctotal = files.reduce((s, e) => s + (e.csize || 0), 0);
  metaEl.textContent = format.toUpperCase() + ' · ' + list.length + (list.length !== entries.length ? ' / ' + entries.length : '') +
    ' · ' + files.length + ' files · ' + fmtBytes(total) +
    (ctotal && ctotal !== total ? ' (compressed ' + fmtBytes(ctotal) + ')' : '');
  noticeEl.style.display = capped ? 'block' : 'none';
  if (capped) {
    noticeEl.textContent = 'Showing first ' + MAX_RENDER.toLocaleString() + ' of ' +
      list.length.toLocaleString() + ' matching entries. Filter to narrow — export covers the filtered set.';
  }
}

async function renderBuffer(buf, name) {
  showLoading('Parsing archive…');
  try {
    entries = await detectAndParse(buf, name);
    currentName = (name || 'archive').replace(/\.(zip|tar|jar|war|ear|nupkg|tgz)$/i, '').replace(/\.tar$/i, '');
    fname.textContent = name || '';
    document.title = currentName + ' — KSI Tools Archive Viewer';
    drop.style.display = 'none';
    tableWrap.style.display = 'block';
    clearError();
    searchIn.disabled = false;
    Object.values(btns).forEach(b => b.disabled = false);
    searchIn.value = '';
    noticeEl.style.display = 'block';
    noticeEl.textContent = 'Listing ready. Click a file row to preview small text members (store/deflate, ≤256 KB). Binary may look garbled.';
    draw();
  } catch (e) {
    showError(e.message || String(e));
  }
  hideLoading();
}

function loadFile(file) {
  if (!file) return;
  if (file.size > MAX_BYTES) {
    showError('File too large for in-memory listing (' + file.size + ' bytes). Max ' + MAX_BYTES + ' bytes.');
    return;
  }
  showLoading('Reading ' + file.name + '…');
  const reader = new FileReader();
  reader.onload = () => renderBuffer(reader.result, file.name);
  reader.onerror = () => { hideLoading(); showError('Failed to read file.'); };
  reader.readAsArrayBuffer(file);
}

drop.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); fileInput.value = ''; });
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('hover'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('hover'); }));
drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) loadFile(f); });
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  if (e.target.closest('#drop')) return;
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f) loadFile(f);
});
searchIn.addEventListener('input', draw);
document.querySelectorAll('.arch th[data-sort]').forEach(th => {
  th.addEventListener('click', () => {
    const k = th.dataset.sort;
    if (sortKey === k) sortDir *= -1;
    else { sortKey = k; sortDir = 1; }
    draw();
  });
});
btns.copy.addEventListener('click', async () => {
  const text = sorted(filtered()).map(e => e.name + '\t' + e.size + '\t' + e.method).join('\n');
  try {
    await navigator.clipboard.writeText(text);
    btns.copy.textContent = 'Copied!';
    setTimeout(() => { btns.copy.textContent = 'Copy list'; }, 1200);
  } catch { /* ignore */ }
});
btns.savejson.addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(sorted(filtered()), null, 2)], { type: 'application/json' }));
  a.download = currentName + '-listing.json';
  a.click(); URL.revokeObjectURL(a.href);
});
btns.savecsv.addEventListener('click', () => {
  const escCsv = v => {
    const s = String(v ?? '');
    return /["\n,]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const lines = ['name,size,compressed,method,date,is_dir'];
  for (const e of sorted(filtered())) {
    lines.push([e.name, e.size, e.csize, e.method, e.date, e.isDir].map(escCsv).join(','));
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv' }));
  a.download = currentName + '-listing.csv';
  a.click(); URL.revokeObjectURL(a.href);
});
</script>
</body>
</html>
