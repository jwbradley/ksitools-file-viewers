<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KSI Tools audit.rules Viewer</title>
<style id="appcss">
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:15px; line-height:1.5; background:#fff; color:#1f2328; }
header.bar { position:sticky; top:0; z-index:20; display:flex; gap:8px; align-items:center; padding:10px 16px; background:#f6f8fa; border-bottom:1px solid #d0d7de; flex-wrap:wrap; }
header.bar h1 { font-size:15px; margin:0; font-weight:600; }
header.bar .fname { color:#57606a; font-size:13px; flex:1; min-width:60px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
header.bar .meta { color:#57606a; font-size:12px; }
button, select, input[type=text], textarea { font:inherit; font-size:13px; padding:6px 12px; border:1px solid #d0d7de; border-radius:6px; background:#fff; color:#1f2328; }
button { cursor:pointer; } button:hover { background:#f3f4f6; } button:disabled { opacity:.45; cursor:default; }
#search { width:200px; }
#drop { max-width:900px; margin:36px auto 16px; padding:48px 24px; text-align:center; border:2px dashed #d0d7de; border-radius:12px; color:#57606a; cursor:pointer; }
#drop.hover { border-color:#0969da; background:rgba(9,105,218,.05); color:#0969da; }
#drop strong { display:block; font-size:18px; margin-bottom:6px; color:#1f2328; }
.hint { color:#8b949e; font-size:12px; }
.paste-box { max-width:900px; margin:0 auto 20px; padding:0 16px; }
.paste-box label { display:block; font-size:13px; color:#57606a; margin-bottom:6px; }
#paste, .tarea { width:100%; min-height:110px; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:12.5px; padding:10px; border:1px solid #d0d7de; border-radius:8px; resize:vertical; }
#notice { padding:7px 16px; font-size:12.5px; background:#fff8c5; color:#7a5c00; border-bottom:1px solid #f0c000; display:none; }
#err { max-width:900px; margin:24px auto; padding:16px 20px; border:1px solid #cf222e; border-radius:10px; background:rgba(207,34,46,.06); color:#cf222e; font-family:ui-monospace,monospace; font-size:13px; white-space:pre-wrap; display:none; }
#loading { position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px; background:rgba(255,255,255,.72); color:#57606a; }
#loading.show { display:flex; }
.spinner { width:38px; height:38px; border:4px solid #d0d7de; border-top-color:#0969da; border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

.badge { display:inline-block; font-size:10px; font-weight:600; padding:1px 7px; border-radius:999px; border:1px solid #d0d7de; margin-right:4px; margin-bottom:4px; }
.badge.bad { background:#ffebe9; border-color:#ff8182; color:#cf222e; }
.badge.warn { background:#fff8c5; border-color:#f0c000; color:#7a5c00; }
.badge.ok { background:#dafbe1; border-color:#4ac26b; color:#1a7f37; }
.badge.info { background:#ddf4ff; border-color:#54aeff; color:#0969da; }

.stats { display:none; flex-wrap:wrap; gap:8px; margin:8px 0 12px; padding:0 16px; }
.stat { border:1px solid #d0d7de; border-radius:8px; padding:8px 12px; font-size:12.5px; background:#f6f8fa; min-width:120px; max-width:320px; }
.stat b { display:block; font-size:14px; word-break:break-word; }
.stat .lbl { color:#57606a; font-size:11px; text-transform:uppercase; letter-spacing:.03em; }

.panel { max-width:1100px; margin:12px auto; padding:0 16px 40px; display:none; }
.panel.show { display:block; }
.card { border:1px solid #d0d7de; border-radius:10px; margin-bottom:12px; overflow:hidden; }
.card h2 { margin:0; padding:10px 14px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; background:#f6f8fa; border-bottom:1px solid #d0d7de; color:#57606a; }
.card .body { padding:12px 14px; }
.flags-row { display:flex; flex-wrap:wrap; gap:4px; align-items:center; }

table.grid { border-collapse:collapse; width:100%; font-size:12.5px; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; }
.grid th { position:sticky; top:53px; background:#f6f8fa; text-align:left; padding:8px 10px; border-bottom:1px solid #d0d7de; white-space:nowrap; z-index:5; }
.grid td { padding:6px 10px; border-bottom:1px solid #f0f2f4; vertical-align:top; word-break:break-word; }
.grid tr:hover td { background:rgba(175,184,193,.12); }
.grid tr { cursor:pointer; }
.grid tr.selected td { background:rgba(9,105,218,.1); }
.grid td.key { color:#0550ae; font-weight:600; white-space:nowrap; width:1%; }
.grid td.sec { color:#57606a; white-space:nowrap; width:1%; }
.grid td.ln { color:#8b949e; width:1%; text-align:right; font-variant-numeric:tabular-nums; }

pre.block { margin:0; padding:10px 12px; background:#f6f8fa; border-radius:8px; white-space:pre-wrap; word-break:break-word; max-height:28vh; overflow:auto; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:12px; }
.ctx-line { display:block; padding:1px 4px; border-radius:3px; }
.ctx-line.cur { background:rgba(9,105,218,.15); font-weight:600; }
.hit { background:#fff3c4; border-radius:3px; box-shadow:0 0 0 1px #f0c000; }

@media (prefers-color-scheme: dark) {
  body { background:#0d1117; color:#e6edf3; }
  header.bar { background:#161b22; border-bottom-color:#30363d; }
  header.bar .fname, header.bar .meta, .hint, .paste-box label, .stat .lbl { color:#8b949e; }
  button, select, input[type=text], textarea, #paste, .tarea { background:#21262d; color:#e6edf3; border-color:#30363d; }
  button:hover { background:#30363d; }
  #drop { border-color:#30363d; color:#8b949e; } #drop strong { color:#e6edf3; }
  #drop.hover { border-color:#4493f8; color:#4493f8; }
  .stat { background:#161b22; border-color:#30363d; }
  .card { border-color:#30363d; }
  .card h2 { background:#161b22; border-bottom-color:#30363d; color:#8b949e; }
  .grid th { background:#161b22; border-bottom-color:#30363d; }
  .grid td { border-bottom-color:#21262d; }
  .grid tr:hover td { background:rgba(110,118,129,.12); }
  .grid tr.selected td { background:rgba(31,111,235,.2); }
  .grid td.key { color:#79c0ff; }
  .grid td.sec { color:#8b949e; }
  .grid td.ln { color:#6e7681; }
  .badge { border-color:#30363d; }
  .badge.bad { background:#3d1418; border-color:#f85149; color:#ff7b72; }
  .badge.warn { background:#3a2f00; border-color:#b58900; color:#e3b341; }
  .badge.ok { background:#12261e; border-color:#238636; color:#3fb950; }
  .badge.info { background:#121d2f; border-color:#1f6feb; color:#58a6ff; }
  pre.block { background:#161b22; }
  .ctx-line.cur { background:rgba(31,111,235,.25); }
  .hit { background:#634c00; color:#ffe08a; box-shadow:0 0 0 1px #b58900; }
  #notice { background:#3a2f00; color:#e3b341; border-bottom-color:#b58900; }
  #err { border-color:#f85149; color:#ff7b72; background:rgba(248,81,73,.08); }
  #loading { background:rgba(13,17,23,.75); }
  .spinner { border-color:#30363d; border-top-color:#4493f8; }
}
</style>
</head>
<body>

<header class="bar">
  <h1>KSI Tools audit.rules Viewer</h1>
  <span class="fname" id="fname"></span>
  <span class="meta" id="meta"></span>
  <input type="text" id="search" placeholder="Filter type / target / key…" disabled>
  <button id="copy" disabled title="Copy a plain-English summary">Copy summary</button>
  <button id="savejson" disabled>Save .json</button>
  <button id="savecsv" disabled>Save .csv</button>
  <button id="pick" onclick="document.getElementById('file').click()">Open file</button>
</header>
<input type="file" id="file" accept="audit.rules,.rules,.conf,.txt,text/plain" style="display:none">

<div id="drop">
  <strong>Drop an audit.rules file here</strong>
  or click to choose · /etc/audit/audit.rules · /etc/audit/rules.d/*
  <div class="hint" style="margin-top:10px">Parsed locally for ops review. Nothing is uploaded.</div>
</div>

<div class="paste-box">
  <label for="paste">Or paste audit.rules contents:</label>
  <textarea id="paste" class="tarea" spellcheck="false" placeholder="# /etc/audit/audit.rules&#10;-D&#10;-b 8192&#10;-f 1&#10;&#10;-w /etc/passwd -p wa -k identity&#10;-w /etc/shadow -p wa -k identity&#10;-w /etc/sudoers -p wa -k scope&#10;&#10;-a always,exit -F arch=b64 -S open,openat -F auid>=1000 -F auid!=4294967295 -k access&#10;-a always,exit -F arch=b64 -S execve -k exec"></textarea>
  <div style="margin-top:8px"><button id="goBtn">Analyze paste</button></div>
</div>

<div id="err"></div>
<div id="notice"></div>
<div class="stats" id="stats"></div>
<div class="panel" id="panel"></div>

<div id="loading"><div class="spinner"></div><div id="loadingmsg">Loading…</div></div>

<script>
(function () {
'use strict';

const MAX_BYTES = 5 * 1024 * 1024;
const SECURE_PATHS = ['/etc/passwd', '/etc/shadow', '/etc/sudoers', '/etc/sudoers.d', '/etc/group', '/etc/gshadow'];
const CONFIG_DIRECTIVES = ['-D', '-b', '-f', '-r', '-R', '-l', '-i', '-s', '-c', '-q', '--'];
const LOW_BACKLOG = 256;
const LOW_RATE = 5;

const drop = document.getElementById('drop');
const errBox = document.getElementById('err');
const noticeEl = document.getElementById('notice');
const fname = document.getElementById('fname');
const metaEl = document.getElementById('meta');
const pasteEl = document.getElementById('paste');
const fileInput = document.getElementById('file');
const searchIn = document.getElementById('search');
const loadingEl = document.getElementById('loading');
const loadingMsg = document.getElementById('loadingmsg');
const statsEl = document.getElementById('stats');
const panel = document.getElementById('panel');
const btns = {
  copy: document.getElementById('copy'),
  savejson: document.getElementById('savejson'),
  savecsv: document.getElementById('savecsv')
};

let currentName = 'audit.rules';
let currentFileName = '';
let rawLines = [];
let state = null; // { summary, flags, rules, rows }

function showLoading(m) { loadingMsg.textContent = m || 'Loading…'; loadingEl.classList.add('show'); }
function hideLoading() { loadingEl.classList.remove('show'); }
function afterPaint(fn) { requestAnimationFrame(() => requestAnimationFrame(fn)); }
function showError(m) { errBox.style.display = 'block'; errBox.textContent = m; }
function clearError() { errBox.style.display = 'none'; errBox.textContent = ''; }
function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: type || 'text/plain' }));
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}
function csvEsc(v) {
  const s = String(v ?? '');
  return /["\n,]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function fmtBytes(n) {
  if (n >= 1024 * 1024) return (n / (1024 * 1024)).toFixed(1) + ' MB';
  if (n >= 1024) return (n / 1024).toFixed(1) + ' KB';
  return n + ' bytes';
}
function wireDrop(loadFn) {
  drop.onclick = () => fileInput.click();
  fileInput.onchange = () => { if (fileInput.files[0]) loadFn(fileInput.files[0]); fileInput.value = ''; };
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('hover'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('hover'); }));
  drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) loadFn(f); });
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => {
    if (e.target.closest && e.target.closest('#drop')) return;
    e.preventDefault();
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) loadFn(f);
  });
}

/** Join physical lines with trailing \ into logical lines; track start line. */
function logicalLines(text) {
  const phys = text.replace(/^﻿/, '').split(/\r\n|\n|\r/);
  rawLines = phys;
  const out = [];
  let buf = '';
  let start = 1;
  let continuing = false;
  for (let i = 0; i < phys.length; i++) {
    const ln = i + 1;
    const raw = phys[i];
    const trimmedEnd = raw.replace(/\s+$/, '');
    if (!continuing) {
      const t = raw.trim();
      if (!t || t.startsWith('#')) continue;
      start = ln;
      if (trimmedEnd.endsWith('\\')) {
        buf = trimmedEnd.slice(0, -1);
        continuing = true;
      } else {
        out.push({ line: ln, text: raw.trim() });
      }
    } else {
      if (trimmedEnd.endsWith('\\')) {
        buf += trimmedEnd.slice(0, -1);
      } else {
        buf += raw.trim();
        out.push({ line: start, text: buf.trim() });
        buf = '';
        continuing = false;
      }
    }
  }
  if (continuing && buf.trim()) out.push({ line: start, text: buf.trim() });
  return out;
}

/** Strip a quoted value: returns inner text if wrapped in matching quotes, else the input. */
function unquote(s) {
  const t = String(s ?? '').trim();
  if (t.length >= 2) {
    const c = t[0];
    if ((c === '"' || c === "'") && t[t.length - 1] === c) return t.slice(1, -1);
  }
  return t;
}

/** Tokenize an auditctl line into flag groups. Each token starting with '-' begins a new group. */
function tokenize(line) {
  const toks = [];
  let cur = '';
  let quote = null;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (quote) {
      cur += c;
      if (c === quote) quote = null;
    } else if (c === '"' || c === "'") {
      cur += c;
      quote = c;
    } else if (c === ' ' || c === '\t') {
      if (cur) { toks.push(cur); cur = ''; }
    } else {
      cur += c;
    }
  }
  if (cur) toks.push(cur);
  return toks;
}

/** Group tokens into {flag, value} pairs; a flag is any token starting with '-'. */
function flagPairs(toks) {
  const pairs = [];
  let i = 0;
  while (i < toks.length) {
    const t = toks[i];
    if (/^-/.test(t)) {
      // flag with optional value(s) until next flag
      const flag = t;
      const vals = [];
      let j = i + 1;
      while (j < toks.length && !/^-/.test(toks[j])) {
        vals.push(toks[j]);
        j++;
      }
      pairs.push({ flag, values: vals });
      i = j;
    } else {
      // bare token (unusual) — keep as own pair with empty flag
      pairs.push({ flag: '', values: [t] });
      i++;
    }
  }
  return pairs;
}

function findFlag(pairs, flag) {
  return pairs.find(p => p.flag === flag);
}
function findFlagValues(pairs, flag) {
  const p = findFlag(pairs, flag);
  return p ? p.values : [];
}
/** -a takes a single combined value like "always,exit" or two tokens "always exit". */
function listAction(pairs) {
  const p = findFlag(pairs, '-a');
  if (!p) return null;
  if (p.values.length === 1) {
    const v = p.values[0];
    const parts = v.split(',').map(s => s.trim()).filter(Boolean);
    if (parts.length >= 2) return { list: parts[0], action: parts[1] };
    return { list: parts[0] || '', action: '' };
  }
  if (p.values.length >= 2) return { list: p.values[0], action: p.values[1] };
  return { list: p.values[0] || '', action: '' };
}

/**
 * Parse audit.rules (auditctl syntax).
 * Returns { rules: [{line, type, target, perms, fields, key, raw, pairs}] }.
 * type: 'watch' | 'syscall' | 'config' | 'unknown'
 */
function parseRules(text) {
  const logical = logicalLines(text);
  const rules = [];
  for (const item of logical) {
    const t = item.text;
    const toks = tokenize(t);
    if (!toks.length) continue;
    const pairs = flagPairs(toks);
    const firstFlag = pairs[0] ? pairs[0].flag : '';

    // Malformed: doesn't start with '-' (and isn't a comment/blank — already filtered)
    if (!firstFlag || !/^-/.test(firstFlag)) {
      rules.push({
        line: item.line, type: 'unknown', target: t, perms: '', fields: [],
        key: '', raw: t, pairs, malformed: true
      });
      continue;
    }

    const hasW = pairs.some(p => p.flag === '-w');
    const hasWUpper = pairs.some(p => p.flag === '-W');
    const hasA = pairs.some(p => p.flag === '-a');
    const hasS = pairs.some(p => p.flag === '-S');

    if (hasW) {
      const path = findFlagValues(pairs, '-w')[0] || '';
      const perms = findFlagValues(pairs, '-p').join('');
      const keyVals = findFlagValues(pairs, '-k').map(unquote);
      rules.push({
        line: item.line, type: 'watch', target: path, perms, fields: [],
        key: keyVals.join(','), raw: t, pairs, removeWatch: false
      });
    } else if (hasWUpper) {
      const path = findFlagValues(pairs, '-W')[0] || '';
      rules.push({
        line: item.line, type: 'watch', target: path, perms: '(removed)', fields: [],
        key: '', raw: t, pairs, removeWatch: true
      });
    } else if (hasA || hasS) {
      const syscalls = findFlagValues(pairs, '-S');
      const fields = pairs.filter(p => p.flag === '-F').map(p => p.values.join('='));
      const la = listAction(pairs);
      const keyVals = findFlagValues(pairs, '-k').map(unquote);
      rules.push({
        line: item.line, type: 'syscall', target: syscalls.join(','), perms: '',
        fields, key: keyVals.join(','), raw: t, pairs,
        list: la ? la.list : '', action: la ? la.action : ''
      });
    } else if (CONFIG_DIRECTIVES.indexOf(firstFlag) >= 0) {
      rules.push({
        line: item.line, type: 'config', target: firstFlag, perms: pairs[0].values.join(' '),
        fields: [], key: '', raw: t, pairs
      });
    } else {
      // Unknown directive (still starts with '-') — call it config but flag for review
      rules.push({
        line: item.line, type: 'config', target: firstFlag, perms: pairs[0].values.join(' '),
        fields: [], key: '', raw: t, pairs, unknownDirective: true
      });
    }
  }
  return rules;
}

function buildSummary(rules, filename) {
  const watches = rules.filter(r => r.type === 'watch' && !r.removeWatch);
  const syscalls = rules.filter(r => r.type === 'syscall');
  const configs = rules.filter(r => r.type === 'config');
  const withKeys = rules.filter(r => r.type !== 'config' && r.key && r.key.length);
  const withoutKeys = rules.filter(r => (r.type === 'watch' && !r.removeWatch || r.type === 'syscall') && (!r.key || !r.key.length));
  const removeWatches = rules.filter(r => r.removeWatch);

  // Failure mode / backlog / rate from configs
  let failureMode = '';
  let backlog = '';
  let rate = '';
  let hasD = false;
  let dLine = -1;
  for (const r of configs) {
    if (r.target === '-f' && r.perms) failureMode = r.perms.trim();
    else if (r.target === '-b' && r.perms) backlog = r.perms.trim();
    else if (r.target === '-r' && r.perms) rate = r.perms.trim();
    else if (r.target === '-D') { hasD = true; dLine = r.line; }
  }

  return {
    filename: filename || '',
    total: rules.length,
    watches: watches.length,
    syscalls: syscalls.length,
    configs: configs.length,
    removeWatches: removeWatches.length,
    withKeys: withKeys.length,
    withoutKeys: withoutKeys.length,
    failureMode,
    backlog,
    rate,
    hasD,
    dLine
  };
}

function analyzeFlags(rules, summary) {
  const flags = [];

  // -f 0
  if (summary.failureMode === '0') {
    flags.push({ level: 'warn', label: '-f 0 (silent failure)', detail: 'Failure mode 0 = continue silently on audit failure. Use -f 2 (kernel panic) for the secure default on hardened hosts.' });
  } else if (summary.failureMode === '2') {
    flags.push({ level: 'ok', label: '-f 2 (panic on failure)', detail: 'Failure mode 2 = kernel panic when audit fails — the secure default.' });
  } else if (summary.failureMode === '1') {
    flags.push({ level: 'info', label: '-f 1 (log failure)', detail: 'Failure mode 1 = log a warning and continue.' });
  }

  // Backlog
  if (summary.backlog) {
    const n = parseInt(summary.backlog, 10);
    if (!isNaN(n) && n < LOW_BACKLOG) {
      flags.push({ level: 'warn', label: '-b backlog low', detail: 'Backlog limit is ' + n + '; events may be dropped under load. Common values are 8192+.' });
    }
  } else {
    flags.push({ level: 'info', label: '-b backlog not set', detail: 'No backlog limit (-b) found; kernel default is 64, which drops events quickly.' });
  }

  // Rate limit
  if (summary.rate) {
    const n = parseInt(summary.rate, 10);
    if (!isNaN(n) && n < LOW_RATE) {
      flags.push({ level: 'warn', label: '-r rate limit low', detail: 'Rate limit is ' + n + '/sec; may drop audit events.' });
    }
  }

  // -D at top
  if (summary.hasD) {
    flags.push({ level: 'info', label: '-D present', detail: 'Ruleset starts with -D (clears existing rules before loading) — standard practice. Line ' + summary.dLine + '.' });
  } else if (summary.total > 0) {
    flags.push({ level: 'info', label: 'no -D at top', detail: 'No -D directive found; loading this file appends rules without clearing existing ones.' });
  }

  // Per-rule checks
  const broadExclude = [];
  for (const r of rules) {
    if (r.type === 'watch' && !r.removeWatch) {
      if (!r.key) {
        flags.push({ level: 'warn', label: 'watch missing -k', detail: 'Line ' + r.line + ': file watch on ' + r.target + ' has no -k key — hard to find in audit logs.' });
      }
      // secure paths
      if (SECURE_PATHS.indexOf(r.target) >= 0) {
        flags.push({ level: 'ok', label: 'watch on ' + r.target, detail: 'Line ' + r.line + ': watching a sensitive identity/auth file — good practice.' });
      }
      // dir with -p a only
      if (r.perms && r.perms.length === 1 && r.perms === 'a' && /\/$/.test(r.target)) {
        flags.push({ level: 'info', label: 'dir watch -p a only', detail: 'Line ' + r.line + ': directory watch with only attribute (-p a) permission; will not catch reads/writes.' });
      }
    }
    if (r.type === 'syscall') {
      if (!r.key) {
        flags.push({ level: 'warn', label: 'syscall rule missing -k', detail: 'Line ' + r.line + ': syscall rule has no -k key — hard to find in audit logs.' });
      }
      const hasArch = r.fields.some(f => /^arch\s*=/i.test(f));
      if (!hasArch) {
        flags.push({ level: 'warn', label: 'no -F arch=', detail: 'Line ' + r.line + ': syscall rule has no -F arch=b64/b32; applies to both ABIs (often desired, worth confirming).' });
      }
      if (/\bexecve\b/.test(r.target)) {
        flags.push({ level: 'info', label: 'exec logging (-S execve)', detail: 'Line ' + r.line + ': logs process executions.' });
      }
      // -a never,... excluding broad syscalls
      if (r.action === 'never') {
        flags.push({ level: 'warn', label: '-a never,… suppression', detail: 'Line ' + r.line + ': rule suppresses audit events — verify intent (may be hiding activity).' });
      }
    }
    if (r.malformed) {
      flags.push({ level: 'bad', label: 'malformed line', detail: 'Line ' + r.line + ': does not start with a flag (-) or comment (#) — not a valid auditctl directive.' });
    }
    if (r.unknownDirective) {
      flags.push({ level: 'info', label: 'unknown directive ' + r.target, detail: 'Line ' + r.line + ': ' + r.target + ' is not one of the recognized config directives (-D/-b/-f/-r/-R/-l/-i/-s/-c/-q/--).' });
    }
  }

  if (summary.withoutKeys > 0) {
    flags.push({ level: 'warn', label: summary.withoutKeys + ' rule(s) missing -k', detail: summary.withoutKeys + ' watch/syscall rule(s) have no key; in large rule sets these are hard to attribute in logs.' });
  }

  if (!flags.length) {
    flags.push({ level: 'ok', label: 'no major flags', detail: 'Heuristic checks found nothing loud.' });
  }
  return flags;
}

function plainSummary(st) {
  const s = st.summary;
  const lines = [];
  lines.push('KSI Tools audit.rules Viewer — summary');
  lines.push('File: ' + (s.filename || currentFileName || '(paste)'));
  lines.push(s.watches + ' watches, ' + s.syscalls + ' syscall rules, ' + s.configs + ' config directives; ' +
    s.withoutKeys + ' rule(s) missing keys; failure mode=' + (s.failureMode || '(unset)') +
    '; backlog=' + (s.backlog || '(unset)') + '; rate=' + (s.rate || '(unset)'));
  if (s.removeWatches) lines.push('Remove-watch directives (-W): ' + s.removeWatches);
  lines.push('Total rules: ' + s.total + ' (' + s.withKeys + ' with -k keys)');
  lines.push('');
  lines.push('Flags:');
  for (const f of st.flags) {
    lines.push('  [' + f.level + '] ' + f.label + (f.detail ? ' — ' + f.detail : ''));
  }
  lines.push('');
  lines.push('Verify with: auditctl -l  (live rules)  ·  augenrules --check  (rules.d integrity)');
  return lines.join('\n');
}

function exportJson(st) {
  return {
    summary: st.summary,
    rules: st.rules.map(r => ({
      line: r.line, type: r.type, target: r.target, perms: r.perms,
      fields: r.fields, key: r.key, raw: r.raw
    })),
    flags: st.flags.map(f => ({ level: f.level, label: f.label, detail: f.detail }))
  };
}

function highlight(text, q) {
  if (!q) return esc(text);
  const s = String(text ?? '');
  const low = s.toLowerCase();
  const idx = low.indexOf(q);
  if (idx < 0) return esc(s);
  return esc(s.slice(0, idx)) + '<span class="hit">' + esc(s.slice(idx, idx + q.length)) + '</span>' + esc(s.slice(idx + q.length));
}

function contextHtml(lineNo) {
  const i = lineNo - 1;
  const from = Math.max(0, i - 3);
  const to = Math.min(rawLines.length - 1, i + 3);
  let html = '';
  for (let n = from; n <= to; n++) {
    const cur = n === i ? ' cur' : '';
    html += '<span class="ctx-line' + cur + '">' + esc(String(n + 1).padStart(4, ' ')) + ' │ ' + esc(rawLines[n]) + '</span>';
  }
  return html;
}

function filteredRows() {
  if (!state) return [];
  const q = searchIn.value.trim().toLowerCase();
  if (!q) return state.rows;
  return state.rows.filter(r =>
    (r.type + ' ' + r.target + ' ' + r.perms + ' ' + (r.fields || []).join(' ') + ' ' + r.key).toLowerCase().includes(q)
  );
}

function draw() {
  if (!state) return;
  const q = searchIn.value.trim().toLowerCase();
  const list = filteredRows();
  const s = state.summary;

  // stats cards
  const cards = [];
  cards.push({ lbl: 'Total rules', val: s.total });
  cards.push({ lbl: 'File watches', val: s.watches });
  cards.push({ lbl: 'Syscall rules', val: s.syscalls });
  cards.push({ lbl: 'Config directives', val: s.configs });
  cards.push({ lbl: 'Rules with -k', val: s.withKeys });
  cards.push({ lbl: 'Rules missing -k', val: s.withoutKeys });
  if (s.failureMode) cards.push({ lbl: 'Failure mode (-f)', val: s.failureMode });
  if (s.backlog) cards.push({ lbl: 'Backlog (-b)', val: s.backlog });
  if (s.rate) cards.push({ lbl: 'Rate (-r)', val: s.rate + '/s' });
  if (s.removeWatches) cards.push({ lbl: 'Remove watches (-W)', val: s.removeWatches });

  statsEl.style.display = 'flex';
  statsEl.innerHTML = cards.map(c =>
    '<div class="stat"><span class="lbl">' + esc(c.lbl) + '</span><b>' + esc(c.val) + '</b></div>'
  ).join('');

  const warnCount = state.flags.filter(f => f.level === 'bad' || f.level === 'warn').length;
  metaEl.textContent = s.total + ' rules · ' + s.watches + ' watches · ' + s.syscalls + ' syscalls' +
    (warnCount ? ' · ' + warnCount + ' flag' + (warnCount === 1 ? '' : 's') : '') +
    (q ? ' · ' + list.length + ' shown' : '');

  // always show notice bar per spec
  noticeEl.style.display = 'block';
  noticeEl.textContent = 'Heuristic audit.rules review; verify with `auditctl -l` for live rules and `augenrules --check`.';

  let html = '';

  // Flags card
  html += '<div class="card"><h2>Flags</h2><div class="body"><div class="flags-row">';
  for (const f of state.flags) {
    html += '<span class="badge ' + esc(f.level) + '" title="' + esc(f.detail || '') + '">' + esc(f.label) + '</span>';
  }
  html += '</div>';
  html += '<ul style="margin:10px 0 0;padding-left:18px;font-size:12.5px;color:inherit">';
  for (const f of state.flags) {
    if (f.level === 'ok') continue;
    html += '<li><strong>' + esc(f.label) + '</strong> — ' + esc(f.detail || '') + '</li>';
  }
  html += '</ul></div></div>';

  // Watches card — group by path
  const watches = state.rules.filter(r => r.type === 'watch' && !r.removeWatch);
  if (watches.length) {
    html += '<div class="card"><h2>Watches (' + watches.length + ')</h2><div class="body" style="padding:0">';
    html += '<table class="grid"><thead><tr><th>Line</th><th>Path</th><th>Perms</th><th>Key</th></tr></thead><tbody>';
    for (const r of watches) {
      html += '<tr data-line="' + r.line + '">' +
        '<td class="ln">' + r.line + '</td>' +
        '<td class="key">' + highlight(r.target, q) + '</td>' +
        '<td class="sec">' + esc(r.perms) + '</td>' +
        '<td>' + highlight(r.key || '-', q) + '</td></tr>';
    }
    html += '</tbody></table></div></div>';
  }

  // Syscall rules card
  const syscalls = state.rules.filter(r => r.type === 'syscall');
  if (syscalls.length) {
    html += '<div class="card"><h2>Syscall rules (' + syscalls.length + ')</h2><div class="body" style="padding:0">';
    html += '<table class="grid"><thead><tr><th>Line</th><th>List,Action</th><th>-S syscalls</th><th>-F fields</th><th>Key</th></tr></thead><tbody>';
    for (const r of syscalls) {
      const la = (r.list || r.action) ? (r.list + ',' + r.action) : '';
      html += '<tr data-line="' + r.line + '">' +
        '<td class="ln">' + r.line + '</td>' +
        '<td class="sec">' + esc(la) + '</td>' +
        '<td class="key">' + highlight(r.target, q) + '</td>' +
        '<td>' + highlight((r.fields || []).join(' '), q) + '</td>' +
        '<td>' + highlight(r.key || '-', q) + '</td></tr>';
    }
    html += '</tbody></table></div></div>';
  }

  // Main table — all rules
  html += '<div class="card"><h2>All rules</h2><div class="body" style="padding:0">';
  html += '<table class="grid"><thead><tr><th>Line</th><th>Type</th><th>Target</th><th>Permissions / Fields</th><th>Key</th></tr></thead><tbody id="tbody">';
  for (const r of list) {
    let pf = '';
    if (r.type === 'watch') pf = r.perms;
    else if (r.type === 'syscall') pf = (r.fields || []).join(' ');
    else pf = r.perms;
    html += '<tr data-line="' + r.line + '">' +
      '<td class="ln">' + r.line + '</td>' +
      '<td class="sec">' + highlight(r.type, q) + '</td>' +
      '<td class="key">' + highlight(r.target, q) + '</td>' +
      '<td>' + highlight(pf, q) + '</td>' +
      '<td>' + highlight(r.key || '-', q) + '</td></tr>';
  }
  if (!list.length) {
    html += '<tr><td colspan="5" style="color:#8b949e;padding:16px">No rows match the filter.</td></tr>';
  }
  html += '</tbody></table></div></div>';

  html += '<div class="card" id="ctxcard" style="display:none"><h2>Line context</h2><div class="body"><pre class="block" id="ctxpre"></pre></div></div>';

  panel.innerHTML = html;
  panel.classList.add('show');

  panel.querySelectorAll('tbody tr[data-line]').forEach(tr => {
    tr.addEventListener('click', () => {
      panel.querySelectorAll('tr.selected').forEach(x => x.classList.remove('selected'));
      tr.classList.add('selected');
      const line = +tr.getAttribute('data-line');
      const card = document.getElementById('ctxcard');
      const pre = document.getElementById('ctxpre');
      if (card && pre) {
        card.style.display = 'block';
        pre.innerHTML = contextHtml(line);
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    });
  });
}

function render(text, name) {
  showLoading('Parsing audit.rules…');
  afterPaint(() => {
    try {
      clearError();
      const rules = parseRules(text);
      if (!rules.length) throw new Error('No audit rules found. File appears empty or contains only comments.');

      currentFileName = name || '(paste)';
      currentName = (name || 'audit.rules').replace(/\.(rules|conf|txt)$/i, '');
      const summary = buildSummary(rules, currentFileName);
      const flags = analyzeFlags(rules, summary);
      state = { summary, flags, rules, rows: rules };

      fname.textContent = currentFileName;
      document.title = currentName + ' — KSI Tools audit.rules Viewer';
      drop.style.display = 'none';
      document.querySelector('.paste-box').style.display = 'none';
      searchIn.disabled = false;
      Object.values(btns).forEach(b => b.disabled = false);
      searchIn.value = '';
      draw();
    } catch (e) {
      showError(e.message || String(e));
      statsEl.style.display = 'none';
      panel.classList.remove('show');
    }
    hideLoading();
  });
}

function loadFile(file) {
  if (!file) return;
  if (file.size > MAX_BYTES) {
    showError('That file is ' + fmtBytes(file.size) + ', over the ' + fmtBytes(MAX_BYTES) + ' limit for audit.rules files.');
    return;
  }
  showLoading('Reading ' + file.name + '…');
  const r = new FileReader();
  r.onload = () => render(String(r.result || ''), file.name);
  r.onerror = () => { hideLoading(); showError('Could not read the file.'); };
  r.readAsText(file);
}

wireDrop(loadFile);
document.getElementById('goBtn').onclick = () => {
  const t = pasteEl.value;
  if (!t.trim()) { showError('Paste audit.rules contents first.'); return; }
  render(t, '(paste)');
};
searchIn.addEventListener('input', () => { clearTimeout(searchIn._t); searchIn._t = setTimeout(draw, 120); });

btns.copy.onclick = async () => {
  if (!state) return;
  try {
    await navigator.clipboard.writeText(plainSummary(state));
    const old = btns.copy.textContent;
    btns.copy.textContent = 'Copied!';
    setTimeout(() => { btns.copy.textContent = old; }, 1200);
  } catch (e) {
    alert('Copy failed — browser blocked clipboard access.');
  }
};

btns.savejson.onclick = () => {
  if (!state) return;
  download(currentName + '.json', JSON.stringify(exportJson(state), null, 2), 'application/json');
};

btns.savecsv.onclick = () => {
  if (!state) return;
  const rows = filteredRows();
  const lines = ['line,type,target,perms,fields,key'].concat(
    rows.map(r => [csvEsc(r.line), csvEsc(r.type), csvEsc(r.target), csvEsc(r.perms), csvEsc((r.fields || []).join(' ')), csvEsc(r.key)].join(','))
  );
  download(currentName + '.csv', lines.join('\n'), 'text/csv');
};

})();
</script>
</body>
</html>
