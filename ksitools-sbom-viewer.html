<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KSI Tools SBOM Viewer</title>
<style id="appcss">
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:15px; line-height:1.5; background:#fff; color:#1f2328; }
header.bar { position:sticky; top:0; z-index:20; display:flex; gap:6px; align-items:center; padding:8px 14px; background:#f6f8fa; border-bottom:1px solid #d0d7de; flex-wrap:wrap; }
header.bar h1 { font-size:14px; margin:0; font-weight:600; white-space:nowrap; }
header.bar .fname { color:#57606a; font-size:12px; flex:1; min-width:60px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
button, select, input[type=text] { font:inherit; font-size:12px; padding:5px 10px; border:1px solid #d0d7de; border-radius:6px; background:#fff; color:#1f2328; }
button { cursor:pointer; } button:hover { background:#f3f4f6; } button:disabled { opacity:.45; cursor:default; }
#search { width:200px; }
#drop { max-width:960px; margin:32px auto 16px; padding:48px 24px; text-align:center; border:2px dashed #d0d7de; border-radius:12px; color:#57606a; cursor:pointer; }
#drop.hover { border-color:#0969da; background:rgba(9,105,218,.05); color:#0969da; }
#drop strong { display:block; font-size:18px; margin-bottom:6px; color:#1f2328; }
.hint { color:#8b949e; font-size:12px; }
.chips { max-width:960px; margin:0 auto 8px; padding:0 14px; display:none; flex-wrap:wrap; gap:8px; }
.chip { display:inline-flex; flex-direction:column; background:#f6f8fa; border:1px solid #d0d7de; border-radius:8px; padding:6px 12px; min-width:80px; }
.chip .cv { font-size:18px; font-weight:700; line-height:1.2; color:#1f2328; }
.chip .cl { font-size:11px; color:#57606a; }
.chip.warn .cv { color:#bc4c00; }
.chip.ok .cv { color:#1a7f37; }
.hist { max-width:960px; margin:0 auto 8px; padding:0 14px; display:none; flex-wrap:wrap; gap:8px; }
.hbox { background:#f6f8fa; border:1px solid #d0d7de; border-radius:8px; padding:8px 12px; min-width:200px; max-width:320px; }
.hbox h3 { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:#57606a; margin:0 0 6px; }
.hrow { display:flex; align-items:center; gap:6px; margin-bottom:3px; font-size:12px; }
.hrow .hbar { flex:1; height:8px; background:#0969da; border-radius:4px; opacity:.7; min-width:2px; }
.hrow .hlabel { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:160px; color:#57606a; }
.hrow .hcount { color:#1f2328; font-weight:600; white-space:nowrap; }
.ntia-warn { max-width:960px; margin:0 auto 6px; padding:6px 14px; font-size:12px; background:#fff8c5; color:#7a5c00; border-radius:6px; display:none; }
.notice { max-width:960px; margin:0 auto 6px; padding:6px 14px; font-size:12px; background:#ddf4ff; color:#0969da; border-radius:6px; display:none; }
.table-wrap { overflow:auto; padding-bottom:60px; display:none; }
table.grid { border-collapse:collapse; width:100%; font-size:12px; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; }
.grid th { position:sticky; top:42px; background:#f6f8fa; text-align:left; padding:7px 10px; border-bottom:1px solid #d0d7de; white-space:nowrap; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:#57606a; }
.grid td { padding:5px 10px; border-bottom:1px solid #f0f2f4; vertical-align:top; word-break:break-word; }
.grid tr:hover td { background:rgba(175,184,193,.12); }
.grid tr.selected td { background:rgba(9,105,218,.1); }
.badge { display:inline-block; font-size:10px; font-weight:600; padding:1px 6px; border-radius:999px; border:1px solid #d0d7de; white-space:nowrap; }
.badge.ok { background:#dafbe1; border-color:#4ac26b; color:#1a7f37; }
.badge.warn { background:#fff8c5; border-color:#f0c000; color:#7a5c00; }
.badge.bad { background:#ffebe9; border-color:#ff8182; color:#cf222e; }
.badge.blue { background:#ddf4ff; border-color:#54aeff; color:#0969da; }
.badge.gray { background:#f6f8fa; border-color:#d0d7de; color:#57606a; }
.detail-wrap { max-width:960px; margin:0 auto; padding:0 14px 40px; display:none; }
.card { border:1px solid #d0d7de; border-radius:10px; margin-bottom:10px; overflow:hidden; }
.card-h { margin:0; padding:8px 14px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; background:#f6f8fa; border-bottom:1px solid #d0d7de; color:#57606a; }
.card-body { padding:10px 14px; }
table.kv { border-collapse:collapse; width:100%; font-size:12px; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; }
.kv td { padding:3px 8px; border-bottom:1px solid #f0f2f4; vertical-align:top; }
.kv td.k { color:#0550ae; width:1%; white-space:nowrap; font-weight:600; }
.paste-area { max-width:960px; margin:0 auto 16px; padding:0 14px; display:none; }
.paste-area label { font-size:12px; color:#57606a; display:block; margin-bottom:4px; }
textarea#paste { width:100%; min-height:80px; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:12px; padding:8px; border:1px solid #d0d7de; border-radius:8px; resize:vertical; }
#err { max-width:960px; margin:20px auto; padding:14px 18px; border:1px solid #cf222e; border-radius:10px; background:rgba(207,34,46,.06); color:#cf222e; font-family:ui-monospace,monospace; font-size:12.5px; white-space:pre-wrap; display:none; }
#loading { position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px; background:rgba(255,255,255,.72); color:#57606a; }
#loading.show { display:flex; }
.spinner { width:38px; height:38px; border:4px solid #d0d7de; border-top-color:#0969da; border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
@media (prefers-color-scheme: dark) {
  body { background:#0d1117; color:#e6edf3; }
  header.bar { background:#161b22; border-bottom-color:#30363d; }
  header.bar .fname, .hint { color:#8b949e; }
  button, select, input[type=text], textarea#paste { background:#21262d; color:#e6edf3; border-color:#30363d; }
  button:hover { background:#30363d; }
  #drop { border-color:#30363d; color:#8b949e; } #drop strong { color:#e6edf3; }
  #drop.hover { border-color:#4493f8; color:#4493f8; }
  .chip, .hbox { background:#161b22; border-color:#30363d; }
  .chip .cv { color:#e6edf3; } .chip .cl { color:#8b949e; }
  .chip.warn .cv { color:#e3a046; } .chip.ok .cv { color:#3fb950; }
  .hbox h3 { color:#8b949e; } .hrow .hlabel { color:#8b949e; } .hrow .hcount { color:#e6edf3; }
  .ntia-warn { background:#3a2f00; color:#e3b341; }
  .notice { background:#121d2f; color:#58a6ff; }
  .grid th { background:#161b22; border-bottom-color:#30363d; color:#8b949e; }
  .grid td { border-bottom-color:#21262d; }
  .grid tr:hover td { background:rgba(110,118,129,.12); }
  .grid tr.selected td { background:rgba(31,111,235,.2); }
  .badge { border-color:#30363d; }
  .badge.ok { background:#12261e; border-color:#238636; color:#3fb950; }
  .badge.warn { background:#3a2f00; border-color:#b58900; color:#e3b341; }
  .badge.bad { background:#3d1418; border-color:#f85149; color:#ff7b72; }
  .badge.blue { background:#121d2f; border-color:#1f6feb; color:#58a6ff; }
  .badge.gray { background:#21262d; border-color:#30363d; color:#8b949e; }
  .card { border-color:#30363d; }
  .card-h { background:#161b22; border-bottom-color:#30363d; color:#8b949e; }
  .kv td { border-bottom-color:#21262d; } .kv td.k { color:#79c0ff; }
  #err { border-color:#f85149; color:#ff7b72; background:rgba(248,81,73,.08); }
  #loading { background:rgba(13,17,23,.75); }
  .spinner { border-color:#30363d; border-top-color:#4493f8; }
}
</style>
</head>
<body>

<header class="bar">
  <h1>KSI Tools SBOM Viewer</h1>
  <span class="fname" id="fname"></span>
  <input type="text" id="search" placeholder="name / version / license / PURL…" disabled>
  <select id="typeSel" disabled><option value="">All types</option></select>
  <button id="copy" disabled>Copy JSON</button>
  <button id="savecsv" disabled>Save CSV</button>
  <button id="pick" onclick="document.getElementById('file').click()">Open file</button>
</header>
<input type="file" id="file" accept=".json,.spdx,.cdx,application/json" style="display:none">

<div id="drop">
  <strong>Drop SBOM here</strong>
  <div class="hint" style="margin-top:8px">CycloneDX v1.4–v1.6 JSON · SPDX v2.2–v2.3 JSON · SPDX tag-value (.spdx). <b>Nothing is uploaded.</b></div>
  <div class="hint" style="margin-top:4px">Generated by Trivy, Syft, GitHub Dependency Review, FOSSA, cdxgen.</div>
</div>

<div class="paste-area" id="pasteArea">
  <label>Or paste SBOM JSON / tag-value:</label>
  <textarea id="paste" placeholder='{"bomFormat":"CycloneDX","specVersion":"1.6",...} or SPDX tag-value'></textarea>
  <button id="pasteBtn" style="margin-top:6px">Parse</button>
</div>

<div id="err"></div>
<div class="chips" id="chips"></div>
<div class="hist" id="hist"></div>
<div class="ntia-warn" id="ntiaWarn"></div>
<div class="notice" id="notice"></div>

<div class="table-wrap" id="tablewrap">
  <table class="grid">
    <thead>
      <tr>
        <th>Name</th>
        <th>Version</th>
        <th>Type</th>
        <th>Supplier</th>
        <th>License</th>
        <th>PURL / CPE</th>
        <th>NTIA</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<div class="detail-wrap" id="detailWrap"></div>
<div id="loading"><div class="spinner"></div></div>

<script>
// ===PARSER-START===
function sbomLicenseStr(c) {
  if (!c) return '';
  if (typeof c.licenses === 'string') return c.licenses;
  if (Array.isArray(c.licenses)) {
    return c.licenses.map(l => {
      if (!l) return '';
      if (l.license) return l.license.id || l.license.name || '';
      if (l.expression) return l.expression;
      return '';
    }).filter(Boolean).join(', ');
  }
  if (c.licenseConcluded && c.licenseConcluded !== 'NOASSERTION' && c.licenseConcluded !== 'NONE') return c.licenseConcluded;
  if (c.licenseDeclared && c.licenseDeclared !== 'NOASSERTION' && c.licenseDeclared !== 'NONE') return c.licenseDeclared;
  return '';
}

function sbomSupplier(c) {
  if (!c) return '';
  if (c.supplier) {
    if (typeof c.supplier === 'string') return c.supplier.replace(/^(organization|person):\s*/i, '');
    if (c.supplier.name) return c.supplier.name;
  }
  if (c.originator) return typeof c.originator === 'string' ? c.originator.replace(/^(organization|person):\s*/i, '') : '';
  if (c.author) return typeof c.author === 'string' ? c.author : (c.author.name || '');
  if (c.publisher) return typeof c.publisher === 'string' ? c.publisher : '';
  return '';
}

function sbomPurl(c) {
  if (!c) return '';
  if (c.purl) return c.purl;
  if (Array.isArray(c.externalRefs)) {
    const p = c.externalRefs.find(r => r.referenceType === 'purl' || r.referenceCategory === 'PACKAGE-MANAGER');
    if (p) return p.referenceLocator || p.purl || '';
  }
  return c.cpe || c.SPDXID || '';
}

function sbomHashes(c) {
  if (!c) return [];
  if (Array.isArray(c.hashes)) return c.hashes.map(h => ({ alg: h.alg || h.algorithm || '', val: h.content || h.checksumValue || h.value || '' })).filter(h => h.alg && h.val);
  if (Array.isArray(c.checksums)) return c.checksums.map(h => ({ alg: h.algorithm || h.alg || '', val: h.checksumValue || h.value || '' })).filter(h => h.alg && h.val);
  return [];
}

function sbomNtia(c) {
  // NTIA minimum elements: supplier, name, version, identifiers, purl/cpe
  const missing = [];
  if (!c.name) missing.push('name');
  if (!c.version) missing.push('version');
  if (!sbomSupplier(c)) missing.push('supplier');
  if (!sbomPurl(c)) missing.push('identifier');
  return missing;
}

function parseCycloneDX(data) {
  const specVersion = String(data.specVersion || '?');
  const meta = data.metadata || {};
  const component = meta.component || {};
  const metadata = {
    format: 'CycloneDX v' + specVersion,
    name: component.name || meta.name || '',
    version: component.version || '',
    timestamp: meta.timestamp || '',
    tool: (Array.isArray(meta.tools) ? meta.tools.map(t => t.name || '').filter(Boolean).join(', ') :
           (meta.tools && meta.tools.components ? meta.tools.components.map(t => t.name || '').filter(Boolean).join(', ') : '')) ||
          (meta.tools && meta.tools.name ? meta.tools.name : ''),
    serialNumber: data.serialNumber || '',
    schema: 'CycloneDX',
  };

  const components = (Array.isArray(data.components) ? data.components : []).map((c, i) => ({
    i,
    name: c.name || '',
    version: c.version || '',
    type: c.type || 'library',
    supplier: sbomSupplier(c),
    license: sbomLicenseStr(c),
    purl: sbomPurl(c),
    hashes: sbomHashes(c),
    ntia: sbomNtia(c),
    raw: c,
  }));

  const vulns = Array.isArray(data.vulnerabilities) ? data.vulnerabilities.length : 0;
  return { metadata, components, vulns };
}

function parseSpdxJson(data) {
  const specVersion = String(data.spdxVersion || 'SPDX-?').replace(/^SPDX-/, '');
  const metadata = {
    format: 'SPDX v' + specVersion,
    name: data.name || data.documentName || '',
    version: '',
    timestamp: data.creationInfo ? (data.creationInfo.created || '') : '',
    tool: data.creationInfo ? (Array.isArray(data.creationInfo.creators) ? data.creationInfo.creators.filter(c => c.startsWith('Tool:')).map(c => c.slice(5).trim()).join(', ') : '') : '',
    serialNumber: data.SPDXID || '',
    schema: 'SPDX',
  };

  const packages = Array.isArray(data.packages) ? data.packages : [];
  const components = packages.map((p, i) => {
    const purl = sbomPurl(p);
    const supplier = sbomSupplier(p);
    return {
      i,
      name: p.name || '',
      version: p.versionInfo || p.version || '',
      type: (p.primaryPackagePurpose || 'LIBRARY').toLowerCase(),
      supplier,
      license: sbomLicenseStr(p),
      purl,
      hashes: sbomHashes(p),
      ntia: sbomNtia({ name: p.name, version: p.versionInfo || p.version, supplier: p.supplier || p.originator, purl }),
      raw: p,
    };
  });

  return { metadata, components, vulns: 0 };
}

function parseSpdxTag(text) {
  const lines = text.split(/\r?\n/);
  let spdxVersion = '';
  let docName = '';
  let created = '';
  const tools = [];
  const packages = [];
  let cur = null;

  for (const line of lines) {
    const colon = line.indexOf(':');
    if (colon < 0) continue;
    const key = line.slice(0, colon).trim();
    const val = line.slice(colon + 1).trim();
    if (!val) continue;

    if (key === 'SPDXVersion') spdxVersion = val;
    else if (key === 'DocumentName') docName = val;
    else if (key === 'Created') created = val;
    else if (key === 'Creator' && val.startsWith('Tool:')) tools.push(val.slice(5).trim());
    else if (key === 'PackageName') { if (cur) packages.push(cur); cur = { name: val, version: '', type: 'library', supplier: '', license: '', purl: '' }; }
    else if (cur) {
      if (key === 'PackageVersion') cur.version = val;
      else if (key === 'PackageSupplier') cur.supplier = val.replace(/^(Organization|Person):\s*/i, '');
      else if (key === 'PackageLicenseConcluded' && val !== 'NOASSERTION' && val !== 'NONE') cur.license = val;
      else if (key === 'PackageLicenseDeclared' && !cur.license && val !== 'NOASSERTION' && val !== 'NONE') cur.license = val;
      else if (key === 'ExternalRef' && val.includes('purl')) {
        const parts = val.split(/\s+/);
        if (parts.length >= 3) cur.purl = parts[2];
      }
    }
  }
  if (cur) packages.push(cur);

  const ver = spdxVersion.replace(/^SPDX-/, '');
  const metadata = { format: 'SPDX v' + (ver || '?'), name: docName, version: '', timestamp: created, tool: tools.join(', '), serialNumber: '', schema: 'SPDX' };
  const components = packages.map((p, i) => ({
    i, ...p,
    hashes: [],
    ntia: sbomNtia(p),
    raw: p,
  }));
  return { metadata, components, vulns: 0 };
}

function parseSbom(text) {
  const t = text.trim();
  if (!t) throw new Error('Empty input.');

  if (t.charAt(0) === '{' || t.charAt(0) === '[') {
    let data;
    try { data = JSON.parse(t); } catch (e) { throw new Error('JSON parse error: ' + e.message); }
    if (Array.isArray(data)) {
      // might be a JSON array of packages or vulnerabilities — check
      if (data[0] && (data[0].bomFormat || data[0].spdxVersion || data[0].name)) {
        throw new Error('Expected a single SBOM object, not an array.');
      }
      throw new Error('Input is a JSON array, not an SBOM document.');
    }
    if (data.bomFormat === 'CycloneDX' || data.specVersion || data.components) return parseCycloneDX(data);
    if (data.spdxVersion || data.packages || data.SPDXID === 'SPDXRef-DOCUMENT') return parseSpdxJson(data);
    throw new Error('JSON is neither CycloneDX (missing bomFormat/components) nor SPDX (missing spdxVersion/packages).');
  }

  if (/SPDXVersion:/i.test(t) || /PackageName:/i.test(t)) return parseSpdxTag(t);

  throw new Error('Unrecognized SBOM format. Expected CycloneDX JSON, SPDX JSON, or SPDX tag-value.');
}
// ===PARSER-END===

// ── UI ────────────────────────────────────────────────────────────────────────
let sbomData = null, currentName = 'sbom';

const $ = id => document.getElementById(id);
const tbody = $('tbody'), tableWrap = $('tablewrap');
const detailWrap = $('detailWrap');
const errBox = $('err');
const fnameEl = $('fname');
const fileInput = $('file');
const searchIn = $('search'), typeSel = $('typeSel');
const chipsEl = $('chips'), histEl = $('hist');
const ntiaWarnEl = $('ntiaWarn'), noticeEl = $('notice');
const loadingEl = $('loading');
const pasteArea = $('pasteArea'), pasteEl = $('paste');

function showLoading() { loadingEl.classList.add('show'); }
function hideLoading() { loadingEl.classList.remove('show'); }
function afterPaint(fn) { requestAnimationFrame(() => requestAnimationFrame(fn)); }
function showError(m) { errBox.style.display = 'block'; errBox.textContent = m; }
function clearError() { errBox.style.display = 'none'; }
function esc(s) { return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function top5(arr, key) {
  const m = new Map();
  for (const x of arr) { const v = String(x[key] || '(none)'); m.set(v, (m.get(v) || 0) + 1); }
  return [...m.entries()].sort((a, b) => b[1] - a[1]).slice(0, 5);
}

function buildChips(data) {
  const comps = data.components;
  const total = comps.length;
  const withPurl = comps.filter(c => c.purl).length;
  const withLic = comps.filter(c => c.license).length;
  const ntiaFail = comps.filter(c => c.ntia.length > 0).length;
  const purlPct = total ? Math.round(withPurl / total * 100) : 0;
  const licPct = total ? Math.round(withLic / total * 100) : 0;

  chipsEl.innerHTML = [
    `<div class="chip"><span class="cv">${total.toLocaleString()}</span><span class="cl">components</span></div>`,
    `<div class="chip ${purlPct < 80 ? 'warn' : 'ok'}"><span class="cv">${purlPct}%</span><span class="cl">with PURL</span></div>`,
    `<div class="chip ${licPct < 50 ? 'warn' : 'ok'}"><span class="cv">${licPct}%</span><span class="cl">licensed</span></div>`,
    ntiaFail ? `<div class="chip warn"><span class="cv">${ntiaFail}</span><span class="cl">NTIA gaps</span></div>` : '',
    data.vulns ? `<div class="chip warn"><span class="cv">${data.vulns}</span><span class="cl">vulns listed</span></div>` : '',
    `<div class="chip"><span class="cv">${esc(data.metadata.format)}</span><span class="cl">format</span></div>`,
  ].join('');
  chipsEl.style.display = 'flex';

  if (ntiaFail) {
    ntiaWarnEl.textContent = ntiaFail + ' component' + (ntiaFail === 1 ? '' : 's') + ' missing NTIA minimum elements (supplier, version, or unique identifier). NTIA memo: "Framing Software Component Transparency" requires all four: name, version, supplier, unique ID.';
    ntiaWarnEl.style.display = 'block';
  }

  noticeEl.textContent = 'Inventory view only — not a license compliance engine. Verify license expressions with your legal team.';
  noticeEl.style.display = 'block';
}

function hBar(label, count, max) {
  const pct = max ? Math.round(count / max * 100) : 0;
  return `<div class="hrow"><span class="hlabel" title="${esc(label)}">${esc(label)}</span><div class="hbar" style="width:${pct}%"></div><span class="hcount">${count.toLocaleString()}</span></div>`;
}

function buildHist(data) {
  const comps = data.components;
  const licenses = top5(comps, 'license');
  const types = top5(comps, 'type');
  const suppliers = top5(comps, 'supplier');
  const maxL = licenses[0]?.[1] || 1, maxT = types[0]?.[1] || 1, maxS = suppliers[0]?.[1] || 1;

  histEl.innerHTML = [
    `<div class="hbox"><h3>Licenses</h3>${licenses.map(([l, c]) => hBar(l, c, maxL)).join('')}</div>`,
    `<div class="hbox"><h3>Component Types</h3>${types.map(([l, c]) => hBar(l, c, maxT)).join('')}</div>`,
    `<div class="hbox"><h3>Suppliers</h3>${suppliers.map(([l, c]) => hBar(l, c, maxS)).join('')}</div>`,
  ].join('');
  histEl.style.display = 'flex';
}

function buildTypeFilter(comps) {
  const types = [...new Set(comps.map(c => c.type))].filter(Boolean).sort();
  typeSel.innerHTML = '<option value="">All types</option>' + types.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
}

function ntiaBadge(c) {
  if (!c.ntia.length) return '<span class="badge ok">✓</span>';
  return `<span class="badge warn" title="Missing: ${esc(c.ntia.join(', '))}">⚠ ${c.ntia.length}</span>`;
}

function filtered() {
  if (!sbomData) return [];
  const q = searchIn.value.trim().toLowerCase();
  const type = typeSel.value;
  return sbomData.components.filter(c => {
    if (type && c.type !== type) return false;
    if (!q) return true;
    return (c.name + ' ' + c.version + ' ' + c.license + ' ' + c.purl + ' ' + c.supplier).toLowerCase().includes(q);
  });
}

function draw() {
  const list = filtered();
  tbody.innerHTML = '';
  for (const c of list) {
    const tr = document.createElement('tr');
    tr.dataset.i = c.i;
    tr.innerHTML =
      `<td><strong>${esc(c.name)}</strong></td>` +
      `<td>${esc(c.version || '—')}</td>` +
      `<td><span class="badge gray">${esc(c.type)}</span></td>` +
      `<td>${esc(c.supplier || '—')}</td>` +
      `<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis" title="${esc(c.license)}">${esc(c.license || '—')}</td>` +
      `<td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;font-size:11px" title="${esc(c.purl)}">${esc(c.purl || '—')}</td>` +
      `<td>${ntiaBadge(c)}</td>`;
    tbody.appendChild(tr);
  }
}

function renderDetail(c) {
  const hashes = c.hashes.map(h => `<tr><td class="k">${esc(h.alg)}</td><td style="word-break:break-all;font-size:11px">${esc(h.val)}</td></tr>`).join('');
  const rawEntries = Object.entries(c.raw || {}).slice(0, 20);

  detailWrap.innerHTML =
    `<div class="card"><div class="card-h">${esc(c.name)} ${esc(c.version)}</div><div class="card-body">` +
    `<table class="kv">` +
    `<tr><td class="k">name</td><td>${esc(c.name)}</td></tr>` +
    `<tr><td class="k">version</td><td>${esc(c.version || '—')}</td></tr>` +
    `<tr><td class="k">type</td><td>${esc(c.type)}</td></tr>` +
    `<tr><td class="k">supplier</td><td>${esc(c.supplier || '—')}</td></tr>` +
    `<tr><td class="k">license</td><td>${esc(c.license || '—')}</td></tr>` +
    `<tr><td class="k">purl / id</td><td style="word-break:break-all;font-size:11px">${esc(c.purl || '—')}</td></tr>` +
    (c.ntia.length ? `<tr><td class="k">NTIA gaps</td><td><span class="badge warn">${esc(c.ntia.join(', '))}</span></td></tr>` : `<tr><td class="k">NTIA</td><td><span class="badge ok">complete</span></td></tr>`) +
    (hashes ? hashes : '') +
    `</table></div></div>`;

  detailWrap.style.display = 'block';
}

function setControls(on) {
  [searchIn, typeSel, $('copy'), $('savecsv')].forEach(el => el.disabled = !on);
}

function render(text, name) {
  showLoading();
  afterPaint(() => {
    try {
      sbomData = parseSbom(text);
      currentName = (name || 'sbom').replace(/\.(json|spdx|cdx)$/i, '');
      fnameEl.textContent = name || '';
      document.title = currentName + ' — KSI Tools SBOM';
      $('drop').style.display = 'none';
      pasteArea.style.display = 'none';
      tableWrap.style.display = 'block';
      detailWrap.style.display = 'none';
      clearError();
      buildTypeFilter(sbomData.components);
      buildChips(sbomData);
      buildHist(sbomData);
      setControls(true);
      searchIn.value = ''; typeSel.value = '';
      draw();
    } catch (e) { showError(e.message || String(e)); }
    hideLoading();
  });
}

function loadFile(file) {
  if (!file) return;
  if (file.size > 20 * 1024 * 1024) { showError('File too large (max 20 MB).'); return; }
  showLoading();
  const r = new FileReader();
  r.onload = () => render(String(r.result || ''), file.name);
  r.readAsText(file);
}

const drop = $('drop');
drop.onclick = () => fileInput.click();
fileInput.onchange = () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); fileInput.value = ''; };
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('hover'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('hover'); }));
drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) loadFile(f); });
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { if (e.target.closest('#drop')) return; e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) loadFile(f); });

$('pasteBtn').onclick = () => { const t = pasteEl.value.trim(); if (t) render(t, 'paste'); };

searchIn.oninput = draw; typeSel.onchange = draw;

tbody.onclick = e => {
  const tr = e.target.closest('tr'); if (!tr) return;
  if (!sbomData) return;
  const c = sbomData.components.find(x => x.i === parseInt(tr.dataset.i, 10)); if (!c) return;
  tbody.querySelectorAll('tr.selected').forEach(r => r.classList.remove('selected'));
  tr.classList.add('selected');
  renderDetail(c);
  detailWrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
};

$('copy').onclick = async () => {
  const out = { metadata: sbomData.metadata, components: filtered().map(c => ({ name: c.name, version: c.version, type: c.type, supplier: c.supplier, license: c.license, purl: c.purl, ntia_missing: c.ntia })) };
  await navigator.clipboard.writeText(JSON.stringify(out, null, 2));
};

$('savecsv').onclick = () => {
  const keys = ['name', 'version', 'type', 'supplier', 'license', 'purl', 'ntia_missing'];
  const esc2 = v => { const s = String(v ?? ''); return /["\n,]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const rows = filtered().map(c => [c.name, c.version, c.type, c.supplier, c.license, c.purl, c.ntia.join('|')].map(esc2).join(','));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([[keys.join(','), ...rows].join('\n')], { type: 'text/csv' }));
  a.download = currentName + '-components.csv';
  a.click();
};

// ── self-test ─────────────────────────────────────────────────────────────────
(function selfTest() {
  const CDX = JSON.stringify({ bomFormat: 'CycloneDX', specVersion: '1.6',
    metadata: { timestamp: '2024-01-01T00:00:00Z', tools: [{ name: 'Trivy' }],
      component: { name: 'my-app', version: '1.0.0' } },
    serialNumber: 'urn:uuid:abc123',
    components: [
      { name: 'express', version: '4.18.2', type: 'library', supplier: { name: 'npm' },
        licenses: [{ license: { id: 'MIT' } }], purl: 'pkg:npm/express@4.18.2',
        hashes: [{ alg: 'SHA-256', content: 'abc' }] },
      { name: 'lodash', version: '4.17.21', type: 'library',
        licenses: [{ license: { id: 'MIT' } }], purl: 'pkg:npm/lodash@4.17.21' },
      { name: 'orphan', version: '', type: 'library' },
    ]
  });
  try {
    const r = parseSbom(CDX);
    if (r.metadata.format !== 'CycloneDX v1.6') throw new Error('format');
    if (r.metadata.name !== 'my-app') throw new Error('meta.name');
    if (r.metadata.tool !== 'Trivy') throw new Error('meta.tool');
    if (r.components.length !== 3) throw new Error('component count');
    if (r.components[0].license !== 'MIT') throw new Error('license');
    if (r.components[0].purl !== 'pkg:npm/express@4.18.2') throw new Error('purl');
    if (r.components[0].supplier !== 'npm') throw new Error('supplier');
    if (r.components[0].hashes[0].alg !== 'SHA-256') throw new Error('hashes');
    if (r.components[0].ntia.length > 0) throw new Error('ntia should be complete');
    if (!r.components[2].ntia.includes('version')) throw new Error('orphan ntia version');
    if (!r.components[2].ntia.includes('supplier')) throw new Error('orphan ntia supplier');
    if (!r.components[2].ntia.includes('identifier')) throw new Error('orphan ntia identifier');
    // SPDX JSON
    const SPDX_JSON = JSON.stringify({ spdxVersion: 'SPDX-2.3',
      SPDXID: 'SPDXRef-DOCUMENT', name: 'test-sbom',
      creationInfo: { created: '2024-01-01T00:00:00Z', creators: ['Tool: Syft'] },
      packages: [
        { SPDXID: 'SPDXRef-1', name: 'django', versionInfo: '4.2.0', licenseConcluded: 'BSD-3-Clause',
          originator: 'Organization: Django Foundation',
          externalRefs: [{ referenceCategory: 'PACKAGE-MANAGER', referenceType: 'purl', referenceLocator: 'pkg:pypi/django@4.2.0' }] }
      ]
    });
    const r2 = parseSbom(SPDX_JSON);
    if (!r2.metadata.format.startsWith('SPDX')) throw new Error('spdx format');
    if (r2.components[0].purl !== 'pkg:pypi/django@4.2.0') throw new Error('spdx purl');
    if (r2.components[0].license !== 'BSD-3-Clause') throw new Error('spdx license');
    // SPDX tag-value
    const SPDX_TAG = 'SPDXVersion: SPDX-2.2\nDocumentName: my-sbom\nCreated: 2024-01-01T00:00:00Z\nCreator: Tool: Syft\nPackageName: requests\nPackageVersion: 2.31.0\nPackageLicenseConcluded: Apache-2.0\nPackageSupplier: Organization: Python\nExternalRef: PACKAGE-MANAGER purl pkg:pypi/requests@2.31.0\n';
    const r3 = parseSbom(SPDX_TAG);
    if (!r3.metadata.format.startsWith('SPDX')) throw new Error('tag format');
    if (r3.components[0].name !== 'requests') throw new Error('tag name');
    if (r3.components[0].license !== 'Apache-2.0') throw new Error('tag license');
    if (r3.components[0].purl !== 'pkg:pypi/requests@2.31.0') throw new Error('tag purl');
    // error cases
    let threw = false;
    try { parseSbom(''); } catch (e) { threw = true; }
    if (!threw) throw new Error('empty should throw');
    threw = false;
    try { parseSbom('{"foo":"bar"}'); } catch (e) { threw = true; }
    if (!threw) throw new Error('non-sbom json should throw');
  } catch (e) { console.error('SBOM viewer self-test FAILED:', e.message); }
})();
</script>
