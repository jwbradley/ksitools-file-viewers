<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KSI Tools MessagePack Viewer</title>
<style id="appcss">
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:15px; line-height:1.5; background:#fff; color:#1f2328; }
header.bar { position:sticky; top:0; z-index:20; display:flex; gap:8px; align-items:center; padding:10px 16px; background:#f6f8fa; border-bottom:1px solid #d0d7de; flex-wrap:wrap; }
header.bar h1 { font-size:15px; margin:0; font-weight:600; }
header.bar .fname { color:#57606a; font-size:13px; flex:1; min-width:60px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
header.bar .meta { color:#57606a; font-size:12px; }
button, select, input[type=text], textarea { font:inherit; font-size:13px; padding:6px 12px; border:1px solid #d0d7de; border-radius:6px; background:#fff; color:#1f2328; }
button { cursor:pointer; } button:hover { background:#f3f4f6; } button:disabled { opacity:.45; cursor:default; }
#search { width:200px; }
#drop { max-width:900px; margin:36px auto 16px; padding:48px 24px; text-align:center; border:2px dashed #d0d7de; border-radius:12px; color:#57606a; cursor:pointer; }
#drop.hover { border-color:#0969da; background:rgba(9,105,218,.05); color:#0969da; }
#drop strong { display:block; font-size:18px; margin-bottom:6px; color:#1f2328; }
.hint { color:#8b949e; font-size:12px; }
.paste-box { max-width:900px; margin:0 auto 20px; padding:0 16px; }
.paste-box label { display:block; font-size:13px; color:#57606a; margin-bottom:6px; }
#paste, .tarea { width:100%; min-height:110px; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:12.5px; padding:10px; border:1px solid #d0d7de; border-radius:8px; resize:vertical; }
#notice { padding:7px 16px; font-size:12.5px; background:#fff8c5; color:#7a5c00; border-bottom:1px solid #f0c000; display:none; }
#err { max-width:900px; margin:24px auto; padding:16px 20px; border:1px solid #cf222e; border-radius:10px; background:rgba(207,34,46,.06); color:#cf222e; font-family:ui-monospace,monospace; font-size:13px; white-space:pre-wrap; display:none; }
#loading { position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px; background:rgba(255,255,255,.72); color:#57606a; }
#loading.show { display:flex; }
.spinner { width:38px; height:38px; border:4px solid #d0d7de; border-top-color:#0969da; border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

.badge { display:inline-block; font-size:10px; font-weight:600; padding:1px 7px; border-radius:999px; border:1px solid #d0d7de; margin-right:4px; margin-bottom:4px; vertical-align:middle; }
.badge.bad { background:#ffebe9; border-color:#ff8182; color:#cf222e; }
.badge.warn { background:#fff8c5; border-color:#f0c000; color:#7a5c00; }
.badge.ok { background:#dafbe1; border-color:#4ac26b; color:#1a7f37; }
.badge.info { background:#ddf4ff; border-color:#54aeff; color:#0969da; }
.badge.dim { background:#f6f8fa; color:#57606a; }

.stats { display:none; flex-wrap:wrap; gap:8px; margin:8px 0 12px; padding:0 16px; max-width:1100px; margin-left:auto; margin-right:auto; }
.stat { border:1px solid #d0d7de; border-radius:8px; padding:8px 12px; font-size:12.5px; background:#f6f8fa; min-width:120px; max-width:320px; }
.stat b { display:block; font-size:14px; word-break:break-word; }
.stat .lbl { color:#57606a; font-size:11px; text-transform:uppercase; letter-spacing:.03em; }

.panel { max-width:1100px; margin:12px auto; padding:0 16px 40px; display:none; }
.panel.show { display:block; }
.card { border:1px solid #d0d7de; border-radius:10px; margin-bottom:12px; overflow:hidden; }
.card h2 { margin:0; padding:10px 14px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; background:#f6f8fa; border-bottom:1px solid #d0d7de; color:#57606a; display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none; }
.card h2 .caret { font-size:10px; color:#8b949e; transition:transform .15s; }
.card.collapsed h2 .caret { transform:rotate(-90deg); }
.card.collapsed .body { display:none; }
.card .body { padding:12px 14px; }

.tree { font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:12.5px; line-height:1.7; padding:8px 4px; }
.node > .line { padding:2px 0; word-break:break-word; }
.toggle { cursor:pointer; color:#57606a; margin-right:4px; user-select:none; display:inline-block; width:1em; }
.toggle.leaf { color:transparent; }
.children { margin-left:1.2em; border-left:1px solid #eaeef2; padding-left:10px; }
.node.collapsed > .children { display:none; }
.k { color:#0550ae; } .s { color:#0a7d24; } .p { color:#57606a; } .t { color:#953800; } .n { color:#1163a6; } .b { color:#8250df; }
.idx { color:#8b949e; }
.hex-line { color:#57606a; }
.bin-ascii { color:#0a7d24; }
.trunc { cursor:pointer; color:#0969da; }
.trunc:hover { text-decoration:underline; }
pre.block { margin:0; padding:10px 12px; background:#f6f8fa; border-radius:8px; white-space:pre-wrap; word-break:break-word; max-height:40vh; overflow:auto; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:12px; }
.hit { background:#fff3c4; border-radius:3px; box-shadow:0 0 0 1px #f0c000; }
.value-text { font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:12.5px; }

@media (prefers-color-scheme: dark) {
  body { background:#0d1117; color:#e6edf3; }
  header.bar { background:#161b22; border-bottom-color:#30363d; }
  header.bar .fname, header.bar .meta, .hint, .paste-box label, .stat .lbl { color:#8b949e; }
  button, select, input[type=text], textarea, #paste, .tarea { background:#21262d; color:#e6edf3; border-color:#30363d; }
  button:hover { background:#30363d; }
  #drop { border-color:#30363d; color:#8b949e; } #drop strong { color:#e6edf3; }
  #drop.hover { border-color:#4493f8; color:#4493f8; }
  .stat { background:#161b22; border-color:#30363d; }
  .card { border-color:#30363d; }
  .card h2 { background:#161b22; border-bottom-color:#30363d; color:#8b949e; }
  .badge { border-color:#30363d; }
  .badge.bad { background:#3d1418; border-color:#f85149; color:#ff7b72; }
  .badge.warn { background:#3a2f00; border-color:#b58900; color:#e3b341; }
  .badge.ok { background:#12261e; border-color:#238636; color:#3fb950; }
  .badge.info { background:#121d2f; border-color:#1f6feb; color:#58a6ff; }
  .badge.dim { background:#161b22; color:#8b949e; }
  pre.block { background:#161b22; }
  .hit { background:#634c00; color:#ffe08a; box-shadow:0 0 0 1px #b58900; }
  #notice { background:#3a2f00; color:#e3b341; border-bottom-color:#b58900; }
  #err { border-color:#f85149; color:#ff7b72; background:rgba(248,81,73,.08); }
  #loading { background:rgba(13,17,23,.75); }
  .spinner { border-color:#30363d; border-top-color:#4493f8; }
  .children { border-left-color:#30363d; }
  .k { color:#79c0ff; } .s { color:#7ee787; } .p { color:#8b949e; } .t { color:#ffa657; } .n { color:#79c0ff; } .b { color:#d2a8ff; }
  .idx { color:#6e7681; }
  .hex-line { color:#8b949e; }
  .bin-ascii { color:#7ee787; }
  .trunc { color:#58a6ff; }
}
</style>
</head>
<body>

<header class="bar">
  <h1>KSI Tools MessagePack Viewer</h1>
  <span class="fname" id="fname"></span>
  <span class="meta" id="meta"></span>
  <input type="text" id="search" placeholder="Filter tree…" disabled>
  <button id="copy" disabled>Copy summary</button>
  <button id="savejson" disabled>Save .json</button>
  <button id="pick" onclick="document.getElementById('file').click()">Open file</button>
</header>
<input type="file" id="file" accept=".msgpack,.bin,application/octet-stream,.txt" style="display:none">

<div id="drop">
  <strong>Drop a .msgpack file, hex, or base64 here</strong>
  or click to choose · parsed entirely in your browser
  <div class="hint" style="margin-top:10px">Nothing is uploaded. Works offline. Accepts raw MessagePack, hex dump, or base64.</div>
</div>

<div class="paste-box">
  <label for="paste">Or paste hex or base64 payload:</label>
  <textarea id="paste" class="tarea" spellcheck="false" placeholder="Example hex:  82 a1 61 01 a1 62 a2 68 69&#10;Example base64:  gqFhAWFiomhp&#10;&#10;Accepts 0x / \\x prefixes, spaces, colons, newlines for hex."></textarea>
  <div style="margin-top:8px"><button id="goBtn">Parse paste</button></div>
</div>

<div id="err"></div>
<div id="notice"></div>
<div class="stats" id="stats"></div>
<div class="panel" id="panel"></div>

<div id="loading"><div class="spinner"></div><div id="loadingmsg">Loading…</div></div>

<script>
"use strict";
/* ============================================================
   KSI Tools MessagePack Viewer — pure-JS, 100% local.
   No external code. Spec: msgpack.org.
   ============================================================ */

/* ---------- small UI helpers (match the suite) ---------- */
var drop = document.getElementById('drop');
var errBox = document.getElementById('err');
var noticeEl = document.getElementById('notice');
var fnameEl = document.getElementById('fname');
var metaEl = document.getElementById('meta');
var pasteEl = document.getElementById('paste');
var fileInput = document.getElementById('file');
var searchIn = document.getElementById('search');
var loadingEl = document.getElementById('loading');
var loadingMsg = document.getElementById('loadingmsg');
var statsEl = document.getElementById('stats');
var panel = document.getElementById('panel');
var btns = {
  copy: document.getElementById('copy'),
  savejson: document.getElementById('savejson')
};

var MAX_BYTES = 16 * 1024 * 1024;
var MAX_DEPTH = 200;

var state = null; // { bytes, roots, error, errorOffset, warnings }

function showLoading(m) { loadingMsg.textContent = m || 'Loading…'; loadingEl.classList.add('show'); }
function hideLoading() { loadingEl.classList.remove('show'); }
function afterPaint(fn) { requestAnimationFrame(function(){ requestAnimationFrame(fn); }); }
function showError(m) { errBox.style.display = 'block'; errBox.textContent = m; }
function clearError() { errBox.style.display = 'none'; errBox.textContent = ''; }
function showNotice(m) { noticeEl.style.display = 'block'; noticeEl.textContent = m; }
function clearNotice() { noticeEl.style.display = 'none'; noticeEl.textContent = ''; }
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function download(name, text, type) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: type || 'text/plain' }));
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}
function fmtBytes(n) {
  if (n >= 1024*1024) return (n/(1024*1024)).toFixed(1) + ' MB';
  if (n >= 1024) return (n/1024).toFixed(1) + ' KB';
  return n + ' bytes';
}
function wireDrop(loadFn) {
  drop.onclick = function(){ fileInput.click(); };
  fileInput.onchange = function(){ if (fileInput.files[0]) loadFn(fileInput.files[0]); fileInput.value = ''; };
  ['dragenter','dragover'].forEach(function(ev){ drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.add('hover'); }); });
  ['dragleave','drop'].forEach(function(ev){ drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.remove('hover'); }); });
  drop.addEventListener('drop', function(e){ var f = e.dataTransfer.files[0]; if (f) loadFn(f); });
  document.addEventListener('dragover', function(e){ e.preventDefault(); });
  document.addEventListener('drop', function(e){
    if (e.target.closest && e.target.closest('#drop')) return;
    e.preventDefault();
    var f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) loadFn(f);
  });
}
function highlight(text, q) {
  var s = String(text == null ? '' : text);
  if (!q) return esc(s);
  var low = s.toLowerCase(), idx = low.indexOf(q);
  if (idx < 0) return esc(s);
  return esc(s.slice(0, idx)) + '<span class="hit">' + esc(s.slice(idx, idx+q.length)) + '</span>' + esc(s.slice(idx+q.length));
}

/* ============================================================
   Input normalization: hex / base64 / raw bytes
   ============================================================ */
function parseHexBytes(text) {
  // strip 0x and \x prefixes, spaces, colons, newlines, tabs, commas, semicolons
  var stripped = text.replace(/0x/gi, '').replace(/\\x/gi, '').replace(/[\s:,;]+/g, '');
  if (!stripped) return null;
  if (!/^[0-9a-fA-F]+$/.test(stripped)) return null;
  if (stripped.length % 2 !== 0) return null;
  var out = new Uint8Array(stripped.length / 2);
  for (var i = 0; i < out.length; i++) {
    out[i] = parseInt(stripped.substr(i*2, 2), 16);
  }
  return out;
}
function parseBase64Bytes(text) {
  var stripped = text.replace(/\s+/g, '');
  if (!stripped) return null;
  if (!/^[A-Za-z0-9+/=]+$/.test(stripped)) return null;
  if (stripped.length % 4 !== 0) return null;
  // atob binary -> Uint8Array
  try {
    var bin = atob(stripped);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  } catch(e) { return null; }
}
function detectAndDecode(text) {
  // try hex first (look for hex-ish content)
  var hex = parseHexBytes(text);
  if (hex) return { bytes: hex, kind: 'hex' };
  var b64 = parseBase64Bytes(text);
  if (b64) return { bytes: b64, kind: 'base64' };
  return null;
}

/* ============================================================
   MessagePack decoder
   ============================================================ */
function MsgpackError(message, offset) {
  this.name = 'MsgpackError';
  this.message = message;
  this.offset = offset;
  this.stack = (new Error()).stack;
}
MsgpackError.prototype = Object.create(Error.prototype);

function Cursor(u8) {
  this.u8 = u8;
  this.view = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  this.len = u8.length;
  this.pos = 0;
}
Cursor.prototype.need = function(n) {
  if (this.pos + n > this.len) {
    throw new MsgpackError('truncated payload: need ' + n + ' byte(s) at offset ' + this.pos + ', only ' + (this.len - this.pos) + ' remaining', this.pos);
  }
};
Cursor.prototype.readU8 = function() { this.need(1); return this.u8[this.pos++]; };
Cursor.prototype.readU16 = function() { this.need(2); var v = this.view.getUint16(this.pos, false); this.pos += 2; return v; };
Cursor.prototype.readU32 = function() { this.need(4); var v = this.view.getUint32(this.pos, false); this.pos += 4; return v; };
Cursor.prototype.readI8  = function() { this.need(1); var v = this.view.getInt8(this.pos); this.pos += 1; return v; };
Cursor.prototype.readI16 = function() { this.need(2); var v = this.view.getInt16(this.pos, false); this.pos += 2; return v; };
Cursor.prototype.readI32 = function() { this.need(4); var v = this.view.getInt32(this.pos, false); this.pos += 4; return v; };
Cursor.prototype.readF32 = function() { this.need(4); var v = this.view.getFloat32(this.pos, false); this.pos += 4; return v; };
Cursor.prototype.readF64 = function() { this.need(8); var v = this.view.getFloat64(this.pos, false); this.pos += 8; return v; };
Cursor.prototype.readU64 = function() {
  this.need(8);
  var hi = this.view.getUint32(this.pos, false);
  var lo = this.view.getUint32(this.pos + 4, false);
  this.pos += 8;
  return { hi: hi, lo: lo };
};
Cursor.prototype.readI64 = function() {
  this.need(8);
  var hi = this.view.getInt32(this.pos, false);
  var lo = this.view.getUint32(this.pos + 4, false);
  this.pos += 8;
  return { hi: hi, lo: lo, signed: true };
};
Cursor.prototype.readBytes = function(n) {
  this.need(n);
  var sub = this.u8.subarray(this.pos, this.pos + n);
  this.pos += n;
  return sub;
};

function u64ToBigInt(v) {
  var big = (BigInt(v.hi) << 32n) | BigInt(v.lo);
  return v.signed ? BigInt(v.hi) << 32n | BigInt(v.lo) : big;
}
function u64FitsSafe(v) {
  if (v.signed) {
    return v.hi === 0 && (v.lo & 0x80000000) === 0 ||
           v.hi === -1 && (v.lo & 0x80000000) !== 0;
  }
  return v.hi === 0 && v.lo <= 0x1fffffffffffff;
}
function u64ToNumber(v) {
  if (v.signed) {
    return (BigInt(v.hi) << 32n | BigInt(v.lo)) == 0n ? 0 : Number(BigInt(v.hi) << 32n | BigInt(v.lo));
  }
  return v.hi * 0x100000000 + v.lo;
}

var TD = new TextDecoder('utf-8', { fatal: false });

function decodeValue(cur, depth) {
  if (depth > MAX_DEPTH) {
    throw new MsgpackError('max depth (' + MAX_DEPTH + ') exceeded at offset ' + cur.pos, cur.pos);
  }
  if (cur.pos >= cur.len) {
    throw new MsgpackError('unexpected end of payload at offset ' + cur.pos, cur.pos);
  }
  var b = cur.readU8();
  var node;

  // positive fixint 0x00..0x7f
  if (b <= 0x7f) {
    return { type: 'int', value: b, byte: b };
  }
  // negative fixint 0xe0..0xff
  if (b >= 0xe0) {
    return { type: 'int', value: b - 256, byte: b };
  }
  // fixstr 0xa0..0xbf
  if (b >= 0xa0 && b <= 0xbf) {
    var len = b & 0x1f;
    var raw = cur.readBytes(len);
    return { type: 'str', value: TD.decode(raw), raw: raw };
  }
  // fixarray 0x90..0x9f
  if (b >= 0x90 && b <= 0x9f) {
    return decodeArray(cur, b & 0x0f, depth);
  }
  // fixmap 0x80..0x8f
  if (b >= 0x80 && b <= 0x8f) {
    return decodeMap(cur, b & 0x0f, depth);
  }

  switch (b) {
    case 0xc0: return { type: 'nil', value: null };
    case 0xc2: return { type: 'bool', value: false };
    case 0xc3: return { type: 'bool', value: true };

    // bin
    case 0xc4: { var n = cur.readU8();  var r = cur.readBytes(n); return { type: 'bin', raw: r }; }
    case 0xc5: { var n = cur.readU16(); var r = cur.readBytes(n); return { type: 'bin', raw: r }; }
    case 0xc6: { var n = cur.readU32(); var r = cur.readBytes(n); return { type: 'bin', raw: r }; }

    // ext
    case 0xc7: { var n = cur.readU8();  return decodeExt(cur, n); }
    case 0xc8: { var n = cur.readU16(); return decodeExt(cur, n); }
    case 0xc9: { var n = cur.readU32(); return decodeExt(cur, n); }

    // float
    case 0xca: return { type: 'float32', value: cur.readF32() };
    case 0xcb: return { type: 'float64', value: cur.readF64() };

    // uint
    case 0xcc: return { type: 'int', value: cur.readU8() };
    case 0xcd: return { type: 'int', value: cur.readU16() };
    case 0xce: return { type: 'int', value: cur.readU32() };
    case 0xcf: { var v = cur.readU64(); return makeUint64Node(v); }

    // int
    case 0xd0: return { type: 'int', value: cur.readI8() };
    case 0xd1: return { type: 'int', value: cur.readI16() };
    case 0xd2: return { type: 'int', value: cur.readI32() };
    case 0xd3: { var v = cur.readI64(); return makeInt64Node(v); }

    // str
    case 0xd9: { var n = cur.readU8();  var r = cur.readBytes(n); return { type: 'str', value: TD.decode(r), raw: r }; }
    case 0xda: { var n = cur.readU16(); var r = cur.readBytes(n); return { type: 'str', value: TD.decode(r), raw: r }; }
    case 0xdb: { var n = cur.readU32(); var r = cur.readBytes(n); return { type: 'str', value: TD.decode(r), raw: r }; }

    // array
    case 0xdc: { var n = cur.readU16(); return decodeArray(cur, n, depth); }
    case 0xdd: { var n = cur.readU32(); return decodeArray(cur, n, depth); }

    // map
    case 0xde: { var n = cur.readU16(); return decodeMap(cur, n, depth); }
    case 0xdf: { var n = cur.readU32(); return decodeMap(cur, n, depth); }

    // fixext
    case 0xd4: return decodeFixext(cur, 1);
    case 0xd5: return decodeFixext(cur, 2);
    case 0xd6: return decodeFixext(cur, 4);
    case 0xd7: return decodeFixext(cur, 8);
    case 0xd8: return decodeFixext(cur, 16);

    default:
      throw new MsgpackError('unknown msgpack prefix byte 0x' + b.toString(16).padStart(2,'0') + ' at offset ' + (cur.pos - 1), cur.pos - 1);
  }
}

function makeUint64Node(v) {
  if (v.hi === 0 && v.lo <= 0x1fffffffffffff) {
    return { type: 'int', value: v.lo };
  }
  // BigInt needed
  var big = (BigInt(v.hi) << 32n) | BigInt(v.lo);
  return { type: 'uint64', value: big.toString(), approx: true };
}
function makeInt64Node(v) {
  // signed 64
  if (v.hi === 0 && (v.lo & 0x80000000) === 0) return { type: 'int', value: v.lo };
  if (v.hi === -1 && (v.lo & 0x80000000) !== 0) return { type: 'int', value: v.lo - 0x100000000 };
  var big = (BigInt(v.hi) << 32n) | BigInt(v.lo);
  return { type: 'int64', value: big.toString(), approx: true };
}

function decodeArray(cur, count, depth) {
  var items = [];
  for (var i = 0; i < count; i++) {
    items.push(decodeValue(cur, depth + 1));
  }
  return { type: 'array', items: items };
}

function decodeMap(cur, count, depth) {
  var pairs = [];
  for (var i = 0; i < count; i++) {
    var key = decodeValue(cur, depth + 1);
    var val = decodeValue(cur, depth + 1);
    pairs.push({ key: key, value: val });
  }
  return { type: 'map', pairs: pairs };
}

function decodeFixext(cur, size) {
  var typeByte = cur.readU8();
  var raw = cur.readBytes(size);
  return interpretExt(typeByte, raw, size);
}
function decodeExt(cur, size) {
  var typeByte = cur.readU8();
  // ext type byte is signed int8
  var typeSigned = (typeByte & 0x80) ? (typeByte - 256) : typeByte;
  var raw = cur.readBytes(size);
  return interpretExt(typeSigned, raw, size);
}

function interpretExt(typeSigned, raw, size) {
  // timestamp extension: type -1 (0xff signed = -1)
  if (typeSigned === -1) {
    try {
      if (size === 4) {
        var view = new DataView(raw.buffer, raw.byteOffset, raw.byteLength);
        var secs = view.getUint32(0, false);
        return { type: 'timestamp', seconds: secs, nanos: 0, raw: raw };
      } else if (size === 8) {
        var view = new DataView(raw.buffer, raw.byteOffset, raw.byteLength);
        var nanos = view.getUint32(0, false);
        var secs = view.getUint32(4, false);
        return { type: 'timestamp', seconds: secs, nanos: nanos, raw: raw };
      } else if (size === 12) {
        var view = new DataView(raw.buffer, raw.byteOffset, raw.byteLength);
        var nanos = view.getUint32(0, false);
        var hi = view.getUint32(4, false);
        var lo = view.getUint32(8, false);
        var secsBig = (BigInt(hi) << 32n) | BigInt(lo);
        return { type: 'timestamp', secondsBig: secsBig, nanos: nanos, raw: raw };
      }
    } catch (e) {
      // fall through to generic ext
    }
  }
  return { type: 'ext', extType: typeSigned, raw: raw };
}

/* ---------- decode a full buffer as a stream of msgpack values ---------- */
function decodeStream(u8) {
  var cur = new Cursor(u8);
  var roots = [];
  var warnings = [];
  var error = null, errorOffset = null;
  while (cur.pos < cur.len) {
    var start = cur.pos;
    try {
      var val = decodeValue(cur, 0);
      roots.push(val);
    } catch (e) {
      if (e instanceof MsgpackError) {
        error = e.message;
        errorOffset = e.offset;
        if (roots.length === 0) {
          // nothing decoded; fatal
          break;
        }
        warnings.push('Decode stopped at offset ' + e.offset + ': ' + e.message);
        break;
      } else {
        error = e.message || String(e);
        errorOffset = cur.pos;
        break;
      }
    }
    if (cur.pos === start) {
      // no progress — avoid infinite loop
      error = 'decoder made no progress at offset ' + cur.pos;
      errorOffset = cur.pos;
      break;
    }
  }
  return { bytes: u8, roots: roots, error: error, errorOffset: errorOffset, warnings: warnings };
}

/* ============================================================
   Stats / tree walks
   ============================================================ */
function nodeTypeName(node) {
  switch (node.type) {
    case 'nil': return 'nil';
    case 'bool': return 'bool';
    case 'int': return 'int';
    case 'int64': return 'int64';
    case 'uint64': return 'uint64';
    case 'float32': return 'float32';
    case 'float64': return 'float64';
    case 'str': return 'string';
    case 'bin': return 'bin';
    case 'array': return 'array';
    case 'map': return 'map';
    case 'timestamp': return 'timestamp';
    case 'ext': return 'ext';
    default: return node.type;
  }
}
function rootTypeLabel(node) {
  if (!node) return '—';
  if (node.type === 'array') return 'array';
  if (node.type === 'map') return 'map';
  return 'scalar';
}

function computeStats(bytes, roots) {
  var stats = {
    bytes: bytes.length,
    rootCount: roots.length,
    strings: 0,
    timestamps: 0,
    maxDepth: 0,
    elements: 0
  };
  function walk(node, depth) {
    if (depth > stats.maxDepth) stats.maxDepth = depth;
    if (node.type === 'str') stats.strings++;
    if (node.type === 'timestamp') stats.timestamps++;
    if (node.type === 'array') {
      stats.elements += node.items.length;
      for (var i = 0; i < node.items.length; i++) walk(node.items[i], depth + 1);
    } else if (node.type === 'map') {
      stats.elements += node.pairs.length;
      for (var i = 0; i < node.pairs.length; i++) {
        walk(node.pairs[i].key, depth + 1);
        walk(node.pairs[i].value, depth + 1);
      }
    }
  }
  for (var i = 0; i < roots.length; i++) walk(roots[i], 1);
  return stats;
}

/* ============================================================
   Rendering
   ============================================================ */
function bytesToHex(b, max) {
  var n = Math.min(b.length, max == null ? b.length : max);
  var hex = [];
  for (var i = 0; i < n; i++) hex.push(('0' + b[i].toString(16)).slice(-2));
  return hex.join(' ');
}
function bytesAsciiPreview(b) {
  var out = '';
  for (var i = 0; i < b.length; i++) {
    var c = b[i];
    out += (c >= 32 && c <= 126) ? String.fromCharCode(c) : '.';
  }
  return out;
}
function isLikelyPrintable(b) {
  if (b.length > 200) return false;
  var nonprint = 0;
  for (var i = 0; i < b.length; i++) {
    var c = b[i];
    if (c === 9 || c === 10 || c === 13) continue;
    if (c < 32 || c > 126) nonprint++;
  }
  return nonprint <= Math.max(1, b.length * 0.1);
}

function formatTimestamp(node) {
  var secs;
  if (node.secondsBig != null) secs = node.secondsBig;
  else secs = BigInt(node.seconds);
  var ms = Number(secs) * 1000 + Math.floor(node.nanos / 1000000);
  if (!isFinite(ms)) return 'ts:' + secs.toString() + '.' + String(node.nanos).padStart(9,'0');
  var d = new Date(ms);
  if (isNaN(d.getTime())) return 'ts:' + secs.toString() + '.' + String(node.nanos).padStart(9,'0');
  var iso = d.toISOString();
  // include nanos if present
  if (node.nanos && node.nanos % 1000000 !== 0) {
    var frac = String(node.nanos).padStart(9,'0').replace(/0+$/,'');
    iso = iso.replace(/\.\d{3}Z$/, '.' + frac + 'Z');
  }
  return iso;
}

function valueScalarHtml(node, q) {
  switch (node.type) {
    case 'nil': return '<span class="p">nil</span>';
    case 'bool': return '<span class="b">' + String(node.value) + '</span>';
    case 'int': return '<span class="n">' + highlight(String(node.value), q) + '</span>';
    case 'int64': return '<span class="n">' + highlight(String(node.value), q) + '</span><span class="badge warn" title="64-bit value exceeds 2^53, shown as string">int64 (approx)</span>';
    case 'uint64': return '<span class="n">' + highlight(String(node.value), q) + '</span><span class="badge warn" title="64-bit value exceeds 2^53, shown as string">uint64 (approx)</span>';
    case 'float32':
      var f32 = String(node.value);
      return '<span class="n">' + highlight(f32, q) + '</span> <span class="badge dim" title="32-bit float">f32</span>';
    case 'float64':
      var f64 = String(node.value);
      return '<span class="n">' + highlight(f64, q) + '</span>';
    case 'str':
      var s = node.value;
      var shown = s;
      var truncated = false;
      if (s.length > 200) { shown = s.slice(0, 200); truncated = true; }
      var html = '"<span class="s">' + highlight(shown, q) + '</span>"';
      if (truncated) html += ' <span class="badge dim">' + (s.length - 200) + ' more chars</span>';
      return html;
    case 'bin':
      return renderBin(node, q);
    case 'timestamp':
      var iso = formatTimestamp(node);
      var rawSec = node.secondsBig != null ? node.secondsBig.toString() : String(node.seconds);
      var rawTxt = 'seconds=' + rawSec + ', nanos=' + node.nanos;
      return '<span class="s">' + highlight(iso, q) + '</span> <span class="p">(' + esc(rawTxt) + ')</span>';
    case 'ext':
      var hex = bytesToHex(node.raw, 64);
      var more = node.raw.length > 64 ? ' <span class="badge dim">+' + (node.raw.length - 64) + ' bytes</span>' : '';
      return '<span class="p">ext type <span class="t">' + node.extType + '</span>, ' + node.raw.length + ' bytes</span> <span class="hex-line">' + esc(hex) + '</span>' + more;
    default:
      return esc(JSON.stringify(node.value));
  }
}

function renderBin(node, q) {
  var b = node.raw;
  var hex = bytesToHex(b, 64);
  var more = b.length > 64 ? ' <span class="badge dim">+' + (b.length - 64) + ' bytes</span>' : '';
  var ascii = '';
  if (isLikelyPrintable(b)) {
    ascii = ' <span class="bin-ascii">// ' + esc(bytesAsciiPreview(b)) + '</span>';
  }
  return '<span class="hex-line">' + esc(hex) + '</span>' + more + ascii;
}

function typeBadge(node) {
  var t = nodeTypeName(node);
  var cls = 'badge info';
  if (node.type === 'nil') cls = 'badge dim';
  else if (node.type === 'bool') cls = 'badge dim';
  else if (node.type === 'int' || node.type === 'int64' || node.type === 'uint64') cls = 'badge info';
  else if (node.type === 'float32' || node.type === 'float64') cls = 'badge info';
  else if (node.type === 'str') cls = 'badge ok';
  else if (node.type === 'bin') cls = 'badge warn';
  else if (node.type === 'array') cls = 'badge info';
  else if (node.type === 'map') cls = 'badge info';
  else if (node.type === 'timestamp') cls = 'badge ok';
  else if (node.type === 'ext') cls = 'badge warn';
  return '<span class="' + cls + '">' + esc(t) + '</span>';
}

function nodeToHtml(node, depth, q, keyLabel) {
  var lines = [];
  var hasChildren = (node.type === 'array' && node.items.length > 0) || (node.type === 'map' && node.pairs.length > 0);
  var chevron = hasChildren
    ? '<span class="toggle">▾</span>'
    : '<span class="toggle leaf">·</span>';
  var keyHtml = keyLabel ? '<span class="idx">' + esc(keyLabel) + '</span> ' : '';
  var label;
  if (node.type === 'array') {
    label = '<span class="p">[' + node.items.length + ' item' + (node.items.length === 1 ? '' : 's') + ']</span>';
  } else if (node.type === 'map') {
    label = '<span class="p">{' + node.pairs.length + ' pair' + (node.pairs.length === 1 ? '' : 's') + '}</span>';
  } else {
    label = valueScalarHtml(node, q);
  }
  lines.push('<div class="node"><div class="line">' + chevron + keyHtml + typeBadge(node) + ' ' + label + '</div>');
  if (hasChildren) {
    lines.push('<div class="children">');
    if (node.type === 'array') {
      for (var i = 0; i < node.items.length; i++) {
        lines.push(nodeToHtml(node.items[i], depth + 1, q, '[' + i + ']'));
      }
    } else if (node.type === 'map') {
      for (var i = 0; i < node.pairs.length; i++) {
        var pair = node.pairs[i];
        // render key (usually a string)
        var keyStr;
        if (pair.key.type === 'str') keyStr = pair.key.value;
        else if (pair.key.type === 'int' || pair.key.type === 'bool') keyStr = String(pair.key.value);
        else if (pair.key.type === 'int64' || pair.key.type === 'uint64') keyStr = pair.key.value;
        else keyStr = JSON.stringify(pair.key.value || nodeToPlain(pair.key));
        lines.push(nodeToHtml(pair.value, depth + 1, q, '"' + keyStr + '":'));
      }
    }
    lines.push('</div>');
  }
  lines.push('</div>');
  return lines.join('');
}

/* ---------- plain JS conversion (for save .json) ---------- */
function nodeToPlain(node) {
  if (!node) return null;
  switch (node.type) {
    case 'nil': return null;
    case 'bool': return node.value;
    case 'int': return node.value;
    case 'int64':
    case 'uint64':
      return { __type: node.type, value: node.value };
    case 'float32':
    case 'float64':
      return node.value;
    case 'str': return node.value;
    case 'bin': return { __type: 'bin', hex: bytesToHex(node.raw) };
    case 'array': return node.items.map(nodeToPlain);
    case 'map':
      var obj = {};
      for (var i = 0; i < node.pairs.length; i++) {
        var k = node.pairs[i].key;
        var keyStr;
        if (k.type === 'str') keyStr = k.value;
        else if (k.type === 'int' || k.type === 'bool') keyStr = String(k.value);
        else if (k.type === 'int64' || k.type === 'uint64') keyStr = k.value;
        else keyStr = JSON.stringify(nodeToPlain(k));
        obj[keyStr] = nodeToPlain(node.pairs[i].value);
      }
      return obj;
    case 'timestamp':
      return { __type: 'timestamp', iso: formatTimestamp(node), seconds: node.secondsBig != null ? node.secondsBig.toString() : node.seconds, nanos: node.nanos };
    case 'ext':
      return { __type: 'ext', extType: node.extType, hex: bytesToHex(node.raw) };
    default:
      return node.value;
  }
}

/* ============================================================
   Render full state
   ============================================================ */
function render() {
  if (!state) return;
  var bytes = state.bytes;
  var roots = state.roots;
  var stats = computeStats(bytes, roots);

  // stats row
  var rootLabel;
  if (roots.length === 0) rootLabel = '— (no values decoded)';
  else if (roots.length === 1) rootLabel = rootTypeLabel(roots[0]);
  else rootLabel = 'stream of ' + roots.length + ' value' + (roots.length === 1 ? '' : 's');

  var tiles = [
    ['Payload', fmtBytes(stats.bytes)],
    ['Root type', rootLabel],
    ['Elements/pairs', stats.elements.toLocaleString()],
    ['Max depth', stats.maxDepth],
    ['Strings', stats.strings.toLocaleString()],
    ['Timestamps', stats.timestamps.toLocaleString()]
  ];
  statsEl.style.display = 'flex';
  statsEl.innerHTML = tiles.map(function(t){
    return '<div class="stat"><span class="lbl">' + esc(t[0]) + '</span><b>' + t[1] + '</b></div>';
  }).join('');

  // panel / tree
  panel.classList.add('show');
  var html = '';
  if (roots.length === 0) {
    html = '<div style="padding:14px;color:#8b949e">No values decoded.</div>';
  } else if (roots.length === 1) {
    html = nodeToHtml(roots[0], 0, '');
  } else {
    for (var i = 0; i < roots.length; i++) {
      html += '<div class="card"><h2 onclick="this.parentNode.classList.toggle(\'collapsed\')"><span class="caret">▾</span> Value #' + (i+1) + '</h2><div class="body" style="padding:8px 14px"><div class="tree">' + nodeToHtml(roots[i], 0, '') + '</div></div></div>';
    }
  }
  // if there was an error mid-stream, surface it
  if (state.error && roots.length > 0) {
    html += '<div class="card"><h2><span class="badge bad">truncated</span> Stream stopped</h2><div class="body"><pre class="block">Decode stopped at byte offset ' + state.errorOffset + ': ' + esc(state.error) + '\n\n' + roots.length + ' value(s) decoded before the error. Leftover bytes did not form a complete value.</pre></div></div>';
  } else if (state.error && roots.length === 0) {
    html = '<div style="padding:14px;color:#cf222e">Failed to decode any value: ' + esc(state.error) + '</div>';
  }
  panel.innerHTML = html;

  // wire tree toggles
  panel.querySelectorAll('.node > .line > .toggle:not(.leaf)').forEach(function(t){
    t.onclick = function(){
      var n = t.closest('.node');
      n.classList.toggle('collapsed');
      t.textContent = n.classList.contains('collapsed') ? '▸' : '▾';
    };
  });

  // card header toggles use the .collapsed class already
  panel.querySelectorAll('.card > h2').forEach(function(h){
    h.onclick = function(){
      h.parentNode.classList.toggle('collapsed');
    };
  });

  searchIn.disabled = false;
  btns.copy.disabled = false;
  btns.savejson.disabled = false;
}

/* ---------- search filter: hide non-matching leaf lines ---------- */
function applyFilter() {
  var q = searchIn.value.trim().toLowerCase();
  panel.querySelectorAll('.node').forEach(function(n){
    n.style.display = '';
  });
  if (!q) return;
  // walk; hide nodes that don't contain match in their line text or any descendant
  panel.querySelectorAll('.node').forEach(function(n){
    var text = n.textContent.toLowerCase();
    if (text.indexOf(q) < 0) {
      n.style.display = 'none';
    }
  });
}
searchIn.addEventListener('input', applyFilter);

/* ============================================================
   Load entrypoints
   ============================================================ */
function loadBytes(u8, sourceLabel) {
  clearError(); clearNotice();
  if (u8.length === 0) { showError('Empty payload — nothing to decode.'); return; }
  if (u8.length > MAX_BYTES) { showError('Payload too large (max ' + fmtBytes(MAX_BYTES) + ').'); return; }
  showLoading('Decoding ' + fmtBytes(u8.length) + '…');
  afterPaint(function(){
    try {
      var result = decodeStream(u8);
      state = result;
      fnameEl.textContent = sourceLabel || '';
      metaEl.textContent = fmtBytes(u8.length) + ' · ' + result.roots.length + ' root value' + (result.roots.length === 1 ? '' : 's');
      document.title = (sourceLabel || 'payload') + ' — KSI Tools MessagePack';
      drop.style.display = 'none';
      if (result.error && result.roots.length === 0) {
        showError('Decode failed at offset ' + result.errorOffset + ': ' + result.error);
        statsEl.style.display = 'none';
        panel.classList.remove('show');
        panel.innerHTML = '';
        searchIn.disabled = true;
        btns.copy.disabled = true;
        btns.savejson.disabled = true;
      } else {
        if (result.error) {
          showNotice('Stream stopped at byte offset ' + result.errorOffset + ': ' + result.error + ' — ' + result.roots.length + ' value(s) decoded before the error.');
        } else if (result.roots.length > 1) {
          showNotice('Multiple top-level values detected (streaming msgpack): ' + result.roots.length + ' values decoded sequentially.');
        }
        render();
      }
    } catch (e) {
      showError('Internal error: ' + (e.message || String(e)));
      console.error(e);
    }
    hideLoading();
  });
}

function loadFile(file) {
  if (!file) return;
  if (file.size > MAX_BYTES) { showError('File too large (max ' + fmtBytes(MAX_BYTES) + ').'); return; }
  showLoading('Reading file…');
  file.arrayBuffer().then(function(buf){
    var u8 = new Uint8Array(buf);
    loadBytes(u8, file.name);
  }).catch(function(e){
    hideLoading();
    showError('Could not read file: ' + (e.message || String(e)));
  });
}

function loadPaste() {
  var text = pasteEl.value;
  if (!text.trim()) { showError('Paste some hex or base64 first.'); return; }
  var decoded = detectAndDecode(text);
  if (!decoded) {
    showError('Could not detect format. Paste must be hex (e.g. "82 a1 61 01", with optional 0x/\\x prefixes, spaces, colons) or base64 (charset [A-Za-z0-9+/=], length multiple of 4).');
    return;
  }
  loadBytes(decoded.bytes, 'paste (' + decoded.kind + ', ' + fmtBytes(decoded.bytes.length) + ')');
}

/* ---------- wiring ---------- */
wireDrop(loadFile);
document.getElementById('goBtn').onclick = loadPaste;
pasteEl.addEventListener('keydown', function(e){
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); loadPaste(); }
});

btns.copy.onclick = async function(){
  if (!state) return;
  var stats = computeStats(state.bytes, state.roots);
  var rootLabel;
  if (state.roots.length === 0) rootLabel = 'none';
  else if (state.roots.length === 1) rootLabel = rootTypeLabel(state.roots[0]);
  else rootLabel = 'stream of ' + state.roots.length + ' values';
  var summary = 'MessagePack payload, ' + stats.bytes + ' bytes, root: ' + rootLabel +
                ', ' + stats.elements + ' elements, depth ' + stats.maxDepth +
                '; ' + stats.timestamps + ' timestamp' + (stats.timestamps === 1 ? '' : 's') +
                ', ' + stats.strings + ' string' + (stats.strings === 1 ? '' : 's') + '.';
  try {
    await navigator.clipboard.writeText(summary);
    btns.copy.textContent = 'Copied!';
    setTimeout(function(){ btns.copy.textContent = 'Copy summary'; }, 1200);
  } catch (e) {
    showError('Clipboard unavailable: ' + (e.message || String(e)));
  }
};

btns.savejson.onclick = function(){
  if (!state) return;
  var plain;
  if (state.roots.length === 1) plain = nodeToPlain(state.roots[0]);
  else plain = state.roots.map(nodeToPlain);
  var text = JSON.stringify(plain, null, 2);
  var name = (fnameEl.textContent || 'msgpack').replace(/\.[^.]+$/, '') + '.json';
  download(name, text, 'application/json');
};

/* ============================================================
   Self-check: parse the four representative samples in memory.
   Runs at load time; failures surface via console.warn only.
   ============================================================ */
(function selfCheck(){
  try {
    // 1. fixmap { "a": 1, "b": "hi" } = 82 a1 61 01 a1 62 a2 68 69
    var s1 = new Uint8Array([0x82, 0xa1, 0x61, 0x01, 0xa1, 0x62, 0xa2, 0x68, 0x69]);
    var r1 = decodeStream(s1);
    if (r1.roots.length !== 1) throw new Error('sample1: expected 1 root, got ' + r1.roots.length);
    if (r1.roots[0].type !== 'map') throw new Error('sample1: expected map, got ' + r1.roots[0].type);
    if (r1.roots[0].pairs.length !== 2) throw new Error('sample1: expected 2 pairs, got ' + r1.roots[0].pairs.length);
    if (r1.roots[0].pairs[0].key.value !== 'a' || r1.roots[0].pairs[0].value.value !== 1) throw new Error('sample1: pair0 wrong');
    if (r1.roots[0].pairs[1].key.value !== 'b' || r1.roots[0].pairs[1].value.value !== 'hi') throw new Error('sample1: pair1 wrong');

    // 2. fixarray [1,2,3] = 93 01 02 03
    var s2 = new Uint8Array([0x93, 0x01, 0x02, 0x03]);
    var r2 = decodeStream(s2);
    if (r2.roots.length !== 1 || r2.roots[0].type !== 'array' || r2.roots[0].items.length !== 3) throw new Error('sample2 failed: ' + JSON.stringify(r2));
    if (r2.roots[0].items[0].value !== 1 || r2.roots[0].items[1].value !== 2 || r2.roots[0].items[2].value !== 3) throw new Error('sample2: values wrong');

    // 3. timestamp fixext4: d6 ff <4-byte uint32 seconds>. Use 0 seconds -> 1970-01-01T00:00:00Z
    var s3 = new Uint8Array([0xd6, 0xff, 0x00, 0x00, 0x00, 0x00]);
    var r3 = decodeStream(s3);
    if (r3.roots.length !== 1 || r3.roots[0].type !== 'timestamp') throw new Error('sample3: expected timestamp, got ' + (r3.roots[0] && r3.roots[0].type));
    var iso = formatTimestamp(r3.roots[0]);
    if (iso !== '1970-01-01T00:00:00.000Z') throw new Error('sample3: iso wrong: ' + iso);

    // 4. truncated: array header 93 then only one element
    var s4 = new Uint8Array([0x93, 0x01]);
    var r4 = decodeStream(s4);
    if (r4.error == null) throw new Error('sample4: expected error, got success');
    if (r4.roots.length !== 0) throw new Error('sample4: expected 0 roots (failed atomically), got ' + r4.roots.length);

    console.log('KSI Tools MessagePack Viewer self-check: PASS (4/4 samples)');
  } catch (e) {
    console.warn('KSI Tools MessagePack Viewer self-check: FAIL —', e.message || e);
  }
})();
</script>
