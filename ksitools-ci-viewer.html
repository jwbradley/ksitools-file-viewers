<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KSI Tools CI Pipeline Viewer</title>
<style id="appcss">
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:15px; line-height:1.5; background:#fff; color:#1f2328; }
header.bar { position:sticky; top:0; z-index:20; display:flex; gap:8px; align-items:center; padding:10px 16px; background:#f6f8fa; border-bottom:1px solid #d0d7de; flex-wrap:wrap; }
header.bar h1 { font-size:15px; margin:0; font-weight:600; }
header.bar .fname { color:#57606a; font-size:13px; flex:1; min-width:60px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
header.bar .meta { color:#57606a; font-size:12px; }
button, select, input[type=text], textarea { font:inherit; font-size:13px; padding:6px 12px; border:1px solid #d0d7de; border-radius:6px; background:#fff; color:#1f2328; }
button { cursor:pointer; } button:hover { background:#f3f4f6; } button:disabled { opacity:.45; cursor:default; }
#search { width:200px; }
#dialect { min-width:140px; }
#drop { max-width:900px; margin:36px auto 16px; padding:48px 24px; text-align:center; border:2px dashed #d0d7de; border-radius:12px; color:#57606a; cursor:pointer; }
#drop.hover { border-color:#0969da; background:rgba(9,105,218,.05); color:#0969da; }
#drop strong { display:block; font-size:18px; margin-bottom:6px; color:#1f2328; }
.hint { color:#8b949e; font-size:12px; }
.paste-box { max-width:900px; margin:0 auto 20px; padding:0 16px; }
.paste-box label { display:block; font-size:13px; color:#57606a; margin-bottom:6px; }
#paste, .tarea { width:100%; min-height:110px; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:12.5px; padding:10px; border:1px solid #d0d7de; border-radius:8px; resize:vertical; }
#notice { padding:7px 16px; font-size:12.5px; background:#fff8c5; color:#7a5c00; border-bottom:1px solid #f0c000; display:none; }
#err { max-width:900px; margin:24px auto; padding:16px 20px; border:1px solid #cf222e; border-radius:10px; background:rgba(207,34,46,.06); color:#cf222e; font-family:ui-monospace,monospace; font-size:13px; white-space:pre-wrap; display:none; }
#loading { position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px; background:rgba(255,255,255,.72); color:#57606a; }
#loading.show { display:flex; }
.spinner { width:38px; height:38px; border:4px solid #d0d7de; border-top-color:#0969da; border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.badge { display:inline-block; font-size:10px; font-weight:600; padding:1px 7px; border-radius:999px; border:1px solid #d0d7de; margin-right:4px; margin-bottom:4px; }
.badge.bad { background:#ffebe9; border-color:#ff8182; color:#cf222e; }
.badge.warn { background:#fff8c5; border-color:#f0c000; color:#7a5c00; }
.badge.ok { background:#dafbe1; border-color:#4ac26b; color:#1a7f37; }
.badge.info { background:#ddf4ff; border-color:#54aeff; color:#0969da; }
.stats { display:none; flex-wrap:wrap; gap:8px; margin:8px 0 12px; padding:0 16px; }
.stat { border:1px solid #d0d7de; border-radius:8px; padding:8px 12px; font-size:12.5px; background:#f6f8fa; min-width:120px; max-width:320px; }
.stat b { display:block; font-size:14px; word-break:break-word; }
.stat .lbl { color:#57606a; font-size:11px; text-transform:uppercase; letter-spacing:.03em; }
.panel { max-width:1100px; margin:12px auto; padding:0 16px 40px; display:none; }
.panel.show { display:block; }
.card { border:1px solid #d0d7de; border-radius:10px; margin-bottom:12px; overflow:hidden; }
.card h2 { margin:0; padding:10px 14px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; background:#f6f8fa; border-bottom:1px solid #d0d7de; color:#57606a; }
.card .body { padding:12px 14px; }
.flags-row { display:flex; flex-wrap:wrap; gap:4px; align-items:center; }
table.grid { border-collapse:collapse; width:100%; font-size:12.5px; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; }
.grid th { position:sticky; top:53px; background:#f6f8fa; text-align:left; padding:8px 10px; border-bottom:1px solid #d0d7de; white-space:nowrap; z-index:5; }
.grid td { padding:6px 10px; border-bottom:1px solid #f0f2f4; vertical-align:top; word-break:break-word; }
.grid tr:hover td { background:rgba(175,184,193,.12); }
.grid tr { cursor:pointer; }
.grid tr.selected td { background:rgba(9,105,218,.1); }
.grid td.key { color:#0550ae; font-weight:600; white-space:nowrap; width:1%; }
.grid td.sec { color:#57606a; white-space:nowrap; width:1%; }
.grid td.ln { color:#8b949e; width:1%; text-align:right; font-variant-numeric:tabular-nums; }
pre.block { margin:0; padding:10px 12px; background:#f6f8fa; border-radius:8px; white-space:pre-wrap; word-break:break-word; max-height:28vh; overflow:auto; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:12px; }
.mono { font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:12px; }
.table-wrap { overflow:auto; }
@media (prefers-color-scheme: dark) {
  body { background:#0d1117; color:#e6edf3; }
  header.bar { background:#161b22; border-bottom-color:#30363d; }
  header.bar .fname, header.bar .meta, .hint, .paste-box label, .stat .lbl { color:#8b949e; }
  button, select, input[type=text], textarea, #paste, .tarea { background:#21262d; color:#e6edf3; border-color:#30363d; }
  button:hover { background:#30363d; }
  #drop { border-color:#30363d; color:#8b949e; } #drop strong { color:#e6edf3; }
  #drop.hover { border-color:#4493f8; color:#4493f8; }
  .stat { background:#161b22; border-color:#30363d; }
  .card { border-color:#30363d; }
  .card h2 { background:#161b22; border-bottom-color:#30363d; color:#8b949e; }
  .grid th { background:#161b22; border-bottom-color:#30363d; }
  .grid td { border-bottom-color:#21262d; }
  .grid tr:hover td { background:rgba(110,118,129,.12); }
  .grid tr.selected td { background:rgba(31,111,235,.2); }
  .grid td.key { color:#79c0ff; }
  .grid td.sec { color:#8b949e; }
  .grid td.ln { color:#6e7681; }
  .badge { border-color:#30363d; }
  .badge.bad { background:#3d1418; border-color:#f85149; color:#ff7b72; }
  .badge.warn { background:#3a2f00; border-color:#b58900; color:#e3b341; }
  .badge.ok { background:#12261e; border-color:#238636; color:#3fb950; }
  .badge.info { background:#121d2f; border-color:#1f6feb; color:#58a6ff; }
  pre.block { background:#161b22; }
  #notice { background:#3a2f00; color:#e3b341; border-bottom-color:#b58900; }
  #err { border-color:#f85149; color:#ff7b72; background:rgba(248,81,73,.08); }
  #loading { background:rgba(13,17,23,.75); }
  .spinner { border-color:#30363d; border-top-color:#4493f8; }
}
</style>
</head>
<body>

<header class="bar">
  <h1>KSI Tools CI Pipeline Viewer</h1>
  <span class="fname" id="fname"></span>
  <span class="meta" id="meta"></span>
  <select id="dialect" title="Mode" disabled>
    <option value="auto">Auto</option>
    <option value="gha">GitHub Actions</option>
    <option value="gitlab">GitLab CI</option>
    <option value="azure">Azure Pipelines</option>
  </select>
  <input type="text" id="search" placeholder="Filter…" disabled>
  <button id="copy" disabled title="Copy a plain-English summary">Copy summary</button>
  <button id="savejson" disabled>Save .json</button>
  <button id="savecsv" disabled>Save .csv</button>
  <button id="pick" onclick="document.getElementById('file').click()">Open file</button>
</header>
<input type="file" id="file" accept=".yml,.yaml,.txt,text/yaml,text/plain" style="display:none">

<div id="drop">
  <strong>Drop a CI pipeline YAML here</strong>
  or click to choose · GitHub Actions · GitLab CI · Azure Pipelines
  <div class="hint" style="margin-top:10px">Accepts .yml .yaml .txt — ci.yml · .gitlab-ci.yml · azure-pipelines.yml. Paste OK. Limit 10 MB. Parsed locally; nothing is uploaded.</div>
</div>

<div class="paste-box">
  <label for="paste">Or paste contents:</label>
  <textarea id="paste" class="tarea" spellcheck="false" placeholder="on:&#10;  push:&#10;jobs:&#10;  build:&#10;    runs-on: ubuntu-latest&#10;    steps:&#10;      - uses: actions/checkout@v4"></textarea>
  <div style="margin-top:8px"><button id="goBtn">Analyze paste</button></div>
</div>

<div id="err"></div>
<div id="notice"></div>
<div class="stats" id="stats"></div>
<div class="panel" id="panel"></div>

<div id="loading"><div class="spinner"></div><div id="loadingmsg">Loading…</div></div>

let state = null;
let sourceText = '';
let currentName = 'ci-pipeline';
let currentFileName = '';

function showLoading(m) { loadingMsg.textContent = m || 'Loading…'; loadingEl.classList.add('show'); }
function hideLoading() { loadingEl.classList.remove('show'); }
function afterPaint(fn) { requestAnimationFrame(() => requestAnimationFrame(fn)); }
function showError(m) { errBox.style.display = 'block'; errBox.textContent = m; }

function esc(s) {

function download(name, text, type) {

  a.click();
  URL.revokeObjectURL(a.href);
}
function csvEsc(v) {

}

}
function wireDrop(loadFn) {

function arr(x) { if (x == null) return []; return Array.isArray(x) ? x : [x]; }

  if (typeof v === 'number' || typeof v === 'boolean') return String(v);
  if (Array.isArray(v)) return v.map(x => (typeof x === 'object' ? JSON.stringify(x) : String(x))).join(', ').slice(0, max);

  const name = (filename || '').toLowerCase();

  if (name.includes('azure-pipelines') || name.includes('azure-pipeline')) return 'azure';

    pushFlag(flags, 'warn', 'permissions: write-all', 'Broad write-all permissions');
  } else if (data.permissions && typeof data.permissions === 'object') {
    if (data.permissions.contents === 'write' || data.permissions.contents === 'write-all') {
      pushFlag(flags, 'warn', 'contents:write', 'Broad contents:write permission');
    }
    const writes = Object.entries(data.permissions).filter(([, v]) => String(v) === 'write');
    if (writes.length >= 3) pushFlag(flags, 'warn', 'broad write perms', writes.map(x => x[0]).join(', '));
  }
  const jobs = [];
  const steps = [];
  const jobMap = (data.jobs && typeof data.jobs === 'object') ? data.jobs : {};
  for (const [id, job] of Object.entries(jobMap)) {
    if (!job || typeof job !== 'object') continue;
    const stepList = Array.isArray(job.steps) ? job.steps : [];
    if (job.permissions === 'write-all') pushFlag(flags, 'warn', 'job ' + id + ' write-all', 'Job permissions write-all');
    if (job.permissions && typeof job.permissions === 'object' && job.permissions.contents === 'write') {
      pushFlag(flags, 'warn', 'job ' + id + ' contents:write', '');
    }
    if (job.env) scanSecretKeys(job.env, 'jobs.' + id + '.env', flags, 'env');
    const runsOn = runsOnStr(job['runs-on'] ?? job.runs_on);
    jobs.push({
      id, name: job.name || '', runsOn, needs: needsStr(job.needs),
      if: job.if != null ? String(job.if) : '',
      environment: typeof job.environment === 'object' ? (job.environment.name || summarizeVal(job.environment, 40)) : (job.environment || ''),
      permissions: permissionsSummary(job.permissions),
      stepCount: stepList.length, flags: [], raw: job
    });
    stepList.forEach((st, i) => {
      if (!st || typeof st !== 'object') return;
      const uses = st.uses || '';
      const run = st.run != null ? String(st.run) : '';
      const name = st.name || '';
      const withKeys = st.with && typeof st.with === 'object' ? Object.keys(st.with) : [];
      const sFlags = [];
      if (/actions\/checkout@/i.test(uses) && st.with && (st.with['persist-credentials'] === true || st.with['persist-credentials'] === 'true')) {
        pushFlag(flags, 'info', 'checkout persist-credentials', 'Job ' + id + ' step ' + (i + 1));
        sFlags.push({ t: 'info', l: 'persist-credentials' });
      }
      if (st.env) scanSecretKeys(st.env, 'jobs.' + id + '.steps[' + i + '].env', flags, 'env');
      if (st.with) {
        for (const [wk, wv] of Object.entries(st.with)) {
          if (PLAIN_SECRET_KEY_RE.test(wk) && wv != null && String(wv).trim() !== '' && !String(wv).includes('${{') && !String(wv).startsWith('$')) {
            pushFlag(flags, 'bad', 'plaintext ' + wk + ' in with', 'Job ' + id + ' step ' + (i + 1));
          }
        }
      }
      const display = name || uses || (run ? 'run: ' + truncate(run, 120) : '(empty)');
      steps.push({ job: id, step: i + 1, name, uses, run: truncate(run, 120), display, withKeys: withKeys.join(', '), flags: sFlags, raw: st });
    });
  }
  if (!flags.length) pushFlag(flags, 'ok', 'no major flags', '');
  return {
    dialect: 'gha', triggers, envKeys, jobs, steps, templates: [], stages: [], flags,
    meta: { name: data.name || '', permissions: permissionsSummary(data.permissions), concurrency: data.concurrency ? summarizeVal(data.concurrency, 60) : '' }
  };
}

function imageStr(img) {
  if (img == null) return '';
  if (typeof img === 'string') return img;
  if (typeof img === 'object') return img.name || summarizeVal(img, 40);
  return String(img);
}
function summarizeOnlyExcept(job) {
  const parts = [];
  if (job.only) parts.push('only:' + summarizeVal(job.only, 40));
  if (job.except) parts.push('except:' + summarizeVal(job.except, 40));
  if (job.rules) parts.push('rules:' + (Array.isArray(job.rules) ? job.rules.length + ' rule(s)' : summarizeVal(job.rules, 40)));
  return parts.join('; ');
}
function summarizeArtifacts(a) {
  if (!a) return '';
  if (typeof a === 'object') {
    const paths = arr(a.paths).join(', ');
    return paths || summarizeVal(a, 50);
  }
  return String(a);
}

function parseGitlab(data) {
  const flags = [];
  const reserved = new Set(['stages', 'variables', 'include', 'default', 'workflow', 'image', 'services', 'cache', 'before_script', 'after_script', 'pages']);
  const stages = arr(data.stages).map(String);
  const jobs = [];
  const templates = [];
  const steps = [];
  if (data.variables && typeof data.variables === 'object') {
    for (const k of Object.keys(data.variables)) {
      if (SECRET_NAME_RE.test(k)) pushFlag(flags, 'info', 'secret-like var:' + k, 'variables.' + k);
      const v = data.variables[k];
      const val = (v && typeof v === 'object' && 'value' in v) ? v.value : v;
      if (PLAIN_SECRET_KEY_RE.test(k) && val != null && String(val).trim() !== '' && !String(val).startsWith('$')) {
        pushFlag(flags, 'bad', 'plaintext ' + k + ' in variables', '');
      }
    }
  }
  for (const [id, job] of Object.entries(data)) {
    if (reserved.has(id)) continue;
    if (!job || typeof job !== 'object' || Array.isArray(job)) continue;
    const isHidden = id.startsWith('.');
    const script = arr(job.script).map(String);
    if (isHidden && !script.length && !job.trigger) {
      templates.push({
        id, type: 'template', stage: job.stage || '', image: imageStr(job.image),
        tags: arr(job.tags).join(', '), scriptLines: 0, onlyExcept: summarizeOnlyExcept(job),
        needs: needsStr(job.needs), artifacts: summarizeArtifacts(job.artifacts), raw: job
      });
      continue;
    }
    for (const line of script) {
      if (CURL_PIPE_BASH_RE.test(line)) pushFlag(flags, 'warn', 'curl|bash http', 'Job ' + id + ': ' + truncate(line, 80));
    }
    if (job.when === 'always') pushFlag(flags, 'info', 'when: always', 'Job ' + id);
    const entry = {
      id, name: job.name || id, type: isHidden ? 'template' : 'job',
      stage: job.stage || (stages[0] || ''), image: imageStr(job.image),
      tags: arr(job.tags).join(', '), scriptLines: script.length,
      onlyExcept: summarizeOnlyExcept(job), needs: needsStr(job.needs),
      artifacts: summarizeArtifacts(job.artifacts), when: job.when || '', raw: job
    };
    if (isHidden) templates.push(entry); else jobs.push(entry);
    script.forEach((line, i) => {
      steps.push({ job: id, step: i + 1, name: '', uses: '', run: truncate(line, 120), display: truncate(line, 120), withKeys: '', flags: [], raw: { script: line } });
    });
  }
  if (!flags.length) pushFlag(flags, 'ok', 'no major flags', '');
  return {
    dialect: 'gitlab', triggers: stages.length ? ['stages: ' + stages.join(', ')] : [],
    envKeys: data.variables && typeof data.variables === 'object' ? Object.keys(data.variables) : [],
    jobs, steps, templates, stages, flags,
    meta: { image: imageStr(data.image), default: data.default ? summarizeVal(data.default, 60) : '' }
  };
}

function parseAzure(data) {
  const flags = [];
  const jobs = [];
  const steps = [];
  const stages = [];
  const triggers = [];
  if (data.trigger != null) triggers.push('trigger:' + summarizeVal(data.trigger, 50));
  if (data.pr != null) triggers.push('pr:' + summarizeVal(data.pr, 50));
  const pool = data.pool ? (typeof data.pool === 'string' ? data.pool : (data.pool.vmImage || data.pool.name || summarizeVal(data.pool, 40))) : '';
  if (data.variables) {
    const vars = Array.isArray(data.variables)
      ? Object.fromEntries(data.variables.map(v => (typeof v === 'object' ? [v.name, v.value] : String(v).split('='))).filter(x => x[0]))
      : data.variables;
    if (vars && typeof vars === 'object') scanSecretKeys(vars, 'variables', flags, 'var');
  }
  function ingestSteps(stepList, jobId) {
    arr(stepList).forEach((st, i) => {
      if (!st || typeof st !== 'object') return;
      const task = st.task || st.template || '';
      const script = st.script != null ? String(st.script) : (st.bash != null ? String(st.bash) : (st.powershell != null ? String(st.powershell) : (st.pwsh != null ? String(st.pwsh) : '')));
      const name = st.displayName || st.name || '';
      const display = name || task || (script ? 'script: ' + truncate(script, 120) : summarizeVal(st, 60));
      if (script && CURL_PIPE_BASH_RE.test(script)) pushFlag(flags, 'warn', 'curl|bash', 'Job ' + jobId + ' step ' + (i + 1));
      if (st.env) scanSecretKeys(st.env, jobId + '.steps[' + i + '].env', flags, 'env');
      if (st.inputs) {
        for (const [ik, iv] of Object.entries(st.inputs)) {
          if (PLAIN_SECRET_KEY_RE.test(ik) && iv != null && String(iv).trim() && !String(iv).includes('$(')) {
            pushFlag(flags, 'bad', 'plaintext ' + ik + ' in inputs', jobId);
          }
        }
      }
      steps.push({ job: jobId, step: i + 1, name, uses: task, run: truncate(script, 120), display: truncate(display, 120), withKeys: st.inputs && typeof st.inputs === 'object' ? Object.keys(st.inputs).join(', ') : '', flags: [], raw: st });
    });
  }
  function ingestJob(job, fallbackId) {
    const id = job.job || job.deployment || fallbackId || 'job';
    const name = job.displayName || job.name || id;
    const jPool = job.pool ? (typeof job.pool === 'string' ? job.pool : (job.pool.vmImage || job.pool.name || summarizeVal(job.pool, 40))) : pool;
    const stepList = job.steps || (job.strategy && job.strategy.runOnce && job.strategy.runOnce.deploy && job.strategy.runOnce.deploy.steps) || [];
    jobs.push({
      id: String(id), name: String(name), runsOn: jPool || '', needs: needsStr(job.dependsOn),
      if: job.condition != null ? String(job.condition) : '',
      environment: job.environment ? (typeof job.environment === 'object' ? (job.environment.name || '') : String(job.environment)) : '',
      permissions: '', stepCount: arr(stepList).length, flags: [], stage: job._stage || '', raw: job
    });
    ingestSteps(stepList, String(id));
  }
  if (Array.isArray(data.stages)) {
    data.stages.forEach((st, si) => {
      if (!st || typeof st !== 'object') return;
      const sname = st.stage || st.displayName || ('stage' + (si + 1));
      stages.push(String(sname));
      arr(st.jobs).forEach((j, ji) => {
        if (!j || typeof j !== 'object') return;
        j._stage = String(sname);
        ingestJob(j, sname + '_job' + (ji + 1));
      });
    });
  } else if (Array.isArray(data.jobs)) {
    data.jobs.forEach((j, ji) => ingestJob(j, 'job' + (ji + 1)));
  } else if (data.jobs && typeof data.jobs === 'object') {
    Object.entries(data.jobs).forEach(([k, j]) => { if (j && typeof j === 'object') ingestJob(Object.assign({}, j, { job: j.job || k }), k); });
  } else if (Array.isArray(data.steps)) {
    ingestJob({ job: 'job', steps: data.steps, pool: data.pool }, 'job');
  }
  if (!flags.length) pushFlag(flags, 'ok', 'no major flags', '');
  return { dialect: 'azure', triggers, envKeys: [], jobs, steps, templates: [], stages, flags, meta: { pool, name: data.name || '' } };
}

function parseCi(data, text, mode, filename) {
  let dialect = mode;
  if (!dialect || dialect === 'auto') dialect = detectCiDialect(data, text, filename);
  if (dialect === 'gitlab') return parseGitlab(data);
  if (dialect === 'azure') return parseAzure(data);
  return parseGha(data);
}

function plainCiSummary(st, filename) {
  const lines = [];
  lines.push('KSI Tools CI Pipeline Viewer — summary');
  lines.push('File: ' + (filename || '(paste)'));
  lines.push('Dialect: ' + st.dialect);
  if (st.triggers && st.triggers.length) lines.push('Triggers/stages: ' + st.triggers.join(', '));
  if (st.stages && st.stages.length) lines.push('Stages: ' + st.stages.join(', '));
  if (st.envKeys && st.envKeys.length) lines.push('Env/var keys: ' + st.envKeys.join(', '));
  lines.push('Jobs: ' + st.jobs.length + (st.templates && st.templates.length ? ' · Templates: ' + st.templates.length : ''));
  lines.push('Steps: ' + st.steps.length);
  lines.push('');
  lines.push('Flags:');
  for (const f of st.flags) lines.push('  [' + f.t + '] ' + f.l + (f.detail ? ' — ' + f.detail : ''));
  lines.push('');
  for (const j of st.jobs) {
    lines.push('- ' + j.id + (j.name && j.name !== j.id ? ' (' + j.name + ')' : '') +
      (j.runsOn ? ' runs-on=' + j.runsOn : '') + (j.stage ? ' stage=' + j.stage : '') +
      ' steps=' + (j.stepCount != null ? j.stepCount : j.scriptLines || 0));
  }
  return lines.join('\n');
}

function toCsv(rows) {
  return rows.map(r => r.map(csvEsc).join(',')).join('\n') + '\n';
}
function jobsCsv(st) {
  const rows = [['job_id', 'name', 'runs_on_or_image', 'needs', 'if_or_rules', 'environment', 'permissions', 'step_count', 'stage', 'type']];
  for (const j of st.jobs) {
    rows.push([j.id, j.name || '', j.runsOn || j.image || '', j.needs || '', j.if || j.onlyExcept || '', j.environment || '', j.permissions || '', String(j.stepCount != null ? j.stepCount : j.scriptLines || 0), j.stage || '', j.type || 'job']);
  }
  for (const j of (st.templates || [])) {
    rows.push([j.id, j.name || '', j.image || '', j.needs || '', j.onlyExcept || '', '', '', String(j.scriptLines || 0), j.stage || '', 'template']);
  }
  return rows;
}
function stepsCsv(st) {
  const rows = [['job', 'step', 'name', 'uses_or_task', 'run', 'with_keys']];
  for (const s of st.steps) rows.push([s.job, String(s.step), s.name || '', s.uses || '', s.run || '', s.withKeys || '']);
  return rows;
}

function loadYaml(text) {
  text = String(text || '').replace(/^\uFEFF/, '').trim();
  if (!text) throw new Error('Empty input');
  if (text.startsWith('{') || text.startsWith('[')) return JSON.parse(text);
  if (typeof jsyaml === 'undefined') throw new Error('YAML requires embedded js-yaml');
  return jsyaml.load(text);
}

function dialectLabel(d) {
  return ({ gha: 'GitHub Actions', gitlab: 'GitLab CI', azure: 'Azure Pipelines' })[d] || d;
}

function filteredJobs() {
  if (!state) return [];
  const q = searchIn.value.trim().toLowerCase();
  const all = state.jobs.concat((state.templates || []).map(t => Object.assign({}, t, { _template: true })));
  if (!q) return all;
  return all.filter(j => [j.id, j.name, j.runsOn, j.image, j.needs, j.stage, j.onlyExcept, j.permissions].join(' ').toLowerCase().includes(q));
}
function filteredSteps() {
  if (!state) return [];
  const q = searchIn.value.trim().toLowerCase();
  if (!q) return state.steps;
  return state.steps.filter(s => [s.job, s.name, s.uses, s.run, s.display, s.withKeys].join(' ').toLowerCase().includes(q));
}

function badgeHtml(flags) {
  return (flags || []).map(f => '<span class="badge ' + esc(f.t) + '" title="' + esc(f.detail || '') + '">' + esc(f.l) + '</span>').join(' ');
}

function draw() {
  if (!state) return;
  const q = searchIn.value.trim().toLowerCase();
  const jobs = filteredJobs();
  const steps = filteredSteps();
  const warnCount = state.flags.filter(f => f.t === 'bad' || f.t === 'warn').length;

  const cards = [];
  cards.push({ lbl: 'Dialect', val: dialectLabel(state.dialect) });
  cards.push({ lbl: 'Jobs', val: String(state.jobs.length) });
  if (state.templates && state.templates.length) cards.push({ lbl: 'Templates', val: String(state.templates.length) });
  cards.push({ lbl: 'Steps', val: String(state.steps.length) });
  if (state.stages && state.stages.length) cards.push({ lbl: 'Stages', val: state.stages.join(', ') });
  if (state.triggers && state.triggers.length) cards.push({ lbl: 'Triggers', val: state.triggers.join(', ') });
  if (state.envKeys && state.envKeys.length) cards.push({ lbl: 'Env keys', val: state.envKeys.join(', ') });
  statsEl.style.display = 'flex';
  statsEl.innerHTML = cards.map(c => '<div class="stat"><span class="lbl">' + esc(c.lbl) + '</span><b>' + esc(c.val) + '</b></div>').join('');

  metaEl.textContent = dialectLabel(state.dialect) + ' · ' + state.jobs.length + ' jobs · ' + state.steps.length + ' steps' +
    (warnCount ? ' · ' + warnCount + ' flag' + (warnCount === 1 ? '' : 's') : '') + (q ? ' · filtered' : '');

  noticeEl.style.display = 'block';
  noticeEl.textContent = (warnCount ? warnCount + ' heuristic flag(s). ' : '') +
    'Detected as ' + dialectLabel(state.dialect) + '. Best-effort ops review — not a live CI evaluation.';

  let html = '';
  html += '<div class="card"><h2>Flags</h2><div class="body"><div class="flags-row">' + badgeHtml(state.flags) + '</div>';
  html += '<ul style="margin:10px 0 0;padding-left:18px;font-size:12.5px">';
  for (const f of state.flags) {
    if (f.t === 'ok') continue;
    html += '<li><strong>' + esc(f.l) + '</strong>' + (f.detail ? ' — ' + esc(f.detail) : '') + '</li>';
  }
  html += '</ul></div></div>';

  if (state.dialect === 'gha' || state.dialect === 'azure') {
    html += '<div class="card"><h2>Jobs</h2><div class="body" style="padding:0"><div class="table-wrap"><table class="grid"><thead><tr>' +
      '<th>Job</th><th>Name</th><th>Runs-on / Pool</th><th>Needs</th><th>If / Condition</th><th>Environment</th><th>Permissions</th><th>Steps</th>' +
      (state.dialect === 'azure' ? '<th>Stage</th>' : '') +
      '</tr></thead><tbody>';
    for (const j of jobs.filter(x => !x._template)) {
      html += '<tr><td class="key">' + esc(j.id) + '</td><td>' + esc(j.name || '—') + '</td><td>' + esc(j.runsOn || '—') + '</td><td>' +
        esc(j.needs || '—') + '</td><td>' + esc(j.if || '—') + '</td><td>' + esc(j.environment || '—') + '</td><td>' +
        esc(j.permissions || '—') + '</td><td>' + esc(String(j.stepCount)) + '</td>' +
        (state.dialect === 'azure' ? '<td>' + esc(j.stage || '—') + '</td>' : '') + '</tr>';
    }
    html += '</tbody></table></div></div></div>';
  } else {
    html += '<div class="card"><h2>Jobs</h2><div class="body" style="padding:0"><div class="table-wrap"><table class="grid"><thead><tr>' +
      '<th>Job</th><th>Stage</th><th>Image</th><th>Tags</th><th>Script lines</th><th>Only/Except/Rules</th><th>Needs</th><th>Artifacts</th><th>Type</th>' +
      '</tr></thead><tbody>';
    for (const j of jobs) {
      html += '<tr><td class="key">' + esc(j.id) + '</td><td>' + esc(j.stage || '—') + '</td><td>' + esc(j.image || '—') + '</td><td>' +
        esc(j.tags || '—') + '</td><td>' + esc(String(j.scriptLines || j.stepCount || 0)) + '</td><td>' + esc(j.onlyExcept || '—') +
        '</td><td>' + esc(j.needs || '—') + '</td><td>' + esc(j.artifacts || '—') + '</td><td>' + esc(j.type || (j._template ? 'template' : 'job')) + '</td></tr>';
    }
    html += '</tbody></table></div></div></div>';
  }

  html += '<div class="card"><h2>Steps (flattened)</h2><div class="body" style="padding:0"><div class="table-wrap"><table class="grid"><thead><tr>' +
    '<th>Job</th><th>#</th><th>Name / Uses / Run</th><th>With keys</th></tr></thead><tbody>';
  for (const s of steps) {
    const shown = s.display || s.name || s.uses || (s.run ? 'run: ' + s.run : '—');
    html += '<tr><td class="sec">' + esc(s.job) + '</td><td class="ln">' + s.step + '</td><td>' + esc(shown) + '</td><td>' + esc(s.withKeys || '—') + '</td></tr>';
  }
  if (!steps.length) html += '<tr><td colspan="4" style="color:#8b949e;padding:16px">No steps.</td></tr>';
  html += '</tbody></table></div></div></div>';

  panel.innerHTML = html;
  panel.classList.add('show');
}

function render(text, name) {
  if (!text || !String(text).trim()) { showError('Empty input'); return; }
  if (new Blob([text]).size > MAX_BYTES) { showError('Input exceeds 10 MB limit'); return; }
  showLoading('Parsing CI pipeline…');
  afterPaint(() => {
    try {
      sourceText = String(text);
      const data = loadYaml(sourceText);
      if (!data || typeof data !== 'object') throw new Error('Expected a YAML/JSON mapping or sequence');
      const override = dialectSel.value;
      state = parseCi(data, sourceText, override, name || '');
      currentFileName = name || '(paste)';
      currentName = (name || 'ci-pipeline').replace(/\.(ya?ml|txt)$/i, '');
      fname.textContent = currentFileName;
      document.title = currentName + ' — KSI Tools CI Pipeline Viewer';
      drop.style.display = 'none';
      const pb = document.querySelector('.paste-box'); if (pb) pb.style.display = 'none';
      clearError();
      searchIn.disabled = false;
      dialectSel.disabled = false;
      Object.values(btns).forEach(b => { b.disabled = false; });
      draw();
    } catch (e) {
      showError(e.message || String(e));
    }
    hideLoading();
  });
}

function loadFile(file) {
  if (!file) return;
  if (file.size > MAX_BYTES) { showError('File too large (max 10 MB)'); return; }
  const r = new FileReader();
  r.onload = () => render(String(r.result || ''), file.name);
  r.onerror = () => showError('Failed to read file');
  r.readAsText(file);
}

wireDrop(loadFile);
document.getElementById('goBtn').onclick = () => render(pasteEl.value, '(paste)');
searchIn.oninput = draw;
dialectSel.onchange = () => { if (sourceText) render(sourceText, currentFileName || currentName); };
btns.copy.onclick = async () => {
  const t = plainCiSummary(state, currentFileName);
  try { await navigator.clipboard.writeText(t); } catch (e) { showError('Clipboard failed: ' + e.message); }
};
btns.savejson.onclick = () => {
  const out = { dialect: state.dialect, triggers: state.triggers, stages: state.stages, envKeys: state.envKeys, meta: state.meta, flags: state.flags, jobs: state.jobs.map(j => ({ id: j.id, name: j.name, runsOn: j.runsOn, image: j.image, needs: j.needs, if: j.if, onlyExcept: j.onlyExcept, environment: j.environment, permissions: j.permissions, stepCount: j.stepCount, scriptLines: j.scriptLines, stage: j.stage, type: j.type })), templates: state.templates, steps: state.steps.map(s => ({ job: s.job, step: s.step, name: s.name, uses: s.uses, run: s.run, withKeys: s.withKeys })) };
  download(currentName + '-ci.json', JSON.stringify(out, null, 2), 'application/json');
};
btns.savecsv.onclick = () => {
  const jobs = toCsv(jobsCsv(state));
  const steps = toCsv(stepsCsv(state));
  download(currentName + '-jobs.csv', jobs, 'text/csv');
  setTimeout(() => download(currentName + '-steps.csv', steps, 'text/csv'), 200);
};

})();

</script>
