<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KSI Tools Firewall Rules</title>
<style id="appcss">
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:15px; line-height:1.5; background:#fff; color:#1f2328; }
header.bar { position:sticky; top:0; z-index:20; display:flex; gap:8px; align-items:center; padding:10px 16px; background:#f6f8fa; border-bottom:1px solid #d0d7de; flex-wrap:wrap; }
header.bar h1 { font-size:15px; margin:0; font-weight:600; }
header.bar .fname { color:#57606a; font-size:13px; flex:1; min-width:60px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
header.bar .meta { color:#57606a; font-size:12px; }
button, select, input[type=text], textarea { font:inherit; font-size:13px; padding:6px 12px; border:1px solid #d0d7de; border-radius:6px; background:#fff; color:#1f2328; }
button { cursor:pointer; } button:hover { background:#f3f4f6; } button:disabled { opacity:.45; cursor:default; }
button.toggle-on { background:#0969da; color:#fff; border-color:#0969da; }
#search { width:180px; }
#drop { max-width:900px; margin:36px auto 16px; padding:48px 24px; text-align:center; border:2px dashed #d0d7de; border-radius:12px; color:#57606a; cursor:pointer; }
#drop.hover { border-color:#0969da; background:rgba(9,105,218,.05); color:#0969da; }
#drop strong { display:block; font-size:18px; margin-bottom:6px; color:#1f2328; }
.hint { color:#8b949e; font-size:12px; }
.table-wrap { overflow:auto; padding-bottom:20px; display:none; }
table.grid { border-collapse:collapse; width:100%; font-size:12.5px; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; }
.grid th { position:sticky; top:53px; background:#f6f8fa; text-align:left; padding:8px 10px; border-bottom:1px solid #d0d7de; white-space:nowrap; z-index:5; }
.grid td { padding:6px 10px; border-bottom:1px solid #f0f2f4; vertical-align:top; word-break:break-word; }
.grid tr:hover td { background:rgba(175,184,193,.12); }
.grid tr { cursor:pointer; }
.grid tr.selected td { background:rgba(9,105,218,.1); }
.grid tr.risk td { background:rgba(207,34,46,.06); }
.grid tr.risk.selected td { background:rgba(9,105,218,.12); }
.badge { display:inline-block; font-size:10px; font-weight:600; padding:1px 7px; border-radius:999px; border:1px solid #d0d7de; margin-right:4px; margin-bottom:2px; }
.badge.bad { background:#ffebe9; border-color:#ff8182; color:#cf222e; }
.badge.warn { background:#fff8c5; border-color:#f0c000; color:#7a5c00; }
.badge.ok { background:#dafbe1; border-color:#4ac26b; color:#1a7f37; }
.badge.info { background:#ddf4ff; border-color:#54aeff; color:#0969da; }
.panel { max-width:1100px; margin:12px auto; padding:0 16px 40px; display:none; }
.panel.show { display:block; }
.card { border:1px solid #d0d7de; border-radius:10px; margin-bottom:12px; overflow:hidden; }
.card h2 { margin:0; padding:10px 14px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; background:#f6f8fa; border-bottom:1px solid #d0d7de; color:#57606a; }
.card .body { padding:12px 14px; }
pre.block, .mono { font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:12px; }
pre.block { margin:0; padding:10px 12px; background:#f6f8fa; border-radius:8px; white-space:pre-wrap; word-break:break-word; max-height:40vh; overflow:auto; }
table.kv { border-collapse:collapse; width:100%; font-size:12.5px; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; }
.kv td { padding:4px 8px; border-bottom:1px solid #f0f2f4; vertical-align:top; }
.kv td.key { color:#0550ae; width:1%; white-space:nowrap; font-weight:600; }
.paste-box { max-width:900px; margin:0 auto 20px; padding:0 16px; }
.paste-box label { display:block; font-size:13px; color:#57606a; margin-bottom:6px; }
#paste, .tarea { width:100%; min-height:100px; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:12.5px; padding:10px; border:1px solid #d0d7de; border-radius:8px; resize:vertical; }
#notice { padding:7px 16px; font-size:12.5px; background:#fff8c5; color:#7a5c00; border-bottom:1px solid #f0c000; display:none; }
#err { max-width:900px; margin:24px auto; padding:16px 20px; border:1px solid #cf222e; border-radius:10px; background:rgba(207,34,46,.06); color:#cf222e; font-family:ui-monospace,monospace; font-size:13px; white-space:pre-wrap; display:none; }
#loading { position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px; background:rgba(255,255,255,.72); color:#57606a; }
#loading.show { display:flex; }
.spinner { width:38px; height:38px; border:4px solid #d0d7de; border-top-color:#0969da; border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px;padding:0 16px}
.stat{border:1px solid #d0d7de;border-radius:8px;padding:8px 12px;font-size:12.5px;background:#f6f8fa}
.stat b{display:block;font-size:16px}
.action-accept,.action-allow{color:#1a7f37;font-weight:600}
.action-drop,.action-deny,.action-reject{color:#cf222e;font-weight:600}
.filters-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:0 16px 8px}
@media (prefers-color-scheme: dark) {
  body { background:#0d1117; color:#e6edf3; }
  header.bar { background:#161b22; border-bottom-color:#30363d; }
  header.bar .fname, header.bar .meta, .hint, .paste-box label { color:#8b949e; }
  button, select, input[type=text], textarea, #paste, .tarea { background:#21262d; color:#e6edf3; border-color:#30363d; }
  button:hover { background:#30363d; }
  button.toggle-on { background:#1f6feb; border-color:#1f6feb; }
  #drop { border-color:#30363d; color:#8b949e; } #drop strong { color:#e6edf3; }
  #drop.hover { border-color:#4493f8; color:#4493f8; }
  .grid th { background:#161b22; border-bottom-color:#30363d; }
  .grid td, .kv td { border-bottom-color:#21262d; }
  .grid tr:hover td { background:rgba(110,118,129,.12); }
  .grid tr.selected td { background:rgba(31,111,235,.2); }
  .grid tr.risk td { background:rgba(248,81,73,.08); }
  .badge { border-color:#30363d; }
  .badge.bad { background:#3d1418; border-color:#f85149; color:#ff7b72; }
  .badge.warn { background:#3a2f00; border-color:#b58900; color:#e3b341; }
  .badge.ok { background:#12261e; border-color:#238636; color:#3fb950; }
  .badge.info { background:#121d2f; border-color:#1f6feb; color:#58a6ff; }
  .card { border-color:#30363d; }
  .card h2 { background:#161b22; border-bottom-color:#30363d; color:#8b949e; }
  pre.block { background:#161b22; }
  .kv td.key { color:#79c0ff; }
  #notice { background:#3a2f00; color:#e3b341; border-bottom-color:#b58900; }
  #err { border-color:#f85149; color:#ff7b72; background:rgba(248,81,73,.08); }
  #loading { background:rgba(13,17,23,.75); }
  .spinner { border-color:#30363d; border-top-color:#4493f8; }
  .stat{background:#161b22;border-color:#30363d}
  .action-accept,.action-allow{color:#3fb950}
  .action-drop,.action-deny,.action-reject{color:#ff7b72}
}
</style>
</head>
<body>

<header class="bar">
  <h1>KSI Tools Firewall Rules</h1>
  <span class="fname" id="fname"></span>
  <span class="meta" id="meta"></span>
  <select id="fmtOverride" title="Format override">
    <option value="auto">auto</option>
    <option value="iptables">iptables</option>
    <option value="nftables">nftables</option>
    <option value="ufw">ufw</option>
    <option value="firewalld">firewalld</option>
  </select>
  <input type="text" id="search" placeholder="Filter chain / port / addr…" disabled>
  <select id="actionFilter" disabled>
    <option value="">All actions</option>
    <option value="accept">ACCEPT / ALLOW</option>
    <option value="drop">DROP / DENY</option>
    <option value="reject">REJECT</option>
    <option value="log">LOG</option>
    <option value="nat">NAT / MASQ / DNAT</option>
    <option value="other">Other</option>
  </select>
  <select id="chainFilter" disabled>
    <option value="">All chains</option>
  </select>
  <button id="risksOnly" disabled title="Show only world-open / high-risk rules">Risks only</button>
  <button id="copy" disabled>Copy summary</button>
  <button id="savecsv" disabled>Save .csv</button>
  <button id="savejson" disabled>Save .json</button>
  <button id="pick" onclick="document.getElementById('file').click()">Open file</button>
</header>
<input type="file" id="file" accept=".txt,.rules,.nft,.xml,.ufw,text/plain,application/xml,text/xml" style="display:none">
<div id="drop"><strong>Drop host firewall dump</strong>
  <div class="hint" style="margin-top:10px">iptables-save · nftables · UFW status · firewalld zone XML. Local flatten only — nothing uploaded.</div></div>
<div class="paste-box"><label>Or paste rules:</label>
<textarea id="paste" class="tarea" placeholder="*filter&#10;:INPUT DROP [0:0]&#10;-A INPUT -p tcp --dport 22 -j ACCEPT&#10;COMMIT"></textarea>
<div style="margin-top:8px"><button id="goBtn">Analyze paste</button></div></div>
<div id="err"></div><div id="notice"></div>
<div class="stats" id="stats"></div>
<div class="table-wrap" id="tablewrap" style="display:none">
<table class="grid"><thead><tr>
  <th>Table</th><th>Chain</th><th>Action</th><th>Proto</th><th>Ports</th><th>Source</th><th>Dest</th><th>Flags</th><th>Line</th>
</tr></thead><tbody id="tbody"></tbody></table>
</div>
<div class="panel" id="detail"></div>
<div id="loading"><div class="spinner"></div><div id="loadingmsg">Loading…</div></div>

<script>
(function(){
'use strict';

const MAX_BYTES = 25 * 1024 * 1024;
const MAX_RENDER = 15000;

const drop = document.getElementById('drop');
const errBox = document.getElementById('err');
const noticeEl = document.getElementById('notice');
const fname = document.getElementById('fname');
const metaEl = document.getElementById('meta');
const pasteEl = document.getElementById('paste');
const fileInput = document.getElementById('file');
const searchIn = document.getElementById('search');
const actionFilter = document.getElementById('actionFilter');
const chainFilter = document.getElementById('chainFilter');
const fmtOverride = document.getElementById('fmtOverride');
const risksOnlyBtn = document.getElementById('risksOnly');
const loadingEl = document.getElementById('loading');
const loadingMsg = document.getElementById('loadingmsg');
const tbody = document.getElementById('tbody');
const tableWrap = document.getElementById('tablewrap');
const statsEl = document.getElementById('stats');
const detailEl = document.getElementById('detail');
const btns = {
  copy: document.getElementById('copy'),
  savecsv: document.getElementById('savecsv'),
  savejson: document.getElementById('savejson')
};

let rows = [];
let currentName = 'firewall-rules';
let detectedFormat = '';
let risksOnly = false;
let selectedIdx = -1;
let lastText = '';

function showLoading(m){ loadingMsg.textContent = m || 'Loading…'; loadingEl.classList.add('show'); }
function hideLoading(){ loadingEl.classList.remove('show'); }
function afterPaint(fn){ requestAnimationFrame(() => requestAnimationFrame(fn)); }
function showError(m){ errBox.style.display = 'block'; errBox.textContent = m; }
function clearError(){ errBox.style.display = 'none'; }
function esc(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: type || 'text/plain' }));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
function csvEsc(v){
  const s = String(v ?? '');
  return /["\n,]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function wireDrop(loadFn){
  if (drop) drop.onclick = () => fileInput.click();
  fileInput.onchange = () => { if (fileInput.files[0]) loadFn(fileInput.files[0]); fileInput.value = ''; };
  if (drop) {
    ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('hover'); }));
    ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('hover'); }));
    drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) loadFn(f); });
  }
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => {
    if (e.target.closest && e.target.closest('#drop')) return;
    e.preventDefault();
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) loadFn(f);
  });
}

function emptyRule(partial){
  return Object.assign({
    format: '', table: '', chain: '', hook: '', action: '', proto: '',
    ports: '', source: '', dest: '', inIface: '', outIface: '', extra: '',
    flags: [], line: 0, raw: '', _policy: false
  }, partial || {});
}

/* ---------- world-open / risk helpers ---------- */
function isWorldOpen(addr){
  if (addr == null || addr === '') return false;
  const a = String(addr).trim().toLowerCase();
  return a === '0.0.0.0/0' || a === '::/0' || a === 'anywhere' || a === 'any' ||
    a === '*' || a === '0/0' || a === 'all' || a === 'internet';
}
function isAllowAction(act){
  const a = String(act || '').toUpperCase();
  return a === 'ACCEPT' || a === 'ALLOW' || a === 'PASS';
}
function portsMention(ports, n){
  const p = String(ports || '').toLowerCase();
  if (!p || p === '—' || p === '-') return false;
  if (p === 'all' || p === 'any' || p === '*') return false;
  const re = new RegExp('(?:^|[^0-9])' + n + '(?:[^0-9]|$)');
  return re.test(p) || p.includes('ssh') && n === 22 || p.includes('rdp') && n === 3389 ||
    p.includes('telnet') && n === 23 || p.includes('smb') && n === 445;
}
function portsIncludeSsh(ports){
  const p = String(ports || '').toLowerCase();
  return portsMention(ports, 22) || /\bssh\b/.test(p);
}
function annotateFlags(r){
  const flags = Array.isArray(r.flags) ? r.flags.slice() : [];
  const srcWorld = isWorldOpen(r.source);
  const dstWorld = isWorldOpen(r.dest);
  const outChain = /^(OUTPUT|OUT|OUTGOING|POSTROUTING)$/i.test(r.chain || '');
  // Inbound/forward: world source (or unbound dest) is risky. Outbound-to-anywhere is normal — skip dest-only.
  const world = srcWorld || (!outChain && dstWorld && !r.source);
  const allow = isAllowAction(r.action);
  const ports = String(r.ports || '');
  const proto = String(r.proto || '').toLowerCase();
  const noPortFilter = !ports || ports === '—' || ports === '-' || ports === '' ||
    ports.toLowerCase() === 'all' || ports === '*' || ports.toLowerCase() === 'any';

  if (world && allow) {
    flags.push({ t: 'bad', l: 'world-open' });
    if (portsIncludeSsh(ports)) flags.push({ t: 'bad', l: 'SSH world-open' });
    if (portsMention(ports, 3389) || /\brdp\b/i.test(ports)) flags.push({ t: 'bad', l: 'RDP world-open' });
    if (portsMention(ports, 23) || /\btelnet\b/i.test(ports)) flags.push({ t: 'bad', l: 'telnet world-open' });
    if (portsMention(ports, 445) || /\bsmb\b/i.test(ports)) flags.push({ t: 'bad', l: 'SMB world-open' });
    if (noPortFilter && (proto === '' || proto === 'all' || proto === 'any' || proto === 'ip' || proto === '-1' || proto === '*')) {
      flags.push({ t: 'bad', l: 'ACCEPT all proto world-open' });
    }
  }
  if (r._policy && /^(DROP|REJECT|DENY)$/i.test(r.action) &&
      /^(INPUT|input|INCOMING|IN|filter)$/i.test(r.chain)) {
    flags.push({ t: 'ok', l: 'DROP/REJECT INPUT policy' });
  }
  if (/MASQUERADE/i.test(r.action) || /MASQUERADE/i.test(r.raw)) {
    flags.push({ t: 'info', l: 'NAT MASQUERADE' });
  }
  if (/^(DNAT|SNAT)$/i.test(r.action)) flags.push({ t: 'info', l: r.action.toUpperCase() });
  if (/^LOG$/i.test(r.action)) flags.push({ t: 'info', l: 'LOG' });
  if (/^RETURN$/i.test(r.action)) flags.push({ t: 'info', l: 'RETURN' });

  // dedupe by label
  const seen = new Set();
  r.flags = flags.filter(f => {
    const k = f.t + ':' + f.l;
    if (seen.has(k)) return false;
    seen.add(k); return true;
  });
  return r;
}

function hasRisk(r){
  return (r.flags || []).some(f => f.t === 'bad');
}

/* ---------- iptables-save ---------- */
function tokenizeIptables(line){
  const tokens = [];
  const re = /"([^"\\]|\\.)*"|'([^'\\]|\\.)*'|\S+/g;
  let m;
  while ((m = re.exec(line))) {
    let t = m[0];
    if ((t[0] === '"' || t[0] === "'") && t.length >= 2) t = t.slice(1, -1);
    tokens.push(t);
  }
  return tokens;
}

function parseIptablesRuleTokens(tokens, startIdx){
  // tokens after -A/-I CHAIN
  const r = {
    proto: '', ports: '', source: '', dest: '', inIface: '', outIface: '',
    action: '', extra: '', sport: '', dport: ''
  };
  const extras = [];
  let i = startIdx;
  const take = () => tokens[i++];
  const peek = () => tokens[i];
  while (i < tokens.length) {
    const t = take();
    if (t === '-p' || t === '--protocol') r.proto = take() || '';
    else if (t === '-s' || t === '--source') r.source = take() || '';
    else if (t === '-d' || t === '--destination') r.dest = take() || '';
    else if (t === '-i' || t === '--in-interface') r.inIface = take() || '';
    else if (t === '-o' || t === '--out-interface') r.outIface = take() || '';
    else if (t === '--dport' || t === '--destination-port') r.dport = take() || '';
    else if (t === '--sport' || t === '--source-port') r.sport = take() || '';
    else if (t === '--dports') r.dport = take() || '';
    else if (t === '--sports') r.sport = take() || '';
    else if (t === '-m' || t === '--match') {
      const mod = take() || '';
      extras.push('match:' + mod);
      if (mod === 'multiport') {
        // handled by --dports/--sports below or already
      } else if (mod === 'state' || mod === 'conntrack') {
        // --state / --ctstate
      } else if (mod === 'tcp' || mod === 'udp') {
        if (!r.proto) r.proto = mod;
      }
    }
    else if (t === '--state' || t === '--ctstate') extras.push('state=' + (take() || ''));
    else if (t === '-j' || t === '--jump') r.action = take() || '';
    else if (t === '-g' || t === '--goto') { r.action = 'GOTO:' + (take() || ''); }
    else if (t === '--to-destination' || t === '--to-source' || t === '--to-ports') {
      extras.push(t + ' ' + (take() || ''));
    }
    else if (t === '!') {
      const next = peek();
      if (next) extras.push('!' + take());
    }
    else if (t.startsWith('-')) {
      // unknown flag — grab value if next doesn't look like a flag
      const nxt = peek();
      if (nxt && !nxt.startsWith('-')) extras.push(t + ' ' + take());
      else extras.push(t);
    }
    else extras.push(t);
  }
  const ports = [];
  if (r.dport) ports.push(r.dport);
  if (r.sport) ports.push('src:' + r.sport);
  r.ports = ports.join(', ') || '';
  r.extra = extras.join(' ');
  return r;
}

function parseIptables(text){
  const lines = text.split(/\r?\n/);
  const out = [];
  let table = '';
  let lineNo = 0;
  for (const rawLine of lines) {
    lineNo++;
    const line = rawLine.trim();
    if (!line || line.startsWith('#')) continue;
    if (line.startsWith('*')) {
      table = line.slice(1).trim();
      continue;
    }
    if (line === 'COMMIT') { table = ''; continue; }
    // policy: :INPUT ACCEPT [0:0]
    const pol = line.match(/^:([^\s]+)\s+(\S+)(?:\s+\[(\d+):(\d+)\])?/);
    if (pol) {
      out.push(annotateFlags(emptyRule({
        format: 'iptables', table, chain: pol[1], hook: 'policy',
        action: pol[2], proto: '', ports: '', source: '', dest: '',
        extra: pol[3] != null ? 'pkts=' + pol[3] + ' bytes=' + (pol[4] || '0') : '',
        flags: [], line: lineNo, raw: rawLine, _policy: true
      })));
      continue;
    }
    if (line.startsWith('-A ') || line.startsWith('-I ') || line.startsWith('-D ')) {
      const tokens = tokenizeIptables(line);
      const op = tokens[0]; // -A / -I
      const chain = tokens[1] || '';
      let idx = 2;
      // -I CHAIN [rulenum]
      if (op === '-I' && tokens[2] && /^\d+$/.test(tokens[2])) idx = 3;
      const parsed = parseIptablesRuleTokens(tokens, idx);
      const ifaceExtra = [];
      if (parsed.inIface) ifaceExtra.push('in=' + parsed.inIface);
      if (parsed.outIface) ifaceExtra.push('out=' + parsed.outIface);
      out.push(annotateFlags(emptyRule({
        format: 'iptables', table, chain, hook: '',
        action: parsed.action, proto: parsed.proto, ports: parsed.ports,
        source: parsed.source, dest: parsed.dest,
        inIface: parsed.inIface, outIface: parsed.outIface,
        extra: [ifaceExtra.join(' '), parsed.extra].filter(Boolean).join(' '),
        flags: [], line: lineNo, raw: rawLine
      })));
    }
  }
  return out;
}

/* ---------- nftables (best-effort brace depth) ---------- */
function parseNftables(text){
  const out = [];
  // Normalize: keep structure but process line-oriented with brace depth
  const lines = text.split(/\r?\n/);
  let table = '', tableFamily = '';
  let chain = '', hook = '', chainPolicy = '';
  let depth = 0;
  let lineNo = 0;
  let inTable = false, inChain = false;

  function flushChainPolicy(ln){
    if (chainPolicy && chain) {
      out.push(annotateFlags(emptyRule({
        format: 'nftables', table: tableFamily ? (tableFamily + ' ' + table) : table,
        chain, hook: hook || 'policy', action: chainPolicy, proto: '', ports: '',
        source: '', dest: '', extra: 'chain policy', flags: [], line: ln, raw: 'policy ' + chainPolicy,
        _policy: true
      })));
    }
  }

  for (const rawLine of lines) {
    lineNo++;
    let line = rawLine.replace(/#.*$/, '').trim();
    if (!line) {
      // still count braces on original? skip
      continue;
    }
    // count braces on this line for depth
    const opens = (line.match(/\{/g) || []).length;
    const closes = (line.match(/\}/g) || []).length;

    // table inet filter {
    const tm = line.match(/^table\s+(inet|ip|ip6|bridge|netdev|arp)\s+(\S+)/i) ||
               line.match(/^table\s+(\S+)\s*\{?/);
    if (/^table\s+/i.test(line) && tm) {
      if (tm.length >= 3 && /^(inet|ip|ip6|bridge|netdev|arp)$/i.test(tm[1])) {
        tableFamily = tm[1]; table = tm[2].replace(/\{$/, '');
      } else {
        tableFamily = ''; table = (tm[1] || '').replace(/\{$/, '');
      }
      inTable = true; chain = ''; hook = ''; chainPolicy = '';
      depth += opens - closes;
      continue;
    }

    // chain NAME {
    const cm = line.match(/^chain\s+(\S+)/i);
    if (cm && inTable) {
      flushChainPolicy(lineNo);
      chain = cm[1].replace(/\{$/, '');
      hook = ''; chainPolicy = '';
      inChain = true;
      // same line may have type/hook/policy
    }

    // type filter hook input priority filter; policy drop;
    if (inChain) {
      const hm = line.match(/type\s+(\S+)\s+hook\s+(\S+)/i);
      if (hm) hook = hm[2];
      const pm = line.match(/policy\s+(\S+)\s*;/i);
      if (pm) {
        chainPolicy = pm[1].replace(/;$/, '');
        // emit policy row once when we see it
        out.push(annotateFlags(emptyRule({
          format: 'nftables',
          table: tableFamily ? (tableFamily + ' ' + table) : table,
          chain, hook: hook || 'policy', action: chainPolicy.toUpperCase(),
          proto: '', ports: '', source: '', dest: '', extra: 'chain policy',
          flags: [], line: lineNo, raw: rawLine.trim(), _policy: true
        })));
        chainPolicy = ''; // already emitted
      }
    }

    // closing braces
    if (closes && !opens) {
      // leaving scopes
    }
    depth += opens - closes;
    if (depth < 0) depth = 0;

    // detect leaving chain/table by brace — approximate: if line is just }
    if (/^\}/.test(line)) {
      if (inChain && depth <= 1) { inChain = false; chain = ''; hook = ''; }
      if (inTable && depth <= 0) { inTable = false; table = ''; tableFamily = ''; }
      continue;
    }

    // Skip structural lines
    if (/^table\s+/i.test(line) || /^chain\s+/i.test(line)) continue;
    if (/type\s+\S+\s+hook/i.test(line) && /policy\s+/i.test(line)) continue;
    if (/^type\s+/i.test(line) || /^policy\s+/i.test(line) || /^hook\s+/i.test(line)) continue;
    if (!inChain || !chain) continue;
    // Skip empty / comment-only already handled
    if (line === '{' || line === '}') continue;

    // Rule line — strip trailing ;
    const ruleLine = line.replace(/;\s*$/, '').trim();
    if (!ruleLine || ruleLine === '{') continue;

    const parsed = parseNftRule(ruleLine);
    out.push(annotateFlags(emptyRule({
      format: 'nftables',
      table: tableFamily ? (tableFamily + ' ' + table) : table,
      chain, hook: hook || '',
      action: parsed.action, proto: parsed.proto, ports: parsed.ports,
      source: parsed.source, dest: parsed.dest,
      inIface: parsed.inIface, outIface: parsed.outIface,
      extra: parsed.extra, flags: [], line: lineNo, raw: rawLine.trim()
    })));
  }
  return out;
}

function parseNftRule(line){
  const r = { action: '', proto: '', ports: '', source: '', dest: '', inIface: '', outIface: '', extra: '' };
  const extras = [];
  // verdict at end
  const verd = line.match(/\b(accept|drop|reject|continue|return|jump\s+\S+|goto\s+\S+|log(?:\s+prefix\s+\S+)?|masquerade|snat\s+to\s+\S+|dnat\s+to\s+\S+|redirect(?:\s+to\s+\S+)?)\s*$/i);
  if (verd) {
    r.action = verd[1].replace(/\s+/g, ' ').toUpperCase().replace(/^JUMP /, 'JUMP:').replace(/^GOTO /, 'GOTO:');
    if (/^MASQUERADE$/i.test(verd[1])) r.action = 'MASQUERADE';
    if (/^DNAT\s+/i.test(verd[1])) r.action = 'DNAT';
    if (/^SNAT\s+/i.test(verd[1])) r.action = 'SNAT';
    if (/^ACCEPT$/i.test(verd[1])) r.action = 'ACCEPT';
    if (/^DROP$/i.test(verd[1])) r.action = 'DROP';
    if (/^REJECT$/i.test(verd[1])) r.action = 'REJECT';
    if (/^RETURN$/i.test(verd[1])) r.action = 'RETURN';
    if (/^LOG/i.test(verd[1])) r.action = 'LOG';
  }

  // proto
  if (/\btcp\b/i.test(line)) r.proto = 'tcp';
  else if (/\budp\b/i.test(line)) r.proto = 'udp';
  else if (/\bicmpv6\b/i.test(line)) r.proto = 'icmpv6';
  else if (/\bicmp\b/i.test(line)) r.proto = 'icmp';
  else if (/\bsctp\b/i.test(line)) r.proto = 'sctp';

  function extractAddr(kind){
    // ip saddr 1.2.3.4  | ip saddr { 1.2.3.4, 5.6.7.8 } | ip6 saddr ::/0
    const re = new RegExp('(?:ip6?|ip)\\s+' + kind + '\\s+(\\{[^}]+\\}|\\S+)', 'i');
    const m = line.match(re);
    if (!m) return '';
    return m[1].replace(/[{}]/g, '').replace(/\s+/g, ' ').trim();
  }
  r.source = extractAddr('saddr');
  r.dest = extractAddr('daddr');

  // ports: tcp dport 22 | tcp dport { 22, 80 } | th dport
  function extractPort(kind){
    const re = new RegExp('(?:tcp|udp|sctp|th)\\s+' + kind + '\\s+(\\{[^}]+\\}|\\S+)', 'i');
    const m = line.match(re);
    if (!m) return '';
    return m[1].replace(/[{}]/g, '').replace(/\s+/g, ' ').trim();
  }
  const dport = extractPort('dport');
  const sport = extractPort('sport');
  const ports = [];
  if (dport) ports.push(dport);
  if (sport) ports.push('src:' + sport);
  r.ports = ports.join(', ');

  // interfaces
  const iif = line.match(/\biif(?:name)?\s+(\S+)/i);
  const oif = line.match(/\boif(?:name)?\s+(\S+)/i);
  if (iif) r.inIface = iif[1];
  if (oif) r.outIface = oif[1];

  // ct state
  const ct = line.match(/\bct\s+state\s+(\{[^}]+\}|\S+)/i);
  if (ct) extras.push('ct state ' + ct[1].replace(/[{}]/g, '').trim());
  // meta
  if (/\bmeta\b/i.test(line)) extras.push('meta');

  r.extra = extras.join('; ');
  if (!r.action) {
    // last word heuristic
    const parts = line.split(/\s+/);
    const last = parts[parts.length - 1] || '';
    if (/^(accept|drop|reject|return|continue)$/i.test(last)) r.action = last.toUpperCase();
  }
  return r;
}

/* ---------- UFW status ---------- */
function parseUfw(text){
  const out = [];
  const lines = text.split(/\r?\n/);
  let lineNo = 0;
  let inRules = false;
  let defaultPolicy = '';

  for (const rawLine of lines) {
    lineNo++;
    const line = rawLine.trim();
    if (!line) continue;

    // Default: deny (incoming), allow (outgoing), disabled (routed)
    const def = line.match(/^Default:\s*(.+)/i);
    if (def) {
      defaultPolicy = def[1];
      // synthesize policy rows
      const parts = def[1].split(',');
      for (const p of parts) {
        const m = p.trim().match(/^(deny|allow|reject|disabled)\s*\((incoming|outgoing|routed)\)/i);
        if (m) {
          out.push(annotateFlags(emptyRule({
            format: 'ufw', table: 'ufw', chain: m[2].toUpperCase(),
            hook: 'policy', action: m[1].toUpperCase(),
            proto: '', ports: '', source: '', dest: '',
            extra: 'default policy', flags: [], line: lineNo, raw: rawLine, _policy: true
          })));
        }
      }
      continue;
    }

    // Header: To Action From  OR  [--] To Action From
    if (/^(-+\s*)?To\s+Action\s+From/i.test(line) || /^\[\s*#\s*\]\s*To\s+Action/i.test(line)) {
      inRules = true;
      continue;
    }
    if (/^Status:/i.test(line) || /^Logging:/i.test(line) || /^Default:/i.test(line)) continue;
    if (!inRules && !/^\s*\[\s*\d+\s*\]/.test(line) && !/^\S+\s+(ALLOW|DENY|REJECT)\s+/i.test(line)) continue;
    inRules = true;

    // Numbered: [ 1] Anywhere ALLOW IN 22/tcp
    //           [ 2] 22/tcp ALLOW IN Anywhere
    // Classic:  22/tcp ALLOW IN Anywhere
    //           Anywhere DENY IN 10.0.0.0/8
    // Out:      53 ALLOW OUT Anywhere on eth0

    let num = '';
    let rest = line;
    const nm = line.match(/^\[\s*(\d+)\s*\]\s*(.*)$/);
    if (nm) { num = nm[1]; rest = nm[2]; }

    // Skip (v6) duplicate markers handled as part of To field
    // Patterns vary. Try: <to> <ACTION> <DIR> <from> [on iface]
    const m = rest.match(/^(.+?)\s+(ALLOW|DENY|REJECT|LIMIT)\s+(IN|OUT|FWD)?\s*(.*)$/i);
    if (!m) continue;
    let toField = m[1].trim();
    const action = m[2].toUpperCase();
    const dir = (m[3] || 'IN').toUpperCase();
    let fromField = (m[4] || '').trim();
    let iface = '';
    const onm = fromField.match(/\bon\s+(\S+)\s*$/i);
    if (onm) { iface = onm[1]; fromField = fromField.replace(/\bon\s+\S+\s*$/i, '').trim(); }
    // Sometimes "Anywhere on eth0" is in To
    const onTo = toField.match(/\bon\s+(\S+)\s*$/i);
    if (onTo) { iface = iface || onTo[1]; toField = toField.replace(/\bon\s+\S+\s*$/i, '').trim(); }

    // Extract port/proto from To (or sometimes From for unusual rules)
    let ports = '', proto = '', dest = '', source = '';
    function splitAddrPort(field){
      // "22/tcp", "Anywhere", "1.2.3.4 22/tcp", "22,80/tcp", "Anywhere (v6)"
      field = field.replace(/\s*\(v6\)\s*/i, '').trim();
      if (/^anywhere$/i.test(field) || /^any$/i.test(field)) return { addr: 'Anywhere', ports: '', proto: '' };
      const mpm = field.match(/^(\d+(?:[,:\-]\d+)*)\/(tcp|udp|any|icmp)$/i);
      if (mpm) return { addr: '', ports: mpm[1], proto: mpm[2].toLowerCase() };
      const ap = field.match(/^(\S+)\s+(\d+(?:[,:\-]\d+)*)\/(tcp|udp|any)$/i);
      if (ap) return { addr: ap[1], ports: ap[2], proto: ap[3].toLowerCase() };
      const justPort = field.match(/^(\d+(?:[,:\-]\d+)*)$/);
      if (justPort) return { addr: '', ports: justPort[1], proto: '' };
      return { addr: field, ports: '', proto: '' };
    }
    const toP = splitAddrPort(toField);
    const fromP = splitAddrPort(fromField);
    // UFW status: "To" column is local port (IN) or remote dest port; "From" is peer address.
    // For IN: To=local port/addr, From=source. For OUT: To=local port, From=destination.
    if (toP.ports) { ports = toP.ports; proto = toP.proto; }
    else if (toP.addr && !/^anywhere$/i.test(toP.addr) && !/^any$/i.test(toP.addr)) {
      // To may be an address (e.g. DENY to a host)
      if (dir === 'OUT') dest = toP.addr;
      else dest = toP.addr;
    }
    if (fromP.ports && !ports) { ports = fromP.ports; proto = proto || fromP.proto; }
    const peer = fromP.addr || fromField || 'Anywhere';
    if (dir === 'OUT') {
      source = '';
      dest = dest || peer;
    } else {
      source = peer;
      // dest stays local / empty unless To had an address
    }

    out.push(annotateFlags(emptyRule({
      format: 'ufw', table: 'ufw', chain: dir, hook: dir === 'OUT' ? 'output' : 'input',
      action, proto, ports, source, dest,
      inIface: dir !== 'OUT' ? iface : '', outIface: dir === 'OUT' ? iface : '',
      extra: num ? '#' + num : '', flags: [], line: lineNo, raw: rawLine
    })));
  }
  return out;
}

/* ---------- firewalld XML ---------- */
function parseFirewalld(text){
  const out = [];
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  const err = doc.querySelector('parsererror');
  if (err) throw new Error('Invalid XML: ' + (err.textContent || '').slice(0, 200));

  // Could be <zone> root, or <zones><zone>, or direct zone file
  let zones = Array.from(doc.getElementsByTagName('zone'));
  if (!zones.length && doc.documentElement && doc.documentElement.tagName.toLowerCase() === 'zone') {
    zones = [doc.documentElement];
  }
  // Also support <service> standalone files lightly
  if (!zones.length) {
    const services = Array.from(doc.getElementsByTagName('service'));
    if (services.length) {
      for (const svc of services) {
        const name = svc.getAttribute('name') || (svc.getElementsByTagName('short')[0] || {}).textContent || 'service';
        for (const p of Array.from(svc.getElementsByTagName('port'))) {
          out.push(annotateFlags(emptyRule({
            format: 'firewalld', table: 'service', chain: name,
            action: 'ALLOW', proto: p.getAttribute('protocol') || '',
            ports: p.getAttribute('port') || '', source: '', dest: '',
            extra: 'service port', flags: [], line: 0, raw: p.outerHTML
          })));
        }
      }
      return out;
    }
  }
  if (!zones.length) throw new Error('No <zone> or <service> elements found in firewalld XML.');

  let lineApprox = 0;
  for (const zone of zones) {
    lineApprox++;
    const zname = zone.getAttribute('name') ||
      ((zone.getElementsByTagName('short')[0] || {}).textContent) || 'zone';
    const target = (zone.getAttribute('target') || 'default').toUpperCase();
    // policy/target row
    out.push(annotateFlags(emptyRule({
      format: 'firewalld', table: 'zone', chain: zname, hook: 'target',
      action: target === '%%REJECT%%' ? 'REJECT' : target,
      proto: '', ports: '', source: '', dest: '',
      extra: 'zone target', flags: [], line: lineApprox, raw: '<zone name="' + zname + '" target="' + target + '">',
      _policy: true
    })));

    function addRow(partial){
      lineApprox++;
      out.push(annotateFlags(emptyRule(Object.assign({
        format: 'firewalld', table: 'zone', chain: zname, hook: '',
        action: 'ALLOW', proto: '', ports: '', source: '', dest: '',
        extra: '', flags: [], line: lineApprox, raw: ''
      }, partial))));
    }

    for (const p of Array.from(zone.getElementsByTagName('port'))) {
      // only direct children-ish — getElementsByTagName is deep; skip if inside <rule>
      if (p.closest && p.closest('rule')) continue;
      addRow({
        action: 'ALLOW', proto: p.getAttribute('protocol') || '',
        ports: p.getAttribute('port') || '', source: '', dest: '',
        extra: 'port', raw: p.outerHTML
      });
    }
    for (const s of Array.from(zone.getElementsByTagName('service'))) {
      if (s.closest && s.closest('rule') && s.parentElement && s.parentElement.tagName.toLowerCase() === 'rule') continue;
      // zone-level <service name="ssh"/>
      if (s.parentElement && s.parentElement.tagName.toLowerCase() !== 'zone' &&
          s.parentElement.tagName.toLowerCase() !== 'source') {
        // might be nested; still include zone-level services
        if (!s.getAttribute('name')) continue;
      }
      const sname = s.getAttribute('name');
      if (!sname) continue;
      if (s.parentElement && s.parentElement.tagName.toLowerCase() === 'rule') continue;
      addRow({
        action: 'ALLOW', proto: '', ports: sname, source: '', dest: '',
        extra: 'service', raw: s.outerHTML
      });
    }
    for (const src of Array.from(zone.getElementsByTagName('source'))) {
      if (src.closest && src.closest('rule')) continue;
      if (src.parentElement && src.parentElement.tagName.toLowerCase() !== 'zone') continue;
      addRow({
        action: 'ALLOW', proto: '', ports: '', source: src.getAttribute('address') || src.getAttribute('mac') || src.getAttribute('ipset') || '',
        dest: '', extra: 'source', raw: src.outerHTML
      });
    }
    for (const fp of Array.from(zone.getElementsByTagName('forward-port'))) {
      addRow({
        action: 'DNAT',
        proto: fp.getAttribute('protocol') || '',
        ports: fp.getAttribute('port') || '',
        source: '', dest: (fp.getAttribute('to-addr') || '') + (fp.getAttribute('to-port') ? (':' + fp.getAttribute('to-port')) : ''),
        extra: 'forward-port', raw: fp.outerHTML
      });
    }
    for (const rule of Array.from(zone.getElementsByTagName('rule'))) {
      const family = rule.getAttribute('family') || '';
      let action = 'ALLOW';
      if (rule.getElementsByTagName('accept').length) action = 'ACCEPT';
      else if (rule.getElementsByTagName('drop').length) action = 'DROP';
      else if (rule.getElementsByTagName('reject').length) action = 'REJECT';
      else if (rule.getElementsByTagName('masquerade').length) action = 'MASQUERADE';
      else if (rule.getElementsByTagName('forward-port').length) action = 'DNAT';

      let source = '', dest = '', proto = '', ports = '';
      const srcEl = rule.getElementsByTagName('source')[0];
      if (srcEl) source = srcEl.getAttribute('address') || srcEl.getAttribute('mac') || '';
      const dstEl = rule.getElementsByTagName('destination')[0];
      if (dstEl) dest = dstEl.getAttribute('address') || '';
      const portEl = rule.getElementsByTagName('port')[0];
      if (portEl) {
        ports = portEl.getAttribute('port') || '';
        proto = portEl.getAttribute('protocol') || '';
      }
      const protoEl = rule.getElementsByTagName('protocol')[0];
      if (protoEl && !proto) proto = protoEl.getAttribute('value') || protoEl.textContent || '';
      const svcEl = rule.getElementsByTagName('service')[0];
      if (svcEl && svcEl.getAttribute('name')) ports = ports || svcEl.getAttribute('name');
      const icmpEl = rule.getElementsByTagName('icmp-block')[0] || rule.getElementsByTagName('icmp-type')[0];
      if (icmpEl) { proto = 'icmp'; ports = icmpEl.getAttribute('name') || ports; }

      addRow({
        action, proto, ports, source, dest,
        extra: ['rule', family].filter(Boolean).join(' '),
        raw: rule.outerHTML
      });
    }
    // interfaces
    for (const iface of Array.from(zone.getElementsByTagName('interface'))) {
      if (iface.parentElement && iface.parentElement.tagName.toLowerCase() !== 'zone') continue;
      addRow({
        action: 'BIND', proto: '', ports: '', source: '', dest: '',
        inIface: iface.getAttribute('name') || '',
        extra: 'interface', raw: iface.outerHTML
      });
    }
  }
  return out;
}

/* ---------- detect ---------- */
function detectFormat(text){
  const t = text.trim();
  if (!t) return 'unknown';
  // firewalld XML
  if (/^\s*</.test(t) && /<(zone|service|firewall)\b/i.test(t)) return 'firewalld';
  // iptables-save
  if (/^\s*\*(filter|nat|mangle|raw|security)\b/m.test(t) ||
      /^:INPUT\s+\S+/m.test(t) ||
      /^-[AI]\s+\S+/m.test(t) && /\-j\s+\S+/m.test(t)) return 'iptables';
  // nftables
  if (/^\s*table\s+(inet|ip|ip6|bridge|netdev|arp)\s+\S+/m.test(t) ||
      /^\s*table\s+\S+\s*\{/m.test(t) ||
      /^\s*chain\s+\S+\s*\{/m.test(t) && /\b(accept|drop|reject)\b/m.test(t)) return 'nftables';
  // UFW
  if (/^Status:\s*(active|inactive)/im.test(t) ||
      /^\s*To\s+Action\s+From/m.test(t) ||
      /\[\s*\d+\s*\]\s+.+\s+(ALLOW|DENY|REJECT)\s+/m.test(t) ||
      /^Default:\s*(deny|allow|reject)/im.test(t)) return 'ufw';
  // soft fallbacks
  if (/iptables|ip6tables/i.test(t) && /^-[AI]\s+/m.test(t)) return 'iptables';
  if (/\b(iif|oif|saddr|daddr|dport)\b/.test(t)) return 'nftables';
  return 'unknown';
}

function parseAll(text, override){
  const fmt = (override && override !== 'auto') ? override : detectFormat(text);
  let result = [];
  switch (fmt) {
    case 'iptables': result = parseIptables(text); break;
    case 'nftables': result = parseNftables(text); break;
    case 'ufw': result = parseUfw(text); break;
    case 'firewalld': result = parseFirewalld(text); break;
    default: {
      // try each
      const attempts = [
        ['iptables', parseIptables],
        ['nftables', parseNftables],
        ['ufw', parseUfw]
      ];
      if (/^\s*</.test(text.trim())) attempts.unshift(['firewalld', parseFirewalld]);
      for (const [name, fn] of attempts) {
        try {
          const r = fn(text);
          if (r && r.length) { detectedFormat = name; return r; }
        } catch (e) { /* try next */ }
      }
      throw new Error('Unrecognized firewall dump. Expected iptables-save, nftables, UFW status, or firewalld zone XML. Use the format dropdown to force a parser.');
    }
  }
  detectedFormat = fmt;
  if (!result.length) throw new Error('Parsed as ' + fmt + ' but found 0 rules. Check format override or input content.');
  return result;
}

/* ---------- action filter categories ---------- */
function actionCategory(act){
  const a = String(act || '').toUpperCase();
  if (/ACCEPT|ALLOW|PASS/.test(a)) return 'accept';
  if (/^DROP|DENY/.test(a) || a === 'DROP' || a === 'DENY') return 'drop';
  if (/REJECT/.test(a)) return 'reject';
  if (/^LOG/.test(a)) return 'log';
  if (/MASQUERADE|DNAT|SNAT|REDIRECT|NAT/.test(a)) return 'nat';
  return 'other';
}

function actionClass(act){
  const c = actionCategory(act);
  if (c === 'accept') return 'action-accept';
  if (c === 'drop' || c === 'reject') return 'action-drop';
  return '';
}

/* ---------- UI ---------- */
function filtered(){
  const q = searchIn.value.trim().toLowerCase();
  const af = actionFilter.value;
  const cf = chainFilter.value;
  return rows.filter(r => {
    if (risksOnly && !hasRisk(r)) return false;
    if (af && actionCategory(r.action) !== af) return false;
    if (cf && r.chain !== cf) return false;
    if (!q) return true;
    const blob = [r.table, r.chain, r.hook, r.action, r.proto, r.ports, r.source, r.dest,
      r.inIface, r.outIface, r.extra, r.raw, (r.flags || []).map(f => f.l).join(' ')].join(' ').toLowerCase();
    return blob.includes(q);
  });
}

function rebuildChainFilter(){
  const chains = [...new Set(rows.map(r => r.chain).filter(Boolean))].sort();
  const cur = chainFilter.value;
  chainFilter.innerHTML = '<option value="">All chains</option>' +
    chains.map(c => '<option value="' + esc(c) + '">' + esc(c) + '</option>').join('');
  if (chains.includes(cur)) chainFilter.value = cur;
}

function showDetail(r){
  if (!r) { detailEl.classList.remove('show'); detailEl.innerHTML = ''; return; }
  const flagsHtml = (r.flags || []).map(f => '<span class="badge ' + f.t + '">' + esc(f.l) + '</span>').join(' ') || '—';
  const kv = [
    ['Format', r.format], ['Table', r.table], ['Chain', r.chain], ['Hook', r.hook],
    ['Action', r.action], ['Proto', r.proto], ['Ports', r.ports],
    ['Source', r.source], ['Dest', r.dest],
    ['In iface', r.inIface], ['Out iface', r.outIface],
    ['Extra', r.extra], ['Line', r.line], ['Flags', '']
  ];
  detailEl.innerHTML =
    '<div class="card"><h2>Rule detail</h2><div class="body">' +
    '<table class="kv">' + kv.map(([k, v]) => {
      if (k === 'Flags') return '<tr><td class="key">Flags</td><td>' + flagsHtml + '</td></tr>';
      return '<tr><td class="key">' + esc(k) + '</td><td class="mono">' + esc(v || '—') + '</td></tr>';
    }).join('') + '</table>' +
    '<div style="margin-top:12px;font-size:12px;color:#57606a">Raw</div>' +
    '<pre class="block">' + esc(r.raw) + '</pre>' +
    '</div></div>';
  detailEl.classList.add('show');
}

function draw(){
  const list = filtered();
  const drawList = list.slice(0, MAX_RENDER);
  tbody.innerHTML = '';
  selectedIdx = -1;
  for (let i = 0; i < drawList.length; i++) {
    const r = drawList[i];
    const tr = document.createElement('tr');
    if (hasRisk(r)) tr.classList.add('risk');
    const fl = (r.flags || []).map(f => '<span class="badge ' + f.t + '">' + esc(f.l) + '</span>').join(' ') || '—';
    const actCls = actionClass(r.action);
    tr.innerHTML =
      '<td>' + esc(r.table || '—') + '</td>' +
      '<td>' + esc(r.chain || '—') + '</td>' +
      '<td class="' + actCls + '">' + esc(r.action || '—') + '</td>' +
      '<td>' + esc(r.proto || '—') + '</td>' +
      '<td>' + esc(r.ports || '—') + '</td>' +
      '<td>' + esc(r.source || '—') + '</td>' +
      '<td>' + esc(r.dest || '—') + '</td>' +
      '<td>' + fl + '</td>' +
      '<td>' + esc(r.line || '') + '</td>';
    tr.addEventListener('click', () => {
      tbody.querySelectorAll('tr.selected').forEach(x => x.classList.remove('selected'));
      tr.classList.add('selected');
      selectedIdx = i;
      showDetail(r);
    });
    tbody.appendChild(tr);
  }
  const world = list.filter(r => (r.flags || []).some(f => f.l === 'world-open' || f.l.includes('world-open'))).length;
  const ssh = list.filter(r => (r.flags || []).some(f => /SSH world-open/i.test(f.l))).length;
  metaEl.textContent = list.length + ' rules · ' + detectedFormat +
    (world ? ' · ' + world + ' world-open' : '') +
    (ssh ? ' · ' + ssh + ' SSH-exposed' : '');
  noticeEl.style.display = list.length > MAX_RENDER ? 'block' : 'none';
  if (list.length > MAX_RENDER) noticeEl.textContent = 'Showing first ' + MAX_RENDER + ' of ' + list.length + ' filtered rows.';
}

function updateStats(){
  const world = rows.filter(r => (r.flags || []).some(f => f.l === 'world-open' || /world-open/i.test(f.l))).length;
  const ssh = rows.filter(r => (r.flags || []).some(f => /SSH world-open/i.test(f.l))).length;
  const policies = rows.filter(r => r._policy);
  const polSummary = policies.slice(0, 8).map(p => (p.chain || '?') + '=' + (p.action || '?')).join(', ') || '—';
  const dropInput = policies.filter(p => /INPUT/i.test(p.chain) && /DROP|REJECT|DENY/i.test(p.action)).length;
  statsEl.innerHTML =
    '<div class="stat"><b>' + esc(detectedFormat || '—') + '</b>format</div>' +
    '<div class="stat"><b>' + rows.length + '</b>rules</div>' +
    '<div class="stat"><b>' + world + '</b>world-open</div>' +
    '<div class="stat"><b>' + ssh + '</b>SSH-exposed</div>' +
    '<div class="stat"><b>' + policies.length + '</b>policies' +
      (dropInput ? ' <span class="badge ok">INPUT DROP/REJECT</span>' : '') +
      '<div class="hint" style="margin-top:4px;max-width:280px">' + esc(polSummary) + '</div></div>';
}

function render(text, name){
  showLoading('Parsing firewall rules…');
  afterPaint(() => {
    try {
      if (!text || !String(text).trim()) throw new Error('Empty input');
      lastText = String(text);
      rows = parseAll(lastText, fmtOverride.value);
      currentName = (name || 'firewall-rules').replace(/\.(txt|rules|nft|xml|ufw)$/i, '');
      fname.textContent = name || '(paste)';
      document.title = currentName + ' — KSI Tools Firewall Rules';
      drop.style.display = 'none';
      tableWrap.style.display = 'block';
      clearError();
      searchIn.disabled = false;
      actionFilter.disabled = false;
      chainFilter.disabled = false;
      risksOnlyBtn.disabled = false;
      Object.values(btns).forEach(b => b.disabled = false);
      rebuildChainFilter();
      updateStats();
      noticeEl.style.display = 'block';
      noticeEl.textContent = 'Heuristic risk flags only (world-open, SSH/RDP/telnet/SMB). Offline review — not a live firewall evaluation.';
      showDetail(null);
      draw();
    } catch (e) {
      showError(e.message || String(e));
    }
    hideLoading();
  });
}

function loadFile(file){
  if (!file) return;
  if (file.size > MAX_BYTES) { showError('File too large (max 25 MB)'); return; }
  showLoading('Reading file…');
  const r = new FileReader();
  r.onload = () => render(String(r.result || ''), file.name);
  r.onerror = () => { hideLoading(); showError('Failed to read file'); };
  r.readAsText(file);
}

wireDrop(loadFile);
document.getElementById('goBtn').onclick = () => render(pasteEl.value, '(paste)');
searchIn.oninput = draw;
actionFilter.onchange = draw;
chainFilter.onchange = draw;
risksOnlyBtn.onclick = () => {
  risksOnly = !risksOnly;
  risksOnlyBtn.classList.toggle('toggle-on', risksOnly);
  draw();
};
fmtOverride.onchange = () => {
  const text = lastText || pasteEl.value;
  if (text && String(text).trim()) render(text, fname.textContent || '(paste)');
};

btns.copy.onclick = async () => {
  const list = filtered();
  const risky = list.filter(hasRisk);
  const lines = [];
  lines.push('KSI Tools Firewall Rules — summary');
  lines.push('Format: ' + detectedFormat);
  lines.push('Total (filtered): ' + list.length);
  lines.push('World-open / risky: ' + risky.length);
  lines.push('SSH world-open: ' + risky.filter(r => (r.flags || []).some(f => /SSH world-open/i.test(f.l))).length);
  const policies = list.filter(r => r._policy);
  if (policies.length) {
    lines.push('Policies:');
    for (const p of policies) lines.push('  ' + p.chain + ' => ' + p.action + (p.table ? ' [' + p.table + ']' : ''));
  }
  lines.push('');
  lines.push('Risky rules:');
  if (!risky.length) lines.push('  (none)');
  for (const r of risky.slice(0, 500)) {
    lines.push('  L' + r.line + ' ' + r.chain + ' ' + r.action + ' ' + (r.proto || '') + ' ' + (r.ports || '') +
      ' src=' + (r.source || '') + ' dst=' + (r.dest || '') +
      ' [' + (r.flags || []).map(f => f.l).join(', ') + ']');
    lines.push('    ' + r.raw);
  }
  try {
    await navigator.clipboard.writeText(lines.join('\n'));
  } catch (e) {
    download(currentName + '-summary.txt', lines.join('\n'), 'text/plain');
  }
};

btns.savejson.onclick = () => {
  const list = filtered().map(r => ({
    format: r.format, table: r.table, chain: r.chain, hook: r.hook,
    action: r.action, proto: r.proto, ports: r.ports, source: r.source, dest: r.dest,
    inIface: r.inIface, outIface: r.outIface, extra: r.extra,
    flags: (r.flags || []).map(f => f.l), line: r.line, raw: r.raw
  }));
  download(currentName + '.json', JSON.stringify(list, null, 2), 'application/json');
};

btns.savecsv.onclick = () => {
  const keys = ['format','table','chain','hook','action','proto','ports','source','dest','inIface','outIface','extra','flags','line','raw'];
  const list = filtered();
  const lines = [keys.join(',')].concat(list.map(r => keys.map(k => {
    if (k === 'flags') return csvEsc((r.flags || []).map(f => f.l).join('|'));
    return csvEsc(r[k]);
  }).join(',')));
  download(currentName + '.csv', lines.join('\n'), 'text/csv');
};

})();
</script>
</body>
