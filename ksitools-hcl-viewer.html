<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KSI Tools HCL Viewer</title>
<style id="appcss">
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:15px; line-height:1.5; background:#fff; color:#1f2328; }
header.bar { position:sticky; top:0; z-index:20; display:flex; gap:6px; align-items:center; padding:8px 14px; background:#f6f8fa; border-bottom:1px solid #d0d7de; flex-wrap:wrap; }
header.bar h1 { font-size:14px; margin:0; font-weight:600; white-space:nowrap; }
header.bar .fname { color:#57606a; font-size:12px; flex:1; min-width:60px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
button, select, input[type=text] { font:inherit; font-size:12px; padding:5px 10px; border:1px solid #d0d7de; border-radius:6px; background:#fff; color:#1f2328; }
button { cursor:pointer; } button:hover { background:#f3f4f6; } button:disabled { opacity:.45; cursor:default; }
#search { width:200px; }
#drop { max-width:960px; margin:32px auto 16px; padding:48px 24px; text-align:center; border:2px dashed #d0d7de; border-radius:12px; color:#57606a; cursor:pointer; }
#drop.hover { border-color:#0969da; background:rgba(9,105,218,.05); color:#0969da; }
#drop strong { display:block; font-size:18px; margin-bottom:6px; color:#1f2328; }
.hint { color:#8b949e; font-size:12px; }
.chips { max-width:960px; margin:0 auto 8px; padding:0 14px; display:none; flex-wrap:wrap; gap:8px; }
.chip { display:inline-flex; flex-direction:column; background:#f6f8fa; border:1px solid #d0d7de; border-radius:8px; padding:6px 12px; min-width:80px; }
.chip .cv { font-size:18px; font-weight:700; line-height:1.2; color:#1f2328; }
.chip .cl { font-size:11px; color:#57606a; }
.hist { max-width:960px; margin:0 auto 8px; padding:0 14px; display:none; flex-wrap:wrap; gap:8px; }
.hbox { background:#f6f8fa; border:1px solid #d0d7de; border-radius:8px; padding:8px 12px; min-width:200px; max-width:280px; }
.hbox h3 { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:#57606a; margin:0 0 6px; }
.hrow { display:flex; align-items:center; gap:6px; margin-bottom:3px; font-size:12px; }
.hrow .hbar { flex:1; height:8px; background:#0969da; border-radius:4px; opacity:.7; min-width:2px; }
.hrow .hlabel { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:140px; color:#57606a; }
.hrow .hcount { color:#1f2328; font-weight:600; white-space:nowrap; }
.notice { max-width:960px; margin:0 auto 6px; padding:6px 14px; font-size:12px; background:#ddf4ff; color:#0969da; border-radius:6px; display:none; }
.table-wrap { overflow:auto; padding-bottom:60px; display:none; }
table.grid { border-collapse:collapse; width:100%; font-size:12px; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; }
.grid th { position:sticky; top:42px; background:#f6f8fa; text-align:left; padding:7px 10px; border-bottom:1px solid #d0d7de; white-space:nowrap; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:#57606a; }
.grid td { padding:5px 10px; border-bottom:1px solid #f0f2f4; vertical-align:top; word-break:break-word; }
.grid tr:hover td { background:rgba(175,184,193,.12); }
.grid tr.selected td { background:rgba(9,105,218,.1); }
.badge { display:inline-block; font-size:10px; font-weight:600; padding:1px 6px; border-radius:999px; border:1px solid #d0d7de; white-space:nowrap; }
.badge.res { background:#ddf4ff; border-color:#54aeff; color:#0969da; }
.badge.mod { background:#fff8c5; border-color:#f0c000; color:#7a5c00; }
.badge.var { background:#dafbe1; border-color:#4ac26b; color:#1a7f37; }
.badge.out { background:#ffd8b2; border-color:#e0900e; color:#7a5500; }
.badge.prv { background:#ffebe9; border-color:#ff8182; color:#cf222e; }
.badge.tf  { background:#f3f4f6; border-color:#8c959f; color:#57606a; }
.badge.dat { background:#ebe5ff; border-color:#a371f7; color:#6e40c9; }
.badge.gray { background:#f6f8fa; border-color:#d0d7de; color:#57606a; }
.detail-wrap { max-width:960px; margin:0 auto; padding:0 14px 40px; display:none; }
.card { border:1px solid #d0d7de; border-radius:10px; margin-bottom:10px; overflow:hidden; }
.card-h { margin:0; padding:8px 14px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; background:#f6f8fa; border-bottom:1px solid #d0d7de; color:#57606a; }
.card-body { padding:10px 14px; }
pre.block { margin:0; padding:10px 12px; background:#f6f8fa; border-radius:8px; white-space:pre-wrap; word-break:break-word; max-height:40vh; overflow:auto; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:12px; }
table.kv { border-collapse:collapse; width:100%; font-size:12px; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; }
.kv td { padding:3px 8px; border-bottom:1px solid #f0f2f4; vertical-align:top; }
.kv td.k { color:#0550ae; width:1%; white-space:nowrap; font-weight:600; }
.paste-area { max-width:960px; margin:0 auto 16px; padding:0 14px; display:none; }
.paste-area label { font-size:12px; color:#57606a; display:block; margin-bottom:4px; }
textarea#paste { width:100%; min-height:80px; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:12px; padding:8px; border:1px solid #d0d7de; border-radius:8px; resize:vertical; }
#err { max-width:960px; margin:20px auto; padding:14px 18px; border:1px solid #cf222e; border-radius:10px; background:rgba(207,34,46,.06); color:#cf222e; font-family:ui-monospace,monospace; font-size:12.5px; white-space:pre-wrap; display:none; }
#loading { position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; background:rgba(255,255,255,.72); }
#loading.show { display:flex; }
.spinner { width:38px; height:38px; border:4px solid #d0d7de; border-top-color:#0969da; border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
@media (prefers-color-scheme: dark) {
  body { background:#0d1117; color:#e6edf3; }
  header.bar { background:#161b22; border-bottom-color:#30363d; }
  header.bar .fname, .hint { color:#8b949e; }
  button, select, input[type=text], textarea#paste { background:#21262d; color:#e6edf3; border-color:#30363d; }
  button:hover { background:#30363d; }
  #drop { border-color:#30363d; color:#8b949e; } #drop strong { color:#e6edf3; }
  #drop.hover { border-color:#4493f8; color:#4493f8; }
  .chip, .hbox { background:#161b22; border-color:#30363d; }
  .chip .cv { color:#e6edf3; } .chip .cl { color:#8b949e; }
  .hbox h3 { color:#8b949e; } .hrow .hlabel { color:#8b949e; } .hrow .hcount { color:#e6edf3; }
  .notice { background:#121d2f; color:#58a6ff; }
  .grid th { background:#161b22; border-bottom-color:#30363d; color:#8b949e; }
  .grid td { border-bottom-color:#21262d; }
  .grid tr:hover td { background:rgba(110,118,129,.12); }
  .grid tr.selected td { background:rgba(31,111,235,.2); }
  .badge { border-color:#30363d; }
  .badge.res { background:#121d2f; border-color:#1f6feb; color:#58a6ff; }
  .badge.mod { background:#3a2f00; border-color:#b58900; color:#e3b341; }
  .badge.var { background:#12261e; border-color:#238636; color:#3fb950; }
  .badge.out { background:#3d2800; border-color:#c87a00; color:#e3a046; }
  .badge.prv { background:#3d1418; border-color:#f85149; color:#ff7b72; }
  .badge.tf  { background:#21262d; border-color:#30363d; color:#8b949e; }
  .badge.dat { background:#2d1f66; border-color:#7a42f7; color:#b490ff; }
  .badge.gray { background:#21262d; border-color:#30363d; color:#8b949e; }
  .card { border-color:#30363d; }
  .card-h { background:#161b22; border-bottom-color:#30363d; color:#8b949e; }
  pre.block { background:#161b22; }
  .kv td { border-bottom-color:#21262d; } .kv td.k { color:#79c0ff; }
  #err { border-color:#f85149; color:#ff7b72; background:rgba(248,81,73,.08); }
  #loading { background:rgba(13,17,23,.75); }
  .spinner { border-color:#30363d; border-top-color:#4493f8; }
}
</style>
</head>
<body>

<header class="bar">
  <h1>KSI Tools HCL Viewer</h1>
  <span class="fname" id="fname"></span>
  <input type="text" id="search" placeholder="kind / type / label…" disabled>
  <select id="kindSel" disabled><option value="">All kinds</option></select>
  <button id="copy" disabled>Copy JSON</button>
  <button id="pick" onclick="document.getElementById('file').click()">Open file</button>
</header>
<input type="file" id="file" accept=".tf,.hcl,.tfvars,.tofu,.tf.json,.txt" style="display:none">

<div id="drop">
  <strong>Drop Terraform / OpenTofu HCL here</strong>
  <div class="hint" style="margin-top:8px">Accepts .tf · .hcl · .tfvars · .tofu · .tf.json. Block outline — not a full HCL interpreter. <b>Nothing is uploaded.</b></div>
  <div class="hint" style="margin-top:4px">Tip: for <code>.terraform.lock.hcl</code> use the <a href="ksitools-terraform-lock-viewer.html" style="color:inherit">Terraform Lock Viewer</a>.</div>
</div>

<div class="paste-area" id="pasteArea">
  <label>Or paste HCL:</label>
  <textarea id="paste" placeholder='resource "aws_s3_bucket" "logs" { ... }'></textarea>
  <button id="pasteBtn" style="margin-top:6px">Parse</button>
</div>

<div id="err"></div>
<div class="chips" id="chips"></div>
<div class="hist" id="hist"></div>
<div class="notice" id="notice"></div>

<div class="table-wrap" id="tablewrap">
  <table class="grid">
    <thead>
      <tr>
        <th>#</th>
        <th>Kind</th>
        <th>Type</th>
        <th>Name / Labels</th>
        <th>Lines</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<div class="detail-wrap" id="detailWrap"></div>
<div id="loading"><div class="spinner"></div></div>

<script>
// ===PARSER-START===
const HCL_BLOCK_KINDS = new Set(['resource','data','module','variable','output','provider','terraform','locals','moved','import','check','ephemeral']);

function parseHclOutline(text) {
  const lines = text.split(/\r\n|\n|\r/);
  const blocks = [];

  let i = 0;
  while (i < lines.length) {
    const raw = lines[i];
    const line = raw.replace(/^\s+/, '');
    if (!line || line.startsWith('#') || line.startsWith('//')) { i++; continue; }

    const m = line.match(/^(resource|data|module|variable|output|provider|terraform|locals|moved|import|check|ephemeral)\b(.*)$/);
    if (!m) { i++; continue; }

    const kind = m[1];

    // Scan forward to collect labels and find the opening brace
    let headerText = line;
    let j = i;
    while (j < lines.length && !headerText.includes('{')) {
      j++;
      if (j < lines.length) headerText += ' ' + lines[j].trim();
      if (j > i + 5) break;
    }

    // Extract quoted labels before the first {
    const before = headerText.split('{')[0];
    const kindRemoved = before.replace(new RegExp('^\\s*' + kind + '\\b'), '');
    const labels = [];
    const qre = /"((?:\\.|[^"\\])*)"/g;
    let qm;
    while ((qm = qre.exec(kindRemoved))) labels.push(qm[1]);

    // Track brace depth to find the closing line
    let depth = 0, end = i;
    for (let k = i; k < lines.length; k++) {
      const L = lines[k];
      let inStr = false, esc = false, strChar = '';
      for (let c = 0; c < L.length; c++) {
        const ch = L[c];
        if (inStr) {
          if (esc) { esc = false; continue; }
          if (ch === '\\') { esc = true; continue; }
          if (ch === strChar) { inStr = false; }
          continue;
        }
        if (ch === '"' || ch === "'") { inStr = true; strChar = ch; continue; }
        if (ch === '#') break;
        if (ch === '/' && L[c + 1] === '/') break;
        if (ch === '{') depth++;
        else if (ch === '}') { depth--; if (depth === 0) { end = k; break; } }
      }
      if (depth === 0 && end > i) break;
    }

    const type = labels[0] || '';
    const name = labels[1] || labels[0] || '';
    const displayLabels = labels.length > 1 ? labels.join(' / ') : (labels[0] || '');

    blocks.push({
      i: blocks.length,
      kind,
      type,
      name: labels.length > 1 ? labels[1] : (labels[0] || ''),
      labels,
      displayLabels,
      startLine: i + 1,  // 1-indexed
      endLine: end + 1,
      lineCount: end - i + 1,
      snippet: lines.slice(i, Math.min(i + 8, end + 1)).join('\n'),
    });

    i = end > i ? end + 1 : i + 1;
  }

  const resourceTypes = [...new Set(blocks.filter(b => b.kind === 'resource').map(b => b.type))].sort();
  const summary = {
    total: blocks.length,
    byKind: Object.fromEntries(
      ['resource','data','module','variable','output','provider','terraform','locals','moved','import','check','ephemeral']
        .map(k => [k, blocks.filter(b => b.kind === k).length]).filter(([,n]) => n > 0)
    ),
    resourceTypes,
  };

  return { blocks, summary };
}
// ===PARSER-END===

// ── UI ────────────────────────────────────────────────────────────────────────
let outline = null, currentName = 'config';

const $ = id => document.getElementById(id);
const tbody = $('tbody'), tableWrap = $('tablewrap');
const detailWrap = $('detailWrap');
const errBox = $('err'), noticeEl = $('notice');
const fnameEl = $('fname');
const fileInput = $('file');
const searchIn = $('search'), kindSel = $('kindSel');
const chipsEl = $('chips'), histEl = $('hist');
const loadingEl = $('loading'), pasteArea = $('pasteArea');

function showLoading() { loadingEl.classList.add('show'); }
function hideLoading() { loadingEl.classList.remove('show'); }
function afterPaint(fn) { requestAnimationFrame(() => requestAnimationFrame(fn)); }
function showError(m) { errBox.style.display = 'block'; errBox.textContent = m; }
function clearError() { errBox.style.display = 'none'; }
function esc(s) { return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

const KIND_BADGE = { resource: 'res', data: 'dat', module: 'mod', variable: 'var', output: 'out', provider: 'prv', terraform: 'tf', locals: 'tf', moved: 'tf', import: 'tf', check: 'tf', ephemeral: 'tf' };

function kindBadge(kind) {
  const cls = KIND_BADGE[kind] || 'gray';
  return `<span class="badge ${cls}">${esc(kind)}</span>`;
}

function top5(arr, key) {
  const m = new Map();
  for (const x of arr) { const v = String(x[key] || ''); if (v) m.set(v, (m.get(v) || 0) + 1); }
  return [...m.entries()].sort((a, b) => b[1] - a[1]).slice(0, 5);
}

function hBar(label, count, max) {
  const pct = max ? Math.round(count / max * 100) : 0;
  return `<div class="hrow"><span class="hlabel" title="${esc(label)}">${esc(label)}</span><div class="hbar" style="width:${pct}%"></div><span class="hcount">${count.toLocaleString()}</span></div>`;
}

function buildChips(data) {
  const s = data.summary;
  chipsEl.innerHTML = [
    `<div class="chip"><span class="cv">${s.total}</span><span class="cl">blocks</span></div>`,
    s.byKind.resource ? `<div class="chip"><span class="cv">${s.byKind.resource}</span><span class="cl">resources</span></div>` : '',
    s.byKind.module ? `<div class="chip"><span class="cv">${s.byKind.module}</span><span class="cl">modules</span></div>` : '',
    s.byKind.variable ? `<div class="chip"><span class="cv">${s.byKind.variable}</span><span class="cl">variables</span></div>` : '',
    s.byKind.output ? `<div class="chip"><span class="cv">${s.byKind.output}</span><span class="cl">outputs</span></div>` : '',
    s.resourceTypes.length ? `<div class="chip"><span class="cv">${s.resourceTypes.length}</span><span class="cl">resource types</span></div>` : '',
  ].join('');
  chipsEl.style.display = 'flex';
}

function buildHist(data) {
  const blocks = data.blocks;
  const resByType = top5(blocks.filter(b => b.kind === 'resource'), 'type');
  const max = resByType[0]?.[1] || 1;

  let html = '';
  if (resByType.length) {
    html += `<div class="hbox"><h3>Resource types</h3>${resByType.map(([l, c]) => hBar(l, c, max)).join('')}</div>`;
  }
  if (data.summary.byKind.module) {
    const mods = top5(blocks.filter(b => b.kind === 'module'), 'type');
    const mm = mods[0]?.[1] || 1;
    html += `<div class="hbox"><h3>Module sources</h3>${mods.map(([l, c]) => hBar(l, c, mm)).join('')}</div>`;
  }

  histEl.innerHTML = html;
  if (html) histEl.style.display = 'flex';
}

function buildKindFilter(blocks) {
  const kinds = [...new Set(blocks.map(b => b.kind))].sort();
  kindSel.innerHTML = '<option value="">All kinds</option>' + kinds.map(k => `<option value="${esc(k)}">${esc(k)}</option>`).join('');
}

function filtered() {
  if (!outline) return [];
  const q = searchIn.value.trim().toLowerCase();
  const kind = kindSel.value;
  return outline.blocks.filter(b => {
    if (kind && b.kind !== kind) return false;
    if (!q) return true;
    return (b.kind + ' ' + b.type + ' ' + b.name + ' ' + b.displayLabels).toLowerCase().includes(q);
  });
}

function draw() {
  const list = filtered();
  tbody.innerHTML = '';
  for (const b of list) {
    const tr = document.createElement('tr');
    tr.dataset.i = b.i;
    tr.innerHTML =
      `<td>${b.i + 1}</td>` +
      `<td>${kindBadge(b.kind)}</td>` +
      `<td>${esc(b.type || '—')}</td>` +
      `<td>${esc(b.name || b.displayLabels || '—')}</td>` +
      `<td style="white-space:nowrap">${b.startLine}–${b.endLine}</td>`;
    tbody.appendChild(tr);
  }
}

function renderDetail(b) {
  detailWrap.innerHTML =
    `<div class="card"><div class="card-h">${kindBadge(b.kind)} ${esc(b.type)} ${esc(b.name)}</div><div class="card-body">` +
    `<table class="kv">` +
    `<tr><td class="k">kind</td><td>${esc(b.kind)}</td></tr>` +
    (b.labels.length > 0 ? b.labels.map((l, i) => `<tr><td class="k">label[${i}]</td><td>${esc(l)}</td></tr>`).join('') : '') +
    `<tr><td class="k">lines</td><td>${b.startLine}–${b.endLine} (${b.lineCount} lines)</td></tr>` +
    `</table></div></div>` +
    `<div class="card"><div class="card-h">Snippet</div><div class="card-body">` +
    `<pre class="block">${esc(b.snippet)}${b.lineCount > 8 ? '\n…' : ''}</pre></div></div>`;
  detailWrap.style.display = 'block';
}

function setControls(on) {
  [searchIn, kindSel, $('copy')].forEach(el => el.disabled = !on);
}

function render(text, name) {
  showLoading();
  afterPaint(() => {
    try {
      if (name && /\.terraform\.lock\.hcl$/i.test(name)) {
        showError('.terraform.lock.hcl is a provider lock file — use the Terraform Lock Viewer for this format.');
        hideLoading(); return;
      }
      outline = parseHclOutline(text);
      if (!outline.blocks.length) throw new Error('No HCL blocks found. Check the file is a .tf / .hcl / .tfvars / .tofu file.');
      currentName = (name || 'config').replace(/\.(tf|hcl|tfvars|tofu)$/i, '');
      fnameEl.textContent = name || '';
      document.title = currentName + ' — KSI Tools HCL';
      $('drop').style.display = 'none';
      pasteArea.style.display = 'none';
      tableWrap.style.display = 'block';
      detailWrap.style.display = 'none';
      clearError();
      buildKindFilter(outline.blocks);
      buildChips(outline);
      buildHist(outline);
      noticeEl.textContent = 'Outline view only — not a full HCL interpreter. Variable interpolation (${}) and heredocs are not resolved.';
      noticeEl.style.display = 'block';
      setControls(true);
      searchIn.value = ''; kindSel.value = '';
      draw();
    } catch (e) { showError(e.message || String(e)); }
    hideLoading();
  });
}

function loadFile(file) {
  if (!file) return;
  if (file.size > 25 * 1024 * 1024) { showError('File too large (max 25 MB).'); return; }
  showLoading();
  const r = new FileReader();
  r.onload = () => render(String(r.result || ''), file.name);
  r.readAsText(file);
}

const drop = $('drop');
drop.onclick = () => fileInput.click();
fileInput.onchange = () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); fileInput.value = ''; };
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('hover'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('hover'); }));
drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) loadFile(f); });
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { if (e.target.closest('#drop')) return; e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) loadFile(f); });

$('pasteBtn').onclick = () => { const t = $('paste').value.trim(); if (t) render(t, 'paste.tf'); };

searchIn.oninput = draw; kindSel.onchange = draw;

tbody.onclick = e => {
  const tr = e.target.closest('tr'); if (!tr) return;
  if (!outline) return;
  const b = outline.blocks.find(x => x.i === parseInt(tr.dataset.i, 10)); if (!b) return;
  tbody.querySelectorAll('tr.selected').forEach(r => r.classList.remove('selected'));
  tr.classList.add('selected');
  renderDetail(b);
  detailWrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
};

$('copy').onclick = async () => {
  await navigator.clipboard.writeText(JSON.stringify(outline, null, 2));
};

// ── self-test ─────────────────────────────────────────────────────────────────
(function selfTest() {
  const HCL = `
resource "aws_s3_bucket" "logs" {
  bucket = "my-logs"
}

resource "aws_iam_role" "app" {
  name = "my-app-role"
  assume_role_policy = jsonencode({...})
}

module "vpc" {
  source  = "terraform-aws-modules/vpc/aws"
  version = "~> 5.0"
}

variable "region" {
  default = "us-east-1"
}

output "bucket_arn" {
  value = aws_s3_bucket.logs.arn
}

provider "aws" {
  region = var.region
}

terraform {
  required_version = ">= 1.6"
}
`;
  try {
    const r = parseHclOutline(HCL);
    if (r.blocks.length !== 7) throw new Error('block count: ' + r.blocks.length);
    if (r.summary.byKind.resource !== 2) throw new Error('resource count');
    if (r.summary.byKind.module !== 1) throw new Error('module count');
    if (r.summary.byKind.variable !== 1) throw new Error('variable count');
    if (r.summary.byKind.output !== 1) throw new Error('output count');
    if (r.summary.byKind.provider !== 1) throw new Error('provider count');
    if (r.summary.byKind.terraform !== 1) throw new Error('terraform count');
    const res = r.blocks.filter(b => b.kind === 'resource');
    if (res[0].type !== 'aws_s3_bucket') throw new Error('resource type: ' + res[0].type);
    if (res[0].name !== 'logs') throw new Error('resource name: ' + res[0].name);
    if (r.summary.resourceTypes.length !== 2) throw new Error('resourceTypes count: ' + r.summary.resourceTypes.length);
    const mod = r.blocks.find(b => b.kind === 'module');
    if (mod.type !== 'vpc') throw new Error('module name: ' + mod.type);
    if (mod.labels[0] !== 'vpc') throw new Error('module label');
    // empty input
    const r2 = parseHclOutline('# just a comment\n');
    if (r2.blocks.length !== 0) throw new Error('empty should yield 0 blocks');
    // line numbers
    const HCL2 = 'resource "aws_vpc" "main" {\n  cidr_block = "10.0.0.0/16"\n}\n';
    const r3 = parseHclOutline(HCL2);
    if (r3.blocks[0].startLine !== 1) throw new Error('startLine');
    if (r3.blocks[0].endLine !== 3) throw new Error('endLine');
  } catch (e) { console.error('HCL viewer self-test FAILED:', e.message); }
})();
</script>
