<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KSI Tools Minified JavaScript Beautifier</title>
<style id="appcss">
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:15px; line-height:1.5; background:#fff; color:#1f2328; }
header.bar { position:sticky; top:0; z-index:20; display:flex; gap:8px; align-items:center; padding:10px 16px; background:#f6f8fa; border-bottom:1px solid #d0d7de; flex-wrap:wrap; }
header.bar h1 { font-size:15px; margin:0; font-weight:600; white-space:nowrap; }
header.bar .meta { color:#57606a; font-size:12px; flex:1; min-width:60px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
button, select, input[type=text], input[type=number], textarea { font:inherit; font-size:13px; padding:6px 12px; border:1px solid #d0d7de; border-radius:6px; background:#fff; color:#1f2328; }
button { cursor:pointer; } button:hover { background:#f3f4f6; } button:disabled { opacity:.45; cursor:default; }
.hint { color:#8b949e; font-size:12px; }
label.inl { display:flex; align-items:center; gap:4px; font-size:12px; color:#57606a; white-space:nowrap; }

.intake { max-width:1180px; margin:22px auto 12px; padding:0 16px; }
.intake .drop { border:2px dashed #d0d7de; border-radius:10px; padding:22px 18px; text-align:center; background:#f6f8fa; }
.intake .drop.hot { border-color:#0969da; background:#ddf4ff; }
.intake .drop p { margin:6px 0; font-size:13px; color:#57606a; }
.intake label.tl { display:block; font-size:13px; color:#57606a; margin:14px 0 6px; }
#paste { width:100%; min-height:120px; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:12.5px; padding:10px; border:1px solid #d0d7de; border-radius:8px; resize:vertical; white-space:pre; overflow-x:auto; }
.row-controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px; }

#err { max-width:1180px; margin:18px auto; padding:14px 18px; border:1px solid #cf222e; border-radius:10px; background:rgba(207,34,46,.06); color:#cf222e; font-family:ui-monospace,monospace; font-size:13px; white-space:pre-wrap; display:none; }
#notice { padding:8px 16px; font-size:12.5px; background:#fff8c5; color:#7a5c00; border-bottom:1px solid #f0c000; display:none; white-space:pre-wrap; }
#confirm { max-width:1180px; margin:18px auto; padding:14px 18px; border:1px solid #f0c000; border-radius:10px; background:#fff8c5; color:#7a5c00; font-size:13px; display:none; }
#confirm .row-controls { margin-top:10px; }

.badge { display:inline-block; font-size:10px; font-weight:600; padding:1px 7px; border-radius:999px; border:1px solid #d0d7de; margin-right:4px; margin-bottom:4px; }
.badge.bad { background:#ffebe9; border-color:#ff8182; color:#cf222e; }
.badge.warn { background:#fff8c5; border-color:#f0c000; color:#7a5c00; }
.badge.ok { background:#dafbe1; border-color:#4ac26b; color:#1a7f37; }
.badge.info { background:#ddf4ff; border-color:#54aeff; color:#0969da; }

.stats { display:none; flex-wrap:wrap; gap:8px; margin:10px auto 4px; padding:0 16px; max-width:1180px; }
.stat { border:1px solid #d0d7de; border-radius:8px; padding:8px 12px; font-size:12.5px; background:#f6f8fa; min-width:110px; max-width:340px; }
.stat b { display:block; font-size:14px; word-break:break-word; }
.stat .lbl { color:#57606a; font-size:11px; text-transform:uppercase; letter-spacing:.03em; }

.tabs { display:none; max-width:1180px; margin:12px auto 0; padding:0 16px; gap:2px; border-bottom:1px solid #d0d7de; }
.tabs.show { display:flex; flex-wrap:wrap; }
.tabs button { border:1px solid transparent; border-bottom:none; border-radius:6px 6px 0 0; background:transparent; color:#57606a; padding:7px 14px; }
.tabs button.on { background:#fff; border-color:#d0d7de; color:#1f2328; font-weight:600; }
.tabs button .n { font-size:11px; color:#8b949e; margin-left:4px; }

.panel { max-width:1180px; margin:0 auto; padding:14px 16px 44px; display:none; }
.panel.show { display:block; }

.codewrap { border:1px solid #d0d7de; border-radius:10px; overflow:hidden; }
.codewrap .chead { display:flex; gap:8px; align-items:center; padding:7px 12px; background:#f6f8fa; border-bottom:1px solid #d0d7de; font-size:12px; color:#57606a; flex-wrap:wrap; }
.codewrap .chead .sp { flex:1; }
.codescroll { max-height:70vh; overflow:auto; background:#fff; }
table.code { border-collapse:collapse; width:100%; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:12.5px; }
table.code td { padding:0 0 0 10px; vertical-align:top; white-space:pre; }
table.code td.ln { text-align:right; padding:0 10px 0 12px; color:#8b949e; background:#f6f8fa; border-right:1px solid #d0d7de; user-select:none; width:1%; white-space:nowrap; position:sticky; left:0; }
table.code tr.hl td { background:#fff8c5; }
table.code tr.hl td.ln { background:#f0e3a0; }
.tk-key { color:#cf222e; }
.tk-str { color:#0a3069; }
.tk-num { color:#0550ae; }
.tk-com { color:#6e7781; font-style:italic; }
.tk-rgx { color:#116329; }
.tk-fn  { color:#8250df; }
.tk-pun { color:#57606a; }

.card { border:1px solid #d0d7de; border-radius:10px; margin-bottom:12px; overflow:hidden; }
.card h2 { margin:0; padding:10px 14px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; background:#f6f8fa; border-bottom:1px solid #d0d7de; color:#57606a; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.card h2 .sp { flex:1; }
.card .body { padding:12px 14px; }
.card .body.tight { padding:0; }
.kv { display:grid; grid-template-columns:230px 1fr; gap:4px 12px; font-size:12.5px; }
.kv .k { color:#57606a; }
.kv .v { font-family:"Cascadia Code","Consolas",ui-monospace,monospace; word-break:break-all; }
.kv .v.plain { font-family:inherit; }

table.grid { border-collapse:collapse; width:100%; font-size:12.5px; }
table.grid th { text-align:left; padding:7px 10px; background:#f6f8fa; border-bottom:1px solid #d0d7de; color:#57606a; font-size:11px; text-transform:uppercase; letter-spacing:.03em; position:sticky; top:0; }
table.grid td { padding:6px 10px; border-bottom:1px solid #eaeef2; vertical-align:top; word-break:break-word; }
table.grid td.mono, table.grid th.mono { font-family:"Cascadia Code","Consolas",ui-monospace,monospace; }
table.grid td.num { text-align:right; white-space:nowrap; }
table.grid tr:hover td { background:#f6f8fa; }
.scrollbox { max-height:60vh; overflow:auto; }
.jump { color:#0969da; cursor:pointer; text-decoration:underline; background:none; border:none; padding:0; font:inherit; }
.trunc { padding:8px 12px; font-size:12px; color:#7a5c00; background:#fff8c5; border-top:1px solid #f0c000; }
.empty { padding:14px; color:#8b949e; font-size:13px; }
.caveat { border:1px solid #54aeff; background:#ddf4ff; color:#0a3069; border-radius:10px; padding:12px 14px; font-size:12.5px; margin-bottom:12px; }
.caveat b { display:block; margin-bottom:4px; }

@media (prefers-color-scheme: dark) {
  body { background:#0d1117; color:#e6edf3; }
  header.bar { background:#161b22; border-bottom-color:#30363d; }
  header.bar .meta, .hint, .intake .drop p, .intake label.tl, .stat .lbl, .kv .k, label.inl { color:#8b949e; }
  button, select, input[type=text], input[type=number], textarea, #paste { background:#21262d; color:#e6edf3; border-color:#30363d; }
  button:hover { background:#30363d; }
  .intake .drop { background:#161b22; border-color:#30363d; }
  .intake .drop.hot { border-color:#1f6feb; background:#121d2f; }
  .stat { background:#161b22; border-color:#30363d; }
  .tabs { border-bottom-color:#30363d; }
  .tabs button { color:#8b949e; }
  .tabs button.on { background:#0d1117; border-color:#30363d; color:#e6edf3; }
  .codewrap, .card { border-color:#30363d; }
  .codewrap .chead { background:#161b22; border-bottom-color:#30363d; color:#8b949e; }
  .codescroll { background:#0d1117; }
  table.code td.ln { background:#161b22; border-right-color:#30363d; color:#6e7781; }
  table.code tr.hl td { background:#3a2f00; }
  table.code tr.hl td.ln { background:#4a3c00; }
  .tk-key { color:#ff7b72; } .tk-str { color:#a5d6ff; } .tk-num { color:#79c0ff; }
  .tk-com { color:#8b949e; } .tk-rgx { color:#7ee787; } .tk-fn { color:#d2a8ff; } .tk-pun { color:#8b949e; }
  .card h2 { background:#161b22; border-bottom-color:#30363d; color:#8b949e; }
  table.grid th { background:#161b22; border-bottom-color:#30363d; color:#8b949e; }
  table.grid td { border-bottom-color:#21262d; }
  table.grid tr:hover td { background:#161b22; }
  .badge { border-color:#30363d; }
  .badge.bad { background:#3d1418; border-color:#f85149; color:#ff7b72; }
  .badge.warn { background:#3a2f00; border-color:#b58900; color:#e3b341; }
  .badge.ok { background:#12261e; border-color:#238636; color:#3fb950; }
  .badge.info { background:#121d2f; border-color:#1f6feb; color:#58a6ff; }
  #notice, #confirm { background:#3a2f00; color:#e3b341; border-color:#b58900; }
  #err { border-color:#f85149; color:#ff7b72; background:rgba(248,81,73,.08); }
  .trunc { background:#3a2f00; color:#e3b341; border-top-color:#b58900; }
  .jump { color:#58a6ff; }
  .caveat { background:#121d2f; border-color:#1f6feb; color:#a5d6ff; }
  .empty { color:#6e7781; }
}
</style>
</head>
<body>

<header class="bar">
  <h1>KSI Tools Minified JavaScript Beautifier</h1>
  <span class="meta" id="meta"></span>
  <label class="inl">Indent <select id="indentSel">
    <option value="2" selected>2 spaces</option>
    <option value="4">4 spaces</option>
    <option value="tab">Tab</option>
  </select></label>
  <label class="inl"><input type="checkbox" id="cbBreakObj" checked> Break object commas</label>
  <label class="inl"><input type="checkbox" id="cbHilite" checked> Highlight</label>
  <button id="reformatBtn" disabled>Reformat</button>
  <button id="dlBtn" disabled>Download .js</button>
  <button id="clearBtn">Clear</button>
</header>

<div id="notice"></div>

<div class="intake" id="intake">
  <div class="drop" id="drop">
    <p><b>Drop a .js file here</b> — or</p>
    <p><input type="file" id="file" accept=".js,.mjs,.cjs,.jsx,.ts,.json,.txt,text/javascript,application/javascript"></p>
    <p class="hint">Parsed and formatted entirely in your browser. Nothing is uploaded. Works offline with no network access.</p>
  </div>
  <label class="tl" for="paste">…or paste minified JavaScript:</label>
  <textarea id="paste" spellcheck="false" wrap="off" placeholder="!function(e,t){&quot;use strict&quot;;var n=/^\/api\/v[0-9]+\//,r=10/2;function o(a){return a.replace(n,&quot;&quot;)}e.f=o}(window,document);"></textarea>
  <div class="row-controls">
    <button id="goBtn">Beautify</button>
    <span class="hint">Ctrl+Enter in the box also works.</span>
  </div>
</div>

<div id="err"></div>
<div id="confirm"></div>
<div class="stats" id="stats"></div>
<div class="tabs" id="tabs"></div>
<div class="panel" id="panel"></div>

<script>
(function () {
'use strict';

/* ------------------------------------------------------------------ *
 * Limits. Nothing here is silent: every cap that fires is disclosed
 * in the #notice bar and/or a .trunc footer on the affected table.
 * ------------------------------------------------------------------ */
const HARD_MAX_BYTES   = 100 * 1024 * 1024;   // refuse outright above this
const CONFIRM_BYTES    = 8 * 1024 * 1024;     // ask before formatting above this
const MAX_RENDER_LINES = 50000;               // rows painted into the DOM
const MAX_STRINGS_ROWS = 3000;                // string-inventory rows shown
const MAX_FINDING_ROWS = 2000;                // per-table finding rows shown
const HILITE_MAX_BYTES = 4 * 1024 * 1024;     // auto-disable highlighting above

/* ------------------------------------------------------------------ *
 * DOM handles
 * ------------------------------------------------------------------ */
const $ = (id) => document.getElementById(id);
const pasteEl = $('paste'), panel = $('panel'), tabsEl = $('tabs'), statsEl = $('stats');
const errBox = $('err'), noticeEl = $('notice'), confirmEl = $('confirm');
const metaEl = $('meta'), dropEl = $('drop'), fileEl = $('file'), intakeEl = $('intake');
const indentSel = $('indentSel'), cbBreakObj = $('cbBreakObj'), cbHilite = $('cbHilite');
const reformatBtn = $('reformatBtn'), dlBtn = $('dlBtn');

let STATE = null;      // { src, name, tokens, out, lines, analysis, notes[] }
let ACTIVE_TAB = 'code';

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function fmtBytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(2) + ' MB';
  return (n / 1024 / 1024 / 1024).toFixed(2) + ' GB';
}
function showError(m) { errBox.style.display = 'block'; errBox.textContent = m; }
function clearError() { errBox.style.display = 'none'; errBox.textContent = ''; }
function setNotes(list) {
  const real = (list || []).filter(Boolean);
  noticeEl.style.display = real.length ? 'block' : 'none';
  noticeEl.textContent = real.join('\n');
}

/* ================================================================== *
 * TOKENIZER
 *
 * A real lexical scan, not a regex sweep. The two things that make
 * naive JS formatters corrupt code are handled explicitly:
 *
 *   1. `/` is either a division operator or the start of a regex
 *      literal, and you cannot tell which without knowing whether the
 *      previous significant token ended an expression. We track that
 *      with a proper "regex allowed here" predicate plus paren/brace
 *      stacks, so   /^\/api\/v[0-9]+\//   stays a regex and   10/2
 *      stays division.
 *
 *   2. Template literals nest arbitrarily: `a${ `b${ c }` }d`. We
 *      scan them with a depth counter rather than a flat match.
 *
 * Token kinds: ws, lcom, bcom, str, tpl, num, name, key, rgx, pun
 * ================================================================== */

const KEYWORDS = new Set(('await break case catch class const continue debugger default delete do else ' +
  'enum export extends false finally for function if implements import in instanceof interface let ' +
  'new null package private protected public return static super switch this throw true try typeof ' +
  'var void while with yield').split(' '));

// After one of these keywords, a `/` starts a regex, not a division.
const REGEX_OK_AFTER_KEYWORD = new Set(('await case delete do else in instanceof new return throw typeof ' +
  'void yield').split(' '));

// Keywords whose `(` is a control-flow head, not a call. Matters for
// `)` disambiguation: `if (x) /re/.test(y)` vs `f(x) / 2`.
const CONTROL_KEYWORDS = new Set(['if', 'for', 'while', 'with', 'switch', 'catch']);

const PUNCT = [
  '>>>=', '...', '===', '!==', '**=', '<<=', '>>=', '>>>', '&&=', '||=', '??=',
  '=>', '==', '!=', '<=', '>=', '&&', '||', '??', '?.', '++', '--', '+=', '-=',
  '*=', '/=', '%=', '&=', '|=', '^=', '<<', '>>', '**',
  '{', '}', '(', ')', '[', ']', ';', ',', '<', '>', '+', '-', '*', '/', '%',
  '&', '|', '^', '!', '~', '?', ':', '=', '.', '#', '@'
];

function isWsCh(c) {
  return c === ' ' || c === '\t' || c === '\n' || c === '\r' || c === '\f' || c === '\v' ||
         c === '\u00a0' || c === '\ufeff' || c === '\u2028' || c === '\u2029';
}
function isDigit(c) { return c >= '0' && c <= '9'; }
function isIdStart(c) {
  return (c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z') || c === '_' || c === '$' || c.charCodeAt(0) > 127;
}
function isIdPart(c) { return isIdStart(c) || isDigit(c); }

function tokenize(src) {
  const toks = [];
  const n = src.length;
  let i = 0;
  let prev = null;                 // last significant (non-ws, non-comment) token
  const parenStack = [];           // true when this `(` is a control-flow head
  const braceStack = [];           // true when this `{` is an object literal (expression position)
  let lastWasNewline = false;      // did whitespace since `prev` contain a line break

  function regexAllowed() {
    if (!prev) return true;
    switch (prev.t) {
      case 'num': case 'str': case 'tpl': case 'rgx': return false;
      case 'name': return false;
      case 'key': return REGEX_OK_AFTER_KEYWORD.has(prev.v);
      case 'pun':
        if (prev.v === ')') return prev.ctrl === true;      // `if(x) /re/` yes; `f(x) / 2` no
        if (prev.v === '}') return prev.objEnd !== true;    // block end yes; object literal end no
        if (prev.v === ']') return false;
        if (prev.v === '++' || prev.v === '--') return false;
        return true;
      default: return true;
    }
  }

  function push(tok) {
    tok.s = tok.s;
    toks.push(tok);
    if (tok.t !== 'ws' && tok.t !== 'lcom' && tok.t !== 'bcom') {
      tok.nlBefore = lastWasNewline;
      prev = tok;
      lastWasNewline = false;
    }
  }

  while (i < n) {
    const c = src[i];
    const start = i;

    /* whitespace ------------------------------------------------- */
    if (isWsCh(c)) {
      let nl = 0, j = i;
      while (j < n && isWsCh(src[j])) {
        if (src[j] === '\n' || src[j] === '\u2028' || src[j] === '\u2029') nl++;
        else if (src[j] === '\r' && src[j + 1] !== '\n') nl++;
        j++;
      }
      if (nl) lastWasNewline = true;
      push({ t: 'ws', v: src.slice(i, j), s: start, nl: nl });
      i = j; continue;
    }

    /* line comment ----------------------------------------------- */
    if (c === '/' && src[i + 1] === '/') {
      let j = i + 2;
      while (j < n && src[j] !== '\n' && src[j] !== '\r' && src[j] !== '\u2028' && src[j] !== '\u2029') j++;
      push({ t: 'lcom', v: src.slice(i, j), s: start });
      i = j; continue;
    }

    /* block comment ---------------------------------------------- */
    if (c === '/' && src[i + 1] === '*') {
      let j = i + 2, closed = false;
      while (j < n) {
        if (src[j] === '*' && src[j + 1] === '/') { j += 2; closed = true; break; }
        j++;
      }
      const v = src.slice(i, j);
      if (/[\n\r\u2028\u2029]/.test(v)) lastWasNewline = true;
      push({ t: 'bcom', v: v, s: start, unterminated: !closed });
      i = j; continue;
    }

    /* string ------------------------------------------------------ */
    if (c === '"' || c === "'") {
      let j = i + 1, closed = false, badNl = false;
      while (j < n) {
        const d = src[j];
        if (d === '\\') { j += 2; continue; }
        if (d === c) { j++; closed = true; break; }
        if (d === '\n' || d === '\r') { badNl = true; break; }   // unterminated at EOL
        j++;
      }
      push({ t: 'str', v: src.slice(i, j), s: start, quote: c, unterminated: !closed, badNl: badNl });
      i = j; continue;
    }

    /* template literal (handles nested ${ ... `...` ... }) --------- */
    if (c === '`') {
      let j = i + 1, closed = false;
      const stack = [];   // '`' for template, '{' for interpolation
      stack.push('`');
      while (j < n && stack.length) {
        const d = src[j];
        if (d === '\\') { j += 2; continue; }
        const top = stack[stack.length - 1];
        if (top === '`') {
          if (d === '`') { stack.pop(); j++; continue; }
          if (d === '$' && src[j + 1] === '{') { stack.push('{'); j += 2; continue; }
          j++; continue;
        }
        // inside ${ ... } — an expression context; only these matter for balance
        if (d === '}') { stack.pop(); j++; continue; }
        if (d === '{') { stack.push('{'); j++; continue; }
        if (d === '`') { stack.push('`'); j++; continue; }
        if (d === '"' || d === "'") {
          j++;
          while (j < n) {
            if (src[j] === '\\') { j += 2; continue; }
            if (src[j] === d) { j++; break; }
            if (src[j] === '\n' || src[j] === '\r') break;
            j++;
          }
          continue;
        }
        j++;
      }
      closed = stack.length === 0;
      const v = src.slice(i, j);
      if (/[\n\r]/.test(v)) { /* multi-line template: newlines are content, not layout */ }
      push({ t: 'tpl', v: v, s: start, unterminated: !closed });
      i = j; continue;
    }

    /* regex literal or division ----------------------------------- */
    if (c === '/') {
      if (regexAllowed()) {
        // Attempt a regex scan. If it fails to close on this line, fall
        // back to treating the `/` as an operator rather than eating code.
        let j = i + 1, inClass = false, closed = false;
        while (j < n) {
          const d = src[j];
          if (d === '\\') { j += 2; continue; }
          if (d === '\n' || d === '\r' || d === '\u2028' || d === '\u2029') break;
          if (inClass) { if (d === ']') inClass = false; j++; continue; }
          if (d === '[') { inClass = true; j++; continue; }
          if (d === '/') { j++; closed = true; break; }
          j++;
        }
        if (closed) {
          while (j < n && isIdPart(src[j])) j++;      // flags: gimsuyvd
          push({ t: 'rgx', v: src.slice(i, j), s: start });
          i = j; continue;
        }
        // fall through to punctuator
      }
      // division / division-assign
      if (src[i + 1] === '=') { push({ t: 'pun', v: '/=', s: start }); i += 2; continue; }
      push({ t: 'pun', v: '/', s: start }); i += 1; continue;
    }

    /* number ------------------------------------------------------ */
    if (isDigit(c) || (c === '.' && isDigit(src[i + 1]))) {
      let j = i;
      if (c === '0' && (src[i + 1] === 'x' || src[i + 1] === 'X')) {
        j = i + 2; while (j < n && (/[0-9a-fA-F_]/).test(src[j])) j++;
      } else if (c === '0' && (src[i + 1] === 'b' || src[i + 1] === 'B' || src[i + 1] === 'o' || src[i + 1] === 'O')) {
        j = i + 2; while (j < n && (/[0-7_01]/).test(src[j])) j++;
      } else {
        while (j < n && (isDigit(src[j]) || src[j] === '_')) j++;
        if (src[j] === '.') { j++; while (j < n && (isDigit(src[j]) || src[j] === '_')) j++; }
        if (src[j] === 'e' || src[j] === 'E') {
          let k = j + 1;
          if (src[k] === '+' || src[k] === '-') k++;
          if (isDigit(src[k])) { j = k; while (j < n && isDigit(src[j])) j++; }
        }
      }
      if (src[j] === 'n') j++;   // BigInt
      push({ t: 'num', v: src.slice(i, j), s: start });
      i = j; continue;
    }

    /* identifier / keyword ---------------------------------------- */
    if (isIdStart(c)) {
      let j = i + 1;
      while (j < n && isIdPart(src[j])) j++;
      const w = src.slice(i, j);
      push({ t: KEYWORDS.has(w) ? 'key' : 'name', v: w, s: start });
      i = j; continue;
    }

    /* punctuator --------------------------------------------------- */
    let matched = null;
    for (let p = 0; p < PUNCT.length; p++) {
      const cand = PUNCT[p];
      if (src.startsWith(cand, i)) { matched = cand; break; }
    }
    if (matched) {
      const tok = { t: 'pun', v: matched, s: start };
      if (matched === '(') {
        // control-flow head if the previous significant token is if/for/while/...
        const ctrl = !!(prev && prev.t === 'key' && CONTROL_KEYWORDS.has(prev.v));
        parenStack.push(ctrl);
        tok.ctrl = ctrl;
      } else if (matched === ')') {
        tok.ctrl = parenStack.length ? parenStack.pop() : false;
      } else if (matched === '{') {
        // Object literal if `{` appears where a value could go; block otherwise.
        const isObj = !regexAllowed() ? false : objectLiteralHere(prev);
        braceStack.push(isObj);
        tok.objStart = isObj;
      } else if (matched === '}') {
        tok.objEnd = braceStack.length ? braceStack.pop() : false;
      }
      push(tok);
      i += matched.length; continue;
    }

    /* anything else: keep the byte, never drop it ------------------ */
    push({ t: 'pun', v: c, s: start, unknown: true });
    i += 1;
  }
  return toks;
}

// `{` in expression position is an object literal; in statement position it's a block.
// Note `=>` is deliberately NOT here: `() => {}` is a block body, and
// `() => ({})` is how you return an object, so the `(` carries that case.
const OBJ_AFTER_PUN = new Set(['(', ',', '=', ':', '[', '!', '&&', '||', '??', '?',
  '+', '-', '*', '/', '%', '===', '!==', '==', '!=', '<', '>', '<=', '>=', '...',
  '+=', '-=', '*=', '/=', '&&=', '||=', '??=']);
const OBJ_AFTER_KEY = new Set(['return', 'typeof', 'case', 'in', 'delete', 'void',
  'instanceof', 'new', 'throw', 'yield', 'await']);

function objectLiteralHere(prev) {
  if (!prev) return false;                                    // program start -> block
  if (prev.t === 'pun') return OBJ_AFTER_PUN.has(prev.v);
  if (prev.t === 'key') return OBJ_AFTER_KEY.has(prev.v);
  return false;                                               // after name/num/str/`)` -> block-ish
}

function significant(toks) {
  const out = [];
  for (let k = 0; k < toks.length; k++) {
    const t = toks[k].t;
    if (t !== 'ws' && t !== 'lcom' && t !== 'bcom') out.push(toks[k]);
  }
  return out;
}

/* ================================================================== *
 * FORMATTER
 *
 * Token-stream reprinter. It only ever inserts or removes whitespace
 * between tokens — token VALUES are copied byte-for-byte, so strings,
 * template literals, regexes and comments survive exactly as written.
 *
 * ASI safety: we never insert a line break between `return`/`throw`/
 * `break`/`continue`/`yield` and its argument, because that would make
 * the engine insert a semicolon and silently change behaviour.
 * ================================================================== */

const NO_BREAK_AFTER = new Set(['return', 'throw', 'break', 'continue', 'yield']);

// Binary/assignment operators that read better surrounded by spaces.
const SPACED_OPS = new Set(['=', '+', '-', '*', '/', '%', '**', '==', '===', '!=', '!==',
  '<', '>', '<=', '>=', '&&', '||', '??', '+=', '-=', '*=', '/=', '%=', '**=', '&=', '|=',
  '^=', '<<=', '>>=', '>>>=', '&&=', '||=', '??=', '<<', '>>', '>>>', '&', '|', '^', '=>', ':']);

// Tokens after which `+`/`-` is unary, not binary.
function unaryContext(prev) {
  if (!prev) return true;
  if (prev.t === 'num' || prev.t === 'str' || prev.t === 'tpl' || prev.t === 'rgx' || prev.t === 'name') return false;
  if (prev.t === 'key') return !['this', 'super', 'true', 'false', 'null'].includes(prev.v);
  if (prev.t === 'pun') return [')', ']', '}', '++', '--'].indexOf(prev.v) === -1;
  return true;
}

function formatTokens(toks, opts) {
  const indentUnit = opts.indent;
  const breakObjects = opts.breakObjects;
  const sig = significant(toks);
  const comments = mapComments(toks);   // significant-index -> comments that preceded it

  // Output is accumulated as an array of chunks, never as one growing
  // string. Appending to a string and then inspecting it with
  // out.replace(/\s+$/) or /\s$/.test(out) is O(length) per token, which
  // turns into O(n^2) overall — a 1.6 MB bundle took over two minutes
  // that way. Here every operation touches only the tail chunk.
  const buf = [];
  let depth = 0;
  let atLineStart = true;
  const blockKind = [];                 // 'obj' | 'block' | 'class' | 'switch'
  const parenDepth = [];                // paren nesting recorded at each `{`
  let curParen = 0;
  let inForHead = 0;                    // `;` inside for(...) must not break the line
  const caseDepth = [];                 // switch nesting for `case` outdent

  function push(s) { if (s) buf.push(s); }
  function tailChar() {
    for (let i = buf.length - 1; i >= 0; i--) {
      const c = buf[i];
      if (c.length) return c.charAt(c.length - 1);
    }
    return '';
  }
  // Drop trailing whitespace from the tail without rescanning the whole buffer.
  function trimTail() {
    while (buf.length) {
      const last = buf[buf.length - 1];
      const t = last.replace(/\s+$/, '');
      if (t === last) break;
      if (t) { buf[buf.length - 1] = t; break; }
      buf.pop();
    }
  }
  function nl() {
    if (!atLineStart) { push('\n'); atLineStart = true; }
  }
  function emitIndent() {
    if (atLineStart) { push(indentUnit.repeat(Math.max(0, depth))); atLineStart = false; }
  }
  function write(s) { emitIndent(); push(s); }
  function space() {
    if (atLineStart) return;
    const c = tailChar();
    if (c === '' || c === ' ' || c === '\t' || c === '\n') return;
    push(' ');
  }
  // True when the last non-whitespace character emitted is `{` and we are
  // sitting at the start of a fresh line — i.e. an empty block body.
  function tailIsOpenBrace() {
    for (let i = buf.length - 1; i >= 0; i--) {
      const c = buf[i].replace(/\s+$/, '');
      if (!c) continue;
      return c.charAt(c.length - 1) === '{';
    }
    return false;
  }
  // Re-open the current line: used for `} else {` and `}(args)` shapes.
  function joinTail(text) {
    trimTail(); atLineStart = false; push(text);
  }

  function emitComments(list) {
    if (!list || !list.length) return;
    for (const c of list) {
      nl();
      if (c.t === 'bcom') {
        // Re-indent each line of a block comment without touching its text.
        const lines = c.v.split(/\r\n|\n|\r/);
        write(lines[0]);
        for (let k = 1; k < lines.length; k++) {
          nl(); write(lines[k].replace(/^\s+/, m => (/^\s*\*/.test(lines[k]) ? ' ' : '')) );
        }
      } else {
        write(c.v);
      }
      nl();
    }
  }

  for (let k = 0; k < sig.length; k++) {
    const t = sig[k];
    const prev = k > 0 ? sig[k - 1] : null;
    const next = k + 1 < sig.length ? sig[k + 1] : null;
    emitComments(comments[k]);

    if (t.t === 'pun') {
      switch (t.v) {
        case '{': {
          const isObj = t.objStart === true;
          const isClassBody = !!(prev && prev.t === 'name' && looksBackFor(sig, k, 'class')) ;
          const isSwitch = !!(prev && prev.t === 'pun' && prev.v === ')' && looksBackFor(sig, k, 'switch'));
          if (isObj && !breakObjects && !containsBreak(sig, k)) {
            // keep short object literals inline
            space(); write('{');
            blockKind.push('objinline'); parenDepth.push(curParen);
            continue;
          }
          if (prev && !(prev.t === 'pun' && (prev.v === '(' || prev.v === '[' || prev.v === '=>'))) space();
          else if (prev && prev.t === 'pun' && prev.v === '=>') space();
          write('{');
          blockKind.push(isObj ? 'obj' : (isSwitch ? 'switch' : (isClassBody ? 'class' : 'block')));
          parenDepth.push(curParen);
          if (isSwitch) caseDepth.push(depth);
          depth++;
          if (next && next.t === 'pun' && next.v === '}') { /* empty {} — collapse */ }
          else nl();
          continue;
        }
        case '}': {
          const kind = blockKind.length ? blockKind.pop() : 'block';
          if (parenDepth.length) curParen = parenDepth.pop();
          if (kind === 'objinline') { write('}'); continue; }
          if (kind === 'switch') {
            // `case` bodies pushed depth one level deeper; restore the
            // switch-statement level so the closing brace lines up.
            if (caseDepth.length) depth = caseDepth.pop();
            nl(); write('}');
            const contSw = next && next.t === 'pun' &&
              [',', ')', ']', ';', '.', ':', '}', '?.', '('].indexOf(next.v) !== -1;
            if (!contSw) nl();
            continue;
          }
          depth--;
          if (tailIsOpenBrace() && atLineStart) {
            // empty block: emit `{}` with nothing between
            joinTail('}');
          } else {
            nl(); write('}');
          }
          // `}` that ends a statement gets a following newline unless a
          // continuation token follows. `(` matters for the IIFE shape
          // `!function(){...}(a,b)` — breaking there is legal but reads
          // as if the call vanished.
          const cont = next && ((next.t === 'key' && ['else', 'catch', 'finally', 'while'].includes(next.v)) ||
                               (next.t === 'pun' && [',', ')', ']', ';', '.', ':', '}', '?.', '(', '['].indexOf(next.v) !== -1) ||
                               (next.t === 'tpl'));
          if (!cont) nl();
          continue;
        }
        case '(': {
          curParen++;
          // space after control keywords: `if (`, `for (`, `while (`
          if (prev && prev.t === 'key' && CONTROL_KEYWORDS.has(prev.v)) space();
          else if (prev && prev.t === 'key' && ['return', 'typeof', 'void', 'delete', 'in',
                   'instanceof', 'new', 'throw', 'await', 'yield', 'case'].includes(prev.v)) space();
          write('(');
          if (t.ctrl && looksBackFor(sig, k, 'for')) inForHead++;
          continue;
        }
        case ')': {
          curParen = Math.max(0, curParen - 1);
          write(')');
          if (inForHead > 0 && t.ctrl) inForHead--;
          continue;
        }
        case '[': write('['); continue;
        case ']': write(']'); continue;
        case ';': {
          write(';');
          if (inForHead > 0) { space(); }        // for(a;b;c) stays on one line
          else nl();
          continue;
        }
        case ',': {
          write(',');
          const inObj = blockKind.length && blockKind[blockKind.length - 1] === 'obj';
          if (inObj && curParen === (parenDepth.length ? parenDepth[parenDepth.length - 1] : 0)) nl();
          else space();
          continue;
        }
        case ':': {
          const inSwitch = blockKind.length && blockKind[blockKind.length - 1] === 'switch';
          if (inSwitch && prevIsCaseLabel(sig, k)) { write(':'); depth++; nl(); continue; }
          write(':'); space(); continue;
        }
        case '.': case '?.': write(t.v); continue;
        case '++': case '--': write(t.v); continue;
        case '!': case '~': write(t.v); continue;
        case '...': write('...'); continue;
        case '#': case '@': write(t.v); continue;
        default: {
          if (SPACED_OPS.has(t.v)) {
            if ((t.v === '+' || t.v === '-') && unaryContext(prev)) { write(t.v); continue; }
            space(); write(t.v); space(); continue;
          }
          if (t.v === '?') { space(); write('?'); space(); continue; }
          write(t.v); continue;
        }
      }
    }

    if (t.t === 'key') {
      // `case`/`default` outdent to the switch body level
      if ((t.v === 'case' || t.v === 'default') && blockKind.length &&
          blockKind[blockKind.length - 1] === 'switch') {
        const base = caseDepth.length ? caseDepth[caseDepth.length - 1] + 1 : depth;
        nl(); depth = base; emitIndent(); push(t.v); atLineStart = false;
        if (t.v === 'case') space();
        continue;
      }
      if (['else', 'catch', 'finally', 'while'].includes(t.v) && prev && prev.t === 'pun' && prev.v === '}') {
        // keep `} else {` on one line
        joinTail(' ' + t.v);
        continue;
      }
      if (prev && needsSpaceBeforeWord(prev)) space();
      write(t.v);
      // `return x` etc: NEVER break here (ASI hazard) — just a space.
      if (NO_BREAK_AFTER.has(t.v)) {
        if (next && !(next.t === 'pun' && (next.v === ';' || next.v === '}'))) space();
        continue;
      }
      if (next && !(next.t === 'pun' && [';', ',', ')', ']', '.', ':', '(' ].indexOf(next.v) !== -1)) space();
      else if (next && next.t === 'pun' && next.v === '(' && CONTROL_KEYWORDS.has(t.v)) space();
      continue;
    }

    // name / num / str / tpl / rgx — value copied verbatim
    if (prev && needsSpaceBeforeWord(prev)) space();
    write(t.v);
    if (next && next.t === 'key' && !['in', 'instanceof', 'of'].includes(next.v)) { /* space added by key branch */ }
    continue;
  }

  // Tail comments after the last significant token
  emitComments(comments[sig.length]);

  // Single join, then linear cleanup passes over the finished text.
  return buf.join('')
    .replace(/[ \t]+$/gm, '')
    .replace(/\n{3,}/g, '\n\n')
    .replace(/^\n+/, '')
    .replace(/\s+$/, '') + '\n';
}

function needsSpaceBeforeWord(prev) {
  if (prev.t === 'name' || prev.t === 'num' || prev.t === 'str' || prev.t === 'tpl' || prev.t === 'rgx') return true;
  if (prev.t === 'key') return true;
  if (prev.t === 'pun') return [')', ']', '}'].indexOf(prev.v) !== -1;
  return false;
}

// Walk back over a balanced (...) to find the keyword that heads it.
function looksBackFor(sig, k, word) {
  let d = 0;
  for (let j = k - 1; j >= 0 && j > k - 400; j--) {
    const t = sig[j];
    if (t.t === 'pun') {
      if (t.v === ')') d++;
      else if (t.v === '(') { if (d === 0) { const p = sig[j - 1]; return !!(p && p.t === 'key' && p.v === word); } d--; }
      else if (t.v === '{' || t.v === ';') return false;
    }
    if (d === 0 && t.t === 'key' && t.v === word) return true;
    if (d === 0 && t.t === 'pun' && (t.v === '{' || t.v === ';')) return false;
  }
  return false;
}

function prevIsCaseLabel(sig, k) {
  for (let j = k - 1; j >= 0 && j > k - 60; j--) {
    const t = sig[j];
    if (t.t === 'key' && (t.v === 'case' || t.v === 'default')) return true;
    if (t.t === 'pun' && (t.v === ';' || t.v === '{' || t.v === '}' || t.v === ':' || t.v === '?')) return false;
  }
  return false;
}

// Does the object literal starting at `k` contain anything that forces a break?
function containsBreak(sig, k) {
  let d = 0;
  for (let j = k; j < sig.length && j < k + 40; j++) {
    const t = sig[j];
    if (t.t === 'pun') {
      if (t.v === '{' || t.v === '(' || t.v === '[') d++;
      else if (t.v === '}' || t.v === ')' || t.v === ']') { d--; if (d === 0) return false; }
    }
    if (t.t === 'key' && ['function', 'if', 'for', 'while', 'switch', 'try', 'class'].includes(t.v)) return true;
  }
  return true;   // ran past the window -> too big to inline
}

// Attach each comment to the significant token that follows it.
function mapComments(toks) {
  const map = {};
  let sigIdx = 0, pending = [];
  for (const t of toks) {
    if (t.t === 'lcom' || t.t === 'bcom') { pending.push(t); continue; }
    if (t.t === 'ws') continue;
    if (pending.length) { map[sigIdx] = pending; pending = []; }
    sigIdx++;
  }
  if (pending.length) map[sigIdx] = pending;
  return map;
}

/* ================================================================== *
 * ROUND-TRIP VERIFIER
 *
 * The whole promise of this tool is "formatting only, meaning
 * unchanged". We prove it per-run instead of asserting it: re-tokenize
 * our own output and compare the significant token stream to the
 * input's. Any divergence is surfaced as a loud failure rather than a
 * quietly-wrong file.
 * ================================================================== */
function verifyRoundTrip(inToks, outText) {
  let outToks;
  try { outToks = tokenize(outText); }
  catch (e) { return { ok: false, detail: 're-tokenizing the output threw: ' + (e && e.message) }; }
  const a = significant(inToks), b = significant(outToks);
  if (a.length !== b.length) {
    // Find the first divergence to make the report actionable.
    let i = 0;
    while (i < a.length && i < b.length && a[i].t === b[i].t && a[i].v === b[i].v) i++;
    return { ok: false, detail: 'token count ' + a.length + ' in vs ' + b.length + ' out; first ' +
      'difference at token ' + (i + 1) + ' — in=' + JSON.stringify((a[i] || {}).v || '<eof>') +
      ' out=' + JSON.stringify((b[i] || {}).v || '<eof>') };
  }
  for (let i = 0; i < a.length; i++) {
    if (a[i].t !== b[i].t || a[i].v !== b[i].v) {
      return { ok: false, detail: 'token ' + (i + 1) + ' changed: ' + a[i].t + ' ' +
        JSON.stringify(a[i].v) + ' -> ' + b[i].t + ' ' + JSON.stringify(b[i].v) };
    }
  }
  return { ok: true, detail: a.length + ' tokens identical' };
}

/* ================================================================== *
 * ANALYSIS
 *
 * Everything below reads only the token stream that is already in
 * memory. No network, no heuristic "phone home", no telemetry.
 * ================================================================== */

// Secret/risk patterns. Deliberately conservative: a hit is "worth a
// human look", never "confirmed credential". Each carries why it fired.
const RISK_PATTERNS = [
  { id: 'jwt', level: 'bad', label: 'JWT',
    re: /\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\b/,
    why: 'Three base64url segments starting with eyJ — a signed JSON Web Token. Decode the payload to see scope and expiry.' },
  { id: 'jwt2', level: 'warn', label: 'JWT header only',
    re: /\beyJ[A-Za-z0-9_-]{16,}\b/,
    why: 'base64 of a JSON object beginning with {" — often a JWT header or an encoded config blob.' },
  { id: 'awsakid', level: 'bad', label: 'AWS access key ID',
    re: /\b(?:AKIA|ASIA|ABIA|ACCA)[0-9A-Z]{16}\b/,
    why: 'AWS access key ID format. ASIA = temporary STS credential; AKIA = long-lived IAM key.' },
  { id: 'awssecret', level: 'bad', label: 'possible AWS secret key',
    re: /\b(?:secret|SECRET|Secret)[A-Za-z_]*(?:key|KEY|Key)\b/,
    why: 'A key named like an AWS secret access key. Check the value next to it.' },
  { id: 'ghpat', level: 'bad', label: 'GitHub token',
    re: /\b(?:ghp|gho|ghu|ghs|ghr|github_pat)_[A-Za-z0-9_]{16,}\b/,
    why: 'GitHub personal access / OAuth / app token prefix.' },
  { id: 'slack', level: 'bad', label: 'Slack token',
    re: /\bxox[abposr]-[A-Za-z0-9-]{10,}\b/,
    why: 'Slack API token prefix.' },
  { id: 'google', level: 'bad', label: 'Google API key',
    re: /\bAIza[0-9A-Za-z_-]{35}\b/,
    why: 'Google / Firebase API key format.' },
  { id: 'privkey', level: 'bad', label: 'PEM private key',
    re: /-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----/,
    why: 'A private key embedded in client-side JavaScript is always a finding.' },
  { id: 'bearer', level: 'warn', label: 'hardcoded Bearer',
    re: /\bBearer\s+[A-Za-z0-9._~+/=-]{12,}/,
    why: 'An Authorization header value baked into the script.' },
  { id: 'basicauth', level: 'bad', label: 'credentials in URL',
    re: /\b[a-z][a-z0-9+.-]*:\/\/[^\s'"`/@]+:[^\s'"`/@]+@/i,
    why: 'user:password@host inside a URL.' },
  { id: 'pwd', level: 'warn', label: 'password-like key',
    re: /\b(?:password|passwd|pwd|apikey|api_key|apiKey|auth_?token|access_?token|client_?secret|private_?key)\b/i,
    why: 'An identifier or string key that names a credential. The adjacent value is what matters.' },
  { id: 'conn', level: 'warn', label: 'connection string',
    re: /\b(?:jdbc:|oracle:thin:|mongodb(?:\+srv)?:\/\/|postgres(?:ql)?:\/\/|mysql:\/\/|redis:\/\/|Data Source=|Server=.*Database=)/i,
    why: 'A database connection string. Check for an embedded username/password.' },
  { id: 'privip', level: 'info', label: 'internal host / private IP',
    re: /\b(?:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|(?:[a-z0-9-]+\.)*(?:dstcorp\.net|ssnc-corp\.cloud|sscinc\.com|internal|local|localdomain|corp)\b)/i,
    why: 'An internal hostname or RFC1918 address left in shipped code — useful recon for an attacker.' },
  { id: 'evalish', level: 'warn', label: 'dynamic code execution',
    re: /^(?:eval|Function|setTimeout|setInterval|execScript)$/,
    identOnly: true,
    why: 'Dynamic evaluation. In minified bundles this is often a loader; it is also how obfuscated payloads unpack.' },
  { id: 'debugger', level: 'info', label: 'debugger statement',
    re: /^debugger$/, identOnly: true,
    why: 'A debugger statement left in a shipped bundle traps anyone with devtools open.' }
];

const URL_RE = /\b(?:https?|wss?|ftp|file):\/\/[^\s'"`<>()\\]{4,}/gi;

function analyze(toks, src) {
  const sig = significant(toks);
  const idents = new Map();          // name -> count
  const strings = [];                // { value, line, kind }
  const findings = [];               // { level, label, why, sample, line }
  const unterminated = [];
  const urls = new Map();            // url -> { count, line, host, scheme }
  const seenFinding = new Set();
  let mangled = 0, identTotal = 0;
  let sourceMap = null;
  const lineOf = lineIndexer(src);

  function addFinding(level, label, why, sample, line, id) {
    const key = id + '|' + sample;
    if (seenFinding.has(key)) return;
    seenFinding.add(key);
    findings.push({ level: level, label: label, why: why, sample: sample, line: line });
  }

  for (const t of toks) {
    if (t.t === 'lcom' || t.t === 'bcom') {
      if (t.unterminated) unterminated.push({ line: lineOf(t.s), what: 'block comment' });
      const m = /[#@]\s*sourceMappingURL\s*=\s*(\S+)/.exec(t.v);
      if (m) sourceMap = { url: m[1], line: lineOf(t.s) };
      scanText(t.v, lineOf(t.s), 'comment');
      continue;
    }
    if (t.t === 'str' || t.t === 'tpl') {
      if (t.unterminated || t.badNl) {
        unterminated.push({ line: lineOf(t.s), what: t.t === 'tpl' ? 'template literal' : 'string literal' });
      }
      const body = t.t === 'str' ? t.v.slice(1, -1) : t.v.slice(1, t.v.length - (t.unterminated ? 0 : 1));
      const decoded = decodeJsString(body);
      strings.push({ value: decoded, raw: body, line: lineOf(t.s), kind: t.t, len: decoded.length });
      scanText(decoded, lineOf(t.s), 'string');
      continue;
    }
    if (t.t === 'name') {
      identTotal++;
      idents.set(t.v, (idents.get(t.v) || 0) + 1);
      if (t.v.length <= 2 && !/^(?:id|ok|on|to|is|in|at|of|by|up|db|fs|os|ui|el|ms|kb|mb|gb|x|y|z|i|j|k|n|e|t)$/.test(t.v)) mangled++;
      else if (t.v.length <= 2) mangled++;
      for (const p of RISK_PATTERNS) {
        if (p.identOnly && p.re.test(t.v)) addFinding(p.level, p.label, p.why, t.v, lineOf(t.s), p.id);
      }
      continue;
    }
    if (t.t === 'key' && t.v === 'debugger') {
      addFinding('info', 'debugger statement',
        'A debugger statement left in a shipped bundle traps anyone with devtools open.',
        'debugger', lineOf(t.s), 'debuggerkw');
    }
    if (t.t === 'rgx') scanText(t.v, lineOf(t.s), 'regex');
  }

  function scanText(text, line, where) {
    if (!text) return;
    for (const p of RISK_PATTERNS) {
      if (p.identOnly) continue;
      const m = p.re.exec(text);
      if (m) {
        addFinding(p.level, p.label, p.why + ' (found in ' + where + ')', redact(m[0]), line, p.id);
      }
    }
    URL_RE.lastIndex = 0;
    let um;
    while ((um = URL_RE.exec(text)) !== null) {
      const u = um[0].replace(/[.,;:'")\]}]+$/, '');
      const cur = urls.get(u);
      if (cur) cur.count++;
      else {
        let host = '', scheme = '';
        const hm = /^([a-z]+):\/\/([^/?#]*)/i.exec(u);
        if (hm) { scheme = hm[1].toLowerCase(); host = hm[2]; }
        urls.set(u, { count: 1, line: line, host: host, scheme: scheme });
      }
    }
  }

  const identArr = Array.from(idents.entries())
    .map(([name, count]) => ({ name: name, count: count, mangled: name.length <= 2 }))
    .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));

  strings.sort((a, b) => b.len - a.len);

  const order = { bad: 0, warn: 1, info: 2 };
  findings.sort((a, b) => order[a.level] - order[b.level] || a.line - b.line);

  return {
    sigCount: sig.length,
    identUnique: idents.size,
    identTotal: identTotal,
    manglePct: identTotal ? Math.round(mangled / identTotal * 100) : 0,
    idents: identArr,
    strings: strings,
    findings: findings,
    urls: Array.from(urls.entries()).map(([u, m]) => ({ url: u, count: m.count, line: m.line, host: m.host, scheme: m.scheme }))
             .sort((a, b) => b.count - a.count || a.url.localeCompare(b.url)),
    unterminated: unterminated,
    sourceMap: sourceMap
  };
}

// Show enough of a secret to identify it, not enough to use it.
function redact(s) {
  if (s.length <= 18) return s;
  return s.slice(0, 10) + '…[' + (s.length - 16) + ' chars]…' + s.slice(-6);
}

function decodeJsString(body) {
  return body.replace(/\\(u\{([0-9a-fA-F]+)\}|u([0-9a-fA-F]{4})|x([0-9a-fA-F]{2})|n|r|t|b|f|v|0|\\|'|"|`|\/|\n)/g,
    (m, all, uBrace, u4, x2, ) => {
      if (uBrace) { try { return String.fromCodePoint(parseInt(uBrace, 16)); } catch (e) { return m; } }
      if (u4) return String.fromCharCode(parseInt(u4, 16));
      if (x2) return String.fromCharCode(parseInt(x2, 16));
      const c = m[1];
      return { n: '\n', r: '\r', t: '\t', b: '\b', f: '\f', v: '\v', '0': '\0' }[c] !== undefined
        ? { n: '\n', r: '\r', t: '\t', b: '\b', f: '\f', v: '\v', '0': '\0' }[c] : c;
    });
}

// Byte offset -> 1-based line number, via binary search over line starts.
function lineIndexer(src) {
  const starts = [0];
  for (let i = 0; i < src.length; i++) if (src[i] === '\n') starts.push(i + 1);
  return function (off) {
    let lo = 0, hi = starts.length - 1;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (starts[mid] <= off) lo = mid; else hi = mid - 1; }
    return lo + 1;
  };
}

/* ================================================================== *
 * TAB RENDERERS
 * ================================================================== */

function renderTab(id) {
  const a = STATE.analysis;
  if (id === 'code')     return renderCode();
  if (id === 'findings') return renderFindings(a);
  if (id === 'strings')  return renderStrings(a);
  if (id === 'urls')     return renderUrls(a);
  if (id === 'idents')   return renderIdents(a);
  return renderAbout(a);
}

function renderCode() {
  const lines = STATE.lines;
  const shown = Math.min(lines.length, MAX_RENDER_LINES);
  const doHilite = cbHilite.checked && STATE.bytes <= HILITE_MAX_BYTES;
  let rows = '';
  for (let i = 0; i < shown; i++) {
    rows += '<tr data-ln="' + (i + 1) + '"><td class="ln">' + (i + 1) + '</td><td>' +
      (doHilite ? hiliteLine(lines[i]) : esc(lines[i]) || '&nbsp;') + '</td></tr>';
  }
  let foot = '';
  if (shown < lines.length) {
    foot = '<div class="trunc">Showing the first ' + shown.toLocaleString() + ' of ' +
      lines.length.toLocaleString() + ' lines. The remaining ' +
      (lines.length - shown).toLocaleString() + ' are formatted but not painted — ' +
      '<b>“Download .js” gives you the complete file.</b></div>';
  }
  const rt = STATE.verify.ok
    ? '<span class="badge ok">round-trip PASS</span>'
    : '<span class="badge bad">round-trip FAIL</span>';
  return '<div class="codewrap"><div class="chead">' + rt +
    '<span>' + esc(STATE.name) + '</span><span class="sp"></span>' +
    '<button id="copyOut">Copy all</button></div>' +
    '<div class="codescroll"><table class="code"><tbody>' + rows + '</tbody></table></div>' +
    foot + '</div>';
}

// Highlighter runs the same tokenizer on one output line. Because a line
// can start mid-string/mid-comment we only colour lines that tokenize
// cleanly on their own; anything else is escaped plain. Wrong colours
// would be worse than none.
function hiliteLine(line) {
  if (!line) return '&nbsp;';
  if (line.length > 4000) return esc(line);
  let toks;
  try { toks = tokenize(line); } catch (e) { return esc(line); }
  let html = '';
  for (let i = 0; i < toks.length; i++) {
    const t = toks[i];
    const v = esc(t.v);
    switch (t.t) {
      case 'key': html += '<span class="tk-key">' + v + '</span>'; break;
      case 'str': case 'tpl': html += '<span class="tk-str">' + v + '</span>'; break;
      case 'num': html += '<span class="tk-num">' + v + '</span>'; break;
      case 'lcom': case 'bcom': html += '<span class="tk-com">' + v + '</span>'; break;
      case 'rgx': html += '<span class="tk-rgx">' + v + '</span>'; break;
      case 'pun': html += '<span class="tk-pun">' + v + '</span>'; break;
      case 'name': {
        const nx = toks[i + 1];
        const isCall = nx && nx.t === 'pun' && nx.v === '(';
        html += isCall ? '<span class="tk-fn">' + v + '</span>' : v;
        break;
      }
      default: html += v;
    }
  }
  return html || '&nbsp;';
}

function renderFindings(a) {
  const caveat = '<div class="caveat"><b>These are leads, not verdicts.</b>' +
    'Every row is a pattern match on text that is already in this file — a hit does not prove a live ' +
    'credential, and a clean tab does not prove there are none. Values are truncated on screen so a ' +
    'screenshot does not leak the whole secret; the untruncated text is in the Beautified tab.</div>';
  if (!a.findings.length) {
    return caveat + '<div class="card"><h2>Secrets &amp; risks</h2><div class="empty">' +
      'No patterns from the built-in list matched. That covers JWTs, AWS/GitHub/Slack/Google key ' +
      'formats, PEM private keys, connection strings, credential-shaped identifiers, internal ' +
      'hostnames and RFC1918 addresses — <b>not</b> secrets in formats it has never seen.</div></div>';
  }
  const rows = a.findings.slice(0, MAX_FINDING_ROWS).map(f =>
    '<tr><td><span class="badge ' + f.level + '">' + esc(f.label) + '</span></td>' +
    '<td class="mono">' + esc(f.sample) + '</td>' +
    '<td><button class="jump" data-line="' + f.line + '">' + f.line + '</button></td>' +
    '<td>' + esc(f.why) + '</td></tr>').join('');
  const foot = a.findings.length > MAX_FINDING_ROWS
    ? '<div class="trunc">Showing ' + MAX_FINDING_ROWS.toLocaleString() + ' of ' +
      a.findings.length.toLocaleString() + ' findings.</div>' : '';
  return caveat + '<div class="card"><h2>Secrets &amp; risks<span class="sp"></span>' +
    '<span class="badge bad">' + a.findings.filter(f => f.level === 'bad').length + ' high</span>' +
    '<span class="badge warn">' + a.findings.filter(f => f.level === 'warn').length + ' medium</span>' +
    '<span class="badge info">' + a.findings.filter(f => f.level === 'info').length + ' info</span></h2>' +
    '<div class="body tight"><div class="scrollbox"><table class="grid"><thead><tr>' +
    '<th>Pattern</th><th>Match (truncated)</th><th>Line</th><th>Why it fired</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table></div>' + foot + '</div></div>';
}

function renderStrings(a) {
  if (!a.strings.length) return '<div class="card"><h2>Strings</h2><div class="empty">No string or template literals.</div></div>';
  const rows = a.strings.slice(0, MAX_STRINGS_ROWS).map(s =>
    '<tr><td class="num">' + s.len.toLocaleString() + '</td>' +
    '<td>' + (s.kind === 'tpl' ? '<span class="badge info">template</span>' : '') + '</td>' +
    '<td class="mono">' + esc(s.value.length > 400 ? s.value.slice(0, 400) + ' …[truncated]' : s.value) + '</td>' +
    '<td><button class="jump" data-line="' + s.line + '">' + s.line + '</button></td></tr>').join('');
  const foot = a.strings.length > MAX_STRINGS_ROWS
    ? '<div class="trunc">Showing the ' + MAX_STRINGS_ROWS.toLocaleString() + ' longest of ' +
      a.strings.length.toLocaleString() + ' strings. Individual values over 400 chars are cut on ' +
      'screen only.</div>' : '';
  return '<div class="card"><h2>String inventory <span class="hint">longest first — ' +
    'minifiers cannot rename string contents, so this is the most readable part of a bundle</span></h2>' +
    '<div class="body tight"><div class="scrollbox"><table class="grid"><thead><tr>' +
    '<th>Len</th><th></th><th>Value (escapes decoded)</th><th>Line</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table></div>' + foot + '</div></div>';
}

function renderUrls(a) {
  if (!a.urls.length) return '<div class="card"><h2>URLs &amp; hosts</h2><div class="empty">' +
    'No absolute URLs found. Relative paths (<code>/api/v2/thing</code>) are not listed here — ' +
    'they have no host to report.</div></div>';
  const rows = a.urls.map(u =>
    '<tr><td class="mono">' + esc(u.scheme) + '</td>' +
    '<td class="mono">' + esc(u.host) + '</td>' +
    '<td class="mono">' + esc(u.url.length > 300 ? u.url.slice(0, 300) + '…' : u.url) + '</td>' +
    '<td class="num">' + u.count + '</td>' +
    '<td><button class="jump" data-line="' + u.line + '">' + u.line + '</button></td></tr>').join('');
  return '<div class="card"><h2>URLs &amp; hosts <span class="hint">every absolute endpoint this ' +
    'bundle references</span></h2><div class="body tight"><div class="scrollbox">' +
    '<table class="grid"><thead><tr><th>Scheme</th><th>Host</th><th>URL</th><th>×</th><th>Line</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table></div></div></div>';
}

function renderIdents(a) {
  const sm = a.sourceMap
    ? '<div class="caveat"><b>This bundle names a source map.</b>' +
      '<code>' + esc(a.sourceMap.url) + '</code> (line ' + a.sourceMap.line + '). If you can obtain ' +
      'that .map file, it restores the <i>original</i> identifier names and file layout — which is the ' +
      'only real fix for mangled code. This viewer does not fetch it (no network by design); open it ' +
      'with the source-map viewer or a local devtools session.</div>'
    : '<div class="caveat"><b>No sourceMappingURL in this file.</b>' +
      'Without a source map, single-letter names cannot be recovered — not by this tool and not by ' +
      'any other beautifier. What you see below is what survived minification.</div>';
  const rows = a.idents.slice(0, MAX_FINDING_ROWS).map(d =>
    '<tr><td class="mono">' + esc(d.name) + '</td><td class="num">' + d.count.toLocaleString() + '</td>' +
    '<td>' + (d.mangled ? '<span class="badge warn">mangled</span>' : '') + '</td></tr>').join('');
  const foot = a.idents.length > MAX_FINDING_ROWS
    ? '<div class="trunc">Showing the ' + MAX_FINDING_ROWS.toLocaleString() + ' most-used of ' +
      a.idents.length.toLocaleString() + ' unique identifiers.</div>' : '';
  return sm + '<div class="card"><h2>Identifiers<span class="sp"></span>' +
    '<span class="hint">' + a.manglePct + '% of ' + a.identTotal.toLocaleString() +
    ' occurrences are 1–2 characters</span></h2>' +
    '<div class="body tight"><div class="scrollbox"><table class="grid"><thead><tr>' +
    '<th>Name</th><th>×</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    foot + '</div></div>';
}

function renderAbout(a) {
  const ut = a.unterminated.length
    ? '<div class="card"><h2>Unterminated literals</h2><div class="body"><div class="kv">' +
      a.unterminated.slice(0, 50).map(u =>
        '<div class="k">Line ' + u.line + '</div><div class="v plain">unterminated ' + esc(u.what) + '</div>').join('') +
      '</div><p class="hint" style="margin:10px 0 0">A file that ends inside a string or comment is ' +
      'usually truncated — check whether the copy you have is complete.</p></div></div>'
    : '';
  return '<div class="card"><h2>What this tool can and cannot do</h2><div class="body">' +
    '<p><b>It restores formatting. It does not restore names.</b> Minification does two separate ' +
    'things: it strips whitespace (fully reversible — that is what this does) and it <i>renames</i> ' +
    'identifiers to single letters (not reversible). After beautifying, <code>function t(e,n)</code> ' +
    'is still <code>function t(e,n)</code>, just readable. Only the original source map recovers the ' +
    'real names.</p>' +
    '<p><b>Formatting is verified, not assumed.</b> Every run re-tokenizes the output and compares it ' +
    'token-for-token against the input. This run: <b>' + (STATE.verify.ok ? 'PASS' : 'FAIL') + '</b> — ' +
    esc(STATE.verify.detail) + '. Token values are copied byte-for-byte, so strings, template ' +
    'literals, regexes and comments are never rewritten.</p>' +
    '<p><b>Known limits, stated plainly:</b></p><ul>' +
    '<li>This is a lexer, not a parser. It does not build an AST, so it will not reflow long ' +
    'expressions, unwrap comma-sequences (<code>a=1,b=2</code>), split <code>&amp;&amp;</code> chains ' +
    'back into <code>if</code> statements, or undo any other structural transform a minifier applied.</li>' +
    '<li>Inlined helpers, hoisted variables and dead-code elimination are permanent. The bundle you ' +
    'see is the bundle that shipped.</li>' +
    '<li>Syntax highlighting colours each output line independently. A line that begins inside a ' +
    'multi-line template literal or block comment is shown uncoloured rather than mis-coloured.</li>' +
    '<li>Highlighting is skipped above ' + fmtBytes(HILITE_MAX_BYTES) + '; on-screen rendering stops ' +
    'at ' + MAX_RENDER_LINES.toLocaleString() + ' lines (the download is always complete); input is ' +
    'refused above ' + fmtBytes(HARD_MAX_BYTES) + '.</li>' +
    '<li>The secrets tab matches a fixed pattern list. It finds what it knows and nothing else — ' +
    'absence of findings is not evidence of absence.</li>' +
    '</ul>' +
    '<p><b>Privacy:</b> this page has no <code>&lt;script src&gt;</code>, no <code>&lt;link href&gt;</code>, ' +
    'no <code>fetch</code>, no <code>XMLHttpRequest</code> and no beacon. It runs from a local file with ' +
    'the network cable unplugged. Nothing you paste leaves this machine — which is the entire point of ' +
    'using it instead of an online beautifier.</p>' +
    '</div></div>' + ut;
}

/* ================================================================== *
 * WIRING
 * ================================================================== */

function reset() {
  STATE = null;
  panel.classList.remove('show'); panel.innerHTML = '';
  tabsEl.classList.remove('show'); tabsEl.innerHTML = '';
  statsEl.style.display = 'none'; statsEl.innerHTML = '';
  confirmEl.style.display = 'none'; confirmEl.innerHTML = '';
  metaEl.textContent = '';
  reformatBtn.disabled = true; dlBtn.disabled = true;
  setNotes([]); clearError();
}

function beginFromText(text, name) {
  clearError();
  confirmEl.style.display = 'none';
  const bytes = new Blob([text]).size;
  if (!text.trim()) { showError('Nothing to beautify — the input is empty.'); return; }
  if (bytes > HARD_MAX_BYTES) {
    showError('Refusing to load ' + fmtBytes(bytes) + '.\nThe hard cap in this tool is ' +
      fmtBytes(HARD_MAX_BYTES) + ' — above that the browser tab reliably dies mid-format and you ' +
      'lose the result.\n\nSplit the file, or run a CLI beautifier on the server instead.');
    return;
  }
  if (bytes > CONFIRM_BYTES) {
    confirmEl.style.display = 'block';
    confirmEl.innerHTML = '<b>' + esc(name || 'Input') + ' is ' + fmtBytes(bytes) + '.</b> ' +
      'Formatting a file this size runs a full lexical scan in the page and can take a while — ' +
      'the tab will be unresponsive until it finishes. Nothing is uploaded either way.' +
      '<div class="row-controls"><button id="cfYes">Beautify anyway</button>' +
      '<button id="cfNo">Cancel</button></div>';
      $('cfYes').onclick = () => { confirmEl.style.display = 'none'; run(text, name, bytes); };
      $('cfNo').onclick = () => { confirmEl.style.display = 'none'; };
    return;
  }
  run(text, name, bytes);
}

function run(text, name, bytes) {
  const notes = [];
  let toks;
  try {
    toks = tokenize(text);
  } catch (e) {
    showError('Tokenizer failed: ' + (e && e.message ? e.message : String(e)) +
      '\n\nThis is a bug in the viewer, not necessarily in your file. Nothing was modified.');
    return;
  }
  const indent = indentSel.value === 'tab' ? '\t' : ' '.repeat(parseInt(indentSel.value, 10) || 2);
  let out;
  try {
    out = formatTokens(toks, { indent: indent, breakObjects: cbBreakObj.checked });
  } catch (e) {
    showError('Formatter failed: ' + (e && e.message ? e.message : String(e)) +
      '\n\nNothing was modified. Your input is still in the box above.');
    return;
  }

  // Round-trip check: re-tokenize the output and compare the significant
  // token stream against the input's. If these diverge, the formatter
  // changed the meaning of the code and the user must be told loudly.
  const verify = verifyRoundTrip(toks, out);

  const analysis = analyze(toks, text);
  const lines = out.split('\n');

  STATE = { src: text, name: name || 'pasted.js', bytes: bytes, tokens: toks, out: out,
            lines: lines, analysis: analysis, verify: verify, indent: indent };

  if (!verify.ok) {
    notes.push('ROUND-TRIP CHECK FAILED — the formatted output does not tokenize back to the same ' +
      'token stream as the input (' + verify.detail + '). Treat the output as READ-ONLY: it may not ' +
      'be equivalent to your original. Please report the input shape that caused this.');
  }
  if (analysis.unterminated.length) {
    notes.push(analysis.unterminated.length + ' unterminated literal(s)/comment(s) found — the file ' +
      'may be truncated. Formatting continued past them; check the flagged lines.');
  }
  if (lines.length > MAX_RENDER_LINES) {
    notes.push('Output is ' + lines.length.toLocaleString() + ' lines; only the first ' +
      MAX_RENDER_LINES.toLocaleString() + ' are painted on screen. Use "Download .js" to get the ' +
      'complete formatted file — the download is NOT truncated.');
  }
  if (cbHilite.checked && bytes > HILITE_MAX_BYTES) {
    notes.push('Syntax highlighting was skipped: input is larger than ' + fmtBytes(HILITE_MAX_BYTES) +
      ' and per-token colouring would stall the tab. Formatting itself is unaffected.');
  }
  STATE.notes = notes;

  reformatBtn.disabled = false; dlBtn.disabled = false;
  setNotes(notes);
  renderAll();
}

function renderAll() {
  if (!STATE) return;
  const a = STATE.analysis;
  const grew = STATE.out.length - STATE.src.length;
  statsEl.style.display = 'flex';
  const cards = [
    { lbl: 'Input', val: fmtBytes(STATE.bytes) },
    { lbl: 'Formatted', val: fmtBytes(new Blob([STATE.out]).size) + (grew > 0 ? ' (+' + fmtBytes(grew) + ')' : '') },
    { lbl: 'Lines in / out', val: (STATE.src.split('\n').length).toLocaleString() + ' → ' + STATE.lines.length.toLocaleString() },
    { lbl: 'Tokens', val: a.sigCount.toLocaleString() },
    { lbl: 'Identifiers', val: a.identUnique.toLocaleString() + ' unique' },
    { lbl: 'Mangled look', val: a.manglePct + '%' },
    { lbl: 'Strings', val: a.strings.length.toLocaleString() },
    { lbl: 'Round-trip', val: STATE.verify.ok ? 'PASS' : 'FAIL' }
  ];
  statsEl.innerHTML = cards.map(c =>
    '<div class="stat"><span class="lbl">' + esc(c.lbl) + '</span><b>' + esc(c.val) + '</b></div>').join('');

  metaEl.textContent = STATE.name + ' · ' + fmtBytes(STATE.bytes) + ' · ' +
    STATE.lines.length.toLocaleString() + ' lines out';

  const tabs = [
    { id: 'code',    label: 'Beautified',  n: STATE.lines.length },
    { id: 'findings',label: 'Secrets & risks', n: a.findings.length },
    { id: 'strings', label: 'Strings',     n: a.strings.length },
    { id: 'urls',    label: 'URLs & hosts',n: a.urls.length },
    { id: 'idents',  label: 'Identifiers', n: a.identUnique },
    { id: 'about',   label: 'What this can’t do', n: null }
  ];
  tabsEl.classList.add('show');
  tabsEl.innerHTML = tabs.map(t =>
    '<button data-tab="' + t.id + '" class="' + (t.id === ACTIVE_TAB ? 'on' : '') + '">' +
    esc(t.label) + (t.n === null ? '' : '<span class="n">' + t.n.toLocaleString() + '</span>') +
    '</button>').join('');
  tabsEl.querySelectorAll('button').forEach(b => {
    b.onclick = () => { ACTIVE_TAB = b.getAttribute('data-tab'); renderAll(); };
  });

  panel.classList.add('show');
  panel.innerHTML = renderTab(ACTIVE_TAB);
  wirePanel();
}

function wirePanel() {
  panel.querySelectorAll('.jump').forEach(b => {
    b.onclick = () => {
      const ln = parseInt(b.getAttribute('data-line'), 10);
      ACTIVE_TAB = 'code';
      renderAll();
      requestAnimationFrame(() => {
        const row = panel.querySelector('tr[data-ln="' + ln + '"]');
        if (row) {
          panel.querySelectorAll('tr.hl').forEach(r => r.classList.remove('hl'));
          row.classList.add('hl');
          row.scrollIntoView({ block: 'center' });
        }
      });
    };
  });
  const cp = panel.querySelector('#copyOut');
  if (cp) cp.onclick = async () => {
    try { await navigator.clipboard.writeText(STATE.out); cp.textContent = 'Copied'; }
    catch (e) { cp.textContent = 'Blocked by browser'; }
    setTimeout(() => { cp.textContent = 'Copy all'; }, 1400);
  };
}

reformatBtn.onclick = () => { if (STATE) run(STATE.src, STATE.name, STATE.bytes); };
indentSel.onchange = () => { if (STATE) run(STATE.src, STATE.name, STATE.bytes); };
cbBreakObj.onchange = () => { if (STATE) run(STATE.src, STATE.name, STATE.bytes); };
cbHilite.onchange = () => { if (STATE) renderAll(); };

dlBtn.onclick = () => {
  if (!STATE) return;
  // Blob + object URL is local-only; no network involved.
  const base = STATE.name.replace(/\.(js|mjs|cjs|jsx|ts|txt)$/i, '');
  const blob = new Blob([STATE.out], { type: 'text/javascript;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = base + '.beautified.js';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
};

$('goBtn').onclick = () => beginFromText(pasteEl.value, 'pasted.js');
$('clearBtn').onclick = () => { pasteEl.value = ''; reset(); pasteEl.focus(); };
pasteEl.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); beginFromText(pasteEl.value, 'pasted.js'); }
});

function readFile(f) {
  if (!f) return;
  if (f.size > HARD_MAX_BYTES) {
    showError('Refusing to load ' + f.name + ' (' + fmtBytes(f.size) + ').\nHard cap is ' +
      fmtBytes(HARD_MAX_BYTES) + '. Nothing was read.');
    return;
  }
  const fr = new FileReader();
  fr.onerror = () => showError('Could not read ' + f.name + ' — ' +
    (fr.error && fr.error.message ? fr.error.message : 'unknown FileReader error') + '.');
  fr.onload = () => beginFromText(String(fr.result), f.name);
  fr.readAsText(f);
}
fileEl.onchange = () => readFile(fileEl.files && fileEl.files[0]);
['dragenter', 'dragover'].forEach(ev => intakeEl.addEventListener(ev, e => {
  e.preventDefault(); e.stopPropagation(); dropEl.classList.add('hot');
}));
['dragleave', 'drop'].forEach(ev => intakeEl.addEventListener(ev, e => {
  e.preventDefault(); e.stopPropagation(); dropEl.classList.remove('hot');
}));
intakeEl.addEventListener('drop', e => {
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  readFile(f);
});

})();
</script>
</body>
</html>
