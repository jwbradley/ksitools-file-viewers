name: Bug report
description: Something is broken or behaves incorrectly
title: "[bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: viewer
    attributes:
      label: Viewer
      description: Which HTML file is affected?
      options:
        - ksitools-json-viewer.html
        - ksitools-yaml-viewer.html
        - ksitools-xml-viewer.html
        - ksitools-csv-viewer.html
        - ksitools-config-viewer.html
        - ksitools-log-viewer.html
        - ksitools-diff-viewer.html
        - ksitools-hex-viewer.html
        - ksitools-markdown-viewer.html
        - ksitools-sqlite-viewer.html
        - index.html / hub
        - documentation
        - multiple / other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: e.g. Firefox 128 on Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimize the sample file and redact secrets.
      placeholder: |
        1. Open …
        2. Drop …
        3. Click …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Console errors, file size, screenshots (no secrets).
