name: Feature request
description: Suggest an improvement or new viewer
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / opportunity
      description: What ops or support workflow is painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Keep local-only, single-file constraints in mind.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Improvement to an existing viewer
        - New format viewer
        - Documentation / packaging
        - Hub / GitHub Pages
        - Other
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints acknowledged
      options:
        - label: Should work offline with no required CDN
          required: true
        - label: Should not upload user file contents
          required: true
