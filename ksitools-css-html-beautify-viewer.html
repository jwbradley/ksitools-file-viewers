<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KSI Tools Minified CSS / HTML Beautifier</title>
<style id="appcss">
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:15px; line-height:1.5; background:#fff; color:#1f2328; }
header.bar { position:sticky; top:0; z-index:20; display:flex; gap:8px; align-items:center; padding:10px 16px; background:#f6f8fa; border-bottom:1px solid #d0d7de; flex-wrap:wrap; }
header.bar h1 { font-size:15px; margin:0; font-weight:600; white-space:nowrap; }
header.bar .meta { color:#57606a; font-size:12px; flex:1; min-width:60px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
button, select, input[type=text], textarea { font:inherit; font-size:13px; padding:6px 12px; border:1px solid #d0d7de; border-radius:6px; background:#fff; color:#1f2328; }
button { cursor:pointer; } button:hover { background:#f3f4f6; } button:disabled { opacity:.45; cursor:default; }
.hint { color:#8b949e; font-size:12px; }
label.inl { display:flex; align-items:center; gap:4px; font-size:12px; color:#57606a; white-space:nowrap; }

.intake { max-width:1180px; margin:22px auto 12px; padding:0 16px; }
.intake .drop { border:2px dashed #d0d7de; border-radius:10px; padding:22px 18px; text-align:center; background:#f6f8fa; }
.intake .drop.hot { border-color:#0969da; background:#ddf4ff; }
.intake .drop p { margin:6px 0; font-size:13px; color:#57606a; }
.intake label.tl { display:block; font-size:13px; color:#57606a; margin:14px 0 6px; }
#paste { width:100%; min-height:120px; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:12.5px; padding:10px; border:1px solid #d0d7de; border-radius:8px; resize:vertical; white-space:pre; overflow-x:auto; }
.row-controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px; }

#err { max-width:1180px; margin:18px auto; padding:14px 18px; border:1px solid #cf222e; border-radius:10px; background:rgba(207,34,46,.06); color:#cf222e; font-family:ui-monospace,monospace; font-size:13px; white-space:pre-wrap; display:none; }
#notice { padding:8px 16px; font-size:12.5px; background:#fff8c5; color:#7a5c00; border-bottom:1px solid #f0c000; display:none; white-space:pre-wrap; }
#confirm { max-width:1180px; margin:18px auto; padding:14px 18px; border:1px solid #f0c000; border-radius:10px; background:#fff8c5; color:#7a5c00; font-size:13px; display:none; }
#confirm .row-controls { margin-top:10px; }

.badge { display:inline-block; font-size:10px; font-weight:600; padding:1px 7px; border-radius:999px; border:1px solid #d0d7de; margin-right:4px; margin-bottom:4px; }
.badge.bad { background:#ffebe9; border-color:#ff8182; color:#cf222e; }
.badge.warn { background:#fff8c5; border-color:#f0c000; color:#7a5c00; }
.badge.ok { background:#dafbe1; border-color:#4ac26b; color:#1a7f37; }
.badge.info { background:#ddf4ff; border-color:#54aeff; color:#0969da; }

.stats { display:none; flex-wrap:wrap; gap:8px; margin:10px auto 4px; padding:0 16px; max-width:1180px; }
.stat { border:1px solid #d0d7de; border-radius:8px; padding:8px 12px; font-size:12.5px; background:#f6f8fa; min-width:110px; max-width:340px; }
.stat b { display:block; font-size:14px; word-break:break-word; }
.stat .lbl { color:#57606a; font-size:11px; text-transform:uppercase; letter-spacing:.03em; }

.tabs { display:none; max-width:1180px; margin:12px auto 0; padding:0 16px; gap:2px; border-bottom:1px solid #d0d7de; }
.tabs.show { display:flex; flex-wrap:wrap; }
.tabs button { border:1px solid transparent; border-bottom:none; border-radius:6px 6px 0 0; background:transparent; color:#57606a; padding:7px 14px; }
.tabs button.on { background:#fff; border-color:#d0d7de; color:#1f2328; font-weight:600; }
.tabs button .n { font-size:11px; color:#8b949e; margin-left:4px; }

.panel { max-width:1180px; margin:0 auto; padding:14px 16px 44px; display:none; }
.panel.show { display:block; }

.codewrap { border:1px solid #d0d7de; border-radius:10px; overflow:hidden; }
.codewrap .chead { display:flex; gap:8px; align-items:center; padding:7px 12px; background:#f6f8fa; border-bottom:1px solid #d0d7de; font-size:12px; color:#57606a; flex-wrap:wrap; }
.codewrap .chead .sp { flex:1; }
.codescroll { max-height:70vh; overflow:auto; background:#fff; }
table.code { border-collapse:collapse; width:100%; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:12.5px; }
table.code td { padding:0 0 0 10px; vertical-align:top; white-space:pre; }
table.code td.ln { text-align:right; padding:0 10px 0 12px; color:#8b949e; background:#f6f8fa; border-right:1px solid #d0d7de; user-select:none; width:1%; white-space:nowrap; position:sticky; left:0; }
table.code tr.hl td { background:#fff8c5; }
table.code tr.hl td.ln { background:#f0e3a0; }
.tk-sel { color:#116329; }
.tk-prop { color:#0550ae; }
.tk-val { color:#0a3069; }
.tk-at { color:#8250df; }
.tk-com { color:#6e7781; font-style:italic; }
.tk-pun { color:#57606a; }
.tk-tag { color:#116329; }
.tk-attr { color:#8250df; }
.tk-str { color:#0a3069; }
.tk-txt { color:#1f2328; }
.tk-doc { color:#6e7781; }

.card { border:1px solid #d0d7de; border-radius:10px; margin-bottom:12px; overflow:hidden; }
.card h2 { margin:0; padding:10px 14px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; background:#f6f8fa; border-bottom:1px solid #d0d7de; color:#57606a; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.card h2 .sp { flex:1; }
.card .body { padding:12px 14px; }
.card .body.tight { padding:0; }
.kv { display:grid; grid-template-columns:230px 1fr; gap:4px 12px; font-size:12.5px; }
.kv .k { color:#57606a; }
.kv .v { font-family:"Cascadia Code","Consolas",ui-monospace,monospace; word-break:break-all; }
.kv .v.plain { font-family:inherit; }

table.grid { border-collapse:collapse; width:100%; font-size:12.5px; }
table.grid th { text-align:left; padding:7px 10px; background:#f6f8fa; border-bottom:1px solid #d0d7de; color:#57606a; font-size:11px; text-transform:uppercase; letter-spacing:.03em; position:sticky; top:0; }
table.grid td { padding:6px 10px; border-bottom:1px solid #eaeef2; vertical-align:top; word-break:break-word; }
table.grid td.mono, table.grid th.mono { font-family:"Cascadia Code","Consolas",ui-monospace,monospace; }
table.grid td.num { text-align:right; white-space:nowrap; }
table.grid tr:hover td { background:#f6f8fa; }
.scrollbox { max-height:60vh; overflow:auto; }
.jump { color:#0969da; cursor:pointer; text-decoration:underline; background:none; border:none; padding:0; font:inherit; }
.trunc { padding:8px 12px; font-size:12px; color:#7a5c00; background:#fff8c5; border-top:1px solid #f0c000; }
.empty { padding:14px; color:#8b949e; font-size:13px; }
.caveat { border:1px solid #54aeff; background:#ddf4ff; color:#0a3069; border-radius:10px; padding:12px 14px; font-size:12.5px; margin-bottom:12px; }
.caveat b { display:block; margin-bottom:4px; }
.tree { font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:12.5px; }
.tree .ind { color:#d0d7de; }

@media (prefers-color-scheme: dark) {
  body { background:#0d1117; color:#e6edf3; }
  header.bar { background:#161b22; border-bottom-color:#30363d; }
  header.bar .meta, .hint, .intake .drop p, .intake label.tl, .stat .lbl, .kv .k, label.inl { color:#8b949e; }
  button, select, input[type=text], textarea, #paste { background:#21262d; color:#e6edf3; border-color:#30363d; }
  button:hover { background:#30363d; }
  .intake .drop { background:#161b22; border-color:#30363d; }
  .intake .drop.hot { border-color:#1f6feb; background:#121d2f; }
  .stat { background:#161b22; border-color:#30363d; }
  .tabs { border-bottom-color:#30363d; }
  .tabs button { color:#8b949e; }
  .tabs button.on { background:#0d1117; border-color:#30363d; color:#e6edf3; }
  .codewrap, .card { border-color:#30363d; }
  .codewrap .chead { background:#161b22; border-bottom-color:#30363d; color:#8b949e; }
  .codescroll { background:#0d1117; }
  table.code td.ln { background:#161b22; border-right-color:#30363d; color:#6e7781; }
  table.code tr.hl td { background:#3a2f00; }
  table.code tr.hl td.ln { background:#4a3c00; }
  .tk-sel, .tk-tag { color:#7ee787; }
  .tk-prop { color:#79c0ff; }
  .tk-val, .tk-str { color:#a5d6ff; }
  .tk-at, .tk-attr { color:#d2a8ff; }
  .tk-com, .tk-doc { color:#8b949e; }
  .tk-pun { color:#8b949e; }
  .tk-txt { color:#e6edf3; }
  .card h2 { background:#161b22; border-bottom-color:#30363d; color:#8b949e; }
  table.grid th { background:#161b22; border-bottom-color:#30363d; color:#8b949e; }
  table.grid td { border-bottom-color:#21262d; }
  table.grid tr:hover td { background:#161b22; }
  .badge { border-color:#30363d; }
  .badge.bad { background:#3d1418; border-color:#f85149; color:#ff7b72; }
  .badge.warn { background:#3a2f00; border-color:#b58900; color:#e3b341; }
  .badge.ok { background:#12261e; border-color:#238636; color:#3fb950; }
  .badge.info { background:#121d2f; border-color:#1f6feb; color:#58a6ff; }
  #notice, #confirm { background:#3a2f00; color:#e3b341; border-color:#b58900; }
  #err { border-color:#f85149; color:#ff7b72; background:rgba(248,81,73,.08); }
  .trunc { background:#3a2f00; color:#e3b341; border-top-color:#b58900; }
  .jump { color:#58a6ff; }
  .caveat { background:#121d2f; border-color:#1f6feb; color:#a5d6ff; }
  .empty { color:#6e7781; }
  .tree .ind { color:#30363d; }
}
</style>
</head>
<body>

<header class="bar">
  <h1>KSI Tools CSS / HTML Beautifier</h1>
  <span class="meta" id="meta"></span>
  <label class="inl">Mode <select id="modeSel">
    <option value="auto" selected>Auto-detect</option>
    <option value="css">CSS</option>
    <option value="html">HTML</option>
  </select></label>
  <label class="inl">Indent <select id="indentSel">
    <option value="2" selected>2 spaces</option>
    <option value="4">4 spaces</option>
    <option value="tab">Tab</option>
  </select></label>
  <label class="inl"><input type="checkbox" id="cbHilite" checked> Highlight</label>
  <button id="reformatBtn" disabled>Reformat</button>
  <button id="dlBtn" disabled>Download</button>
  <button id="clearBtn">Clear</button>
</header>

<div id="notice"></div>

<div class="intake" id="intake">
  <div class="drop" id="drop">
    <p><b>Drop a .css or .html file here</b> — or</p>
    <p><input type="file" id="file" accept=".css,.html,.htm,.xhtml,.svg,.vue,.scss,.less,.txt,text/css,text/html"></p>
    <p class="hint">Parsed and formatted entirely in your browser. Nothing is uploaded. Works offline with no network access.</p>
  </div>
  <label class="tl" for="paste">…or paste minified CSS / HTML:</label>
  <textarea id="paste" spellcheck="false" wrap="off" placeholder=".a{margin:0;width:calc(100% - 10px);background:url(data:image/gif;base64,R0lGODlhAQABAAAAACw=)}@media(max-width:600px){.a{display:none}}"></textarea>
  <div class="row-controls">
    <button id="goBtn">Beautify</button>
    <span class="hint">Ctrl+Enter in the box also works.</span>
  </div>
</div>

<div id="err"></div>
<div id="confirm"></div>
<div class="stats" id="stats"></div>
<div class="tabs" id="tabs"></div>
<div class="panel" id="panel"></div>

<script>
(function () {
'use strict';

/* ------------------------------------------------------------------ *
 * Limits. Every cap that fires is disclosed in #notice and/or a
 * .trunc footer. Nothing is silently dropped.
 * ------------------------------------------------------------------ */
const HARD_MAX_BYTES   = 100 * 1024 * 1024;
const CONFIRM_BYTES    = 8 * 1024 * 1024;
const MAX_RENDER_LINES = 50000;
const MAX_ROWS         = 3000;
const HILITE_MAX_BYTES = 4 * 1024 * 1024;

const $ = (id) => document.getElementById(id);
const pasteEl = $('paste'), panel = $('panel'), tabsEl = $('tabs'), statsEl = $('stats');
const errBox = $('err'), noticeEl = $('notice'), confirmEl = $('confirm');
const metaEl = $('meta'), dropEl = $('drop'), fileEl = $('file'), intakeEl = $('intake');
const modeSel = $('modeSel'), indentSel = $('indentSel'), cbHilite = $('cbHilite');
const reformatBtn = $('reformatBtn'), dlBtn = $('dlBtn');

let STATE = null;
let ACTIVE_TAB = 'code';

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function fmtBytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(2) + ' MB';
  return (n / 1024 / 1024 / 1024).toFixed(2) + ' GB';
}
function showError(m) { errBox.style.display = 'block'; errBox.textContent = m; }
function clearError() { errBox.style.display = 'none'; errBox.textContent = ''; }
function setNotes(list) {
  const real = (list || []).filter(Boolean);
  noticeEl.style.display = real.length ? 'block' : 'none';
  noticeEl.textContent = real.join('\n');
}

/* ================================================================== *
 * MODE DETECTION
 * ================================================================== */
function detectMode(src) {
  const head = src.slice(0, 4000);
  if (/^\s*<(?:!doctype|html|\?xml|!--|div|span|body|head|table|svg|section|main|p\b)/i.test(head)) return 'html';
  if (/<\/[a-z][a-z0-9-]*>/i.test(head) && /<[a-z][a-z0-9-]*[\s>]/i.test(head)) return 'html';
  if (/^\s*(?:@(?:charset|import|media|supports|font-face|keyframes)|[.#*\[a-z:])/i.test(head) &&
      /\{[^}]*:[^}]*\}/.test(head)) return 'css';
  if (/\{[^{}]*:[^{}]*;/.test(head)) return 'css';
  return /</.test(head) ? 'html' : 'css';
}

/* ================================================================== *
 * CSS TOKENIZER
 *
 * The traps a naive "split on ; and {" CSS formatter falls into, all
 * handled explicitly here:
 *
 *   - `url(data:image/gif;base64,...)` contains BOTH `;` and `,` and
 *     must survive as one atomic token. Unquoted url() is its own
 *     lexical mode in the CSS spec, and it is the single most common
 *     way beautifiers corrupt a stylesheet.
 *   - `calc(100% - 10px)` requires the spaces around `-` to be kept;
 *     `calc(100%-10px)` is invalid CSS. So we never touch whitespace
 *     inside a function's parens.
 *   - `content: "a;b{c}"` — strings can contain any structural char.
 *   - `@media screen and (max-width:600px)` — at-rule preludes are
 *     copied verbatim; only the block braces are reformatted.
 *   - Nested rules (`@media` > rule, and CSS-nesting `&:hover`) need a
 *     real brace stack, not a flat pass.
 *
 * Token kinds: ws, com, str, url, fn, at, ident, num, pun
 * ================================================================== */

function cssTokenize(src) {
  const toks = [];
  const n = src.length;
  let i = 0;

  function isWs(c) { return c === ' ' || c === '\t' || c === '\n' || c === '\r' || c === '\f'; }
  function isNameStart(c) { return /[a-zA-Z_]|[\u0080-\uffff]/.test(c) || c === '-'; }
  function isName(c) { return /[a-zA-Z0-9_-]|[\u0080-\uffff]/.test(c); }

  while (i < n) {
    const c = src[i], start = i;

    if (isWs(c)) {
      let j = i; while (j < n && isWs(src[j])) j++;
      toks.push({ t: 'ws', v: src.slice(i, j), s: start });
      i = j; continue;
    }

    /* comment — CSS has only /* *\/ ; `//` is NOT a comment in real CSS */
    if (c === '/' && src[i + 1] === '*') {
      let j = i + 2, closed = false;
      while (j < n) { if (src[j] === '*' && src[j + 1] === '/') { j += 2; closed = true; break; } j++; }
      toks.push({ t: 'com', v: src.slice(i, j), s: start, unterminated: !closed });
      i = j; continue;
    }

    /* string */
    if (c === '"' || c === "'") {
      let j = i + 1, closed = false;
      while (j < n) {
        if (src[j] === '\\') { j += 2; continue; }
        if (src[j] === c) { j++; closed = true; break; }
        if (src[j] === '\n') break;                 // unterminated at EOL
        j++;
      }
      toks.push({ t: 'str', v: src.slice(i, j), s: start, unterminated: !closed });
      i = j; continue;
    }

    /* url( ... ) — atomic, unquoted body may hold ; , ) escapes */
    if ((c === 'u' || c === 'U') && /^url\(/i.test(src.slice(i, i + 4))) {
      let j = i + 4;
      while (j < n && isWs(src[j])) j++;
      if (src[j] === '"' || src[j] === "'") {
        const q = src[j]; j++;
        while (j < n) { if (src[j] === '\\') { j += 2; continue; } if (src[j] === q) { j++; break; } j++; }
        while (j < n && isWs(src[j])) j++;
        if (src[j] === ')') j++;
      } else {
        // unquoted: run to the first unescaped ')'
        while (j < n) { if (src[j] === '\\') { j += 2; continue; } if (src[j] === ')') { j++; break; } j++; }
      }
      toks.push({ t: 'url', v: src.slice(i, j), s: start });
      i = j; continue;
    }

    /* function token: ident(  — captured whole, parens balanced, so
       calc()/var()/clamp()/min()/max() interiors are never respaced */
    if (isNameStart(c) || (c === '-' && isNameStart(src[i + 1] || ''))) {
      let j = i; while (j < n && isName(src[j])) j++;
      if (src[j] === '(') {
        let depth = 0, k = j;
        while (k < n) {
          const d = src[k];
          if (d === '\\') { k += 2; continue; }
          if (d === '"' || d === "'") {
            const q = d; k++;
            while (k < n) { if (src[k] === '\\') { k += 2; continue; } if (src[k] === q) { k++; break; } k++; }
            continue;
          }
          if (d === '(') { depth++; k++; continue; }
          if (d === ')') { depth--; k++; if (depth === 0) break; continue; }
          k++;
        }
        toks.push({ t: 'fn', v: src.slice(i, k), s: start, name: src.slice(i, j) });
        i = k; continue;
      }
      toks.push({ t: 'ident', v: src.slice(i, j), s: start });
      i = j; continue;
    }

    /* at-rule keyword */
    if (c === '@') {
      let j = i + 1; while (j < n && isName(src[j])) j++;
      toks.push({ t: 'at', v: src.slice(i, j), s: start, name: src.slice(i + 1, j).toLowerCase() });
      i = j; continue;
    }

    /* number / dimension / percentage */
    if (/[0-9]/.test(c) || ((c === '.' || c === '+' || c === '-') && /[0-9]/.test(src[i + 1] || ''))) {
      let j = i;
      if (c === '+' || c === '-') j++;
      while (j < n && /[0-9]/.test(src[j])) j++;
      if (src[j] === '.') { j++; while (j < n && /[0-9]/.test(src[j])) j++; }
      if (src[j] === 'e' || src[j] === 'E') {
        let k = j + 1; if (src[k] === '+' || src[k] === '-') k++;
        if (/[0-9]/.test(src[k] || '')) { j = k; while (j < n && /[0-9]/.test(src[j])) j++; }
      }
      if (src[j] === '%') j++;
      else while (j < n && isName(src[j])) j++;      // unit
      toks.push({ t: 'num', v: src.slice(i, j), s: start });
      i = j; continue;
    }

    toks.push({ t: 'pun', v: c, s: start });
    i++; continue;
  }
  return toks;
}

function cssSignificant(toks) {
  return toks.filter(t => t.t !== 'ws');
}

/* ------------------------------------------------------------------ *
 * CSS FORMATTER
 *
 * Chunk-array output with O(1) tail inspection — the same shape used in
 * the JS beautifier after a string-accumulator version proved O(n^2).
 * Token values are copied byte-for-byte; only whitespace between them
 * changes.
 * ------------------------------------------------------------------ */
function cssFormat(toks, opts) {
  const unit = opts.indent;
  const buf = [];
  let depth = 0, atLineStart = true;
  let inPrelude = false;      // between a selector/at-rule start and its `{` or `;`
  let inValue = false;        // after `:` inside a declaration block
  const stack = [];           // 'block' for each open `{`

  function push(s) { if (s) buf.push(s); }
  function tailChar() {
    for (let i = buf.length - 1; i >= 0; i--) { const c = buf[i]; if (c.length) return c.charAt(c.length - 1); }
    return '';
  }
  function nl() { if (!atLineStart) { push('\n'); atLineStart = true; } }
  function ind() { if (atLineStart) { push(unit.repeat(Math.max(0, depth))); atLineStart = false; } }
  function w(s) { ind(); push(s); }
  function sp() {
    if (atLineStart) return;
    const c = tailChar();
    if (c === '' || c === ' ' || c === '\t' || c === '\n') return;
    push(' ');
  }

  const sig = cssSignificant(toks);
  for (let k = 0; k < sig.length; k++) {
    const t = sig[k];
    const prev = k > 0 ? sig[k - 1] : null;
    const next = k + 1 < sig.length ? sig[k + 1] : null;

    if (t.t === 'com') {
      nl();
      const lines = t.v.split(/\r\n|\n|\r/);
      w(lines[0]);
      for (let m = 1; m < lines.length; m++) { nl(); w(lines[m].replace(/^\s+/, ' ')); }
      nl(); continue;
    }

    if (t.t === 'pun') {
      switch (t.v) {
        case '{':
          sp(); w('{'); stack.push('block'); depth++; inPrelude = false; inValue = false;
          if (next && next.t === 'pun' && next.v === '}') { /* empty rule stays `{}` */ }
          else nl();
          continue;
        case '}': {
          stack.pop(); depth--;
          if (tailChar() === '{') { push('}'); }
          else { nl(); w('}'); }
          nl(); inValue = false; inPrelude = false;
          continue;
        }
        case ';':
          w(';'); nl(); inValue = false; inPrelude = false;
          continue;
        case ':':
          // Declaration colon gets `: `; pseudo-class colon gets nothing.
          if (stack.length && !inPrelude) { w(':'); sp(); inValue = true; }
          else w(':');
          continue;
        case ',':
          w(',');
          // Selector lists break one-per-line; value lists stay inline.
          if (!inValue && !stack.length) nl();
          else if (!inValue && stack.length && !inPrelude) nl();
          else sp();
          continue;
        case '>': case '+': case '~':
          // Combinators in a selector want spaces; `+`/`~` inside a value
          // are arithmetic/operators and are left alone.
          if (!inValue) { sp(); w(t.v); sp(); } else { w(t.v); }
          continue;
        case '(':
          // In an at-rule prelude, `and (max-width:600px)` needs its space:
          // without it, `and(...)` lexes as a FUNCTION token and the query
          // changes meaning. Inside a declaration value, `(` follows a
          // function name and must stay tight.
          if (inPrelude && prev && (prev.t === 'ident' || prev.t === 'at')) sp();
          w('('); continue;
        case '!':
          sp(); w('!'); continue;
        default:
          w(t.v); continue;
      }
    }

    if (t.t === 'at') {
      nl(); w(t.v); inPrelude = true;
      if (next && !(next.t === 'pun' && (next.v === ';' || next.v === '{'))) sp();
      continue;
    }

    // ident / num / str / url / fn — value copied verbatim
    if (prev && needsSpaceCss(prev, t)) sp();
    w(t.v);
    continue;
  }

  return buf.join('')
    .replace(/[ \t]+$/gm, '')
    .replace(/\n{3,}/g, '\n\n')
    .replace(/^\n+/, '')
    .replace(/\s+$/, '') + '\n';
}

function needsSpaceCss(prev, cur) {
  if (prev.t === 'pun') {
    if (prev.v === ',' || prev.v === ':' || prev.v === ';' || prev.v === '{' || prev.v === '}') return false;
    if (prev.v === '(' || prev.v === '[') return false;
    if (prev.v === '.' || prev.v === '#' || prev.v === '*' || prev.v === '&') return false;
    if (prev.v === '>' || prev.v === '+' || prev.v === '~' || prev.v === '=') return false;
    if (prev.v === '!') return false;
    return true;
  }
  if (cur.t === 'pun') {
    // no space before these
    if ([',', ';', ':', ')', ']', '{', '}', '.', '('].indexOf(cur.v) !== -1) return false;
  }
  // ident/num/str/url/fn following ident/num/str/url/fn -> space
  // (e.g. `margin: 0 auto`, `1px solid red`, `screen and (...)`)
  return true;
}

/* ------------------------------------------------------------------ *
 * CSS ANALYSIS
 * ------------------------------------------------------------------ */
function cssAnalyze(toks, src) {
  const lineOf = lineIndexer(src);
  const rules = [];        // selector text per rule
  const atRules = new Map();
  const urls = [];
  const colors = new Map();
  const fonts = new Set();
  const imports = [];
  const findings = [];
  const unterminated = [];
  const props = new Map();
  const sig = cssSignificant(toks);
  let declCount = 0, importantCount = 0;

  let sel = [], depth = 0, curProp = null;
  for (let k = 0; k < sig.length; k++) {
    const t = sig[k];
    if (t.t === 'com' && t.unterminated) unterminated.push({ line: lineOf(t.s), what: 'comment' });
    if (t.t === 'str' && t.unterminated) unterminated.push({ line: lineOf(t.s), what: 'string' });

    if (t.t === 'at') {
      atRules.set(t.name, (atRules.get(t.name) || 0) + 1);
      if (t.name === 'import') {
        // collect the prelude up to ; or {
        let parts = [], m = k + 1;
        while (m < sig.length && !(sig[m].t === 'pun' && (sig[m].v === ';' || sig[m].v === '{'))) {
          parts.push(sig[m].v); m++;
        }
        imports.push({ text: parts.join(' '), line: lineOf(t.s) });
      }
    }
    if (t.t === 'url') {
      const inner = t.v.replace(/^url\(\s*/i, '').replace(/\s*\)$/, '').replace(/^["']|["']$/g, '');
      const isData = /^data:/i.test(inner);
      urls.push({ url: inner, line: lineOf(t.s), data: isData,
                  len: inner.length, mime: isData ? (inner.match(/^data:([^;,]*)/i) || [, ''])[1] : '' });
    }
    if (t.t === 'pun' && t.v === '{') depth++;
    if (t.t === 'pun' && t.v === '}') { depth = Math.max(0, depth - 1); curProp = null; }
    if (t.t === 'pun' && t.v === ';') curProp = null;
    if (t.t === 'ident' && depth > 0 && !curProp) {
      // property name if followed by ':'
      const nx = sig[k + 1];
      if (nx && nx.t === 'pun' && nx.v === ':') {
        curProp = t.v.toLowerCase();
        props.set(curProp, (props.get(curProp) || 0) + 1);
        declCount++;
        if (curProp === 'font-family') {
          let m = k + 2, parts = [];
          while (m < sig.length && !(sig[m].t === 'pun' && (sig[m].v === ';' || sig[m].v === '}'))) { parts.push(sig[m].v); m++; }
          parts.join(' ').split(',').forEach(f => { const c = f.trim().replace(/^["']|["']$/g, ''); if (c) fonts.add(c); });
        }
      }
    }
    if (t.t === 'pun' && t.v === '!') {
      const nx = sig[k + 1];
      if (nx && nx.t === 'ident' && /^important$/i.test(nx.v)) importantCount++;
    }
    if (t.t === 'ident' && /^#?[0-9a-f]{3,8}$/i.test(t.v) && depth > 0) { /* handled below */ }
    if (t.t === 'pun' && t.v === '#' && depth > 0) {
      const nx = sig[k + 1];
      if (nx && (nx.t === 'ident' || nx.t === 'num') && /^[0-9a-f]{3,8}$/i.test(nx.v)) {
        const hex = ('#' + nx.v).toLowerCase();
        colors.set(hex, (colors.get(hex) || 0) + 1);
      }
    }
    if (t.t === 'fn' && /^(?:rgb|rgba|hsl|hsla|color|oklch|lab)$/i.test(t.name)) {
      const key = t.v.replace(/\s+/g, '');
      colors.set(key, (colors.get(key) || 0) + 1);
    }
  }

  // selector collection: text between `}`/start and the next `{` at depth 0..n
  {
    let cur = [], d = 0;
    for (const t of sig) {
      if (t.t === 'com') continue;
      if (t.t === 'pun' && t.v === '{') {
        if (cur.length) rules.push({ sel: cur.join(' ').replace(/\s+/g, ' ').trim(), line: lineOf(cur[0].s || 0), depth: d });
        cur = []; d++; continue;
      }
      if (t.t === 'pun' && t.v === '}') { cur = []; d = Math.max(0, d - 1); continue; }
      if (t.t === 'pun' && t.v === ';') { cur = []; continue; }
      if (d === 0 || (d > 0 && looksLikeSelectorToken(t))) cur.push(t);
    }
  }

  // risk scan over strings/urls/comments
  for (const t of toks) {
    if (t.t === 'str' || t.t === 'url' || t.t === 'com') {
      scanRisk(t.v, lineOf(t.s), t.t === 'com' ? 'comment' : (t.t === 'url' ? 'url()' : 'string'), findings);
    }
  }

  const bigData = urls.filter(u => u.data).sort((a, b) => b.len - a.len);
  if (bigData.length) {
    const total = bigData.reduce((s, u) => s + u.len, 0);
    findings.push({ level: 'info', label: 'inlined data URIs',
      sample: bigData.length + ' data: URIs, ' + fmtBytes(total) + ' total',
      line: bigData[0].line,
      why: 'Base64-inlined assets. Large ones bloat the stylesheet and block first paint; the ' +
           'largest here is ' + fmtBytes(bigData[0].len) + ' (' + (bigData[0].mime || 'unknown type') + ').' });
  }

  return {
    kind: 'css',
    ruleCount: rules.length,
    rules: rules,
    declCount: declCount,
    importantCount: importantCount,
    atRules: Array.from(atRules.entries()).map(([n, c]) => ({ name: '@' + n, count: c })).sort((a, b) => b.count - a.count),
    props: Array.from(props.entries()).map(([n, c]) => ({ name: n, count: c })).sort((a, b) => b.count - a.count || a.name.localeCompare(b.name)),
    urls: urls,
    colors: Array.from(colors.entries()).map(([v, c]) => ({ value: v, count: c })).sort((a, b) => b.count - a.count),
    fonts: Array.from(fonts),
    imports: imports,
    findings: findings,
    unterminated: unterminated
  };
}

function looksLikeSelectorToken(t) {
  if (t.t === 'ident' || t.t === 'num') return true;
  if (t.t === 'pun') return ['.', '#', '&', '*', '>', '+', '~', '[', ']', '=', ':', '"', "'"].indexOf(t.v) !== -1;
  if (t.t === 'str' || t.t === 'fn') return true;
  return false;
}

/* ================================================================== *
 * HTML TOKENIZER
 *
 * The traps handled here:
 *
 *   - `<pre>`, `<textarea>`, `<script>`, `<style>` have whitespace that
 *     IS content. Re-indenting inside them changes what renders (or, in
 *     script/style, what executes). Their interiors are emitted
 *     byte-exact, no exceptions.
 *   - Void elements (`<br>`, `<img>`, `<input>`, …) have no close tag,
 *     so a naive depth counter drifts and everything after them is
 *     wrongly indented.
 *   - Inline elements (`<a>`, `<span>`, `<b>`, …) must not be split onto
 *     their own lines: `<b>bold</b>text` and `<b>bold</b> text` differ
 *     visibly. Breaking there inserts rendered whitespace.
 *   - Attribute values can contain `>` (`title="a > b"`), so the tag
 *     scanner must be quote-aware.
 *   - Comments, CDATA, DOCTYPE and processing instructions are copied
 *     verbatim, including conditional comments.
 *
 * Token kinds: text, open, close, self, comment, doctype, cdata, pi, raw
 * ================================================================== */

const VOID_TAGS = new Set(['area', 'base', 'br', 'col', 'embed', 'hr', 'img', 'input',
  'link', 'meta', 'param', 'source', 'track', 'wbr', 'basefont', 'bgsound', 'frame', 'keygen']);

// Whitespace inside these is significant / must not be reformatted.
const RAW_TAGS = new Set(['pre', 'textarea', 'script', 'style', 'code', 'listing', 'plaintext', 'xmp']);

// Never put these on their own line — that would add rendered whitespace.
const INLINE_TAGS = new Set(['a', 'abbr', 'b', 'bdi', 'bdo', 'br', 'cite', 'code', 'data', 'dfn',
  'em', 'i', 'kbd', 'mark', 'q', 'rp', 'rt', 'ruby', 's', 'samp', 'small', 'span', 'strong',
  'sub', 'sup', 'time', 'u', 'var', 'wbr', 'img', 'button', 'label', 'select', 'option',
  'textarea', 'input', 'output', 'picture', 'source', 'svg', 'del', 'ins', 'big', 'tt', 'font']);

function htmlTokenize(src) {
  const toks = [];
  const n = src.length;
  let i = 0;

  while (i < n) {
    const lt = src.indexOf('<', i);
    if (lt === -1) {
      if (i < n) toks.push({ t: 'text', v: src.slice(i), s: i });
      break;
    }
    if (lt > i) toks.push({ t: 'text', v: src.slice(i, lt), s: i });

    /* comment (incl. conditional comments) */
    if (src.startsWith('<!--', lt)) {
      const end = src.indexOf('-->', lt + 4);
      const j = end === -1 ? n : end + 3;
      toks.push({ t: 'comment', v: src.slice(lt, j), s: lt, unterminated: end === -1 });
      i = j; continue;
    }
    /* CDATA */
    if (src.startsWith('<![CDATA[', lt)) {
      const end = src.indexOf(']]>', lt + 9);
      const j = end === -1 ? n : end + 3;
      toks.push({ t: 'cdata', v: src.slice(lt, j), s: lt, unterminated: end === -1 });
      i = j; continue;
    }
    /* DOCTYPE / other <! declarations */
    if (src.startsWith('<!', lt)) {
      const end = src.indexOf('>', lt + 2);
      const j = end === -1 ? n : end + 1;
      toks.push({ t: 'doctype', v: src.slice(lt, j), s: lt, unterminated: end === -1 });
      i = j; continue;
    }
    /* processing instruction / XML decl */
    if (src.startsWith('<?', lt)) {
      const end = src.indexOf('>', lt + 2);
      const j = end === -1 ? n : end + 1;
      toks.push({ t: 'pi', v: src.slice(lt, j), s: lt, unterminated: end === -1 });
      i = j; continue;
    }
    /* close tag */
    if (src[lt + 1] === '/') {
      const end = src.indexOf('>', lt + 2);
      const j = end === -1 ? n : end + 1;
      const name = src.slice(lt + 2, end === -1 ? n : end).trim().toLowerCase();
      toks.push({ t: 'close', v: src.slice(lt, j), s: lt, name: name, unterminated: end === -1 });
      i = j; continue;
    }
    /* open / self-closing tag — quote-aware so `title="a>b"` survives */
    {
      let j = lt + 1, q = null;
      while (j < n) {
        const c = src[j];
        if (q) { if (c === q) q = null; j++; continue; }
        if (c === '"' || c === "'") { q = c; j++; continue; }
        if (c === '>') { j++; break; }
        j++;
      }
      const tagText = src.slice(lt, j);
      const nm = /^<\s*([a-zA-Z][a-zA-Z0-9:._-]*)/.exec(tagText);
      const name = nm ? nm[1].toLowerCase() : '';
      const selfClosed = /\/\s*>$/.test(tagText);
      const isVoid = VOID_TAGS.has(name);
      toks.push({
        t: selfClosed || isVoid ? 'self' : 'open',
        v: tagText, s: lt, name: name, selfClosed: selfClosed, isVoid: isVoid,
        attrs: parseAttrs(tagText, name)
      });
      i = j;

      // Raw-text element: capture its body verbatim up to the matching close.
      if (!selfClosed && !isVoid && RAW_TAGS.has(name) && name !== 'code') {
        const closeRe = new RegExp('<\\/\\s*' + name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*>', 'i');
        const rest = src.slice(i);
        const m = closeRe.exec(rest);
        const bodyEnd = m ? i + m.index : n;
        if (bodyEnd > i) toks.push({ t: 'raw', v: src.slice(i, bodyEnd), s: i, owner: name });
        i = bodyEnd;
        if (m) {
          toks.push({ t: 'close', v: m[0], s: i, name: name });
          i += m[0].length;
        }
      }
      continue;
    }
  }
  return toks;
}

function parseAttrs(tagText, name) {
  const out = [];
  const body = tagText.replace(/^<\s*[a-zA-Z][a-zA-Z0-9:._-]*/, '').replace(/\/?\s*>$/, '');
  const re = /([^\s=\/"'<>]+)(?:\s*=\s*("([^"]*)"|'([^']*)'|([^\s"'=<>`]+)))?/g;
  let m;
  while ((m = re.exec(body)) !== null) {
    if (!m[1]) continue;
    const val = m[3] !== undefined ? m[3] : (m[4] !== undefined ? m[4] : (m[5] !== undefined ? m[5] : null));
    out.push({ name: m[1], value: val, raw: m[0] });
  }
  return out;
}

/* ------------------------------------------------------------------ *
 * HTML FORMATTER
 * ------------------------------------------------------------------ */
function htmlFormat(toks, opts) {
  const unit = opts.indent;
  const buf = [];
  let depth = 0, atLineStart = true;
  const openStack = [];

  // Raw bodies (<pre>, <textarea>, <script>, <style>) must survive the
  // final whitespace-cleanup passes byte-exact. They are parked here and
  // re-inserted after cleanup via a placeholder that cannot occur in
  // markup (U+0000 is not valid in an HTML document).
  const parked = [];
  const PARK_A = '\u0000RAW', PARK_B = '\u0000';

  function push(s) { if (s) buf.push(s); }
  function tailChar() {
    for (let i = buf.length - 1; i >= 0; i--) { const c = buf[i]; if (c.length) return c.charAt(c.length - 1); }
    return '';
  }
  function nl() { if (!atLineStart) { push('\n'); atLineStart = true; } }
  function ind() { if (atLineStart) { push(unit.repeat(Math.max(0, depth))); atLineStart = false; } }
  function w(s) { ind(); push(s); }

  // Are we inside an element whose whitespace must not be touched?
  function inRaw() {
    for (let i = openStack.length - 1; i >= 0; i--) if (RAW_TAGS.has(openStack[i])) return true;
    return false;
  }

  for (let k = 0; k < toks.length; k++) {
    const t = toks[k];
    const next = toks[k + 1];

    if (t.t === 'raw') {
      // Byte-exact: parked so no later cleanup pass can touch it. Emitted
      // with no indent and no surrounding newline, because inside these
      // elements whitespace is content.
      const id = parked.push(t.v) - 1;
      push(PARK_A + id + PARK_B);
      atLineStart = false;
      continue;
    }

    if (t.t === 'text') {
      if (inRaw()) {
        const id = parked.push(t.v) - 1;
        push(PARK_A + id + PARK_B); atLineStart = false; continue;
      }
      const trimmed = t.v.replace(/\s+/g, ' ');
      if (!trimmed.trim()) {
        // Whitespace-only text between tags: collapsible layout, but keep a
        // single space when it sits between two inline elements, because
        // there it is rendered content.
        const prevTok = toks[k - 1], nextTok = next;
        const between = prevTok && nextTok &&
          (prevTok.t === 'close' || prevTok.t === 'self' || prevTok.t === 'text') &&
          (nextTok.t === 'open' || nextTok.t === 'self' || nextTok.t === 'text') &&
          isInlineTok(prevTok) && isInlineTok(nextTok);
        if (between && /[ \t\n]/.test(t.v)) { if (tailChar() !== ' ') push(' '); }
        continue;
      }
      const lead = /^\s/.test(t.v), trail = /\s$/.test(t.v);
      if (atLineStart) w(trimmed.trim());
      else {
        if (lead && tailChar() !== ' ') push(' ');
        push(trimmed.trim()); atLineStart = false;
      }
      if (trail && next && isInlineTok(next)) push(' ');
      continue;
    }

    if (t.t === 'comment' || t.t === 'doctype' || t.t === 'pi' || t.t === 'cdata') {
      if (inRaw()) { push(t.v); continue; }
      nl(); w(t.v); nl(); continue;
    }

    if (t.t === 'self') {
      if (inRaw()) { push(t.v); continue; }
      if (INLINE_TAGS.has(t.name)) { ind(); push(t.v); atLineStart = false; }
      else { nl(); w(t.v); nl(); }
      continue;
    }

    if (t.t === 'open') {
      if (inRaw()) { push(t.v); openStack.push(t.name); continue; }
      const inline = INLINE_TAGS.has(t.name);
      const raw = RAW_TAGS.has(t.name);
      if (inline && !raw) { ind(); push(t.v); atLineStart = false; }
      else { nl(); w(t.v); }
      openStack.push(t.name);
      // A raw element's open tag is NOT followed by a newline — the very
      // next character belongs to its body and adding one would change it.
      if (!inline && !raw) { depth++; nl(); }
      else if (raw) { depth++; atLineStart = false; }
      continue;
    }

    if (t.t === 'close') {
      // Pop to the matching open, tolerating unclosed tags rather than
      // drifting: mismatched markup is common in real bundles.
      let idx = -1;
      for (let m = openStack.length - 1; m >= 0; m--) if (openStack[m] === t.name) { idx = m; break; }
      const wasRaw = inRaw();
      if (idx === -1) {
        // stray close tag — emit it, change nothing
        if (wasRaw) push(t.v); else { ind(); push(t.v); atLineStart = false; }
        continue;
      }
      const removed = openStack.splice(idx);
      const inline = INLINE_TAGS.has(t.name) && removed.length === 1 && !RAW_TAGS.has(t.name);
      if (RAW_TAGS.has(t.name)) {
        // Closing a raw element: emit the close tag immediately after the
        // body with nothing inserted, then break the line.
        depth = Math.max(0, depth - 1);
        push(t.v); atLineStart = false; nl();
        continue;
      }
      const nonInline = removed.filter(nmm => !INLINE_TAGS.has(nmm)).length;
      if (inline) { ind(); push(t.v); atLineStart = false; continue; }
      depth = Math.max(0, depth - Math.max(1, nonInline));
      nl(); w(t.v); nl(); continue;
    }
  }

  let text = buf.join('')
    .replace(/[ \t]+$/gm, '')
    .replace(/\n{3,}/g, '\n\n')
    .replace(/^\n+/, '')
    .replace(/\s+$/, '') + '\n';

  // Restore parked raw bodies byte-for-byte, after all cleanup.
  text = text.replace(/\u0000RAW(\d+)\u0000/g, (m, id) => parked[Number(id)]);
  return text;
}

function isInlineTok(t) {
  if (!t) return false;
  if (t.t === 'text') return true;
  if (t.t === 'open' || t.t === 'close' || t.t === 'self') return INLINE_TAGS.has(t.name);
  return false;
}

/* ------------------------------------------------------------------ *
 * HTML ANALYSIS
 * ------------------------------------------------------------------ */
function htmlAnalyze(toks, src) {
  const lineOf = lineIndexer(src);
  const tags = new Map();
  const ids = new Map();
  const classes = new Map();
  const links = [];
  const findings = [];
  const unterminated = [];
  const inlineHandlers = [];
  const extRes = [];
  const forms = [];
  let textBytes = 0, maxDepth = 0, depth = 0;
  const stack = [];
  const unclosed = [];

  for (const t of toks) {
    if (t.unterminated) unterminated.push({ line: lineOf(t.s), what: t.t });

    if (t.t === 'text' || t.t === 'raw') {
      textBytes += t.v.length;
      scanRisk(t.v, lineOf(t.s), t.t === 'raw' ? 'inline script/style' : 'text', findings);
      continue;
    }
    if (t.t === 'comment') {
      scanRisk(t.v, lineOf(t.s), 'comment', findings);
      if (/\b(?:todo|fixme|hack|xxx|password|api[_-]?key|secret|token|remove before|debug)\b/i.test(t.v)) {
        findings.push({ level: 'info', label: 'notable comment',
          sample: t.v.replace(/\s+/g, ' ').slice(0, 90), line: lineOf(t.s),
          why: 'HTML comments ship to every visitor. This one mentions something worth checking.' });
      }
      continue;
    }
    if (t.t === 'open' || t.t === 'self') {
      tags.set(t.name, (tags.get(t.name) || 0) + 1);
      if (t.t === 'open') {
        stack.push({ name: t.name, line: lineOf(t.s) });
        depth++; if (depth > maxDepth) maxDepth = depth;
      }
      for (const a of (t.attrs || [])) {
        const an = a.name.toLowerCase();
        if (an === 'id' && a.value) ids.set(a.value, (ids.get(a.value) || 0) + 1);
        if (an === 'class' && a.value) a.value.split(/\s+/).forEach(c => { if (c) classes.set(c, (classes.get(c) || 0) + 1); });
        if (/^on[a-z]+$/.test(an)) {
          inlineHandlers.push({ tag: t.name, attr: an, line: lineOf(t.s),
            snippet: (a.value || '').replace(/\s+/g, ' ').slice(0, 80) });
          scanRisk(a.value || '', lineOf(t.s), 'inline ' + an + ' handler', findings);
        }
        if ((an === 'src' || an === 'href' || an === 'action' || an === 'data-src' || an === 'poster') && a.value) {
          const v = a.value.trim();
          const abs = /^[a-z][a-z0-9+.-]*:\/\//i.test(v);
          const proto = /^([a-z][a-z0-9+.-]*):/i.exec(v);
          links.push({ tag: t.name, attr: an, value: v, line: lineOf(t.s), absolute: abs,
                       scheme: proto ? proto[1].toLowerCase() : '' });
          if (abs) {
            // Anything absolute is a third-party reference worth listing.
            // script/link/iframe/img/form execute or embed, so they carry
            // more risk than a plain <a>, but an operator auditing a page
            // wants to see every off-origin destination.
            extRes.push({ tag: t.name, url: v, line: lineOf(t.s),
              executes: ['script', 'link', 'iframe', 'img', 'form', 'embed', 'object', 'source'].indexOf(t.name) !== -1 });
          }
          scanRisk(v, lineOf(t.s), an + ' attribute', findings);
        }
        if (an === 'style' && a.value) scanRisk(a.value, lineOf(t.s), 'inline style', findings);
        if (an === 'value' || an === 'content' || an === 'data-config') {
          if (a.value) scanRisk(a.value, lineOf(t.s), an + ' attribute', findings);
        }
      }
      if (t.name === 'form') {
        const method = (t.attrs.find(a => a.name.toLowerCase() === 'method') || {}).value || 'get';
        const action = (t.attrs.find(a => a.name.toLowerCase() === 'action') || {}).value || '';
        forms.push({ method: method.toUpperCase(), action: action, line: lineOf(t.s) });
      }
      continue;
    }
    if (t.t === 'close') {
      let idx = -1;
      for (let m = stack.length - 1; m >= 0; m--) if (stack[m].name === t.name) { idx = m; break; }
      if (idx === -1) {
        findings.push({ level: 'warn', label: 'stray close tag', sample: t.v, line: lineOf(t.s),
          why: 'A closing tag with no matching open tag. Browsers recover silently; the DOM you get ' +
               'is not the DOM the markup implies.' });
      } else {
        for (let m = stack.length - 1; m > idx; m--) unclosed.push(stack[m]);
        stack.splice(idx);
        depth = Math.max(0, stack.length);
      }
      continue;
    }
  }
  for (const s of stack) unclosed.push(s);
  if (unclosed.length) {
    findings.push({ level: 'warn', label: 'unclosed tags',
      sample: unclosed.slice(0, 6).map(u => '<' + u.name + '> @' + u.line).join(', ') +
              (unclosed.length > 6 ? ' +' + (unclosed.length - 6) + ' more' : ''),
      line: unclosed[0].line,
      why: 'Tags left open. The formatter tolerated them, but indentation past this point reflects ' +
           'the browser’s error recovery, not a clean tree.' });
  }
  if (extRes.length) {
    const exec = extRes.filter(r => r.executes);
    findings.push({ level: exec.length ? 'warn' : 'info', label: 'external resources',
      sample: extRes.length + ' absolute off-origin reference(s)' +
              (exec.length ? ', ' + exec.length + ' that execute or embed' : ''),
      line: extRes[0].line,
      why: 'This page points at other origins. Each one sees your users’ IP; the executing/embedding ' +
           'ones (script, link, iframe, img, form) can also change what they serve at any time.' });
  }
  if (inlineHandlers.length) {
    findings.push({ level: 'warn', label: 'inline event handlers',
      sample: inlineHandlers.length + ' on* attributes (' +
              Array.from(new Set(inlineHandlers.map(h => h.attr))).slice(0, 6).join(', ') + ')',
      line: inlineHandlers[0].line,
      why: 'Inline handlers need a permissive CSP (unsafe-inline) to run, which weakens XSS defence.' });
  }
  const dupIds = Array.from(ids.entries()).filter(([, c]) => c > 1);
  if (dupIds.length) {
    findings.push({ level: 'warn', label: 'duplicate id',
      sample: dupIds.slice(0, 8).map(([v, c]) => v + ' ×' + c).join(', '),
      line: 1,
      why: 'Duplicate ids are invalid. getElementById returns only the first, so scripts and labels ' +
           'silently bind to the wrong element.' });
  }

  const order = { bad: 0, warn: 1, info: 2 };
  findings.sort((a, b) => order[a.level] - order[b.level] || a.line - b.line);

  return {
    kind: 'html',
    tags: Array.from(tags.entries()).map(([n, c]) => ({ name: n, count: c })).sort((a, b) => b.count - a.count || a.name.localeCompare(b.name)),
    tagTotal: Array.from(tags.values()).reduce((s, c) => s + c, 0),
    ids: Array.from(ids.entries()).map(([v, c]) => ({ value: v, count: c })).sort((a, b) => b.count - a.count || a.value.localeCompare(b.value)),
    classes: Array.from(classes.entries()).map(([v, c]) => ({ value: v, count: c })).sort((a, b) => b.count - a.count || a.value.localeCompare(b.value)),
    links: links,
    extRes: extRes,
    inlineHandlers: inlineHandlers,
    forms: forms,
    findings: findings,
    unterminated: unterminated,
    maxDepth: maxDepth,
    textBytes: textBytes,
    unclosed: unclosed
  };
}

/* ================================================================== *
 * SHARED: risk scanning + line index
 * ================================================================== */
const RISK_PATTERNS = [
  { id: 'jwt', level: 'bad', label: 'JWT',
    re: /\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\b/,
    why: 'Three base64url segments starting with eyJ — a signed JSON Web Token.' },
  { id: 'awsakid', level: 'bad', label: 'AWS access key ID',
    re: /\b(?:AKIA|ASIA|ABIA|ACCA)[0-9A-Z]{16}\b/,
    why: 'AWS access key ID format. ASIA = temporary STS credential; AKIA = long-lived IAM key.' },
  { id: 'ghpat', level: 'bad', label: 'GitHub token',
    re: /\b(?:ghp|gho|ghu|ghs|ghr|github_pat)_[A-Za-z0-9_]{16,}\b/,
    why: 'GitHub personal access / OAuth / app token prefix.' },
  { id: 'slack', level: 'bad', label: 'Slack token',
    re: /\bxox[abposr]-[A-Za-z0-9-]{10,}\b/, why: 'Slack API token prefix.' },
  { id: 'google', level: 'bad', label: 'Google API key',
    re: /\bAIza[0-9A-Za-z_-]{35}\b/, why: 'Google / Firebase API key format.' },
  { id: 'privkey', level: 'bad', label: 'PEM private key',
    re: /-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----/,
    why: 'A private key served to the browser is always a finding.' },
  { id: 'basicauth', level: 'bad', label: 'credentials in URL',
    re: /\b[a-z][a-z0-9+.-]*:\/\/[^\s\x27"`\/@]+:[^\s\x27"`\/@]+@/i,
    why: 'user:password@host inside a URL.' },
  { id: 'bearer', level: 'warn', label: 'hardcoded Bearer',
    re: /\bBearer\s+[A-Za-z0-9._~+\/=-]{12,}/, why: 'An Authorization header value baked into the page.' },
  { id: 'pwd', level: 'warn', label: 'credential-shaped key',
    re: /\b(?:password|passwd|pwd|apikey|api_key|apiKey|auth_?token|access_?token|client_?secret|private_?key)\b/i,
    why: 'A key that names a credential. The adjacent value is what matters.' },
  { id: 'conn', level: 'warn', label: 'connection string',
    re: /\b(?:jdbc:|oracle:thin:|mongodb(?:\+srv)?:\/\/|postgres(?:ql)?:\/\/|mysql:\/\/|redis:\/\/|Data Source=|Server=.*Database=)/i,
    why: 'A database connection string. Check for an embedded username/password.' },
  { id: 'privip', level: 'info', label: 'internal host / private IP',
    re: /\b(?:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|(?:[a-z0-9-]+\.)*(?:dstcorp\.net|ssnc-corp\.cloud|sscinc\.com|internal|localdomain)\b)/i,
    why: 'An internal hostname or RFC1918 address left in shipped markup — useful recon.' },
  { id: 'evalish', level: 'warn', label: 'dynamic code execution',
    re: /\b(?:eval\s*\(|new\s+Function\s*\(|document\.write\s*\(|innerHTML\s*=)/,
    why: 'Dynamic evaluation / raw HTML injection sink. Common XSS vector.' }
];

function scanRisk(text, line, where, findings) {
  if (!text) return;
  for (const p of RISK_PATTERNS) {
    const m = p.re.exec(text);
    if (m) {
      const sample = redact(m[0]);
      if (findings.some(f => f.label === p.label && f.sample === sample)) continue;
      findings.push({ level: p.level, label: p.label, sample: sample, line: line,
                      why: p.why + ' (found in ' + where + ')' });
    }
  }
}

// Show enough of a secret to identify it, not enough to use it.
function redact(s) {
  if (s.length <= 18) return s;
  return s.slice(0, 10) + '…[' + (s.length - 16) + ' chars]…' + s.slice(-6);
}

// Byte offset -> 1-based line number via binary search over line starts.
function lineIndexer(src) {
  const starts = [0];
  for (let i = 0; i < src.length; i++) if (src[i] === '\n') starts.push(i + 1);
  return function (off) {
    let lo = 0, hi = starts.length - 1;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (starts[mid] <= off) lo = mid; else hi = mid - 1; }
    return lo + 1;
  };
}

/* ================================================================== *
 * ROUND-TRIP VERIFIERS
 *
 * Same discipline as the JS beautifier: prove "formatting only" per run
 * instead of asserting it.
 *
 * CSS: re-tokenize and compare the significant token stream.
 * HTML: compare the tag/attribute skeleton plus normalized text, since
 *       collapsing layout whitespace is the point and so a byte compare
 *       would always fail. Raw-element bodies ARE compared byte-exact.
 * ================================================================== */
function cssVerify(inToks, outText) {
  let outToks;
  try { outToks = cssTokenize(outText); }
  catch (e) { return { ok: false, detail: 're-tokenizing output threw: ' + (e && e.message) }; }
  const a = cssSignificant(inToks), b = cssSignificant(outToks);
  if (a.length !== b.length) {
    let i = 0;
    while (i < a.length && i < b.length && a[i].t === b[i].t && a[i].v === b[i].v) i++;
    return { ok: false, detail: 'token count ' + a.length + ' in vs ' + b.length + ' out; first ' +
      'difference at ' + (i + 1) + ' — in=' + JSON.stringify((a[i] || {}).v || '<eof>') +
      ' out=' + JSON.stringify((b[i] || {}).v || '<eof>') };
  }
  for (let i = 0; i < a.length; i++) {
    if (a[i].t !== b[i].t || a[i].v !== b[i].v) {
      return { ok: false, detail: 'token ' + (i + 1) + ' changed: ' + JSON.stringify(a[i].v) +
        ' → ' + JSON.stringify(b[i].v) };
    }
  }
  return { ok: true, detail: a.length + ' tokens identical' };
}

function htmlVerify(inToks, outText) {
  let outToks;
  try { outToks = htmlTokenize(outText); }
  catch (e) { return { ok: false, detail: 're-tokenizing output threw: ' + (e && e.message) }; }
  const sk = (toks) => {
    const o = [];
    for (const t of toks) {
      if (t.t === 'text') {
        const n = t.v.replace(/\s+/g, ' ').trim();
        if (n) o.push('t:' + n);
      } else if (t.t === 'raw') {
        o.push('raw:' + t.v);                       // byte-exact on purpose
      } else if (t.t === 'open' || t.t === 'self') {
        o.push(t.t + ':' + t.name + ':' + (t.attrs || []).map(a =>
          a.name.toLowerCase() + '=' + (a.value === null ? '' : a.value)).sort().join('|'));
      } else if (t.t === 'close') {
        o.push('close:' + t.name);
      } else {
        o.push(t.t + ':' + t.v.replace(/\s+/g, ' ').trim());
      }
    }
    return o;
  };
  const a = sk(inToks), b = sk(outToks);
  if (a.length !== b.length) {
    let i = 0;
    while (i < a.length && i < b.length && a[i] === b[i]) i++;
    return { ok: false, detail: 'node count ' + a.length + ' in vs ' + b.length + ' out; first ' +
      'difference at ' + (i + 1) + ' — in=' + JSON.stringify((a[i] || '<eof>').slice(0, 70)) +
      ' out=' + JSON.stringify((b[i] || '<eof>').slice(0, 70)) };
  }
  for (let i = 0; i < a.length; i++) {
    if (a[i] !== b[i]) {
      return { ok: false, detail: 'node ' + (i + 1) + ' changed: ' +
        JSON.stringify(a[i].slice(0, 70)) + ' → ' + JSON.stringify(b[i].slice(0, 70)) };
    }
  }
  return { ok: true, detail: a.length + ' nodes match (tags, attributes, text, raw bodies)' };
}

/* ================================================================== *
 * RENDER
 * ================================================================== */
function renderAll() {
  if (!STATE) return;
  const a = STATE.analysis, isCss = a.kind === 'css';
  const grew = STATE.out.length - STATE.src.length;

  statsEl.style.display = 'flex';
  const cards = [
    { lbl: 'Detected', val: isCss ? 'CSS' : 'HTML' },
    { lbl: 'Input', val: fmtBytes(STATE.bytes) },
    { lbl: 'Formatted', val: fmtBytes(new Blob([STATE.out]).size) + (grew > 0 ? ' (+' + fmtBytes(grew) + ')' : '') },
    { lbl: 'Lines in / out', val: STATE.src.split('\n').length.toLocaleString() + ' → ' + STATE.lines.length.toLocaleString() },
    { lbl: 'Round-trip', val: STATE.verify.ok ? 'PASS' : 'FAIL' }
  ];
  if (isCss) {
    cards.push({ lbl: 'Rules', val: a.ruleCount.toLocaleString() });
    cards.push({ lbl: 'Declarations', val: a.declCount.toLocaleString() });
    cards.push({ lbl: '!important', val: a.importantCount.toLocaleString() });
    cards.push({ lbl: 'url() refs', val: a.urls.length.toLocaleString() });
  } else {
    cards.push({ lbl: 'Elements', val: a.tagTotal.toLocaleString() });
    cards.push({ lbl: 'Distinct tags', val: a.tags.length.toLocaleString() });
    cards.push({ lbl: 'Max nesting', val: a.maxDepth });
    cards.push({ lbl: 'Links / refs', val: a.links.length.toLocaleString() });
  }
  statsEl.innerHTML = cards.map(c =>
    '<div class="stat"><span class="lbl">' + esc(c.lbl) + '</span><b>' + esc(c.val) + '</b></div>').join('');

  metaEl.textContent = STATE.name + ' · ' + (isCss ? 'CSS' : 'HTML') + ' · ' +
    fmtBytes(STATE.bytes) + ' · ' + STATE.lines.length.toLocaleString() + ' lines out';

  const tabs = [{ id: 'code', label: 'Beautified', n: STATE.lines.length },
                { id: 'findings', label: 'Secrets & risks', n: a.findings.length }];
  if (isCss) {
    tabs.push({ id: 'rules', label: 'Selectors', n: a.ruleCount });
    tabs.push({ id: 'props', label: 'Properties', n: a.props.length });
    tabs.push({ id: 'assets', label: 'url() & imports', n: a.urls.length + a.imports.length });
    tabs.push({ id: 'colors', label: 'Colors & fonts', n: a.colors.length + a.fonts.length });
  } else {
    tabs.push({ id: 'tags', label: 'Tags', n: a.tags.length });
    tabs.push({ id: 'links', label: 'Links & resources', n: a.links.length });
    tabs.push({ id: 'idsel', label: 'ids & classes', n: a.ids.length + a.classes.length });
    tabs.push({ id: 'forms', label: 'Forms & handlers', n: a.forms.length + a.inlineHandlers.length });
  }
  tabs.push({ id: 'about', label: 'What this can’t do', n: null });

  tabsEl.classList.add('show');
  tabsEl.innerHTML = tabs.map(t =>
    '<button data-tab="' + t.id + '" class="' + (t.id === ACTIVE_TAB ? 'on' : '') + '">' +
    esc(t.label) + (t.n === null ? '' : '<span class="n">' + t.n.toLocaleString() + '</span>') +
    '</button>').join('');
  tabsEl.querySelectorAll('button').forEach(b => {
    b.onclick = () => { ACTIVE_TAB = b.getAttribute('data-tab'); renderAll(); };
  });

  if (!tabs.some(t => t.id === ACTIVE_TAB)) ACTIVE_TAB = 'code';
  panel.classList.add('show');
  panel.innerHTML = renderTab(ACTIVE_TAB, a);
  wirePanel();
}

function renderTab(id, a) {
  if (id === 'code') return renderCode();
  if (id === 'findings') return renderFindings(a);
  if (id === 'about') return renderAbout(a);
  if (a.kind === 'css') {
    if (id === 'rules') return renderRules(a);
    if (id === 'props') return renderProps(a);
    if (id === 'assets') return renderAssets(a);
    if (id === 'colors') return renderColors(a);
  } else {
    if (id === 'tags') return renderTags(a);
    if (id === 'links') return renderLinks(a);
    if (id === 'idsel') return renderIdSel(a);
    if (id === 'forms') return renderForms(a);
  }
  return renderCode();
}

function renderCode() {
  const lines = STATE.lines;
  const shown = Math.min(lines.length, MAX_RENDER_LINES);
  const doHilite = cbHilite.checked && STATE.bytes <= HILITE_MAX_BYTES;
  let rows = '';
  for (let i = 0; i < shown; i++) {
    rows += '<tr data-ln="' + (i + 1) + '"><td class="ln">' + (i + 1) + '</td><td>' +
      (doHilite ? (STATE.analysis.kind === 'css' ? hiliteCss(lines[i]) : hiliteHtml(lines[i]))
                : (esc(lines[i]) || '&nbsp;')) + '</td></tr>';
  }
  const foot = shown < lines.length
    ? '<div class="trunc">Showing the first ' + shown.toLocaleString() + ' of ' +
      lines.length.toLocaleString() + ' lines. The rest are formatted but not painted — ' +
      '<b>“Download” gives you the complete file.</b></div>' : '';
  const rt = STATE.verify.ok ? '<span class="badge ok">round-trip PASS</span>'
                             : '<span class="badge bad">round-trip FAIL</span>';
  return '<div class="codewrap"><div class="chead">' + rt +
    '<span>' + esc(STATE.name) + '</span><span class="sp"></span>' +
    '<button id="copyOut">Copy all</button></div>' +
    '<div class="codescroll"><table class="code"><tbody>' + rows + '</tbody></table></div>' +
    foot + '</div>';
}

// Per-line highlighting. A line that starts mid-construct is shown plain
// rather than mis-coloured — wrong colours are worse than none.
function hiliteCss(line) {
  if (!line) return '&nbsp;';
  if (line.length > 4000) return esc(line);
  let toks; try { toks = cssTokenize(line); } catch (e) { return esc(line); }
  let html = '', sawColon = false;
  for (let i = 0; i < toks.length; i++) {
    const t = toks[i], v = esc(t.v);
    if (t.t === 'com') { html += '<span class="tk-com">' + v + '</span>'; continue; }
    if (t.t === 'at') { html += '<span class="tk-at">' + v + '</span>'; continue; }
    if (t.t === 'str' || t.t === 'url') { html += '<span class="tk-val">' + v + '</span>'; continue; }
    if (t.t === 'num') { html += '<span class="tk-val">' + v + '</span>'; continue; }
    if (t.t === 'fn') { html += '<span class="tk-val">' + v + '</span>'; continue; }
    if (t.t === 'pun') {
      if (t.v === ':') sawColon = true;
      if (t.v === ';' || t.v === '{' || t.v === '}') sawColon = false;
      html += '<span class="tk-pun">' + v + '</span>'; continue;
    }
    if (t.t === 'ident') {
      const nx = toks[i + 1] && toks[i + 1].t === 'ws' ? toks[i + 2] : toks[i + 1];
      const isProp = nx && nx.t === 'pun' && nx.v === ':' && !sawColon;
      html += '<span class="' + (isProp ? 'tk-prop' : (sawColon ? 'tk-val' : 'tk-sel')) + '">' + v + '</span>';
      continue;
    }
    html += v;
  }
  return html || '&nbsp;';
}

function hiliteHtml(line) {
  if (!line) return '&nbsp;';
  if (line.length > 4000) return esc(line);
  let html = '', i = 0;
  const n = line.length;
  while (i < n) {
    const lt = line.indexOf('<', i);
    if (lt === -1) { html += '<span class="tk-txt">' + esc(line.slice(i)) + '</span>'; break; }
    if (lt > i) html += '<span class="tk-txt">' + esc(line.slice(i, lt)) + '</span>';
    if (line.startsWith('<!--', lt)) {
      const e = line.indexOf('-->', lt + 4);
      const j = e === -1 ? n : e + 3;
      html += '<span class="tk-com">' + esc(line.slice(lt, j)) + '</span>'; i = j; continue;
    }
    if (line.startsWith('<!', lt) || line.startsWith('<?', lt)) {
      const e = line.indexOf('>', lt + 2);
      const j = e === -1 ? n : e + 1;
      html += '<span class="tk-doc">' + esc(line.slice(lt, j)) + '</span>'; i = j; continue;
    }
    let j = lt + 1, q = null;
    while (j < n) { const c = line[j];
      if (q) { if (c === q) q = null; j++; continue; }
      if (c === '"' || c === "'") { q = c; j++; continue; }
      if (c === '>') { j++; break; } j++; }
    const tag = line.slice(lt, j);
    html += '<span class="tk-pun">&lt;</span>';
    const nm = /^<\/?\s*([a-zA-Z][a-zA-Z0-9:._-]*)/.exec(tag);
    let rest = tag.slice(1, tag.length - (tag.endsWith('>') ? 1 : 0));
    if (rest.startsWith('/')) { html += '<span class="tk-pun">/</span>'; rest = rest.slice(1); }
    if (nm) {
      html += '<span class="tk-tag">' + esc(nm[1]) + '</span>';
      rest = rest.slice(nm[1].length);
    }
    html += rest.replace(/([^\s=]+)(\s*=\s*)("[^"]*"|'[^']*'|[^\s>]+)?/g,
      (m, an, eq, av) => '<span class="tk-attr">' + esc(an) + '</span>' + esc(eq || '') +
        (av ? '<span class="tk-str">' + esc(av) + '</span>' : ''));
    if (tag.endsWith('>')) html += '<span class="tk-pun">&gt;</span>';
    i = j;
  }
  return html || '&nbsp;';
}

function renderFindings(a) {
  const caveat = '<div class="caveat"><b>These are leads, not verdicts.</b>' +
    'Every row is a pattern match on text already in this file — a hit does not prove a live ' +
    'credential, and an empty tab does not prove there are none. Matches are truncated on screen so ' +
    'a screenshot does not leak a whole secret; full text is in the Beautified tab.</div>';
  if (!a.findings.length) {
    return caveat + '<div class="card"><h2>Secrets &amp; risks</h2><div class="empty">' +
      'No patterns from the built-in list matched — JWTs, AWS/GitHub/Slack/Google key formats, PEM ' +
      'private keys, connection strings, credentials in URLs, credential-shaped keys, internal ' +
      'hostnames, RFC1918 addresses, and dynamic-execution sinks. <b>Not</b> secrets in formats it ' +
      'has never seen.</div></div>';
  }
  const rows = a.findings.slice(0, MAX_ROWS).map(f =>
    '<tr><td><span class="badge ' + f.level + '">' + esc(f.label) + '</span></td>' +
    '<td class="mono">' + esc(f.sample) + '</td>' +
    '<td><button class="jump" data-line="' + f.line + '">' + f.line + '</button></td>' +
    '<td>' + esc(f.why) + '</td></tr>').join('');
  const foot = a.findings.length > MAX_ROWS
    ? '<div class="trunc">Showing ' + MAX_ROWS.toLocaleString() + ' of ' + a.findings.length.toLocaleString() + '.</div>' : '';
  return caveat + '<div class="card"><h2>Secrets &amp; risks<span class="sp"></span>' +
    '<span class="badge bad">' + a.findings.filter(f => f.level === 'bad').length + ' high</span>' +
    '<span class="badge warn">' + a.findings.filter(f => f.level === 'warn').length + ' medium</span>' +
    '<span class="badge info">' + a.findings.filter(f => f.level === 'info').length + ' info</span></h2>' +
    '<div class="body tight"><div class="scrollbox"><table class="grid"><thead><tr>' +
    '<th>Pattern</th><th>Match (truncated)</th><th>Line</th><th>Why it fired</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table></div>' + foot + '</div></div>';
}

function gridCard(title, hint, headers, rows, total) {
  if (!rows) return '<div class="card"><h2>' + title + '</h2><div class="empty">None found.</div></div>';
  const foot = (total && total > MAX_ROWS)
    ? '<div class="trunc">Showing ' + MAX_ROWS.toLocaleString() + ' of ' + total.toLocaleString() + '.</div>' : '';
  return '<div class="card"><h2>' + title + (hint ? ' <span class="hint">' + hint + '</span>' : '') +
    '</h2><div class="body tight"><div class="scrollbox"><table class="grid"><thead><tr>' +
    headers.map(h => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>' + rows +
    '</tbody></table></div>' + foot + '</div></div>';
}

function renderRules(a) {
  const rows = a.rules.slice(0, MAX_ROWS).map(r =>
    '<tr><td class="mono">' + esc(r.sel.length > 220 ? r.sel.slice(0, 220) + '…' : r.sel) + '</td>' +
    '<td class="num">' + r.sel.split(',').length + '</td>' +
    '<td class="num">' + r.depth + '</td></tr>').join('');
  return gridCard('Selectors', 'in source order', ['Selector', 'Parts', 'Nesting'], rows, a.rules.length);
}

function renderProps(a) {
  const rows = a.props.slice(0, MAX_ROWS).map(p =>
    '<tr><td class="mono">' + esc(p.name) + '</td><td class="num">' + p.count.toLocaleString() + '</td>' +
    '<td>' + (/^--/.test(p.name) ? '<span class="badge info">custom property</span>' :
             (/^-(?:webkit|moz|ms|o)-/.test(p.name) ? '<span class="badge warn">vendor prefix</span>' : '')) +
    '</td></tr>').join('');
  const at = a.atRules.length
    ? gridCard('At-rules', '', ['Rule', 'Count'],
        a.atRules.map(r => '<tr><td class="mono">' + esc(r.name) + '</td><td class="num">' + r.count + '</td></tr>').join(''))
    : '';
  return gridCard('Properties', 'most used first', ['Property', '×', ''], rows, a.props.length) + at;
}

function renderAssets(a) {
  const dataRows = a.urls.filter(u => u.data).sort((x, y) => y.len - x.len).slice(0, MAX_ROWS).map(u =>
    '<tr><td class="mono">' + esc(u.mime || '(none)') + '</td><td class="num">' + fmtBytes(u.len) + '</td>' +
    '<td><button class="jump" data-line="' + u.line + '">' + u.line + '</button></td></tr>').join('');
  const extRows = a.urls.filter(u => !u.data).slice(0, MAX_ROWS).map(u =>
    '<tr><td class="mono">' + esc(u.url.length > 220 ? u.url.slice(0, 220) + '…' : u.url) + '</td>' +
    '<td><button class="jump" data-line="' + u.line + '">' + u.line + '</button></td></tr>').join('');
  const impRows = a.imports.map(m =>
    '<tr><td class="mono">' + esc(m.text.slice(0, 220)) + '</td>' +
    '<td><button class="jump" data-line="' + m.line + '">' + m.line + '</button></td></tr>').join('');
  return gridCard('Inlined data: URIs', 'largest first — these bloat the stylesheet',
           ['MIME type', 'Size', 'Line'], dataRows) +
         gridCard('External url() references', '', ['URL', 'Line'], extRows) +
         gridCard('@import', 'each one is an extra blocking request', ['Prelude', 'Line'], impRows);
}

function renderColors(a) {
  const cRows = a.colors.slice(0, MAX_ROWS).map(c =>
    '<tr><td class="mono">' + esc(c.value) + '</td><td class="num">' + c.count + '</td></tr>').join('');
  const fRows = a.fonts.slice(0, MAX_ROWS).map(f =>
    '<tr><td class="mono">' + esc(f) + '</td></tr>').join('');
  return gridCard('Colors', 'literal values as written — no normalization', ['Value', '×'], cRows, a.colors.length) +
         gridCard('Font families', '', ['Family'], fRows, a.fonts.length);
}

function renderTags(a) {
  const rows = a.tags.slice(0, MAX_ROWS).map(t =>
    '<tr><td class="mono">&lt;' + esc(t.name) + '&gt;</td><td class="num">' + t.count.toLocaleString() + '</td>' +
    '<td>' + (VOID_TAGS.has(t.name) ? '<span class="badge info">void</span>' : '') +
             (RAW_TAGS.has(t.name) ? '<span class="badge warn">raw text</span>' : '') +
             (t.name.indexOf('-') !== -1 ? '<span class="badge info">custom element</span>' : '') +
    '</td></tr>').join('');
  return gridCard('Elements', 'most used first', ['Tag', '×', ''], rows, a.tags.length);
}

function renderLinks(a) {
  const rows = a.links.slice(0, MAX_ROWS).map(l =>
    '<tr><td class="mono">&lt;' + esc(l.tag) + '&gt;</td><td class="mono">' + esc(l.attr) + '</td>' +
    '<td class="mono">' + esc(l.value.length > 200 ? l.value.slice(0, 200) + '…' : l.value) + '</td>' +
    '<td>' + (l.absolute ? '<span class="badge warn">external</span>' : '<span class="badge ok">relative</span>') +
    (l.scheme === 'javascript' ? '<span class="badge bad">javascript:</span>' : '') +
    (l.scheme === 'data' ? '<span class="badge info">data:</span>' : '') + '</td>' +
    '<td><button class="jump" data-line="' + l.line + '">' + l.line + '</button></td></tr>').join('');
  return gridCard('Links &amp; resource references', 'src / href / action / poster',
    ['Tag', 'Attr', 'Value', '', 'Line'], rows, a.links.length);
}

function renderIdSel(a) {
  const idRows = a.ids.slice(0, MAX_ROWS).map(d =>
    '<tr><td class="mono">' + esc(d.value) + '</td><td class="num">' + d.count + '</td>' +
    '<td>' + (d.count > 1 ? '<span class="badge warn">duplicate</span>' : '') + '</td></tr>').join('');
  const clRows = a.classes.slice(0, MAX_ROWS).map(d =>
    '<tr><td class="mono">' + esc(d.value) + '</td><td class="num">' + d.count + '</td></tr>').join('');
  return gridCard('ids', 'duplicates are invalid — getElementById returns only the first',
           ['id', '×', ''], idRows, a.ids.length) +
         gridCard('classes', '', ['class', '×'], clRows, a.classes.length);
}

function renderForms(a) {
  const fRows = a.forms.map(f =>
    '<tr><td class="mono">' + esc(f.method) + '</td>' +
    '<td class="mono">' + esc(f.action || '(same page)') + '</td>' +
    '<td>' + (/^http:\/\//i.test(f.action) ? '<span class="badge bad">plaintext http</span>' : '') + '</td>' +
    '<td><button class="jump" data-line="' + f.line + '">' + f.line + '</button></td></tr>').join('');
  const hRows = a.inlineHandlers.slice(0, MAX_ROWS).map(h =>
    '<tr><td class="mono">&lt;' + esc(h.tag) + '&gt;</td><td class="mono">' + esc(h.attr) + '</td>' +
    '<td class="mono">' + esc(h.snippet) + '</td>' +
    '<td><button class="jump" data-line="' + h.line + '">' + h.line + '</button></td></tr>').join('');
  return gridCard('Forms', 'where user input goes', ['Method', 'Action', '', 'Line'], fRows) +
         gridCard('Inline event handlers', 'each one requires CSP unsafe-inline to run',
           ['Tag', 'Attribute', 'Code', 'Line'], hRows, a.inlineHandlers.length);
}

function renderAbout(a) {
  const isCss = a.kind === 'css';
  const ut = a.unterminated.length
    ? '<div class="card"><h2>Unterminated constructs</h2><div class="body"><div class="kv">' +
      a.unterminated.slice(0, 50).map(u =>
        '<div class="k">Line ' + u.line + '</div><div class="v plain">unterminated ' + esc(u.what) + '</div>').join('') +
      '</div><p class="hint" style="margin:10px 0 0">A file ending inside a comment, string or tag is ' +
      'usually truncated — check whether your copy is complete.</p></div></div>' : '';

  const cssLimits = '<li>This is a lexer, not a full CSS parser with a cascade model. It will not tell ' +
    'you which rule wins, find unused selectors, or resolve <code>var()</code> values.</li>' +
    '<li><code>calc()</code>, <code>var()</code>, <code>clamp()</code> and every other function are ' +
    'captured whole and copied byte-for-byte — <code>calc(100% - 10px)</code> keeps its spaces, ' +
    'because removing them would make it invalid CSS.</li>' +
    '<li><code>url(data:image/gif;base64,…)</code> is one atomic token, so the <code>;</code> and ' +
    '<code>,</code> inside it never get treated as structure. That is the most common way ' +
    'beautifiers corrupt a stylesheet.</li>' +
    '<li>SCSS/LESS syntax (nesting, mixins, <code>//</code> comments) is not a target. Real CSS has no ' +
    '<code>//</code> comment, so those files will format oddly.</li>';

  const htmlLimits = '<li>Whitespace inside <code>&lt;pre&gt;</code>, <code>&lt;textarea&gt;</code>, ' +
    '<code>&lt;script&gt;</code> and <code>&lt;style&gt;</code> is emitted <b>byte-exact</b>. It is ' +
    'content (or code), not layout, and re-indenting it would change what renders or what runs.</li>' +
    '<li>Inline elements (<code>&lt;a&gt;</code>, <code>&lt;span&gt;</code>, <code>&lt;b&gt;</code>, …) ' +
    'are never moved onto their own line. <code>&lt;b&gt;x&lt;/b&gt;y</code> and ' +
    '<code>&lt;b&gt;x&lt;/b&gt; y</code> render differently, so a line break there would be a visible ' +
    'change, not a cosmetic one.</li>' +
    '<li>Whitespace <i>between</i> block elements is collapsed — that is the whole point of ' +
    'beautifying. So the round-trip check compares the tag/attribute/text skeleton rather than bytes ' +
    '(raw-element bodies are still compared byte-exact).</li>' +
    '<li>Malformed markup is tolerated, not fixed. Unclosed and stray tags are reported in the ' +
    'findings tab; indentation after them reflects browser-style recovery, not a clean tree.</li>' +
    '<li>Embedded <code>&lt;script&gt;</code> contents are not beautified here — use the ' +
    'JavaScript beautifier for that.</li>';

  return '<div class="card"><h2>What this tool can and cannot do</h2><div class="body">' +
    '<p><b>It restores formatting. It does not restore names or structure.</b> Minifiers strip ' +
    'whitespace (reversible — that is what this does) and also rename things: CSS class names become ' +
    '<code>.a1</code>, HTML gets its attributes reordered and quotes dropped. Those renames are ' +
    'permanent. Beautifying makes the file readable, not original.</p>' +
    '<p><b>Formatting is verified, not assumed.</b> Every run re-processes its own output and compares ' +
    'it against the input. This run: <b>' + (STATE.verify.ok ? 'PASS' : 'FAIL') + '</b> — ' +
    esc(STATE.verify.detail) + '.</p>' +
    '<p><b>Known limits for ' + (isCss ? 'CSS' : 'HTML') + ':</b></p><ul>' +
    (isCss ? cssLimits : htmlLimits) +
    '<li>Highlighting is per-line and skipped above ' + fmtBytes(HILITE_MAX_BYTES) + '; a line ' +
    'starting mid-construct is shown uncoloured rather than mis-coloured.</li>' +
    '<li>On-screen rendering stops at ' + MAX_RENDER_LINES.toLocaleString() + ' lines — <b>the ' +
    'download is always complete</b>. Input is refused above ' + fmtBytes(HARD_MAX_BYTES) + '.</li>' +
    '<li>The secrets tab matches a fixed pattern list. It finds what it knows and nothing else — ' +
    'absence of findings is not evidence of absence.</li>' +
    '</ul>' +
    '<p><b>Privacy:</b> this page has no <code>&lt;script src&gt;</code>, no ' +
    '<code>&lt;link href&gt;</code>, no <code>fetch</code>, no <code>XMLHttpRequest</code> and no ' +
    'beacon. It runs from a local file with the network unplugged. Nothing you paste leaves this ' +
    'machine — which is the entire point of using it instead of an online beautifier.</p>' +
    '</div></div>' + ut;
}

function wirePanel() {
  panel.querySelectorAll('.jump').forEach(b => {
    b.onclick = () => {
      const ln = parseInt(b.getAttribute('data-line'), 10);
      ACTIVE_TAB = 'code'; renderAll();
      requestAnimationFrame(() => {
        const row = panel.querySelector('tr[data-ln="' + ln + '"]');
        if (row) {
          panel.querySelectorAll('tr.hl').forEach(r => r.classList.remove('hl'));
          row.classList.add('hl');
          row.scrollIntoView({ block: 'center' });
        }
      });
    };
  });
  const cp = panel.querySelector('#copyOut');
  if (cp) cp.onclick = async () => {
    try { await navigator.clipboard.writeText(STATE.out); cp.textContent = 'Copied'; }
    catch (e) { cp.textContent = 'Blocked by browser'; }
    setTimeout(() => { cp.textContent = 'Copy all'; }, 1400);
  };
}

/* ================================================================== *
 * RUN + WIRING
 * ================================================================== */
function reset() {
  STATE = null;
  panel.classList.remove('show'); panel.innerHTML = '';
  tabsEl.classList.remove('show'); tabsEl.innerHTML = '';
  statsEl.style.display = 'none'; statsEl.innerHTML = '';
  confirmEl.style.display = 'none'; confirmEl.innerHTML = '';
  metaEl.textContent = '';
  reformatBtn.disabled = true; dlBtn.disabled = true;
  setNotes([]); clearError();
}

function beginFromText(text, name) {
  clearError(); confirmEl.style.display = 'none';
  const bytes = new Blob([text]).size;
  if (!text.trim()) { showError('Nothing to beautify — the input is empty.'); return; }
  if (bytes > HARD_MAX_BYTES) {
    showError('Refusing to load ' + fmtBytes(bytes) + '.\nThe hard cap is ' + fmtBytes(HARD_MAX_BYTES) +
      ' — above that the tab reliably dies mid-format and you lose the result.\n\nSplit the file, or ' +
      'run a CLI beautifier on the server instead.');
    return;
  }
  if (bytes > CONFIRM_BYTES) {
    confirmEl.style.display = 'block';
    confirmEl.innerHTML = '<b>' + esc(name || 'Input') + ' is ' + fmtBytes(bytes) + '.</b> ' +
      'Formatting a file this size runs a full scan in the page and can take a while — the tab will be ' +
      'unresponsive until it finishes. Nothing is uploaded either way.' +
      '<div class="row-controls"><button id="cfYes">Beautify anyway</button>' +
      '<button id="cfNo">Cancel</button></div>';
    $('cfYes').onclick = () => { confirmEl.style.display = 'none'; run(text, name, bytes); };
    $('cfNo').onclick = () => { confirmEl.style.display = 'none'; };
    return;
  }
  run(text, name, bytes);
}

function run(text, name, bytes) {
  const notes = [];
  const chosen = modeSel.value;
  const mode = chosen === 'auto' ? detectMode(text) : chosen;
  const indent = indentSel.value === 'tab' ? '\t' : ' '.repeat(parseInt(indentSel.value, 10) || 2);

  let toks, out, verify, analysis;
  try {
    if (mode === 'css') {
      toks = cssTokenize(text);
      out = cssFormat(toks, { indent: indent });
      verify = cssVerify(toks, out);
      analysis = cssAnalyze(toks, text);
    } else {
      toks = htmlTokenize(text);
      out = htmlFormat(toks, { indent: indent });
      verify = htmlVerify(toks, out);
      analysis = htmlAnalyze(toks, text);
    }
  } catch (e) {
    showError((mode === 'css' ? 'CSS' : 'HTML') + ' processing failed: ' +
      (e && e.message ? e.message : String(e)) +
      '\n\nNothing was modified. Your input is still in the box above.' +
      (chosen === 'auto' ? '\n\nAuto-detect picked ' + mode.toUpperCase() +
       ' — if that is wrong, set the Mode dropdown explicitly and try again.' : ''));
    return;
  }

  const lines = out.split('\n');
  STATE = { src: text, name: name || ('pasted.' + mode), bytes: bytes, mode: mode,
            tokens: toks, out: out, lines: lines, analysis: analysis, verify: verify };

  if (chosen === 'auto') {
    notes.push('Auto-detected ' + mode.toUpperCase() + '. If that is wrong, pick the mode explicitly ' +
      'in the header dropdown — detection is a heuristic on the first few KB.');
  }
  if (!verify.ok) {
    notes.push('ROUND-TRIP CHECK FAILED — the formatted output does not re-process to the same ' +
      'structure as the input (' + verify.detail + '). Treat the output as READ-ONLY: it may not be ' +
      'equivalent to your original. Please report the input shape that caused this.');
  }
  if (analysis.unterminated.length) {
    notes.push(analysis.unterminated.length + ' unterminated construct(s) found — the file may be ' +
      'truncated. Formatting continued past them; see the last tab.');
  }
  if (lines.length > MAX_RENDER_LINES) {
    notes.push('Output is ' + lines.length.toLocaleString() + ' lines; only the first ' +
      MAX_RENDER_LINES.toLocaleString() + ' are painted on screen. Use "Download" for the complete ' +
      'formatted file — the download is NOT truncated.');
  }
  if (cbHilite.checked && bytes > HILITE_MAX_BYTES) {
    notes.push('Syntax highlighting was skipped: input is larger than ' + fmtBytes(HILITE_MAX_BYTES) +
      '. Formatting itself is unaffected.');
  }
  STATE.notes = notes;

  reformatBtn.disabled = false; dlBtn.disabled = false;
  setNotes(notes);
  renderAll();
}

reformatBtn.onclick = () => { if (STATE) run(STATE.src, STATE.name, STATE.bytes); };
indentSel.onchange = () => { if (STATE) run(STATE.src, STATE.name, STATE.bytes); };
modeSel.onchange = () => { if (STATE) { ACTIVE_TAB = 'code'; run(STATE.src, STATE.name, STATE.bytes); } };
cbHilite.onchange = () => { if (STATE) renderAll(); };

dlBtn.onclick = () => {
  if (!STATE) return;
  const ext = STATE.mode === 'css' ? 'css' : 'html';
  const base = STATE.name.replace(/\.(css|html?|xhtml|svg|vue|scss|less|txt)$/i, '');
  const blob = new Blob([STATE.out], { type: (ext === 'css' ? 'text/css' : 'text/html') + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = base + '.beautified.' + ext;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
};

$('goBtn').onclick = () => beginFromText(pasteEl.value, null);
$('clearBtn').onclick = () => { pasteEl.value = ''; reset(); pasteEl.focus(); };
pasteEl.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); beginFromText(pasteEl.value, null); }
});

function readFile(f) {
  if (!f) return;
  if (f.size > HARD_MAX_BYTES) {
    showError('Refusing to load ' + f.name + ' (' + fmtBytes(f.size) + ').\nHard cap is ' +
      fmtBytes(HARD_MAX_BYTES) + '. Nothing was read.');
    return;
  }
  const fr = new FileReader();
  fr.onerror = () => showError('Could not read ' + f.name + ' — ' +
    (fr.error && fr.error.message ? fr.error.message : 'unknown FileReader error') + '.');
  fr.onload = () => {
    if (modeSel.value === 'auto') {
      if (/\.css$/i.test(f.name)) modeSel.value = 'css';
      else if (/\.(html?|xhtml|svg|vue)$/i.test(f.name)) modeSel.value = 'html';
    }
    beginFromText(String(fr.result), f.name);
  };
  fr.readAsText(f);
}
fileEl.onchange = () => readFile(fileEl.files && fileEl.files[0]);
['dragenter', 'dragover'].forEach(ev => intakeEl.addEventListener(ev, e => {
  e.preventDefault(); e.stopPropagation(); dropEl.classList.add('hot');
}));
['dragleave', 'drop'].forEach(ev => intakeEl.addEventListener(ev, e => {
  e.preventDefault(); e.stopPropagation(); dropEl.classList.remove('hot');
}));
intakeEl.addEventListener('drop', e => {
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  readFile(f);
});

})();
</script>
</body>
</html>
