<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KSI Tools JSON Viewer</title>
<style id="appcss">
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.5; background:#fff; color:#1f2328; }
header.bar { position:sticky; top:0; z-index:10; display:flex; gap:10px; align-items:center;
  padding:10px 16px; background:#f6f8fa; border-bottom:1px solid #d0d7de; flex-wrap:wrap; }
header.bar h1 { font-size:15px; margin:0; font-weight:600; flex:0 0 auto; }
header.bar .fname { color:#57606a; font-size:13px; flex:1 1 auto;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:60px; }
button { font:inherit; font-size:13px; padding:6px 12px; border:1px solid #d0d7de;
  border-radius:6px; background:#fff; color:#1f2328; cursor:pointer; }
button:hover { background:#f3f4f6; } button:disabled { opacity:.45; cursor:default; }
#search { font:inherit; font-size:13px; padding:6px 10px; border:1px solid #d0d7de;
  border-radius:6px; background:#fff; color:#1f2328; width:200px; }
#search:disabled { opacity:.45; }
#drop { max-width:900px; margin:48px auto; padding:60px 24px; text-align:center;
  border:2px dashed #d0d7de; border-radius:12px; color:#57606a; cursor:pointer; }
#drop.hover { border-color:#0969da; background:rgba(9,105,218,.05); color:#0969da; }
#drop strong { display:block; font-size:18px; margin-bottom:6px; color:#1f2328; }

/* ---- Tree ---- */
.tree { font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:13.5px;
  line-height:1.65; padding:18px 20px 90px; overflow:auto; white-space:nowrap; }
.node, .leaf { }
.children { padding-left:1.6em; border-left:1px solid transparent; }
.tree .node:hover > .children { border-left-color:rgba(175,184,193,.35); }
.line, .closeline, .leaf { position:relative; padding:1px 0 1px 1.25em; border-radius:4px; }
.line:hover, .leaf:hover { background:rgba(175,184,193,.14); }
.toggle { position:absolute; left:0; top:0; width:1.1em; text-align:center; cursor:pointer;
  color:#57606a; user-select:none; font-size:11px; }
.toggle::before { content:"\25BC"; }               /* ▼ expanded */
.node.collapsed > .line .toggle::before { content:"\25B6"; }  /* ▶ collapsed */
.node.collapsed > .children,
.node.collapsed > .closeline { display:none; }
.preview { color:#57606a; font-style:italic; margin-left:.4em; }
.node:not(.collapsed) > .line .preview { display:none; }

.k   { color:#0550ae; }               /* key */
.s   { color:#0a7d24; }               /* string value */
.n   { color:#953800; }               /* number */
.b   { color:#8250df; font-weight:600; } /* boolean */
.z   { color:#6e7781; font-weight:600; } /* null */
.p   { color:#57606a; }               /* punctuation : , { } [ ] */
.hit { background:#fff3c4; color:inherit; border-radius:3px; box-shadow:0 0 0 1px #f0c000; }

#err { max-width:900px; margin:40px auto; padding:16px 20px; border:1px solid #cf222e;
  border-radius:10px; background:rgba(207,34,46,.06); color:#cf222e;
  font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:13px; white-space:pre-wrap; }
.hint { color:#8b949e; font-size:12px; }

/* notice banner shown when the tree is capped */
#notice { position:sticky; top:0; z-index:8; padding:7px 16px; font-size:12.5px;
  background:#fff8c5; color:#7a5c00; border-bottom:1px solid #f0c000; display:none;
  font-family:-apple-system,"Segoe UI",Roboto,sans-serif; }
/* loading overlay + spinner */
#loading { position:fixed; inset:0; z-index:50; display:none; align-items:center;
  justify-content:center; flex-direction:column; gap:14px;
  background:rgba(255,255,255,.72); backdrop-filter:blur(1px); color:#57606a; font-size:14px; }
#loading.show { display:flex; }
.spinner { width:38px; height:38px; border:4px solid #d0d7de; border-top-color:#0969da;
  border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

@media (prefers-color-scheme: dark) {
  body { background:#0d1117; color:#e6edf3; }
  header.bar { background:#161b22; border-bottom-color:#30363d; }
  header.bar .fname { color:#8b949e; }
  #notice { background:#3a2f00; color:#e3b341; border-bottom-color:#b58900; }
  #loading { background:rgba(13,17,23,.75); color:#8b949e; }
  .spinner { border-color:#30363d; border-top-color:#4493f8; }
  button { background:#21262d; color:#e6edf3; border-color:#30363d; } button:hover { background:#30363d; }
  #search { background:#0d1117; color:#e6edf3; border-color:#30363d; }
  #drop { border-color:#30363d; color:#8b949e; } #drop strong { color:#e6edf3; }
  #drop.hover { border-color:#4493f8; color:#4493f8; }
  .toggle, .preview { color:#8b949e; }
  .line:hover, .leaf:hover { background:rgba(110,118,129,.15); }
  .tree .node:hover > .children { border-left-color:rgba(110,118,129,.4); }
  .k { color:#79c0ff; } .s { color:#7ee787; } .n { color:#ffa657; }
  .b { color:#d2a8ff; } .z { color:#8b949e; } .p { color:#8b949e; }
  .hit { background:#634c00; color:#ffe08a; box-shadow:0 0 0 1px #b58900; }
  #err { border-color:#f85149; color:#ff7b72; background:rgba(248,81,73,.08); }
}
</style>
</head>
<body>
<header class="bar">
  <h1>KSI Tools JSON Viewer</h1>
  <span class="fname" id="fname"></span>
  <input type="text" id="search" placeholder="Search keys &amp; values…" disabled>
  <button id="expand"   disabled title="Expand every node">Expand all</button>
  <button id="collapse" disabled title="Collapse every node">Collapse all</button>
  <button id="copy" disabled title="Copy prettified JSON to the clipboard">Copy</button>
  <button id="savejson" disabled title="Download prettified (2-space) JSON">Save .json</button>
  <button id="savecsv" disabled title="Download as CSV for Excel/Sheets. Arrays of objects become rows; nested keys flatten with dots (crm.salesforceId).">Save .csv</button>
  <button id="savehtml" disabled title="Download this formatted view as a standalone .html">Save .html</button>
  <button id="pick" onclick="document.getElementById('file').click()">Open file</button>
</header>
<input type="file" id="file" accept=".json,.jsonc,.txt,application/json" style="display:none">
<div id="drop">
  <strong>Drop a JSON file here</strong>
  or click to choose &middot; formats instantly in your browser
  <div class="hint" style="margin-top:10px">Nothing is uploaded — parsing happens locally.</div>
</div>
<div id="err" style="display:none"></div>
<div id="notice"></div>
<div class="tree" id="tree" style="display:none"></div>
<div id="loading"><div class="spinner"></div><div id="loadingmsg">Loading…</div></div>

<script>
const drop     = document.getElementById('drop');
const tree     = document.getElementById('tree');
const errBox   = document.getElementById('err');
const fname    = document.getElementById('fname');
const fileInput= document.getElementById('file');
const searchIn = document.getElementById('search');
const btns = {
  expand:   document.getElementById('expand'),
  collapse: document.getElementById('collapse'),
  copy:     document.getElementById('copy'),
  savejson: document.getElementById('savejson'),
  savecsv:  document.getElementById('savecsv'),
  savehtml: document.getElementById('savehtml'),
};
const noticeEl = document.getElementById('notice');
const loadingEl = document.getElementById('loading');
const loadingMsg = document.getElementById('loadingmsg');
let currentName = 'data';
let currentData = null;   // last successfully parsed JSON value

// Guardrails for very large files:
//  MAX_BYTES  – refuse outright above this (browser memory / usability).
//  MAX_NODES  – cap how many tree rows (leaves + container lines) we build in
//               one pass. The parsed value stays in `currentData`, so search,
//               Copy and all exports still cover the whole document; only the
//               on-screen tree is truncated (DOM nodes are the real perf cliff).
const MAX_BYTES = 100 * 1024 * 1024;   // 100 MB
const MAX_NODES = 100000;              // tree rows built per render
let nodeBudget = 0;                    // decremented as build() emits rows
let nodesTruncated = false;            // set when the budget runs out

// ---- Loading overlay -------------------------------------------------------
// JS is single-threaded, so parse/build work blocks paint. Show the overlay,
// then yield (double rAF) so the spinner paints before the heavy work runs.
function showLoading(msg) { loadingMsg.textContent = msg || 'Loading…'; loadingEl.classList.add('show'); }
function hideLoading() { loadingEl.classList.remove('show'); }
function afterPaint(fn) { requestAnimationFrame(() => requestAnimationFrame(fn)); }
function fmtBytes(n) {
  if (n >= 1024 * 1024) return (n / (1024 * 1024)).toFixed(1) + ' MB';
  if (n >= 1024) return (n / 1024).toFixed(1) + ' KB';
  return n + ' bytes';
}

// ---- Helpers ---------------------------------------------------------------
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function typeOf(v) {
  if (v === null) return 'null';
  if (Array.isArray(v)) return 'array';
  return typeof v; // object | string | number | boolean
}
function primClass(t) { return {string:'s', number:'n', boolean:'b', null:'z'}[t] || 's'; }
function primText(v, t) {
  if (t === 'string') return JSON.stringify(v); // keep quotes + escapes
  if (t === 'null') return 'null';
  return String(v);
}
function countLabel(v, t) {
  if (t === 'array') return v.length + (v.length === 1 ? ' item' : ' items');
  const n = Object.keys(v).length;
  return n + (n === 1 ? ' key' : ' keys');
}
function previewText(v, t) {
  const open = t === 'array' ? '[' : '{';
  const close = t === 'array' ? ']' : '}';
  return open + ' ' + countLabel(v, t) + ' ' + close;
}

// ---- Tree builder ----------------------------------------------------------
// Renders one value into `parent`. `key` is the object key / array index label
// (or null for the root). `trailingComma` adds a comma after this value so the
// output reads like real JSON.
function build(key, value, parent, trailingComma) {
  // Node-budget guard: stop emitting rows once we've hit MAX_NODES so a huge
  // document can't lock the tab building millions of DOM nodes.
  if (nodeBudget <= 0) { nodesTruncated = true; return; }
  const t = typeOf(value);
  const isContainer = (t === 'object' || t === 'array');

  if (!isContainer) {
    nodeBudget--;
    const leaf = el('div', 'leaf');
    if (key !== null) { appendKey(leaf, key); leaf.appendChild(el('span', 'p', ': ')); }
    leaf.appendChild(el('span', primClass(t), primText(value, t)));
    if (trailingComma) leaf.appendChild(el('span', 'p', ','));
    leaf.dataset.search = ((key !== null ? key + ' ' : '') + primText(value, t)).toLowerCase();
    parent.appendChild(leaf);
    return;
  }

  nodeBudget--;
  const entries = t === 'array'
    ? value.map((v, i) => [i, v])
    : Object.keys(value).map(k => [k, value[k]]);

  const node = el('div', 'node');
  const line = el('div', 'line');
  line.appendChild(el('span', 'toggle'));
  if (key !== null) { appendKey(line, key); line.appendChild(el('span', 'p', ': ')); }
  line.appendChild(el('span', 'p', t === 'array' ? '[' : '{'));
  line.appendChild(el('span', 'preview', ' ' + countLabel(value, t) + ' ' + (t === 'array' ? ']' : '}') + (trailingComma ? ',' : '')));
  line.dataset.search = (key !== null ? String(key) : '').toLowerCase();
  node.appendChild(line);

  const children = el('div', 'children');
  for (let i = 0; i < entries.length; i++) {
    if (nodeBudget <= 0) { nodesTruncated = true; break; }
    build(t === 'array' ? null : entries[i][0], entries[i][1], children, i < entries.length - 1);
  }
  // For arrays we still want no key label on children (handled above by null key).
  node.appendChild(children);

  const closeline = el('div', 'closeline');
  closeline.appendChild(el('span', 'p', (t === 'array' ? ']' : '}') + (trailingComma ? ',' : '')));
  node.appendChild(closeline);

  // toggle behaviour
  line.querySelector('.toggle').addEventListener('click', () => node.classList.toggle('collapsed'));
  // also allow clicking the opening bracket line to toggle
  line.addEventListener('click', e => {
    if (e.target.classList.contains('toggle')) return; // already handled
    if (e.target.closest('.k')) return;                // let key be selectable
    node.classList.toggle('collapsed');
  });

  parent.appendChild(node);
}
function appendKey(row, key) {
  // Object keys are quoted like JSON; array indices are shown dimmed without quotes.
  const isIndex = typeof key === 'number';
  row.appendChild(el('span', isIndex ? 'p' : 'k', isIndex ? key : JSON.stringify(key)));
}

// ---- Render / errors -------------------------------------------------------
function render(text, name) {
  currentName = (name || 'data').replace(/\.(jsonc?|txt)$/i, '');
  showLoading('Parsing ' + (name || 'data') + '…');
  afterPaint(() => {
    let data;
    try {
      data = JSON.parse(text);
    } catch (ex) {
      hideLoading();
      showError(text, ex);
      return;
    }
    currentData = data;
    tree.innerHTML = '';
    nodeBudget = MAX_NODES; nodesTruncated = false;
    build(null, data, tree, false);
    tree.style.display = 'block';
    errBox.style.display = 'none';
    drop.style.display = 'none';
    fname.textContent = name || '';
    Object.values(btns).forEach(b => b.disabled = false);
    searchIn.disabled = false;
    searchIn.value = '';
    document.title = currentName + ' — KSI Tools JSON Viewer';
    if (nodesTruncated) {
      noticeEl.textContent = 'This document is very large — the on-screen tree is truncated at about '
        + MAX_NODES.toLocaleString() + ' nodes (search covers only the shown part). '
        + 'Copy and all exports still cover the whole document.';
      noticeEl.style.display = 'block';
    } else {
      noticeEl.style.display = 'none';
    }
    hideLoading();
  });
}

function showError(text, ex) {
  hideLoading();
  currentData = null;
  tree.style.display = 'none';
  drop.style.display = 'none';
  noticeEl.style.display = 'none';
  Object.values(btns).forEach(b => b.disabled = true);
  searchIn.disabled = true;
  // Try to surface a line/column from the "position N" some engines report.
  let detail = ex.message;
  const m = /position (\d+)/.exec(ex.message);
  if (m) {
    const pos = +m[1];
    const before = text.slice(0, pos);
    const line = before.split('\n').length;
    const col = pos - before.lastIndexOf('\n');
    detail += '\n\n→ around line ' + line + ', column ' + col;
    const ctx = text.split('\n')[line - 1] || '';
    detail += '\n\n' + ctx + '\n' + ' '.repeat(Math.max(0, col - 1)) + '^';
  }
  errBox.textContent = 'Not valid JSON:\n\n' + detail;
  errBox.style.display = 'block';
}

// Plain-message error (used for the size cap — no JSON parse context).
function showPlainError(msg) {
  hideLoading();
  currentData = null;
  tree.style.display = 'none'; drop.style.display = 'none'; noticeEl.style.display = 'none';
  Object.values(btns).forEach(b => b.disabled = true);
  searchIn.disabled = true;
  errBox.textContent = msg; errBox.style.display = 'block';
}

function readFile(file) {
  if (!file) return;
  if (file.size > MAX_BYTES) {
    showPlainError('That file is ' + fmtBytes(file.size) + ', which is over this viewer\'s '
      + fmtBytes(MAX_BYTES) + ' limit.\n\n'
      + 'The browser would run out of memory trying to load it. For a file this big,\n'
      + 'extract just the part you need first (e.g. with jq) and open that here.');
    return;
  }
  showLoading('Reading ' + file.name + ' (' + fmtBytes(file.size) + ')…');
  const r = new FileReader();
  r.onload = e => render(e.target.result, file.name);
  r.onerror = () => showPlainError('Could not read the file: ' + (r.error && r.error.message || 'unknown error'));
  r.readAsText(file);
}

// ---- Search ----------------------------------------------------------------
// A row is shown if it matches, or if any descendant matches. Ancestors of a
// match are auto-expanded so the hit is visible.
function applySearch(q) {
  q = q.trim().toLowerCase();
  clearHits(tree);
  if (!q) {
    tree.querySelectorAll('.leaf, .node, .line, .closeline').forEach(e => e.style.display = '');
    return;
  }
  Array.from(tree.children).forEach(child => filter(child, q));
}
function filter(node, q) {
  if (node.classList.contains('leaf')) {
    const match = node.dataset.search.includes(q);
    node.style.display = match ? '' : 'none';
    if (match) markHits(node, q);
    return match;
  }
  // container node
  const line = node.querySelector(':scope > .line');
  const children = node.querySelector(':scope > .children');
  const closeline = node.querySelector(':scope > .closeline');
  const selfMatch = line.dataset.search.includes(q);
  let childMatch = false;
  Array.from(children.children).forEach(c => { if (filter(c, q)) childMatch = true; });
  const visible = selfMatch || childMatch;
  node.style.display = visible ? '' : 'none';
  line.style.display = visible ? '' : 'none';
  closeline.style.display = visible ? '' : 'none';
  if (childMatch) node.classList.remove('collapsed'); // reveal path to hits
  if (selfMatch) markHits(line, q);
  return visible;
}
// Wrap matched substrings in the key/value spans with a .hit span.
function markHits(row, q) {
  row.querySelectorAll('.k, .s, .n, .b, .z').forEach(span => {
    const txt = span.textContent;
    const idx = txt.toLowerCase().indexOf(q);
    if (idx < 0) return;
    span.textContent = '';
    span.appendChild(document.createTextNode(txt.slice(0, idx)));
    span.appendChild(el('span', 'hit', txt.slice(idx, idx + q.length)));
    span.appendChild(document.createTextNode(txt.slice(idx + q.length)));
  });
}
function clearHits(root) {
  root.querySelectorAll('.hit').forEach(h => {
    const parent = h.parentNode;
    parent.replaceChild(document.createTextNode(h.textContent), h);
    parent.normalize();
  });
}

// ---- Toolbar actions -------------------------------------------------------
function setAllCollapsed(state) {
  tree.querySelectorAll('.node').forEach(n => n.classList.toggle('collapsed', state));
}
function download(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

btns.expand.addEventListener('click',   () => setAllCollapsed(false));
btns.collapse.addEventListener('click', () => {
  // Collapse everything except the root so there's always something visible.
  setAllCollapsed(true);
  const root = tree.querySelector(':scope > .node');
  if (root) root.classList.remove('collapsed');
});
btns.savejson.addEventListener('click', () => {
  if (currentData === null && typeOf(currentData) !== 'null') return;
  const pretty = JSON.stringify(currentData, null, 2);
  download(new Blob([pretty], { type: 'application/json' }), currentName + '.json');
});
btns.copy.addEventListener('click', () => {
  const pretty = JSON.stringify(currentData, null, 2);
  navigator.clipboard.writeText(pretty).then(() => {
    const old = btns.copy.textContent;
    btns.copy.textContent = 'Copied!';
    setTimeout(() => btns.copy.textContent = old, 1200);
  }).catch(() => alert('Copy failed — your browser blocked clipboard access.'));
});
// ---- CSV / spreadsheet export ---------------------------------------------
// JSON isn't inherently tabular, so we pick the most useful shape:
//  - array of objects        -> one row per element, columns = union of keys
//  - single object           -> one row
//  - array of scalars/mixed  -> one "value" column, one row each
//  - bare scalar             -> a 1x1 sheet
// Nested objects/arrays inside a row are flattened with dotted paths
// (crm.salesforceId, regions.0). This is the shape Excel/Sheets expect.
function flattenRow(obj, prefix, out) {
  const t = typeOf(obj);
  if (t === 'object') {
    const keys = Object.keys(obj);
    if (keys.length === 0) { out[prefix || ''] = '{}'; return out; }
    keys.forEach(k => flattenRow(obj[k], prefix ? prefix + '.' + k : k, out));
  } else if (t === 'array') {
    if (obj.length === 0) { out[prefix || ''] = '[]'; return out; }
    obj.forEach((v, i) => flattenRow(v, prefix ? prefix + '.' + i : String(i), out));
  } else {
    out[prefix || 'value'] = obj; // scalar leaf (null stays null for empty cell)
  }
  return out;
}
function toRows(data) {
  const t = typeOf(data);
  let records;
  if (t === 'array') {
    records = data.map(item => {
      const it = typeOf(item);
      return (it === 'object' || it === 'array') ? flattenRow(item, '', {}) : { value: item };
    });
  } else if (t === 'object') {
    records = [flattenRow(data, '', {})];
  } else {
    records = [{ value: data }];
  }
  // Column order: first-seen order across all records (stable, predictable).
  const cols = [];
  const seen = new Set();
  records.forEach(r => Object.keys(r).forEach(k => { if (!seen.has(k)) { seen.add(k); cols.push(k); } }));
  return { cols: cols.length ? cols : ['value'], records };
}
function csvCell(v) {
  if (v === null || v === undefined) return '';
  let s = (typeof v === 'object') ? JSON.stringify(v) : String(v);
  // Quote if it contains comma, quote, CR or LF; escape embedded quotes.
  if (/[",\r\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function toCsv(data) {
  const { cols, records } = toRows(data);
  const lines = [cols.map(csvCell).join(',')];
  records.forEach(r => lines.push(cols.map(c => csvCell(r[c])).join(',')));
  return lines.join('\r\n'); // CRLF — Excel-friendly
}
btns.savecsv.addEventListener('click', () => {
  const csv = toCsv(currentData);
  // UTF-8 BOM so Excel detects encoding and shows accented / special chars.
  download(new Blob(['﻿', csv], { type: 'text/csv;charset=utf-8;' }), currentName + '.csv');
});

btns.savehtml.addEventListener('click', () => {
  // Standalone snapshot: current tree markup + inlined CSS + a tiny toggle script
  // so collapsibles still work in the exported file. Fully offline.
  const css = document.getElementById('appcss').textContent;
  const toggleJs =
    "document.querySelectorAll('.line').forEach(function(l){"
    + "l.addEventListener('click',function(e){"
    + "if(e.target.closest('.k'))return;"
    + "var n=l.closest('.node'); if(n) n.classList.toggle('collapsed');});});";
  const html = '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">'
    + '<meta name="viewport" content="width=device-width, initial-scale=1">'
    + '<title>' + currentName + '</title><style>' + css + '</style></head>'
    + '<body><div class="tree" style="display:block">' + tree.innerHTML + '</div>'
    + '<script>' + toggleJs + '<\/script></body></html>';
  download(new Blob([html], { type: 'text/html' }), currentName + '.html');
});
let searchTimer = null;
searchIn.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => applySearch(searchIn.value), 120);
});

// ---- Drag & drop / file pick ----------------------------------------------
['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.add('hover'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.remove('hover'); }));
drop.addEventListener('drop', e => readFile(e.dataTransfer.files[0]));
window.addEventListener('dragover', e => e.preventDefault());
