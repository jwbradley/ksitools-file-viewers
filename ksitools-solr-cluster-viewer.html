<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KSI Tools Solr Cluster Health Viewer</title>
<style>
:root{color-scheme:light dark}*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;background:#fff;color:#1f2328}
header{position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center;padding:10px 16px;background:#f6f8fa;border-bottom:1px solid #d0d7de;flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:600}header .meta{color:#57606a;font-size:12px;flex:1}
button,textarea{font:inherit;font-size:13px;padding:6px 12px;border:1px solid #d0d7de;border-radius:6px;background:#fff;color:#1f2328}
button{cursor:pointer}button:hover{background:#f3f4f6}
#drop{max-width:900px;margin:24px auto 8px;padding:40px 24px;text-align:center;border:2px dashed #d0d7de;border-radius:12px;color:#57606a;cursor:pointer}
#drop.hover{border-color:#0969da;background:rgba(9,105,218,.05)}
#drop strong{display:block;font-size:18px;margin-bottom:6px;color:#1f2328}
.hint{color:#8b949e;font-size:12px}
.pb{max-width:900px;margin:0 auto 16px;padding:0 16px}
.pb label{display:block;font-size:13px;color:#57606a;margin-bottom:4px}
#paste{width:100%;min-height:110px;font-family:monospace;font-size:12.5px;padding:10px;border:1px solid #d0d7de;border-radius:8px;resize:vertical}
#err{max-width:900px;margin:16px auto;padding:14px 18px;border:1px solid #cf222e;border-radius:10px;background:rgba(207,34,46,.06);color:#cf222e;font-family:monospace;font-size:13px;white-space:pre-wrap;display:none}
.stats{display:none;flex-wrap:wrap;gap:8px;margin:8px 0 12px;padding:0 16px}
.stat{border:1px solid #d0d7de;border-radius:8px;padding:8px 12px;font-size:12.5px;background:#f6f8fa;min-width:110px}
.stat b{display:block;font-size:14px}.stat .lbl{color:#57606a;font-size:11px;text-transform:uppercase;letter-spacing:.03em}
.panel{max-width:1100px;margin:8px auto;padding:0 16px 40px;display:none}.panel.show{display:block}
.card{border:1px solid #d0d7de;border-radius:10px;margin-bottom:12px;overflow:hidden}
.card h2{margin:0;padding:10px 14px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;background:#f6f8fa;border-bottom:1px solid #d0d7de;color:#57606a}
.card .body{padding:12px 14px}
.badge{display:inline-block;font-size:10px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid #d0d7de;margin-right:4px}
.badge.bad{background:#ffebe9;border-color:#ff8182;color:#cf222e}
.badge.warn{background:#fff8c5;border-color:#f0c000;color:#7a5c00}
.badge.ok{background:#dafbe1;border-color:#4ac26b;color:#1a7f37}
.badge.info{background:#ddf4ff;border-color:#54aeff;color:#0969da}
table.grid{border-collapse:collapse;width:100%;font-size:12.5px;font-family:monospace}
.grid th{background:#f6f8fa;text-align:left;padding:7px 10px;border-bottom:1px solid #d0d7de;white-space:nowrap}
.grid td{padding:5px 10px;border-bottom:1px solid #f0f2f4;word-break:break-word;vertical-align:top}
.grid tr:hover td{background:rgba(175,184,193,.12)}.grid tr.sel td{background:rgba(9,105,218,.08)}
.grid tr{cursor:pointer}.empty{padding:12px 14px;color:#8b949e;font-size:13px}
.sub{background:#f6f8fa;padding:10px 14px;border-top:1px solid #d0d7de;display:none}.sub.show{display:block}
@media(prefers-color-scheme:dark){
  body{background:#0d1117;color:#e6edf3}header{background:#161b22;border-color:#30363d}
  header .meta,.hint,.lbl{color:#8b949e}
  button,textarea,#paste{background:#21262d;color:#e6edf3;border-color:#30363d}button:hover{background:#30363d}
  #drop{background:#0d1117;border-color:#30363d;color:#8b949e}#drop strong{color:#e6edf3}#drop.hover{border-color:#4493f8}
  .stat{background:#161b22;border-color:#30363d}.card{border-color:#30363d}
  .card h2{background:#161b22;border-color:#30363d;color:#8b949e}
  .grid th{background:#161b22;border-color:#30363d}.grid td{border-color:#21262d}
  .grid tr:hover td{background:rgba(110,118,129,.12)}.grid tr.sel td{background:rgba(31,111,235,.15)}
  .sub{background:#161b22;border-color:#30363d}
}
</style>
</head>
<body>
<header>
  <h1>KSI Tools Solr Cluster Health Viewer</h1>
  <span class="meta" id="meta"></span>
  <button onclick="clearAll()">Clear</button>
</header>

<div id="drop">
  <strong>Drop clusterstate.json or CLUSTERSTATUS response here</strong>
  <span class="hint">or paste JSON below and click Parse — accepts CLUSTERSTATUS wrapper or plain clusterstate.json</span>
</div>

<div class="pb">
  <label for="paste">Paste JSON:</label>
  <textarea id="paste" placeholder='{"cluster":{"collections":{...},"live_nodes":[...]}}'></textarea>
</div>
<div class="pb" style="padding-top:0">
  <button onclick="parseInput()">Parse JSON</button>
</div>

<div id="err"></div>
<div class="stats" id="stats"></div>

<div class="panel" id="panel">
  <div class="card">
    <h2>Health Findings</h2>
    <div class="body" id="healthBody"></div>
  </div>
  <div class="card">
    <h2>Collections <span id="collCount" style="font-weight:400"></span></h2>
    <div id="collTable"></div>
  </div>
  <div class="card">
    <h2 id="nodesTitle">Live Nodes</h2>
    <div class="body" id="nodesBody"></div>
  </div>
</div>

<script>
var data=null;

// Drop zone
var drop=document.getElementById('drop');
drop.addEventListener('dragover',function(e){e.preventDefault();drop.classList.add('hover');});
drop.addEventListener('dragleave',function(){drop.classList.remove('hover');});
drop.addEventListener('drop',function(e){
  e.preventDefault();drop.classList.remove('hover');
  var f=e.dataTransfer.files[0];if(!f)return;
  readFile(f);
});
drop.addEventListener('click',function(){
  var inp=document.createElement('input');inp.type='file';inp.accept='.json,text/plain';
  inp.onchange=function(){if(inp.files[0])readFile(inp.files[0]);};
  inp.click();
});

function readFile(f){
  var r=new FileReader();
  r.onload=function(ev){document.getElementById('paste').value=ev.target.result;parseInput();};
  r.readAsText(f);
}

function showErr(msg){var e=document.getElementById('err');e.textContent=msg;e.style.display='block';}
function clearErr(){document.getElementById('err').style.display='none';}

function parseInput(){
  clearErr();
  var raw=document.getElementById('paste').value.trim();
  if(!raw){showErr('No input provided.');return;}
  var parsed;
  try{parsed=JSON.parse(raw);}catch(ex){showErr('JSON parse error:\n'+ex.message);return;}

  var collections,liveNodes;
  if(parsed.cluster){
    // CLUSTERSTATUS wrapper
    collections=parsed.cluster.collections||{};
    liveNodes=parsed.cluster.live_nodes||[];
  }else if(parsed.responseHeader&&!parsed.cluster){
    showErr('Unexpected Solr response shape — expected cluster key or plain clusterstate object.');return;
  }else{
    // plain clusterstate.json — keys are collection names
    collections={};liveNodes=[];
    for(var k in parsed){
      if(parsed[k]&&typeof parsed[k]==='object'&&parsed[k].shards){collections[k]=parsed[k];}
    }
    if(!Object.keys(collections).length){showErr('Could not find any collections with shards in the input.');return;}
  }

  data={collections:collections,liveNodes:liveNodes};
  render(data);
}

function clearAll(){
  data=null;
  document.getElementById('paste').value='';
  clearErr();
  document.getElementById('stats').style.display='none';
  document.getElementById('panel').classList.remove('show');
  document.getElementById('meta').textContent='';
}

function badge(cls,text){return '<span class="badge '+cls+'">'+text+'</span>';}

function stateBadge(state){
  if(!state)return badge('warn','?');
  var s=state.toLowerCase();
  if(s==='active')return badge('ok','active');
  if(s==='recovering')return badge('warn','recovering');
  if(s==='recovery_failed')return badge('bad','recovery_failed');
  if(s==='down')return badge('bad','down');
  return badge('warn',esc(s));
}

function esc(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escId(s){return String(s).replace(/[^a-zA-Z0-9_-]/g,'_');}

function render(d){
  var collections=d.collections,liveNodes=d.liveNodes;
  var liveSet=new Set(liveNodes);
  var collNames=Object.keys(collections);
  var totalShards=0,totalReplicas=0,issues=[];

  for(var cname in collections){
    var coll=collections[cname];
    var rf=parseInt(coll.replicationFactor)||1;
    var shards=coll.shards||{};
    for(var sname in shards){
      var shard=shards[sname];
      totalShards++;
      var replicas=shard.replicas||{};
      var liveCount=0,hasLeader=false,repKeys=Object.keys(replicas);
      if(shard.state&&shard.state!=='active'){
        issues.push('Shard '+cname+'/'+sname+': state='+shard.state);
      }
      for(var rname in replicas){
        var rep=replicas[rname];
        totalReplicas++;
        var nodeLive=liveSet.size===0||liveSet.has(rep.node_name||'');
        if(rep.state==='active'&&nodeLive)liveCount++;
        if(rep.leader==='true')hasLeader=true;
        if(rep.state==='down')issues.push('Replica '+rname+' ('+cname+'/'+sname+'): DOWN');
        else if(rep.state==='recovery_failed')issues.push('Replica '+rname+' ('+cname+'/'+sname+'): recovery_failed');
        else if(rep.state==='recovering')issues.push('Replica '+rname+' ('+cname+'/'+sname+'): recovering');
      }
      if(!hasLeader&&repKeys.length>0)issues.push('Shard '+cname+'/'+sname+': no leader');
      if(liveSet.size>0&&liveCount<rf)issues.push('Shard '+cname+'/'+sname+': live replicas '+liveCount+' < replicationFactor '+rf);
    }
  }

  var healthBadge;
  if(issues.length===0)healthBadge=badge('ok','HEALTHY');
  else if(issues.some(function(i){return/\bdown\b|recovery_failed/i.test(i);}))healthBadge=badge('bad','DOWN');
  else healthBadge=badge('warn','WARNINGS');

  // Stat cards
  var statsEl=document.getElementById('stats');
  statsEl.style.display='flex';
  statsEl.innerHTML=
    '<div class="stat"><b>'+liveNodes.length+'</b><span class="lbl">Live Nodes</span></div>'+
    '<div class="stat"><b>'+collNames.length+'</b><span class="lbl">Collections</span></div>'+
    '<div class="stat"><b>'+totalShards+'</b><span class="lbl">Shards</span></div>'+
    '<div class="stat"><b>'+totalReplicas+'</b><span class="lbl">Replicas</span></div>'+
    '<div class="stat"><b>'+healthBadge+'</b><span class="lbl">Health</span></div>';

  // Health findings
  var healthBody=document.getElementById('healthBody');
  if(issues.length===0){
    healthBody.innerHTML=badge('ok','All shards active, leaders present, replicas healthy');
  }else{
    healthBody.innerHTML=issues.map(function(i){
      var cls=/\bdown\b|recovery_failed/i.test(i)?'bad':'warn';
      return '<div style="margin-bottom:4px">'+badge(cls,'!')
        +' <span style="font-family:monospace;font-size:12.5px">'+esc(i)+'</span></div>';
    }).join('');
  }

  renderCollectionsTable(collections,liveSet);

  document.getElementById('nodesTitle').textContent='Live Nodes ('+liveNodes.length+')';
  var nodesBody=document.getElementById('nodesBody');
  if(liveNodes.length===0){
    nodesBody.innerHTML='<span style="color:#8b949e;font-size:13px">No live_nodes in response (plain clusterstate.json format).</span>';
  }else{
    nodesBody.innerHTML=liveNodes.map(function(n){
      return '<div style="font-family:monospace;font-size:12.5px;padding:2px 0">'+badge('ok','UP')+' '+esc(n)+'</div>';
    }).join('');
  }

  document.getElementById('meta').textContent=collNames.length+' collection'+(collNames.length!==1?'s':'')+' · parsed '+new Date().toLocaleTimeString();
  document.getElementById('panel').classList.add('show');
}

function renderCollectionsTable(collections,liveSet){
  var container=document.getElementById('collTable');
  var keys=Object.keys(collections);
  document.getElementById('collCount').textContent='('+keys.length+')';
  if(!keys.length){container.innerHTML='<div class="empty">No collections found.</div>';return;}

  var html='<table class="grid"><thead><tr>'
    +'<th>Collection</th><th>Shards</th><th>Repl.Factor</th>'
    +'<th>Live / Total Replicas</th><th>Config</th>'
    +'</tr></thead><tbody>';

  for(var i=0;i<keys.length;i++){
    var cname=keys[i];
    var coll=collections[cname];
    var rf=parseInt(coll.replicationFactor)||1;
    var shards=coll.shards||{};
    var shardKeys=Object.keys(shards);
    var liveReplicas=0,totalReplicas=0;
    for(var j=0;j<shardKeys.length;j++){
      var reps=shards[shardKeys[j]].replicas||{};
      for(var rname in reps){
        var rep=reps[rname];totalReplicas++;
        if(rep.state==='active'&&(liveSet.size===0||liveSet.has(rep.node_name||'')))liveReplicas++;
      }
    }
    var expected=rf*shardKeys.length;
    var repStyle=liveReplicas<expected?'color:#cf222e;font-weight:600':'';
    var sid=escId(cname);
    html+='<tr onclick="toggleShard(this,\''+sid+'\')" id="row-'+sid+'">'
      +'<td><strong>'+esc(cname)+'</strong></td>'
      +'<td>'+shardKeys.length+'</td>'
      +'<td>'+rf+'</td>'
      +'<td style="'+repStyle+'">'+liveReplicas+' / '+totalReplicas+'</td>'
      +'<td>'+esc(coll.configName||'')+'</td>'
      +'</tr>'
      +'<tr id="subrow-'+sid+'" style="cursor:default"><td colspan="5" style="padding:0">'
      +'<div class="sub" id="sub-'+sid+'"></div></td></tr>';
  }
  html+='</tbody></table>';
  container.innerHTML=html;
}

function toggleShard(row,sid){
  var sub=document.getElementById('sub-'+sid);
  if(!sub)return;
  var wasOpen=sub.classList.contains('show');
  document.querySelectorAll('.sub').forEach(function(s){s.classList.remove('show');});
  document.querySelectorAll('tr[id^="row-"]').forEach(function(r){r.classList.remove('sel');});
  if(!wasOpen){
    row.classList.add('sel');
    sub.classList.add('show');
    if(!sub.dataset.loaded){renderShardDetail(sid,sub);sub.dataset.loaded='1';}
  }
}

function renderShardDetail(sid,container){
  if(!data)return;
  var coll=null;
  for(var k in data.collections){if(escId(k)===sid){coll=data.collections[k];break;}}
  if(!coll){container.innerHTML='<div class="empty">Collection not found.</div>';return;}

  var liveSet=new Set(data.liveNodes);
  var shards=coll.shards||{};
  var shardKeys=Object.keys(shards);
  if(!shardKeys.length){container.innerHTML='<div class="empty">No shards.</div>';return;}

  var html='';
  for(var i=0;i<shardKeys.length;i++){
    var sname=shardKeys[i];
    var shard=shards[sname];
    var replicas=shard.replicas||{};
    var repKeys=Object.keys(replicas);
    html+='<div style="font-size:11px;color:#57606a;padding:6px 0 2px;font-weight:600">'
      +esc(sname)+'&nbsp;&middot;&nbsp;range: '+esc(shard.range||'n/a')
      +'&nbsp;&middot;&nbsp;'+stateBadge(shard.state)
      +'&nbsp;&middot;&nbsp;'+repKeys.length+' replica'+(repKeys.length!==1?'s':'')
      +'</div>'
      +'<table class="grid"><thead><tr>'
      +'<th>Node</th><th>Core</th><th>Type</th><th>State</th><th>Leader</th>'
      +'</tr></thead><tbody>';
    for(var j=0;j<repKeys.length;j++){
      var rname=repKeys[j];
      var rep=replicas[rname];
      var isLeader=rep.leader==='true';
      html+='<tr style="cursor:default">'
        +'<td>'+esc(rep.node_name||rep.base_url||rname)+'</td>'
        +'<td style="font-size:11px">'+esc(rep.core||'')+'</td>'
        +'<td>'+esc(rep.type||'NRT')+'</td>'
        +'<td>'+stateBadge(rep.state)+'</td>'
        +'<td>'+(isLeader?badge('info','leader'):'')+'</td>'
        +'</tr>';
    }
    html+='</tbody></table>';
  }
  container.innerHTML=html;
}
</script>
</body>
</html>
