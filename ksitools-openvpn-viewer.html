<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KSI Tools OpenVPN Viewer</title>
<style id="appcss">
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:15px; line-height:1.5; background:#fff; color:#1f2328; }
header.bar { position:sticky; top:0; z-index:20; display:flex; gap:8px; align-items:center; padding:10px 16px; background:#f6f8fa; border-bottom:1px solid #d0d7de; flex-wrap:wrap; }
header.bar h1 { font-size:15px; margin:0; font-weight:600; }
header.bar .fname { color:#57606a; font-size:13px; flex:1; min-width:60px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
header.bar .meta { color:#57606a; font-size:12px; }
button, select, input[type=text], textarea { font:inherit; font-size:13px; padding:6px 12px; border:1px solid #d0d7de; border-radius:6px; background:#fff; color:#1f2328; }
button { cursor:pointer; } button:hover { background:#f3f4f6; } button:disabled { opacity:.45; cursor:default; }
button.toggle-on { background:#0969da; color:#fff; border-color:#0969da; }
#search { width:220px; }
#drop { max-width:900px; margin:36px auto 16px; padding:48px 24px; text-align:center; border:2px dashed #d0d7de; border-radius:12px; color:#57606a; cursor:pointer; }
#drop.hover { border-color:#0969da; background:rgba(9,105,218,.05); color:#0969da; }
#drop strong { display:block; font-size:18px; margin-bottom:6px; color:#1f2328; }
.hint { color:#8b949e; font-size:12px; }
.paste-box { max-width:900px; margin:0 auto 20px; padding:0 16px; }
.paste-box label { display:block; font-size:13px; color:#57606a; margin-bottom:6px; }
#paste, .tarea { width:100%; min-height:110px; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:12.5px; padding:10px; border:1px solid #d0d7de; border-radius:8px; resize:vertical; }
#notice { padding:7px 16px; font-size:12.5px; background:#fff8c5; color:#7a5c00; border-bottom:1px solid #f0c000; display:none; }
#err { max-width:900px; margin:24px auto; padding:16px 20px; border:1px solid #cf222e; border-radius:10px; background:rgba(207,34,46,.06); color:#cf222e; font-family:ui-monospace,monospace; font-size:13px; white-space:pre-wrap; display:none; }
#loading { position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px; background:rgba(255,255,255,.72); color:#57606a; }
#loading.show { display:flex; }
.spinner { width:38px; height:38px; border:4px solid #d0d7de; border-top-color:#0969da; border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

.badge { display:inline-block; font-size:10px; font-weight:600; padding:1px 7px; border-radius:999px; border:1px solid #d0d7de; margin-right:4px; margin-bottom:4px; }
.badge.bad { background:#ffebe9; border-color:#ff8182; color:#cf222e; }
.badge.warn { background:#fff8c5; border-color:#f0c000; color:#7a5c00; }
.badge.ok { background:#dafbe1; border-color:#4ac26b; color:#1a7f37; }
.badge.info { background:#ddf4ff; border-color:#54aeff; color:#0969da; }

.stats { display:none; flex-wrap:wrap; gap:8px; margin:8px 0 12px; padding:0 16px; }
.stat { border:1px solid #d0d7de; border-radius:8px; padding:8px 12px; font-size:12.5px; background:#f6f8fa; min-width:120px; max-width:320px; }
.stat b { display:block; font-size:14px; word-break:break-word; }
.stat .lbl { color:#57606a; font-size:11px; text-transform:uppercase; letter-spacing:.03em; }

.panel { max-width:1100px; margin:12px auto; padding:0 16px 40px; display:none; }
.panel.show { display:block; }
.card { border:1px solid #d0d7de; border-radius:10px; margin-bottom:12px; overflow:hidden; }
.card h2 { margin:0; padding:10px 14px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; background:#f6f8fa; border-bottom:1px solid #d0d7de; color:#57606a; }
.card .body { padding:12px 14px; }
.flags-row { display:flex; flex-wrap:wrap; gap:4px; align-items:center; }
.peer-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px; }
.peer-card { border:1px solid #d0d7de; border-radius:8px; padding:10px 12px; background:#f6f8fa; font-size:12.5px; }
.peer-card .ptitle { font-weight:600; margin-bottom:6px; color:#0550ae; }
.peer-card .pkv { font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:11.5px; margin:2px 0; word-break:break-word; }
.peer-card .pkv .k { color:#57606a; }

table.grid { border-collapse:collapse; width:100%; font-size:12.5px; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; }
.grid th { position:sticky; top:53px; background:#f6f8fa; text-align:left; padding:8px 10px; border-bottom:1px solid #d0d7de; white-space:nowrap; z-index:5; }
.grid td { padding:6px 10px; border-bottom:1px solid #f0f2f4; vertical-align:top; word-break:break-word; }
.grid tr:hover td { background:rgba(175,184,193,.12); }
.grid tr { cursor:pointer; }
.grid tr.selected td { background:rgba(9,105,218,.1); }
.grid td.key { color:#0550ae; font-weight:600; white-space:nowrap; width:1%; }
.grid td.sec { color:#57606a; white-space:nowrap; width:1%; }
.grid td.ln { color:#8b949e; width:1%; text-align:right; font-variant-numeric:tabular-nums; }
.masked { color:#8b949e; letter-spacing:.08em; }

pre.block { margin:0; padding:10px 12px; background:#f6f8fa; border-radius:8px; white-space:pre-wrap; word-break:break-word; max-height:28vh; overflow:auto; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:12px; }
.ctx-line { display:block; padding:1px 4px; border-radius:3px; }
.ctx-line.cur { background:rgba(9,105,218,.15); font-weight:600; }
.hit { background:#fff3c4; border-radius:3px; box-shadow:0 0 0 1px #f0c000; }

@media (prefers-color-scheme: dark) {
  body { background:#0d1117; color:#e6edf3; }
  header.bar { background:#161b22; border-bottom-color:#30363d; }
  header.bar .fname, header.bar .meta, .hint, .paste-box label, .stat .lbl { color:#8b949e; }
  button, select, input[type=text], textarea, #paste, .tarea { background:#21262d; color:#e6edf3; border-color:#30363d; }
  button:hover { background:#30363d; }
  button.toggle-on { background:#1f6feb; border-color:#1f6feb; }
  #drop { border-color:#30363d; color:#8b949e; } #drop strong { color:#e6edf3; }
  #drop.hover { border-color:#4493f8; color:#4493f8; }
  .stat { background:#161b22; border-color:#30363d; }
  .card { border-color:#30363d; }
  .card h2 { background:#161b22; border-bottom-color:#30363d; color:#8b949e; }
  .peer-card { background:#161b22; border-color:#30363d; }
  .peer-card .ptitle { color:#79c0ff; }
  .peer-card .pkv .k { color:#8b949e; }
  .grid th { background:#161b22; border-bottom-color:#30363d; }
  .grid td { border-bottom-color:#21262d; }
  .grid tr:hover td { background:rgba(110,118,129,.12); }
  .grid tr.selected td { background:rgba(31,111,235,.2); }
  .grid td.key { color:#79c0ff; }
  .grid td.sec { color:#8b949e; }
  .grid td.ln { color:#6e7681; }
  .masked { color:#6e7681; }
  .badge { border-color:#30363d; }
  .badge.bad { background:#3d1418; border-color:#f85149; color:#ff7b72; }
  .badge.warn { background:#3a2f00; border-color:#b58900; color:#e3b341; }
  .badge.ok { background:#12261e; border-color:#238636; color:#3fb950; }
  .badge.info { background:#121d2f; border-color:#1f6feb; color:#58a6ff; }
  pre.block { background:#161b22; }
  .ctx-line.cur { background:rgba(31,111,235,.25); }
  .hit { background:#634c00; color:#ffe08a; box-shadow:0 0 0 1px #b58900; }
  #notice { background:#3a2f00; color:#e3b341; border-bottom-color:#b58900; }
  #err { border-color:#f85149; color:#ff7b72; background:rgba(248,81,73,.08); }
  #loading { background:rgba(13,17,23,.75); }
  .spinner { border-color:#30363d; border-top-color:#4493f8; }
}
</style>
</head>
<body>

<header class="bar">
  <h1>KSI Tools OpenVPN Viewer</h1>
  <span class="fname" id="fname"></span>
  <span class="meta" id="meta"></span>
  <input type="text" id="search" placeholder="Filter directive / remote / block…" disabled>
  <button id="reveal" disabled title="Show PEM / key bodies">Reveal secrets</button>
  <button id="copy" disabled title="Copy a plain-English summary">Copy summary</button>
  <button id="savejson" disabled>Save .json</button>
  <button id="savecsv" disabled>Save .csv</button>
  <button id="pick" onclick="document.getElementById('file').click()">Open file</button>
</header>
<input type="file" id="file" accept=".ovpn,.conf,.txt,text/plain" style="display:none">

<div id="drop">
  <strong>Drop an OpenVPN config here</strong>
  or click to choose · .ovpn · .conf · .txt
  <div class="hint" style="margin-top:10px">Parsed locally. Inline &lt;ca&gt;/&lt;cert&gt;/&lt;key&gt; PEM bodies stay masked unless you reveal them. Nothing is uploaded.</div>
</div>

<div class="paste-box">
  <label for="paste">Or paste OpenVPN config:</label>
  <textarea id="paste" class="tarea" spellcheck="false" placeholder="client&#10;dev tun&#10;proto udp&#10;remote vpn.example.com 1194&#10;resolv-retry infinite&#10;nobind&#10;persist-key&#10;persist-tun&#10;remote-cert-tls server&#10;cipher AES-256-GCM&#10;auth SHA256&#10;verb 3&#10;&lt;ca&gt;&#10;-----BEGIN CERTIFICATE-----&#10;…&#10;-----END CERTIFICATE-----&#10;&lt;/ca&gt;"></textarea>
  <div style="margin-top:8px"><button id="goBtn">Analyze paste</button></div>
</div>

<div id="err"></div>
<div id="notice"></div>
<div class="stats" id="stats"></div>
<div class="panel" id="panel"></div>

<div id="loading"><div class="spinner"></div><div id="loadingmsg">Loading…</div></div>

<script>
(function () {
'use strict';

const MAX_BYTES = 5 * 1024 * 1024;

/** Inline PEM / secret block tag names (lower). */
const INLINE_TAGS = {
  ca: true,
  cert: true,
  key: true,
  'tls-auth': true,
  'tls-crypt': true,
  'tls-crypt-v2': true,
  'extra-certs': true,
  secret: true,
  pkcs12: true
};

/** Tags whose bodies are always treated as secrets (warn + redact). */
const SECRET_TAGS = {
  key: true,
  secret: true,
  'tls-auth': true,
  'tls-crypt': true,
  'tls-crypt-v2': true,
  pkcs12: true
};

/** External file-ref directives (first arg is a path). */
const FILE_REF_DIRS = {
  ca: true,
  cert: true,
  key: true,
  'tls-auth': true,
  'tls-crypt': true,
  'tls-crypt-v2': true,
  'extra-certs': true,
  dh: true,
  pkcs12: true,
  secret: true,
  'askpass': true,
  'auth-user-pass': true,
  'crl-verify': true
};

const drop = document.getElementById('drop');
const errBox = document.getElementById('err');
const noticeEl = document.getElementById('notice');
const fname = document.getElementById('fname');
const metaEl = document.getElementById('meta');
const pasteEl = document.getElementById('paste');
const fileInput = document.getElementById('file');
const searchIn = document.getElementById('search');
const loadingEl = document.getElementById('loading');
const loadingMsg = document.getElementById('loadingmsg');
const statsEl = document.getElementById('stats');
const panel = document.getElementById('panel');
const revealBtn = document.getElementById('reveal');
const btns = {
  copy: document.getElementById('copy'),
  savejson: document.getElementById('savejson'),
  savecsv: document.getElementById('savecsv')
};

let currentName = 'openvpn';
let currentFileName = '';
let rawLines = [];
let state = null; // { directives, remotes, blocks, fileRefs, flags, summary, rows }
let revealSecrets = false; // default OFF

function showLoading(m) { loadingMsg.textContent = m || 'Loading…'; loadingEl.classList.add('show'); }
function hideLoading() { loadingEl.classList.remove('show'); }
function afterPaint(fn) { requestAnimationFrame(() => requestAnimationFrame(fn)); }
function showError(m) { errBox.style.display = 'block'; errBox.textContent = m; }
function clearError() { errBox.style.display = 'none'; errBox.textContent = ''; }
function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: type || 'text/plain' }));
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}
function csvEsc(v) {
  const s = String(v ?? '');
  return /["\n,]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function fmtBytes(n) {
  if (n >= 1024 * 1024) return (n / (1024 * 1024)).toFixed(1) + ' MB';
  if (n >= 1024) return (n / 1024).toFixed(1) + ' KB';
  return n + ' bytes';
}
function wireDrop(loadFn) {
  drop.onclick = () => fileInput.click();
  fileInput.onchange = () => { if (fileInput.files[0]) loadFn(fileInput.files[0]); fileInput.value = ''; };
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('hover'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('hover'); }));
  drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) loadFn(f); });
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => {
    if (e.target.closest && e.target.closest('#drop')) return;
    e.preventDefault();
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) loadFn(f);
  });
}

function utf8ByteLength(s) {
  if (typeof TextEncoder !== 'undefined') return new TextEncoder().encode(s).length;
  let n = 0;
  for (let i = 0; i < s.length; i++) {
    const c = s.charCodeAt(i);
    if (c < 0x80) n += 1;
    else if (c < 0x800) n += 2;
    else if (c >= 0xd800 && c <= 0xdbff) { n += 4; i++; }
    else n += 3;
  }
  return n;
}

function maskPemPreview(block, reveal) {
  if (reveal) return block.body;
  const tag = block.tag;
  const lines = block.lineCount;
  const bytes = block.byteLength;
  const secret = !!SECRET_TAGS[tag] || tag === 'key';
  return '<' + tag + '> · ' + lines + ' line' + (lines === 1 ? '' : 's') +
    ' · ' + bytes + ' byte' + (bytes === 1 ? '' : 's') +
    ' · [MASKED' + (secret ? ' KEY/SECRET' : '') + ']';
}

function exportBlockBody(block, reveal) {
  if (reveal) return block.body;
  return '[REDACTED ' + block.byteLength + ' bytes, ' + block.lineCount + ' lines]';
}

/**
 * Parse OpenVPN .ovpn / .conf text into directives, remotes, inline blocks, file refs.
 */
function parseOpenVPN(text) {
  const phys = String(text || '').replace(/^\uFEFF/, '').split(/\r\n|\n|\r/);
  rawLines = phys;

  const directives = [];
  const remotes = [];
  const blocks = [];
  const fileRefs = [];

  let i = 0;
  while (i < phys.length) {
    const ln = i + 1;
    const raw = phys[i];
    const trimmed = raw.trim();

    if (!trimmed || trimmed.startsWith('#') || trimmed.startsWith(';')) {
      i++;
      continue;
    }

    // Inline block open: <tag> or <tag args>
    const open = /^<([A-Za-z0-9_-]+)(?:\s+([^>]*))?>\s*$/.exec(trimmed);
    if (open) {
      const tag = open[1].toLowerCase();
      const openArgs = (open[2] || '').trim();
      const startLine = ln;
      const bodyLines = [];
      i++;
      let closed = false;
      while (i < phys.length) {
        const t2 = phys[i].trim();
        const close = new RegExp('^</' + tag.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '>\\s*$', 'i').exec(t2);
        if (close) {
          closed = true;
          i++;
          break;
        }
        bodyLines.push(phys[i]);
        i++;
      }
      const body = bodyLines.join('\n');
      const block = {
        tag,
        openArgs,
        startLine,
        endLine: closed ? i : phys.length,
        body,
        lineCount: bodyLines.length,
        byteLength: utf8ByteLength(body),
        secret: !!SECRET_TAGS[tag],
        closed
      };
      blocks.push(block);
      directives.push({
        line: startLine,
        directive: '<' + tag + '>',
        directiveNorm: tag,
        args: openArgs || '(inline block)',
        kind: 'block',
        secret: block.secret,
        blockIndex: blocks.length - 1
      });
      continue;
    }

    // Directive: first token + rest
    const sp = trimmed.search(/\s/);
    const directive = (sp < 0 ? trimmed : trimmed.slice(0, sp)).toLowerCase();
    const args = sp < 0 ? '' : trimmed.slice(sp).trim();
    const argsParts = args ? args.split(/\s+/) : [];

    const entry = {
      line: ln,
      directive,
      directiveNorm: directive,
      args,
      argsParts,
      kind: 'directive',
      secret: false,
      raw: trimmed
    };

    if (directive === 'remote') {
      const host = argsParts[0] || '';
      const port = argsParts[1] || '';
      const proto = argsParts[2] || '';
      remotes.push({ line: ln, host, port, proto, raw: args });
      entry.kind = 'remote';
    }

    // External file refs (when not an inline block and has a path-like arg)
    if (FILE_REF_DIRS[directive] && argsParts.length >= 1) {
      // auth-user-pass with no args is a prompt, not a file ref
      if (!(directive === 'auth-user-pass' && !args)) {
        const path = argsParts[0];
        // skip boolean-ish / flag-only uses
        if (path && path !== 'none') {
          fileRefs.push({
            line: ln,
            directive,
            path,
            extra: argsParts.slice(1).join(' '),
            kind: 'file-ref'
          });
          entry.kind = entry.kind === 'remote' ? 'remote' : 'file-ref';
        }
      }
    }

    directives.push(entry);
    i++;
  }

  return { directives, remotes, blocks, fileRefs, lineCount: phys.length };
}

function firstDirective(directives, name) {
  const n = name.toLowerCase();
  for (const d of directives) {
    if (d.kind === 'block') continue;
    if (d.directiveNorm === n) return d;
  }
  return null;
}

function allDirectives(directives, name) {
  const n = name.toLowerCase();
  return directives.filter(d => d.kind !== 'block' && d.directiveNorm === n);
}

function analyzeFlags(parsed) {
  const flags = [];
  const { directives, remotes, blocks, fileRefs } = parsed;

  // Inline <key> → warn
  const keyBlocks = blocks.filter(b => b.tag === 'key');
  if (keyBlocks.length) {
    for (const b of keyBlocks) {
      flags.push({
        level: 'warn',
        label: 'inline <key> (private key in file)',
        detail: 'Private key embedded at line ' + b.startLine +
          ' (' + b.byteLength + ' bytes, ' + b.lineCount + ' lines). Masked unless Reveal secrets is on.'
      });
    }
  }

  // Other secret inline blocks
  for (const b of blocks) {
    if (b.tag === 'key') continue;
    if (SECRET_TAGS[b.tag]) {
      flags.push({
        level: 'warn',
        label: 'inline <' + b.tag + '> secret',
        detail: 'Sensitive <' + b.tag + '> block at line ' + b.startLine +
          ' (' + b.byteLength + ' bytes). Masked by default.'
      });
    }
  }

  // Unclosed blocks
  for (const b of blocks) {
    if (!b.closed) {
      flags.push({
        level: 'bad',
        label: 'unclosed <' + b.tag + '>',
        detail: 'Inline block opened at line ' + b.startLine + ' never closed.'
      });
    }
  }

  // auth-user-pass
  const aup = allDirectives(directives, 'auth-user-pass');
  for (const d of aup) {
    if (!d.args) {
      flags.push({
        level: 'info',
        label: 'auth-user-pass (will prompt)',
        detail: 'Line ' + d.line + ': auth-user-pass with no file — client will prompt for username/password.'
      });
    } else {
      flags.push({
        level: 'info',
        label: 'auth-user-pass file',
        detail: 'Line ' + d.line + ': credentials file → ' + d.argsParts[0]
      });
    }
  }

  // cipher none / auth none → bad
  for (const d of allDirectives(directives, 'cipher')) {
    if ((d.argsParts[0] || '').toLowerCase() === 'none') {
      flags.push({
        level: 'bad',
        label: 'cipher none',
        detail: 'Line ' + d.line + ': cipher none disables encryption.'
      });
    }
  }
  for (const d of allDirectives(directives, 'auth')) {
    if ((d.argsParts[0] || '').toLowerCase() === 'none') {
      flags.push({
        level: 'bad',
        label: 'auth none',
        detail: 'Line ' + d.line + ': auth none disables authentication HMAC.'
      });
    }
  }

  // redirect-gateway → info (full tunnel)
  for (const d of allDirectives(directives, 'redirect-gateway')) {
    flags.push({
      level: 'info',
      label: 'redirect-gateway (full tunnel)',
      detail: 'Line ' + d.line + ': redirect-gateway' + (d.args ? ' ' + d.args : '') + ' — full-tunnel routing.'
    });
  }

  // deprecated comp-lzo → warn
  for (const d of allDirectives(directives, 'comp-lzo')) {
    flags.push({
      level: 'warn',
      label: 'deprecated comp-lzo',
      detail: 'Line ' + d.line + ': comp-lzo is deprecated; prefer compress / disable compression.'
    });
  }

  // External key/cert file refs → info
  for (const fr of fileRefs) {
    if (fr.directive === 'key' || fr.directive === 'ca' || fr.directive === 'cert' ||
        fr.directive === 'tls-auth' || fr.directive === 'tls-crypt') {
      flags.push({
        level: 'info',
        label: fr.directive + ' file',
        detail: 'Line ' + fr.line + ': ' + fr.directive + ' → ' + fr.path +
          (fr.extra ? ' ' + fr.extra : '')
      });
    }
  }

  // Mode hints
  const isClient = directives.some(d => d.directiveNorm === 'client' || d.directiveNorm === 'tls-client');
  const isServer = directives.some(d => d.directiveNorm === 'server' || d.directiveNorm === 'tls-server');
  if (isClient) {
    flags.push({ level: 'ok', label: 'client mode', detail: 'client / tls-client directive present.' });
  }
  if (isServer) {
    flags.push({ level: 'info', label: 'server mode', detail: 'server / tls-server directive present.' });
  }

  if (!remotes.length && isClient) {
    flags.push({
      level: 'warn',
      label: 'no remote',
      detail: 'Client-like config has no remote directive.'
    });
  }

  if (!flags.length) {
    flags.push({ level: 'ok', label: 'no major flags', detail: 'Heuristic checks found nothing loud.' });
  }
  return flags;
}

function buildSummary(parsed, filename) {
  const { directives, remotes, blocks, fileRefs } = parsed;
  const protoD = firstDirective(directives, 'proto');
  const cipherD = firstDirective(directives, 'cipher');
  const authD = firstDirective(directives, 'auth');
  const devD = firstDirective(directives, 'dev');
  const portD = firstDirective(directives, 'port');
  const verbD = firstDirective(directives, 'verb');
  const isClient = directives.some(d => d.directiveNorm === 'client' || d.directiveNorm === 'tls-client');
  const isServer = directives.some(d => d.directiveNorm === 'server' || d.directiveNorm === 'tls-server');

  return {
    filename: filename || '',
    remoteCount: remotes.length,
    remotes: remotes.map(r => ({ host: r.host, port: r.port, proto: r.proto, line: r.line })),
    proto: protoD ? protoD.args : (remotes[0] && remotes[0].proto) || '',
    cipher: cipherD ? cipherD.args : '',
    auth: authD ? authD.args : '',
    dev: devD ? devD.args : '',
    port: portD ? portD.args : '',
    verb: verbD ? verbD.args : '',
    inlineBlockCount: blocks.length,
    inlineBlocks: blocks.map(b => ({
      tag: b.tag,
      startLine: b.startLine,
      lineCount: b.lineCount,
      byteLength: b.byteLength,
      secret: b.secret,
      closed: b.closed
    })),
    fileRefCount: fileRefs.length,
    hasInlineKey: blocks.some(b => b.tag === 'key'),
    hasInlineCa: blocks.some(b => b.tag === 'ca'),
    hasInlineCert: blocks.some(b => b.tag === 'cert'),
    mode: isServer ? 'server' : (isClient ? 'client' : 'unknown'),
    directiveCount: directives.filter(d => d.kind !== 'block').length
  };
}

function flattenRows(parsed) {
  const rows = [];
  for (const d of parsed.directives) {
    if (d.kind === 'block') {
      const b = parsed.blocks[d.blockIndex];
      rows.push({
        line: d.line,
        kind: 'block',
        directive: d.directive,
        directiveNorm: d.directiveNorm,
        args: maskPemPreview(b, false), // placeholder; draw uses reveal
        value: b.body,
        secret: true,
        blockIndex: d.blockIndex
      });
    } else {
      rows.push({
        line: d.line,
        kind: d.kind,
        directive: d.directive,
        directiveNorm: d.directiveNorm,
        args: d.args,
        value: d.args,
        secret: false,
        blockIndex: -1
      });
    }
  }
  return rows;
}

function plainSummary(st) {
  const s = st.summary;
  const lines = [];
  lines.push('KSI Tools OpenVPN Viewer — summary');
  lines.push('File: ' + (s.filename || currentFileName || '(paste)'));
  lines.push('Mode: ' + (s.mode || 'unknown'));
  lines.push('Remotes: ' + s.remoteCount);
  for (const r of s.remotes) {
    lines.push('  - ' + r.host + (r.port ? ' ' + r.port : '') + (r.proto ? ' ' + r.proto : '') + ' (line ' + r.line + ')');
  }
  lines.push('Proto: ' + (s.proto || '(none)'));
  lines.push('Cipher: ' + (s.cipher || '(none)'));
  if (s.auth) lines.push('Auth: ' + s.auth);
  if (s.dev) lines.push('Dev: ' + s.dev);
  lines.push('Inline blocks: ' + s.inlineBlockCount);
  for (const b of s.inlineBlocks) {
    lines.push('  - <' + b.tag + '> line ' + b.startLine +
      ' · ' + b.lineCount + ' lines · ' + b.byteLength + ' bytes' +
      (b.secret ? ' [SECRET]' : '') +
      (revealSecrets ? '' : ' [REDACTED]'));
  }
  lines.push('File refs: ' + s.fileRefCount);
  lines.push('Inline key: ' + (s.hasInlineKey ? 'yes (masked unless revealed)' : 'no'));

  lines.push('');
  lines.push('Flags:');
  for (const f of st.flags) {
    lines.push('  [' + f.level + '] ' + f.label + (f.detail ? ' — ' + f.detail : ''));
  }
  lines.push('');
  lines.push('Directives: ' + st.rows.length + (revealSecrets ? '' : ' (PEM/secrets redacted in exports)'));
  return lines.join('\n');
}

function exportJson(st) {
  return {
    summary: {
      filename: st.summary.filename,
      mode: st.summary.mode,
      remoteCount: st.summary.remoteCount,
      remotes: st.summary.remotes,
      proto: st.summary.proto,
      cipher: st.summary.cipher,
      auth: st.summary.auth,
      dev: st.summary.dev,
      port: st.summary.port,
      inlineBlockCount: st.summary.inlineBlockCount,
      inlineBlocks: st.summary.inlineBlocks,
      fileRefCount: st.summary.fileRefCount,
      hasInlineKey: st.summary.hasInlineKey,
      hasInlineCa: st.summary.hasInlineCa,
      hasInlineCert: st.summary.hasInlineCert,
      directiveCount: st.summary.directiveCount
    },
    flags: st.flags.map(f => ({ level: f.level, label: f.label, detail: f.detail })),
    secretsRevealed: revealSecrets,
    remotes: st.remotes,
    fileRefs: st.fileRefs,
    blocks: st.blocks.map(b => ({
      tag: b.tag,
      openArgs: b.openArgs,
      startLine: b.startLine,
      endLine: b.endLine,
      lineCount: b.lineCount,
      byteLength: b.byteLength,
      secret: b.secret,
      closed: b.closed,
      body: exportBlockBody(b, revealSecrets)
    })),
    directives: st.directives.filter(d => d.kind !== 'block').map(d => ({
      line: d.line,
      directive: d.directive,
      args: d.args,
      kind: d.kind
    }))
  };
}

function highlight(text, q) {
  if (!q) return esc(text);
  const s = String(text ?? '');
  const low = s.toLowerCase();
  const idx = low.indexOf(q);
  if (idx < 0) return esc(s);
  return esc(s.slice(0, idx)) + '<span class="hit">' + esc(s.slice(idx, idx + q.length)) + '</span>' + esc(s.slice(idx + q.length));
}

function contextHtml(lineNo) {
  const i = lineNo - 1;
  const from = Math.max(0, i - 3);
  const to = Math.min(rawLines.length - 1, i + 3);
  let html = '';

  // Determine if we're inside a masked block for context lines
  const blockRanges = (state && state.blocks) ? state.blocks : [];

  for (let n = from; n <= to; n++) {
    const cur = n === i ? ' cur' : '';
    let lineText = rawLines[n];
    if (!revealSecrets && lineText) {
      const lineNum = n + 1;
      for (const b of blockRanges) {
        // body lines are startLine+1 .. endLine-1 (approx)
        if (lineNum > b.startLine && lineNum < b.endLine) {
          const t = lineText.trim();
          if (t && !t.startsWith('-----BEGIN') && !t.startsWith('-----END')) {
            lineText = lineText.replace(/\S/g, '•');
          } else if (t.startsWith('-----BEGIN') || t.startsWith('-----END')) {
            // keep PEM headers visible as structure hints
          }
          break;
        }
      }
    }
    html += '<span class="ctx-line' + cur + '">' + esc(String(n + 1).padStart(4, ' ')) + ' │ ' + esc(lineText) + '</span>';
  }
  return html;
}

function rowDisplayArgs(r) {
  if (r.blockIndex >= 0 && state && state.blocks[r.blockIndex]) {
    return maskPemPreview(state.blocks[r.blockIndex], revealSecrets);
  }
  return r.args;
}

function filteredRows() {
  if (!state) return [];
  const q = searchIn.value.trim().toLowerCase();
  if (!q) return state.rows;
  return state.rows.filter(r => {
    const shown = rowDisplayArgs(r);
    return (r.kind + ' ' + r.directive + ' ' + shown + ' ' +
      (r.secret && !revealSecrets ? '' : r.value)).toLowerCase().includes(q);
  });
}

function filteredRemotes() {
  if (!state) return [];
  const q = searchIn.value.trim().toLowerCase();
  if (!q) return state.remotes;
  return state.remotes.filter(r =>
    (r.host + ' ' + r.port + ' ' + r.proto + ' ' + r.raw).toLowerCase().includes(q)
  );
}

function filteredBlocks() {
  if (!state) return [];
  const q = searchIn.value.trim().toLowerCase();
  if (!q) return state.blocks;
  return state.blocks.filter(b =>
    (b.tag + ' ' + b.openArgs + ' ' + String(b.startLine)).toLowerCase().includes(q)
  );
}

function draw() {
  if (!state) return;
  const q = searchIn.value.trim().toLowerCase();
  const list = filteredRows();
  const remList = filteredRemotes();
  const blockList = filteredBlocks();
  const s = state.summary;

  const cards = [];
  cards.push({ lbl: 'Remotes', val: String(s.remoteCount) });
  cards.push({ lbl: 'Proto', val: s.proto || (s.remotes[0] && s.remotes[0].proto) || '(none)' });
  cards.push({ lbl: 'Cipher', val: s.cipher || '(none)' });
  cards.push({ lbl: 'Inline blocks', val: String(s.inlineBlockCount) });
  if (s.dev) cards.push({ lbl: 'Dev', val: s.dev });
  if (s.mode && s.mode !== 'unknown') cards.push({ lbl: 'Mode', val: s.mode });
  cards.push({
    lbl: 'Inline key',
    val: s.hasInlineKey ? (revealSecrets ? 'revealed' : 'present (masked)') : 'absent'
  });

  statsEl.style.display = 'flex';
  statsEl.innerHTML = cards.map(c =>
    '<div class="stat"><span class="lbl">' + esc(c.lbl) + '</span><b>' + esc(c.val) + '</b></div>'
  ).join('');

  const warnCount = state.flags.filter(f => f.level === 'bad' || f.level === 'warn').length;
  metaEl.textContent = s.directiveCount + ' directives · ' + s.remoteCount + ' remote' +
    (s.remoteCount === 1 ? '' : 's') + ' · ' + s.inlineBlockCount + ' block' +
    (s.inlineBlockCount === 1 ? '' : 's') +
    (warnCount ? ' · ' + warnCount + ' flag' + (warnCount === 1 ? '' : 's') : '') +
    (q ? ' · filtered' : '') +
    (revealSecrets ? ' · secrets REVEALED' : '');

  noticeEl.style.display = warnCount ? 'block' : 'none';
  if (warnCount) {
    noticeEl.textContent = warnCount +
      ' heuristic flag(s) for ops review (inline keys, cipher/auth none, comp-lzo, remotes). PEM bodies stay masked unless Reveal secrets is on.';
  }

  let html = '';
  html += '<div class="card"><h2>Flags</h2><div class="body"><div class="flags-row">';
  for (const f of state.flags) {
    html += '<span class="badge ' + esc(f.level) + '" title="' + esc(f.detail || '') + '">' + esc(f.label) + '</span>';
  }
  html += '</div>';
  html += '<ul style="margin:10px 0 0;padding-left:18px;font-size:12.5px;color:inherit">';
  for (const f of state.flags) {
    if (f.level === 'ok' && f.label.indexOf('client') < 0 && f.label.indexOf('key') < 0) continue;
    html += '<li><strong>' + esc(f.label) + '</strong> — ' + esc(f.detail || '') + '</li>';
  }
  html += '</ul></div></div>';

  // Remotes table
  html += '<div class="card"><h2>Remotes</h2><div class="body" style="padding:0">';
  html += '<table class="grid"><thead><tr><th>Line</th><th>Host</th><th>Port</th><th>Proto</th></tr></thead><tbody>';
  if (!remList.length) {
    html += '<tr><td colspan="4" style="color:#8b949e;padding:16px">No remote directives.</td></tr>';
  } else {
    for (const r of remList) {
      html += '<tr data-line="' + r.line + '">' +
        '<td class="ln">' + r.line + '</td>' +
        '<td class="key">' + highlight(r.host, q) + '</td>' +
        '<td>' + highlight(r.port || '—', q) + '</td>' +
        '<td>' + highlight(r.proto || '—', q) + '</td></tr>';
    }
  }
  html += '</tbody></table></div></div>';

  // Cert / key blocks
  html += '<div class="card"><h2>Cert / key blocks</h2><div class="body">';
  if (!blockList.length) {
    html += '<div class="hint">No inline &lt;ca&gt;/&lt;cert&gt;/&lt;key&gt;/&lt;tls-*&gt; blocks.</div>';
  } else {
    html += '<div class="peer-grid">';
    for (const b of blockList) {
      const preview = maskPemPreview(b, revealSecrets);
      html += '<div class="peer-card">';
      html += '<div class="ptitle">&lt;' + esc(b.tag) + '&gt;' +
        (b.secret ? ' <span class="badge warn">secret</span>' : ' <span class="badge info">pem</span>') +
        '</div>';
      html += '<div class="pkv"><span class="k">Line </span>' + b.startLine +
        (b.closed ? '–' + b.endLine : ' (unclosed)') + '</div>';
      html += '<div class="pkv"><span class="k">Size </span>' + b.lineCount + ' lines · ' + b.byteLength + ' bytes</div>';
      if (b.openArgs) html += '<div class="pkv"><span class="k">Args </span>' + esc(b.openArgs) + '</div>';
      html += '<div class="pkv"><span class="k">Body </span>';
      if (!revealSecrets) {
        html += '<span class="masked">' + esc(preview) + '</span>';
      } else {
        html += '</div><pre class="block" style="margin-top:6px;max-height:16vh">' + esc(b.body) + '</pre><div>';
      }
      html += '</div></div>';
    }
    html += '</div>';
  }
  html += '</div></div>';

  // Directives table
  html += '<div class="card"><h2>Directives</h2><div class="body" style="padding:0">';
  html += '<table class="grid"><thead><tr><th>Line</th><th>Kind</th><th>Directive</th><th>Args / preview</th></tr></thead><tbody id="tbody">';
  for (const r of list) {
    const shown = rowDisplayArgs(r);
    const isMasked = r.secret && !revealSecrets;
    const valHtml = isMasked
      ? '<span class="masked">' + esc(shown) + '</span>'
      : (r.secret
          ? '<pre class="block" style="max-height:12vh">' + esc(shown) + '</pre>'
          : highlight(shown, q));
    html += '<tr data-line="' + r.line + '">' +
      '<td class="ln">' + r.line + '</td>' +
      '<td class="sec">' + highlight(r.kind, q) + '</td>' +
      '<td class="key">' + highlight(r.directive, q) + '</td>' +
      '<td>' + valHtml + '</td></tr>';
  }
  if (!list.length) {
    html += '<tr><td colspan="4" style="color:#8b949e;padding:16px">No rows match the filter.</td></tr>';
  }
  html += '</tbody></table></div></div>';

  html += '<div class="card" id="ctxcard" style="display:none"><h2>Line context</h2><div class="body"><pre class="block" id="ctxpre"></pre></div></div>';

  panel.innerHTML = html;
  panel.classList.add('show');

  panel.querySelectorAll('tr[data-line]').forEach(tr => {
    tr.addEventListener('click', () => {
      panel.querySelectorAll('tr.selected').forEach(x => x.classList.remove('selected'));
      tr.classList.add('selected');
      const line = +tr.getAttribute('data-line');
      const card = document.getElementById('ctxcard');
      const pre = document.getElementById('ctxpre');
      if (card && pre) {
        card.style.display = 'block';
        pre.innerHTML = contextHtml(line);
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    });
  });
}

function render(text, name) {
  showLoading('Parsing OpenVPN config…');
  afterPaint(() => {
    try {
      clearError();
      const parsed = parseOpenVPN(text);
      const hasSignal = parsed.directives.length > 0 || parsed.blocks.length > 0;
      if (!hasSignal) {
        throw new Error('No OpenVPN directives found.');
      }

      currentFileName = name || '(paste)';
      currentName = (name || 'openvpn').replace(/\.(ovpn|conf|txt)$/i, '').replace(/[^a-zA-Z0-9._-]+/g, '_') || 'openvpn';
      const summary = buildSummary(parsed, currentFileName);
      const flags = analyzeFlags(parsed);
      const rows = flattenRows(parsed);
      state = {
        directives: parsed.directives,
        remotes: parsed.remotes,
        blocks: parsed.blocks,
        fileRefs: parsed.fileRefs,
        flags,
        summary,
        rows
      };

      fname.textContent = currentFileName;
      document.title = currentName + ' — KSI Tools OpenVPN Viewer';
      drop.style.display = 'none';
      document.querySelector('.paste-box').style.display = 'none';
      searchIn.disabled = false;
      revealBtn.disabled = false;
      Object.values(btns).forEach(b => { b.disabled = false; });
      searchIn.value = '';
      draw();
    } catch (e) {
      showError(e.message || String(e));
      statsEl.style.display = 'none';
      panel.classList.remove('show');
    }
    hideLoading();
  });
}

function loadFile(file) {
  if (!file) return;
  if (file.size > MAX_BYTES) {
    showError('That file is ' + fmtBytes(file.size) + ', over the ' + fmtBytes(MAX_BYTES) + ' limit for OpenVPN configs.');
    return;
  }
  showLoading('Reading ' + file.name + '…');
  const r = new FileReader();
  r.onload = () => render(String(r.result || ''), file.name);
  r.onerror = () => { hideLoading(); showError('Could not read the file.'); };
  r.readAsText(file);
}

wireDrop(loadFile);
document.getElementById('goBtn').onclick = () => {
  const t = pasteEl.value;
  if (!t.trim()) { showError('Paste an OpenVPN config first.'); return; }
  render(t, '(paste)');
};
searchIn.addEventListener('input', () => { clearTimeout(searchIn._t); searchIn._t = setTimeout(draw, 120); });

revealBtn.onclick = () => {
  revealSecrets = !revealSecrets;
  revealBtn.classList.toggle('toggle-on', revealSecrets);
  revealBtn.textContent = revealSecrets ? 'Hide secrets' : 'Reveal secrets';
  if (state) draw();
};

btns.copy.onclick = async () => {
  if (!state) return;
  try {
    await navigator.clipboard.writeText(plainSummary(state));
    const old = btns.copy.textContent;
    btns.copy.textContent = 'Copied!';
    setTimeout(() => { btns.copy.textContent = old; }, 1200);
  } catch (e) {
    alert('Copy failed — browser blocked clipboard access.');
  }
};

btns.savejson.onclick = () => {
  if (!state) return;
  download(currentName + '.json', JSON.stringify(exportJson(state), null, 2), 'application/json');
};

btns.savecsv.onclick = () => {
  if (!state) return;
  const rows = filteredRows();
  const lines = ['line,kind,directive,args'].concat(
    rows.map(r => {
      let args = r.args;
      if (r.blockIndex >= 0 && state.blocks[r.blockIndex]) {
        args = exportBlockBody(state.blocks[r.blockIndex], revealSecrets);
      }
      return [csvEsc(r.line), csvEsc(r.kind), csvEsc(r.directive), csvEsc(args)].join(',');
    })
  );
  download(currentName + '.csv', lines.join('\n'), 'text/csv');
};

// Exposed for offline smoke tests (Node extracts this IIFE)
const KSIOpenVPNAPI = {
  parseOpenVPN,
  analyzeFlags,
  buildSummary,
  flattenRows,
  maskPemPreview,
  exportBlockBody,
  exportJson,
  MAX_BYTES,
  INLINE_TAGS,
  SECRET_TAGS,
  getRevealSecrets() { return revealSecrets; },
  setRevealSecrets(v) { revealSecrets = !!v; }
};
if (typeof globalThis !== 'undefined') globalThis.KSIOpenVPNAPI = KSIOpenVPNAPI;

})();
</script>
</body>
