<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KSI Tools sar / sysstat Viewer</title>
<style id="appcss">
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:15px; line-height:1.5; background:#fff; color:#1f2328; }
header.bar { position:sticky; top:0; z-index:20; display:flex; gap:8px; align-items:center; padding:10px 16px; background:#f6f8fa; border-bottom:1px solid #d0d7de; flex-wrap:wrap; }
header.bar h1 { font-size:15px; margin:0; font-weight:600; }
header.bar .fname { color:#57606a; font-size:13px; flex:1; min-width:60px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
header.bar .meta { color:#57606a; font-size:12px; }
button, select, input[type=text], textarea { font:inherit; font-size:13px; padding:6px 12px; border:1px solid #d0d7de; border-radius:6px; background:#fff; color:#1f2328; }
button { cursor:pointer; } button:hover { background:#f3f4f6; } button:disabled { opacity:.45; cursor:default; }
#search { width:200px; }
#drop { max-width:900px; margin:36px auto 16px; padding:48px 24px; text-align:center; border:2px dashed #d0d7de; border-radius:12px; color:#57606a; cursor:pointer; }
#drop.hover { border-color:#0969da; background:rgba(9,105,218,.05); color:#0969da; }
#drop strong { display:block; font-size:18px; margin-bottom:6px; color:#1f2328; }
.hint { color:#8b949e; font-size:12px; }
.paste-box { max-width:900px; margin:0 auto 20px; padding:0 16px; }
.paste-box label { display:block; font-size:13px; color:#57606a; margin-bottom:6px; }
#paste, .tarea { width:100%; min-height:110px; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:12.5px; padding:10px; border:1px solid #d0d7de; border-radius:8px; resize:vertical; }
#notice { padding:7px 16px; font-size:12.5px; background:#fff8c5; color:#7a5c00; border-bottom:1px solid #f0c000; display:none; }
#err { max-width:900px; margin:24px auto; padding:16px 20px; border:1px solid #cf222e; border-radius:10px; background:rgba(207,34,46,.06); color:#cf222e; font-family:ui-monospace,monospace; font-size:13px; white-space:pre-wrap; display:none; }
#loading { position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px; background:rgba(255,255,255,.72); color:#57606a; }
#loading.show { display:flex; }
.spinner { width:38px; height:38px; border:4px solid #d0d7de; border-top-color:#0969da; border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

.badge { display:inline-block; font-size:10px; font-weight:600; padding:1px 7px; border-radius:999px; border:1px solid #d0d7de; margin-right:4px; margin-bottom:4px; }
.badge.bad { background:#ffebe9; border-color:#ff8182; color:#cf222e; }
.badge.warn { background:#fff8c5; border-color:#f0c000; color:#7a5c00; }
.badge.ok { background:#dafbe1; border-color:#4ac26b; color:#1a7f37; }
.badge.info { background:#ddf4ff; border-color:#54aeff; color:#0969da; }

.stats { display:none; flex-wrap:wrap; gap:8px; margin:8px 0 12px; padding:0 16px; }
.stat { border:1px solid #d0d7de; border-radius:8px; padding:8px 12px; font-size:12.5px; background:#f6f8fa; min-width:120px; max-width:320px; }
.stat b { display:block; font-size:14px; word-break:break-word; }
.stat .lbl { color:#57606a; font-size:11px; text-transform:uppercase; letter-spacing:.03em; }

.panel { max-width:1100px; margin:12px auto; padding:0 16px 40px; display:none; }
.panel.show { display:block; }
.card { border:1px solid #d0d7de; border-radius:10px; margin-bottom:12px; overflow:hidden; }
.card h2 { margin:0; padding:10px 14px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; background:#f6f8fa; border-bottom:1px solid #d0d7de; color:#57606a; }
.card .body { padding:12px 14px; }
.flags-row { display:flex; flex-wrap:wrap; gap:4px; align-items:center; }

table.grid { border-collapse:collapse; width:100%; font-size:12.5px; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; }
.grid th { position:sticky; top:53px; background:#f6f8fa; text-align:left; padding:8px 10px; border-bottom:1px solid #d0d7de; white-space:nowrap; z-index:5; }
.grid td { padding:6px 10px; border-bottom:1px solid #f0f2f4; vertical-align:top; word-break:break-word; }
.grid tr:hover td { background:rgba(175,184,193,.12); }
.grid tr { cursor:pointer; }
.grid tr.selected td { background:rgba(9,105,218,.1); }
.grid td.key { color:#0550ae; font-weight:600; white-space:nowrap; width:1%; }
.grid td.sec { color:#57606a; white-space:nowrap; width:1%; }
.grid td.ln { color:#8b949e; width:1%; text-align:right; font-variant-numeric:tabular-nums; }
.grid td.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
.grid td.t { color:#0550ae; white-space:nowrap; }
.grid td.avg { color:#7a5c00; font-weight:600; }
.grid td.hi-bad { color:#cf222e; font-weight:600; }
.grid td.hi-warn { color:#7a5c00; font-weight:600; }
.grid td.hi-ok { color:#1a7f37; }

pre.block { margin:0; padding:10px 12px; background:#f6f8fa; border-radius:8px; white-space:pre-wrap; word-break:break-word; max-height:28vh; overflow:auto; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:12px; }
.ctx-line { display:block; padding:1px 4px; border-radius:3px; }
.ctx-line.cur { background:rgba(9,105,218,.15); font-weight:600; }
.hit { background:#fff3c4; border-radius:3px; box-shadow:0 0 0 1px #f0c000; }

.group-bar { max-width:1100px; margin:12px auto 4px; padding:0 16px; display:none; }
.group-bar.show { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.group-bar label { font-size:12.5px; color:#57606a; }
#groupsel { min-width:280px; }
.col-bar { max-width:1100px; margin:0 auto 8px; padding:0 16px; display:none; }
.col-bar.show { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.col-bar label { font-size:12.5px; color:#57606a; }
#colsel { min-width:200px; }
.spark-wrap { display:inline-block; vertical-align:middle; }
.spark { display:block; }

@media (prefers-color-scheme: dark) {
  body { background:#0d1117; color:#e6edf3; }
  header.bar { background:#161b22; border-bottom-color:#30363d; }
  header.bar .fname, header.bar .meta, .hint, .paste-box label, .stat .lbl, .group-bar label, .col-bar label { color:#8b949e; }
  button, select, input[type=text], textarea, #paste, .tarea { background:#21262d; color:#e6edf3; border-color:#30363d; }
  button:hover { background:#30363d; }
  #drop { border-color:#30363d; color:#8b949e; } #drop strong { color:#e6edf3; }
  #drop.hover { border-color:#4493f8; color:#4493f8; }
  .stat { background:#161b22; border-color:#30363d; }
  .card { border-color:#30363d; }
  .card h2 { background:#161b22; border-bottom-color:#30363d; color:#8b949e; }
  .grid th { background:#161b22; border-bottom-color:#30363d; }
  .grid td { border-bottom-color:#21262d; }
  .grid tr:hover td { background:rgba(110,118,129,.12); }
  .grid tr.selected td { background:rgba(31,111,235,.2); }
  .grid td.key { color:#79c0ff; }
  .grid td.sec { color:#8b949e; }
  .grid td.ln { color:#6e7681; }
  .grid td.t { color:#79c0ff; }
  .grid td.avg { color:#e3b341; }
  .grid td.hi-bad { color:#ff7b72; }
  .grid td.hi-warn { color:#e3b341; }
  .grid td.hi-ok { color:#3fb950; }
  .badge { border-color:#30363d; }
  .badge.bad { background:#3d1418; border-color:#f85149; color:#ff7b72; }
  .badge.warn { background:#3a2f00; border-color:#b58900; color:#e3b341; }
  .badge.ok { background:#12261e; border-color:#238636; color:#3fb950; }
  .badge.info { background:#121d2f; border-color:#1f6feb; color:#58a6ff; }
  pre.block { background:#161b22; }
  .ctx-line.cur { background:rgba(31,111,235,.25); }
  .hit { background:#634c00; color:#ffe08a; box-shadow:0 0 0 1px #b58900; }
  #notice { background:#3a2f00; color:#e3b341; border-bottom-color:#b58900; }
  #err { border-color:#f85149; color:#ff7b72; background:rgba(248,81,73,.08); }
  #loading { background:rgba(13,17,23,.75); }
  .spinner { border-color:#30363d; border-top-color:#4493f8; }
}
</style>
</head>
<body>

<header class="bar">
  <h1>KSI Tools sar / sysstat Viewer</h1>
  <span class="fname" id="fname"></span>
  <span class="meta" id="meta"></span>
  <input type="text" id="search" placeholder="Filter rows…" disabled>
  <button id="copy" disabled title="Copy a plain-English summary">Copy summary</button>
  <button id="savejson" disabled>Save .json</button>
  <button id="savecsv" disabled>Save .csv</button>
  <button id="pick" onclick="document.getElementById('file').click()">Open file</button>
</header>
<input type="file" id="file" accept=".sar,.txt,.out,text/plain" style="display:none">

<div id="drop">
  <strong>Drop a sar/iostat/mpstat text dump here</strong>
  or click to choose · <code>sar -A</code> · <code>iostat -x</code>
  <div class="hint" style="margin-top:10px">Text output only. Binary sadb is NOT supported — run <code>sadf -d</code> or <code>sar -A</code> first. Parsed locally; nothing is uploaded.</div>
</div>

<div class="paste-box">
  <label for="paste">Or paste sar/iostat/mpstat output:</label>
  <textarea id="paste" class="tarea" spellcheck="false" placeholder="Linux 4.18.0-... (host)  08/18/2024  _x86_64_  (8 CPU)&#10;&#10;12:00:01 AM     CPU     %user     %nice   %system   %iowait    %steal     %idle&#10;12:10:01 AM     all      2.34      0.00      1.20      0.50      0.00     95.96&#10;..."></textarea>
  <div style="margin-top:8px"><button id="goBtn">Analyze paste</button></div>
</div>

<div id="err"></div>
<div id="notice"></div>
<div class="stats" id="stats"></div>

<div class="group-bar" id="groupbar">
  <label for="groupsel">Metric group:</label>
  <select id="groupsel"></select>
</div>
<div class="col-bar" id="colbar">
  <label for="colsel">Sparkline column:</label>
  <select id="colsel"></select>
  <span class="spark-wrap" id="sparkwrap"></span>
</div>

<div class="panel" id="panel"></div>

<div id="loading"><div class="spinner"></div><div id="loadingmsg">Loading…</div></div>

<script>
(function () {
'use strict';

const MAX_BYTES = 20 * 1024 * 1024;

// Banner line: "Linux <kernel> (<host>)  <date>  _arch_  (N CPU)"
const BANNER_RE = /^Linux\s+(\S+)\s+\(([^)]+)\)\s+(\d{2}\/\d{2}\/\d{4}|\w{3}\s+\d{1,2},?\s+\d{4}|\d{4}-\d{2}-\d{2})\s+\([^)]*\)\s+\((\d+)\s*CPU/i;
// Time token at start of line: "12:00:01 AM" or "12:00:01" or "Average:"
const TIME_RE = /^(Average:|\d{1,2}:\d{2}:\d{2}(?:\s*[AP]M)?)/i;
// Column header markers — a line whose 2nd token is "CPU" or has %-cols / known metric names
const HEADER_TOKENS = /^%|%user|%nice|%system|%iowait|%steal|%idle|%usr|%util|%rrqm|%wrqm|kbmemfree|kbmemused|kbswpfree|kbswpused|runq-sz|plist-sz|ldavg|devpts|frmpg|bufpg|campg|frag|totally|pgscank|pgscand|pgsteal|%vmeff|kbhugfree|kbhugused|kbbuffers|kbcached|kbactive|kbinact|kbdirty|kbmmaped|kbcommit|%commit|kbmem|kbfree|kbavail|tps|rkB|wkB|areq-sz|aqu-sz|svctm|r_await|w_await|d_await|rareq|wareq|rrqm|wrqm|Node|smem|nvcsw|nivcsw|iostat/i;

const METRIC_KEYWORDS = {
  CPU: ['%user', '%nice', '%system', '%iowait', '%steal', '%idle', '%usr', '%sys', '%gnice', '%irq', '%soft', '%guest', '%gnice'],
  memory: ['kbmemfree', 'kbmemused', 'kbfree', 'kbavail', 'kbbuffers', 'kbcached', 'kbactive', 'kbinact', 'kbdirty', 'kbcommit', '%commit', 'frmpg', 'bufpg', 'campg', 'kbhugfree', 'kbhugused'],
  swap: ['kbswpfree', 'kbswpused', 'kbswpcad', '%swpused', '%swpcad', 'pswpin', 'pswpout'],
  io: ['tps', 'rkB', 'wkB', 'dkB', 'areq-sz', 'aqu-sz', 'svctm', '%util', 'r_await', 'w_await', 'd_await', 'rareq-sz', 'wareq-sz', 'rrqm', 'wrqm', 'r/s', 'w/s', 'rkB/s', 'wkB/s', 'rrqm/s', 'wrqm/s', '%rrqm', '%wrqm'],
  runq: ['runq-sz', 'plist-sz', 'ldavg-1', 'ldavg-5', 'ldavg-15', 'blocked', 'procs'],
  network: ['rxpck', 'txpck', 'rxkB', 'txkB', 'rxcmp', 'txcmp', 'rxmcst', '%ifutil', 'IFACE', 'rxerr', 'txerr', 'coll', 'rxdrop', 'txdrop', 'rxpck/s', 'txpck/s'],
  kernel: ['cswch', 'proc', 'fdsize', 'filesz', 'inode', 'pty', 'pgscank', 'pgscand', 'pgsteal', '%vmeff', 'nvcsw', 'nivcsw', 'pswpin', 'pswpout', 'frag', 'dentunusd', 'file-nr', 'inode-nr', 'pty-nr', 'sock', 'tcp-tw']
};

const drop = document.getElementById('drop');
const errBox = document.getElementById('err');
const noticeEl = document.getElementById('notice');
const fname = document.getElementById('fname');
const metaEl = document.getElementById('meta');
const pasteEl = document.getElementById('paste');
const fileInput = document.getElementById('file');
const searchIn = document.getElementById('search');
const loadingEl = document.getElementById('loading');
const loadingMsg = document.getElementById('loadingmsg');
const statsEl = document.getElementById('stats');
const panel = document.getElementById('panel');
const groupBar = document.getElementById('groupbar');
const groupSel = document.getElementById('groupsel');
const colBar = document.getElementById('colbar');
const colSel = document.getElementById('colsel');
const sparkWrap = document.getElementById('sparkwrap');
const btns = {
  copy: document.getElementById('copy'),
  savejson: document.getElementById('savejson'),
  savecsv: document.getElementById('savecsv')
};

let currentName = 'sar';
let currentFileName = '';
let rawLines = [];
let state = null; // { summary, sections, flags, groups, groupCols }
let selectedGroup = '';

function showLoading(m) { loadingMsg.textContent = m || 'Loading…'; loadingEl.classList.add('show'); }
function hideLoading() { loadingEl.classList.remove('show'); }
function afterPaint(fn) { requestAnimationFrame(() => requestAnimationFrame(fn)); }
function showError(m) { errBox.style.display = 'block'; errBox.textContent = m; }
function clearError() { errBox.style.display = 'none'; errBox.textContent = ''; }
function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: type || 'text/plain' }));
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}
function csvEsc(v) {
  const s = String(v ?? '');
  return /["\n,]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function fmtBytes(n) {
  if (n >= 1024 * 1024) return (n / (1024 * 1024)).toFixed(1) + ' MB';
  if (n >= 1024) return (n / 1024).toFixed(1) + ' KB';
  return n + ' bytes';
}
function wireDrop(loadFn) {
  drop.onclick = () => fileInput.click();
  fileInput.onchange = () => { if (fileInput.files[0]) loadFn(fileInput.files[0]); fileInput.value = ''; };
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('hover'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('hover'); }));
  drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) loadFn(f); });
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => {
    if (e.target.closest && e.target.closest('#drop')) return;
    e.preventDefault();
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) loadFn(f);
  });
}

/** Normalize raw text into rawLines; keep blank lines (needed for section breaks). */
function splitLines(text) {
  rawLines = text.replace(/^﻿/, '').split(/\r\n|\n|\r/);
  return rawLines;
}

function isNumeric(v) {
  if (v === null || v === undefined || v === '') return false;
  return !isNaN(Number(v));
}

function toNum(v) {
  if (v === null || v === undefined || v === '') return null;
  const n = Number(v);
  return isFinite(n) ? n : null;
}

/**
 * Parse sar text. Returns { sections, banner }.
 * section = { title, header: [colnames], rows: [{ line, time, avg, cells: [strings] }] }
 * Heuristic: a "header line" has no time prefix OR contains %-cols / known metric names
 *   AND has multiple tokens. A "data line" starts with a time token.
 */
function parseSar(text) {
  const lines = splitLines(text);
  const sections = [];
  let banner = null;
  let cur = null;
  let lastBanner = null;

  for (let i = 0; i < lines.length; i++) {
    const ln = i + 1;
    const raw = lines[i];
    const trimmed = raw.trim();

    // banner line: "Linux ... (host)  date  (N CPU)"
    const bm = BANNER_RE.exec(trimmed);
    if (bm) {
      banner = banner || { kernel: bm[1], host: bm[2], date: bm[3], ncpu: parseInt(bm[4], 10) };
      lastBanner = ln;
      // A banner restarts section collection for the day — but we keep appending new sections.
      continue;
    }

    // Skip the "Restarted" lines sar sometimes prints
    if (!trimmed || /^Restarted\b/i.test(trimmed)) {
      continue;
    }

    const tok = trimmed.split(/\s+/);
    const timeMatch = TIME_RE.exec(trimmed);

    // Header detection: no time prefix, OR has %-cols / known metric names
    const hasHeaderMarks = HEADER_TOKENS.test(trimmed);
    const hasTimePrefix = !!timeMatch;

    if (!hasTimePrefix && hasHeaderMarks && tok.length >= 2) {
      // new metric block header
      cur = { title: trimmed, header: tok.slice(), rows: [], startLine: ln, headerLine: ln };
      sections.push(cur);
      continue;
    }

    // pidstat / mpstat / iostat style: header that DOES start with a time-looking token
    // is unusual; skip that edge — treat only no-time headers as headers.

    // Data row: starts with a time token (or "Average:")
    if (hasTimePrefix && cur) {
      const isAvg = /^Average:/i.test(trimmed);
      // First cell = time (or "Average:"), rest are values
      const cells = isAvg ? trimmed.split(/\s+/) : trimmed.split(/\s+/);
      cur.rows.push({
        line: ln,
        time: isAvg ? 'Average:' + cells.slice(1, 2).join(' ') : cells[0],
        avg: isAvg,
        cells: isAvg ? cells.slice(1) : cells.slice(1)
      });
      continue;
    }

    // Orphan line — could be a malformed row; track only if it looks numeric-ish
    if (cur && tok.length >= 2 && tok.slice(0, 2).some(isNumeric)) {
      cur.rows.push({ line: ln, time: '(?)', avg: false, cells: tok });
    }
    // Otherwise ignore (separator blank, comments)
  }

  // Derive a friendly title for each section from the header column set
  for (const s of sections) {
    s.metricGroup = classifyGroup(s.header);
    if (!s.title) s.title = s.header.join(' ');
  }

  return { sections, banner };
}

function classifyGroup(headerCols) {
  const lower = headerCols.map(c => c.toLowerCase());
  const hits = {};
  for (const [group, kws] of Object.entries(METRIC_KEYWORDS)) {
    hits[group] = 0;
    for (const kw of kws) {
      for (const col of lower) {
        if (col === kw || col.includes(kw.toLowerCase())) { hits[group]++; break; }
      }
    }
  }
  // pick best
  let best = 'other', bestN = 0;
  for (const [g, n] of Object.entries(hits)) {
    if (n > bestN) { best = g; bestN = n; }
  }
  if (bestN === 0) return 'other';
  return best;
}

function buildSummary(parsed, filename) {
  const b = parsed.banner || {};
  const sections = parsed.sections;
  const groups = {};
  for (const s of sections) {
    groups[s.metricGroup] = (groups[s.metricGroup] || 0) + 1;
  }
  // time range across all sections
  let minT = null, maxT = null;
  for (const s of sections) {
    for (const r of s.rows) {
      if (r.avg || r.time === '(?)' || !r.time) continue;
      // Parse to a comparable value: works for HH:MM:SS [AM/PM]
      const t = parseTime(r.time);
      if (t === null) continue;
      if (minT === null || t < minT) minT = t;
      if (maxT === null || t > maxT) maxT = t;
    }
  }
  const groupList = Object.keys(groups);
  return {
    filename: filename || '',
    host: b.host || '',
    kernel: b.kernel || '',
    date: b.date || '',
    ncpu: b.ncpu || null,
    sectionCount: sections.length,
    groups: groups,
    groupList: groupList,
    timeRange: (minT !== null && maxT !== null) ? (fmtTime(minT) + ' – ' + fmtTime(maxT)) : ''
  };
}

function parseTime(t) {
  // returns seconds-of-day, supports "HH:MM:SS" and "HH:MM:SS AM/PM"
  const m = /^(\d{1,2}):(\d{2}):(\d{2})(?:\s*([AP]M))?$/i.exec(t);
  if (!m) return null;
  let h = parseInt(m[1], 10);
  const mi = parseInt(m[2], 10);
  const s = parseInt(m[3], 10);
  if (m[4]) {
    const ap = m[4].toUpperCase();
    if (ap === 'PM' && h !== 12) h += 12;
    if (ap === 'AM' && h === 12) h = 0;
  }
  return h * 3600 + mi * 60 + s;
}

function fmtTime(sec) {
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  function pad(n) { return String(n).padStart(2, '0'); }
  return pad(h) + ':' + pad(m) + ':' + pad(s);
}

/** Locate column index by name (case-insensitive, partial match fallback). */
function colIdx(header, name) {
  const lower = header.map(c => c.toLowerCase());
  const exact = lower.indexOf(name.toLowerCase());
  if (exact >= 0) return exact;
  for (let i = 0; i < lower.length; i++) {
    if (lower[i].includes(name.toLowerCase())) return i;
  }
  return -1;
}

function analyzeFlags(parsed, summary) {
  const flags = [];
  const sections = parsed.sections;
  let parseFailures = 0;
  const ncpu = summary.ncpu || 1;

  // per-section peak trackers
  let peakIowait = null, peakIowaitSection = null;
  let peakRunq = null, peakRunqSection = null;
  let peakIdleLow = null;

  for (const s of sections) {
    if (!s.rows.length) {
      flags.push({ level: 'warn', label: 'empty section', detail: 'Metric group "' + esc(s.metricGroup) + '" header had no data rows.' });
      continue;
    }
    // detect parse failures: rows whose cell count doesn't match header
    for (const r of s.rows) {
      if (r.avg) continue; // average rows often drop the time/cpu label
      if (r.cells.length !== s.header.length - 1) {
        // only flag meaningful mismatches (off by > 1)
        if (Math.abs(r.cells.length - (s.header.length - 1)) > 1) {
          parseFailures++;
        }
      }
    }

    const g = s.metricGroup;
    if (g === 'CPU') {
      // %idle / %iowait / %steal — only consider "all" CPU aggregate rows
      const idleIdx = colIdx(s.header, '%idle') >= 0 ? colIdx(s.header, '%idle')
                   : (colIdx(s.header, '%idl') >= 0 ? colIdx(s.header, '%idl') : -1);
      const ioIdx = colIdx(s.header, '%iowait');
      const stealIdx = colIdx(s.header, '%steal');
      let lowIdleRun = 0, lowIdleBadRun = 0;
      for (const r of s.rows) {
        if (r.avg) continue;
        // skip per-CPU rows when header has CPU column — only "all"
        const cpuIdx = colIdx(s.header, 'CPU');
        let isAll = true;
        if (cpuIdx >= 0 && cpuIdx < r.cells.length) {
          isAll = String(r.cells[cpuIdx-1] || '').toLowerCase() === 'all';
        }
        if (!isAll) continue;
        if (idleIdx >= 0) {
          const idle = toNum(r.cells[idleIdx - 1]);
          if (idle !== null) {
            if (idle < 5) lowIdleBadRun++;
            else if (idle < 10) lowIdleRun++;
            else { lowIdleRun = 0; lowIdleBadRun = 0; }
            if (peakIdleLow === null || idle < peakIdleLow) peakIdleLow = idle;
          }
        }
        if (ioIdx >= 0) {
          const io = toNum(r.cells[ioIdx - 1]);
          if (io !== null) {
            if (peakIowait === null || io > peakIowait) { peakIowait = io; peakIowaitSection = s.title; }
            if (io > 40) flags.push({ level: 'bad', label: '%iowait ' + io.toFixed(1) + '%', detail: 'High iowait (>40%) at ' + r.time + ' — disk-bound.' });
            else if (io > 20) flags.push({ level: 'warn', label: '%iowait ' + io.toFixed(1) + '%', detail: 'Elevated iowait (>20%) at ' + r.time + ' — disk-bound.' });
          }
        }
        if (stealIdx >= 0) {
          const steal = toNum(r.cells[stealIdx - 1]);
          if (steal !== null && steal > 5) {
            flags.push({ level: 'warn', label: '%steal ' + steal.toFixed(1) + '%', detail: 'Hypervisor steal >5% at ' + r.time + ' — VM is being starved.' });
          }
        }
      }
      if (lowIdleBadRun >= 2) {
        flags.push({ level: 'bad', label: 'CPU saturated', detail: '%idle < 5% sustained across ' + lowIdleBadRun + ' samples (peak idle=' + (peakIdleLow !== null ? peakIdleLow.toFixed(1) : '?') + '%).' });
      } else if (lowIdleRun >= 2) {
        flags.push({ level: 'warn', label: 'CPU near-saturation', detail: '%idle < 10% sustained across ' + lowIdleRun + ' samples.' });
      }
    }

    if (g === 'runq') {
      const runqIdx = colIdx(s.header, 'runq-sz');
      const ld15Idx = colIdx(s.header, 'ldavg-15');
      for (const r of s.rows) {
        if (r.avg) continue;
        if (runqIdx >= 0) {
          const rq = toNum(r.cells[runqIdx - 1]);
          if (rq !== null) {
            if (peakRunq === null || rq > peakRunq) { peakRunq = rq; peakRunqSection = s.title; }
            if (rq > 2 * ncpu) {
              flags.push({ level: 'warn', label: 'runq-sz ' + rq, detail: 'Run queue > 2×CPU count (' + ncpu + ') at ' + r.time + ' — saturation.' });
            }
          }
        }
        if (ld15Idx >= 0) {
          const ld = toNum(r.cells[ld15Idx - 1]);
          if (ld !== null && ld > ncpu) {
            flags.push({ level: 'warn', label: 'ldavg-15 ' + ld.toFixed(2), detail: 'Load avg-15 > CPU count (' + ncpu + ') at ' + r.time + '.' });
          }
        }
      }
    }

    if (g === 'memory') {
      const memUsedPctIdx = colIdx(s.header, '%memused');
      if (memUsedPctIdx < 0) {
        // compute from kbmemfree + kbmemused if both present
      }
      if (memUsedPctIdx >= 0) {
        let prevPct = null;
        for (const r of s.rows) {
          if (r.avg) continue;
          const pct = toNum(r.cells[memUsedPctIdx - 1]);
          if (pct !== null) {
            if (pct > 90) {
              flags.push({ level: 'warn', label: '%memused ' + pct.toFixed(1) + '%', detail: 'Memory use >90% at ' + r.time + '.' });
            }
            prevPct = pct;
          }
        }
      }
    }

    if (g === 'swap') {
      const swpUsedPctIdx = colIdx(s.header, '%swpused');
      let prevUsed = null;
      if (swpUsedPctIdx >= 0) {
        for (const r of s.rows) {
          if (r.avg) continue;
          const pct = toNum(r.cells[swpUsedPctIdx - 1]);
          if (pct !== null) {
            if (pct > 0) {
              if (prevUsed !== null && pct > prevUsed) {
                flags.push({ level: 'warn', label: 'swap growing', detail: 'Swap use rose ' + prevUsed.toFixed(1) + '% → ' + pct.toFixed(1) + '% at ' + r.time + '.' });
                break; // one is enough
              }
              if (prevUsed === null && pct > 0) {
                flags.push({ level: 'info', label: 'swap in use', detail: 'Swap usage ' + pct.toFixed(1) + '% observed at ' + r.time + '.' });
              }
            }
            prevUsed = pct;
          }
        }
      }
    }

    if (g === 'io') {
      // %util == 100 sustained, r_await/w_await > 50ms
      const utilIdx = colIdx(s.header, '%util');
      const rAwaitIdx = colIdx(s.header, 'r_await');
      const wAwaitIdx = colIdx(s.header, 'w_await');
      let utilRun = 0, utilDev = '';
      for (const r of s.rows) {
        if (r.avg) continue;
        if (utilIdx >= 0) {
          const u = toNum(r.cells[utilIdx - 1]);
          if (u !== null) {
            if (u >= 100) {
              utilRun++;
              utilDev = (r.cells[colIdx(s.header, 'Device') - 1] || r.cells[0] || '?');
            } else utilRun = 0;
            if (utilRun >= 2) {
              flags.push({ level: 'warn', label: '%util=100 sustained', detail: 'Device ' + utilDev + ' at 100% utilization across ' + utilRun + ' samples.' });
              break;
            }
          }
        }
        if (rAwaitIdx >= 0) {
          const a = toNum(r.cells[rAwaitIdx - 1]);
          if (a !== null && a > 50) {
            flags.push({ level: 'warn', label: 'r_await ' + a.toFixed(1) + 'ms', detail: 'Read latency >50ms at ' + r.time + '.' });
          }
        }
        if (wAwaitIdx >= 0) {
          const a = toNum(r.cells[wAwaitIdx - 1]);
          if (a !== null && a > 50) {
            flags.push({ level: 'warn', label: 'w_await ' + a.toFixed(1) + 'ms', detail: 'Write latency >50ms at ' + r.time + '.' });
          }
        }
      }
    }
  }

  if (parseFailures > 0) {
    flags.push({ level: 'bad', label: 'parse failures', detail: parseFailures + ' row(s) did not match their column header — file may be malformed or mixed.' });
  }

  // store peaks on summary for re-use
  summary.peakIowait = peakIowait;
  summary.peakIowaitSection = peakIowaitSection;
  summary.peakRunq = peakRunq;
  summary.peakRunqSection = peakRunqSection;
  summary.peakIdleLow = peakIdleLow;

  if (!flags.length) {
    flags.push({ level: 'ok', label: 'no flags', detail: 'Heuristic checks found nothing loud.' });
  }
  return flags;
}

function plainSummary(st) {
  const s = st.summary;
  const lines = [];
  lines.push('KSI Tools sar / sysstat Viewer — summary');
  lines.push('File: ' + (s.filename || currentFileName || '(paste)'));
  if (s.host) lines.push('Host: ' + s.host + ' · kernel ' + s.kernel + ' · ' + s.date + (s.ncpu ? ' · ' + s.ncpu + ' CPU' : ''));
  const groupStr = s.groupList.map(g => g + (s.groups[g] > 1 ? '(' + s.groups[g] + ')' : '')).join('/');
  lines.push('Sections: ' + s.sectionCount + ' (' + groupStr + ')');
  if (s.timeRange) lines.push('Time range: ' + s.timeRange);
  if (s.peakIowait !== null) lines.push('Peak %iowait: ' + s.peakIowait.toFixed(1) + '%');
  if (s.peakRunq !== null) lines.push('Peak runq-sz: ' + s.peakRunq);
  if (s.peakIdleLow !== null) lines.push('Lowest %idle (all): ' + s.peakIdleLow.toFixed(1) + '%');
  lines.push('');
  lines.push('Flags:');
  for (const f of st.flags) {
    lines.push('  [' + f.level + '] ' + f.label + (f.detail ? ' — ' + f.detail : ''));
  }
  lines.push('');
  lines.push('Heuristic sar/sysstat text review. Binary sadb is NOT supported — run sadf -d or sar -A. Verify against the host.');
  return lines.join('\n');
}

function exportJson(st) {
  return {
    summary: st.summary,
    flags: st.flags.map(f => ({ level: f.level, label: f.label, detail: f.detail })),
    sections: st.sections.map(s => ({
      title: s.title,
      metricGroup: s.metricGroup,
      header: s.header,
      rows: s.rows.map(r => ({ line: r.line, time: r.time, avg: r.avg, cells: r.cells }))
    }))
  };
}

function highlight(text, q) {
  if (!q) return esc(text);
  const s = String(text ?? '');
  const low = s.toLowerCase();
  const idx = low.indexOf(q);
  if (idx < 0) return esc(s);
  return esc(s.slice(0, idx)) + '<span class="hit">' + esc(s.slice(idx, idx + q.length)) + '</span>' + esc(s.slice(idx + q.length));
}

function contextHtml(lineNo) {
  const i = lineNo - 1;
  const from = Math.max(0, i - 3);
  const to = Math.min(rawLines.length - 1, i + 3);
  let html = '';
  for (let n = from; n <= to; n++) {
    const cur = n === i ? ' cur' : '';
    html += '<span class="ctx-line' + cur + '">' + esc(String(n + 1).padStart(4, ' ')) + ' │ ' + esc(rawLines[n]) + '</span>';
  }
  return html;
}

/** Compute per-section color class for a numeric cell given column name + value. */
function cellClass(colName, val) {
  const v = toNum(val);
  if (v === null) return '';
  const c = colName.toLowerCase();
  if (c === '%idle' || c === '%idl') {
    if (v < 5) return 'hi-bad';
    if (v < 10) return 'hi-warn';
    return 'hi-ok';
  }
  if (c === '%iowait') {
    if (v > 40) return 'hi-bad';
    if (v > 20) return 'hi-warn';
    return '';
  }
  if (c === '%steal') {
    if (v > 5) return 'hi-warn';
    return '';
  }
  if (c === '%util') {
    if (v >= 100) return 'hi-warn';
    if (v >= 80) return '';
    return '';
  }
  if (c === 'runq-sz') {
    const ncpu = (state && state.summary.ncpu) || 1;
    if (v > 2 * ncpu) return 'hi-warn';
    return '';
  }
  if (c === '%memused' || c === '%commit') {
    if (v > 90) return 'hi-warn';
    return '';
  }
  if (c === '%swpused') {
    if (v > 0) return 'hi-warn';
    return '';
  }
  if (c === 'r_await' || c === 'w_await' || c === 'd_await' || c === 'await') {
    if (v > 50) return 'hi-warn';
    return '';
  }
  if (c === 'ldavg-1' || c === 'ldavg-5' || c === 'ldavg-15') {
    const ncpu = (state && state.summary.ncpu) || 1;
    if (v > ncpu) return 'hi-warn';
    return '';
  }
  return '';
}

/** Render a tiny inline SVG sparkline. values = [n|null]. width x height. */
function sparkline(values, width, height, color) {
  const w = width || 120, h = height || 28;
  const pts = values.map((v, i) => ({ v: v, i: i })).filter(p => p.v !== null && p.v !== undefined && isFinite(p.v));
  if (pts.length < 2) return '';
  const xs = pts.map(p => p.i);
  const xMin = Math.min.apply(null, xs);
  const xMax = Math.max.apply(null, xs);
  const ys = pts.map(p => p.v);
  let yMin = Math.min.apply(null, ys);
  let yMax = Math.max.apply(null, ys);
  if (yMin === yMax) { yMin -= 1; yMax += 1; }
  const pad = 2;
  const sx = i => pad + (xMax === xMin ? 0 : ((i - xMin) / (xMax - xMin)) * (w - 2 * pad));
  const sy = v => h - pad - ((v - yMin) / (yMax - yMin)) * (h - 2 * pad);
  const d = pts.map((p, idx) => (idx === 0 ? 'M' : 'L') + sx(p.i).toFixed(1) + ' ' + sy(p.v).toFixed(1)).join(' ');
  const last = pts[pts.length - 1];
  const stroke = color || '#0969da';
  const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const fill = isDark ? '#161b22' : '#f6f8fa';
  return '<svg class="spark" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" style="background:' + fill + ';border:1px solid ' + (isDark ? '#30363d' : '#d0d7de') + ';border-radius:4px">' +
    '<path d="' + d + '" fill="none" stroke="' + stroke + '" stroke-width="1.5"/>' +
    '<circle cx="' + sx(last.i).toFixed(1) + '" cy="' + sy(last.v).toFixed(1) + '" r="2" fill="' + stroke + '"/>' +
    '</svg>';
}

function draw() {
  if (!state) return;
  const s = state.summary;

  // stats cards
  const cards = [];
  cards.push({ lbl: 'Sections', val: s.sectionCount });
  const groupStr = s.groupList.map(g => g + (s.groups[g] > 1 ? ' (' + s.groups[g] + ')' : '')).join(', ');
  cards.push({ lbl: 'Metric groups', val: groupStr || '—' });
  if (s.timeRange) cards.push({ lbl: 'Time range', val: s.timeRange });
  if (s.host) cards.push({ lbl: 'Host', val: s.host });
  if (s.kernel) cards.push({ lbl: 'Kernel', val: s.kernel });
  if (s.date) cards.push({ lbl: 'Date', val: s.date });
  if (s.ncpu) cards.push({ lbl: 'CPU count', val: s.ncpu });
  if (s.peakIowait !== null) cards.push({ lbl: 'Peak %iowait', val: s.peakIowait.toFixed(1) + '%' });
  if (s.peakRunq !== null) cards.push({ lbl: 'Peak runq-sz', val: s.peakRunq });
  if (s.peakIdleLow !== null) cards.push({ lbl: 'Lowest %idle', val: s.peakIdleLow.toFixed(1) + '%' });

  statsEl.style.display = 'flex';
  statsEl.innerHTML = cards.map(c =>
    '<div class="stat"><span class="lbl">' + esc(c.lbl) + '</span><b>' + esc(c.val) + '</b></div>'
  ).join('');

  const warnCount = state.flags.filter(f => f.level === 'bad' || f.level === 'warn').length;
  metaEl.textContent = s.sectionCount + ' section' + (s.sectionCount === 1 ? '' : 's') +
    ' · ' + state.sections.reduce((a, b) => a + b.rows.length, 0) + ' rows' +
    (warnCount ? ' · ' + warnCount + ' flag' + (warnCount === 1 ? '' : 's') : '');

  noticeEl.style.display = 'block';
  noticeEl.textContent = 'Heuristic sar/sysstat text review. Binary sadb is NOT supported — run `sadf -d`/`sar -A` for text. Verify against the host.';

  // flags card
  let html = '';
  html += '<div class="card"><h2>Flags</h2><div class="body"><div class="flags-row">';
  for (const f of state.flags) {
    html += '<span class="badge ' + esc(f.level) + '" title="' + esc(f.detail || '') + '">' + esc(f.label) + '</span>';
  }
  html += '</div>';
  html += '<ul style="margin:10px 0 0;padding-left:18px;font-size:12.5px;color:inherit">';
  for (const f of state.flags) {
    if (f.level === 'ok') continue;
    html += '<li><strong>' + esc(f.label) + '</strong> — ' + esc(f.detail || '') + '</li>';
  }
  html += '</ul></div></div>';

  // group selector
  const groupOptions = [];
  const seenGroups = {};
  state.sections.forEach((s, i) => {
    const key = s.metricGroup + '#' + i;
    const label = '[' + (i + 1) + '] ' + s.metricGroup + ' — ' + (s.title.length > 60 ? s.title.slice(0, 60) + '…' : s.title);
    seenGroups[key] = label;
    groupOptions.push('<option value="' + i + '">' + esc(label) + ' (' + s.rows.length + ' rows)</option>');
  });
  groupSel.innerHTML = groupOptions.join('');
  if (selectedGroup === '' || !state.sections[+selectedGroup]) selectedGroup = '0';
  groupSel.value = selectedGroup;
  groupBar.classList.add('show');

  // column selector (populated when we render the table; we set it here)
  html += '<div class="card" id="tablecard"><h2 id="tabletitle">Metric group</h2><div class="body" style="padding:0">';
  html += '<table class="grid" id="gridtable"><thead id="gridhead"></thead><tbody id="tbody"></tbody></table>';
  html += '</div></div>';

  html += '<div class="card" id="ctxcard" style="display:none"><h2>Line context</h2><div class="body"><pre class="block" id="ctxpre"></pre></div></div>';

  panel.innerHTML = html;
  panel.classList.add('show');

  renderGroupTable();
}

function renderGroupTable() {
  if (!state) return;
  const idx = +selectedGroup;
  const sec = state.sections[idx];
  if (!sec) return;

  const q = searchIn.value.trim().toLowerCase();
  document.getElementById('tabletitle').textContent = 'Group ' + (idx + 1) + ' / ' + state.sections.length +
    ' — ' + sec.metricGroup + ' (' + sec.rows.length + ' rows)';

  // header row
  const headEl = document.getElementById('gridhead');
  const headCols = ['Line', 'Time'].concat(sec.header.slice(1)); // drop the leading "Time" token if it's there
  // But sar headers' first token IS the time column label ("12:00:01 AM" or "TIME"). We display Time ourselves.
  // Detect: if first header token looks like a time, skip it.
  let headerCols = sec.header.slice();
  const firstIsTime = TIME_RE.test(headerCols[0]);
  if (firstIsTime) headerCols = headerCols.slice(1);
  const displayHead = ['Line', 'Time'].concat(headerCols);
  headEl.innerHTML = '<tr>' + displayHead.map(h => '<th>' + esc(h) + '</th>').join('') + '</tr>';

  // rows
  const tbody = document.getElementById('tbody');
  let html = '';
  let shown = 0;
  const maxShow = 2000;
  for (const r of sec.rows) {
    const rowText = r.time + ' ' + r.cells.join(' ');
    if (q && rowText.toLowerCase().indexOf(q) < 0) continue;
    if (shown >= maxShow) {
      html += '<tr><td colspan="' + displayHead.length + '" style="color:#8b949e;padding:12px">Truncated at ' + maxShow + ' rows — use the search box to narrow.</td></tr>';
      break;
    }
    const cellsHtml = r.cells.map((c, i) => {
      const colName = headerCols[i] || '';
      const cls = cellClass(colName, c);
      const numCls = isNumeric(c) ? ' class="num' + (cls ? ' ' + cls : '') + '"' : '';
      return '<td' + numCls + '>' + highlight(c, q) + '</td>';
    }).join('');
    const avgCls = r.avg ? ' class="avg"' : ' class="t"';
    html += '<tr data-line="' + r.line + '">' +
      '<td class="ln">' + r.line + '</td>' +
      '<td' + avgCls + '>' + highlight(r.time, q) + '</td>' +
      cellsHtml + '</tr>';
    shown++;
  }
  if (!shown && q) {
    html += '<tr><td colspan="' + displayHead.length + '" style="color:#8b949e;padding:16px">No rows match the filter.</td></tr>';
  }
  tbody.innerHTML = html;

  // column selector
  const numericCols = [];
  for (let i = 0; i < headerCols.length; i++) {
    // pick column if > 50% of cells are numeric
    let numCount = 0, tot = 0;
    for (const r of sec.rows) {
      if (r.avg) continue;
      if (r.cells[i] !== undefined) { tot++; if (isNumeric(r.cells[i])) numCount++; }
    }
    if (tot > 0 && numCount / tot > 0.5) numericCols.push({ idx: i, name: headerCols[i] });
  }
  colSel.innerHTML = numericCols.map(c => '<option value="' + c.idx + '">' + esc(c.name) + '</option>').join('');
  colBar.classList.toggle('show', numericCols.length > 0);
  if (numericCols.length > 0) {
    if (colSel.value === '' || +colSel.value >= headerCols.length) {
      // pick first useful column
      const prefer = ['%idle', '%iowait', '%util', 'runq-sz', 'ldavg-1', 'r_await', 'w_await', '%memused'];
      let picked = 0;
      for (const p of prefer) {
        const i = numericCols.findIndex(c => c.name.toLowerCase() === p);
        if (i >= 0) { picked = numericCols[i].idx; break; }
      }
      colSel.value = String(picked);
    }
    renderSparkline();
  } else {
    sparkWrap.innerHTML = '';
  }

  // wire row clicks
  if (tbody) {
    tbody.addEventListener('click', e => {
      const tr = e.target.closest('tr[data-line]');
      if (!tr) return;
      tbody.querySelectorAll('tr.selected').forEach(x => x.classList.remove('selected'));
      tr.classList.add('selected');
      const line = +tr.getAttribute('data-line');
      const card = document.getElementById('ctxcard');
      const pre = document.getElementById('ctxpre');
      if (card && pre) {
        card.style.display = 'block';
        pre.innerHTML = contextHtml(line);
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    });
  }
}

function renderSparkline() {
  if (!state) return;
  const idx = +selectedGroup;
  const sec = state.sections[idx];
  if (!sec) { sparkWrap.innerHTML = ''; return; }
  const colIdxSel = +colSel.value;
  if (isNaN(colIdxSel) || colIdxSel < 0) { sparkWrap.innerHTML = ''; return; }

  const headerCols = sec.header.slice();
  const firstIsTime = TIME_RE.test(headerCols[0]);
  if (firstIsTime) headerCols.shift();

  const values = sec.rows.map(r => {
    if (r.avg) return null;
    const v = toNum(r.cells[colIdxSel]);
    return v;
  });
  const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const color = isDark ? '#58a6ff' : '#0969da';
  sparkWrap.innerHTML = sparkline(values, 160, 32, color);
}

function render(text, name) {
  showLoading('Parsing sar/sysstat text…');
  afterPaint(() => {
    try {
      clearError();
      const parsed = parseSar(text);
      if (!parsed.sections.length) {
        throw new Error('No sar/sysstat sections detected. The text needs a column-header row and time-prefixed data rows. Binary sadb is NOT supported — run `sadf -d` or `sar -A` first.');
      }
      currentFileName = name || '(paste)';
      currentName = (name || 'sar').replace(/\.(sar|txt|out)$/i, '');
      const summary = buildSummary(parsed, currentFileName);
      const flags = analyzeFlags(parsed, summary);
      state = { summary, sections: parsed.sections, flags };
      selectedGroup = '0';

      fname.textContent = currentFileName;
      document.title = currentName + ' — KSI Tools sar / sysstat Viewer';
      drop.style.display = 'none';
      document.querySelector('.paste-box').style.display = 'none';
      searchIn.disabled = false;
      Object.values(btns).forEach(b => b.disabled = false);
      searchIn.value = '';
      draw();
    } catch (e) {
      showError(e.message || String(e));
      statsEl.style.display = 'none';
      panel.classList.remove('show');
      groupBar.classList.remove('show');
      colBar.classList.remove('show');
    }
    hideLoading();
  });
}

function loadFile(file) {
  if (!file) return;
  if (file.size > MAX_BYTES) {
    showError('That file is ' + fmtBytes(file.size) + ', over the ' + fmtBytes(MAX_BYTES) + ' limit.');
    return;
  }
  showLoading('Reading ' + file.name + '…');
  const r = new FileReader();
  r.onload = () => render(String(r.result || ''), file.name);
  r.onerror = () => { hideLoading(); showError('Could not read the file.'); };
  r.readAsText(file);
}

wireDrop(loadFile);
document.getElementById('goBtn').onclick = () => {
  const t = pasteEl.value;
  if (!t.trim()) { showError('Paste sar/sysstat text first.'); return; }
  render(t, '(paste)');
};
searchIn.addEventListener('input', () => { clearTimeout(searchIn._t); searchIn._t = setTimeout(renderGroupTable, 120); });
groupSel.addEventListener('change', () => { selectedGroup = groupSel.value; renderGroupTable(); });
colSel.addEventListener('change', () => { renderSparkline(); });

btns.copy.onclick = async () => {
  if (!state) return;
  try {
    await navigator.clipboard.writeText(plainSummary(state));
    const old = btns.copy.textContent;
    btns.copy.textContent = 'Copied!';
    setTimeout(() => { btns.copy.textContent = old; }, 1200);
  } catch (e) {
    alert('Copy failed — browser blocked clipboard access.');
  }
};

btns.savejson.onclick = () => {
  if (!state) return;
  download(currentName + '.json', JSON.stringify(exportJson(state), null, 2), 'application/json');
};

btns.savecsv.onclick = () => {
  if (!state) return;
  const blocks = [];
  for (const sec of state.sections) {
    blocks.push('# Section ' + (state.sections.indexOf(sec) + 1) + ' — ' + sec.metricGroup + ' — ' + sec.title);
    const headerCols = sec.header.slice();
    const firstIsTime = TIME_RE.test(headerCols[0]);
    if (firstIsTime) headerCols.shift();
    const headRow = ['Time'].concat(headerCols);
    blocks.push(headRow.map(csvEsc).join(','));
    for (const r of sec.rows) {
      const row = [r.time].concat(r.cells);
      blocks.push(row.map(csvEsc).join(','));
    }
    blocks.push('');
  }
  download(currentName + '.csv', blocks.join('\n'), 'text/csv');
};

})();
</script>
</body>
</html>
