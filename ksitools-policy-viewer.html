<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KSI Tools Policy Viewer</title>
<style id="appcss">
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:15px; line-height:1.5; background:#fff; color:#1f2328; }
header.bar { position:sticky; top:0; z-index:20; display:flex; gap:8px; align-items:center; padding:10px 16px; background:#f6f8fa; border-bottom:1px solid #d0d7de; flex-wrap:wrap; }
header.bar h1 { font-size:15px; margin:0; font-weight:600; }
header.bar .fname { color:#57606a; font-size:13px; flex:1; min-width:60px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
header.bar .meta { color:#57606a; font-size:12px; }
button, select, input[type=text], textarea { font:inherit; font-size:13px; padding:6px 12px; border:1px solid #d0d7de; border-radius:6px; background:#fff; color:#1f2328; }
button { cursor:pointer; } button:hover { background:#f3f4f6; } button:disabled { opacity:.45; cursor:default; }
#search { width:220px; }
#drop { max-width:900px; margin:36px auto 16px; padding:48px 24px; text-align:center; border:2px dashed #d0d7de; border-radius:12px; color:#57606a; cursor:pointer; }
#drop.hover { border-color:#0969da; background:rgba(9,105,218,.05); color:#0969da; }
#drop strong { display:block; font-size:18px; margin-bottom:6px; color:#1f2328; }
.hint { color:#8b949e; font-size:12px; }
.paste-box { max-width:900px; margin:0 auto 20px; padding:0 16px; }
.paste-box label { display:block; font-size:13px; color:#57606a; margin-bottom:6px; }
#paste, .tarea { width:100%; min-height:110px; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:12.5px; padding:10px; border:1px solid #d0d7de; border-radius:8px; resize:vertical; }
#notice { padding:7px 16px; font-size:12.5px; background:#fff8c5; color:#7a5c00; border-bottom:1px solid #f0c000; display:none; }
#err { max-width:900px; margin:24px auto; padding:16px 20px; border:1px solid #cf222e; border-radius:10px; background:rgba(207,34,46,.06); color:#cf222e; font-family:ui-monospace,monospace; font-size:13px; white-space:pre-wrap; display:none; }
#loading { position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px; background:rgba(255,255,255,.72); color:#57606a; }
#loading.show { display:flex; }
.spinner { width:38px; height:38px; border:4px solid #d0d7de; border-top-color:#0969da; border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.badge { display:inline-block; font-size:10px; font-weight:600; padding:1px 7px; border-radius:999px; border:1px solid #d0d7de; margin-right:4px; margin-bottom:4px; }
.badge.bad { background:#ffebe9; border-color:#ff8182; color:#cf222e; }
.badge.warn { background:#fff8c5; border-color:#f0c000; color:#7a5c00; }
.badge.ok { background:#dafbe1; border-color:#4ac26b; color:#1a7f37; }
.badge.info { background:#ddf4ff; border-color:#54aeff; color:#0969da; }
.stats { display:none; flex-wrap:wrap; gap:8px; margin:8px 0 12px; padding:0 16px; }
.stat { border:1px solid #d0d7de; border-radius:8px; padding:8px 12px; font-size:12.5px; background:#f6f8fa; min-width:120px; max-width:320px; }
.stat b { display:block; font-size:14px; word-break:break-word; }
.stat .lbl { color:#57606a; font-size:11px; text-transform:uppercase; letter-spacing:.03em; }
.panel { max-width:1100px; margin:12px auto; padding:0 16px 40px; display:none; }
.panel.show { display:block; }
.card { border:1px solid #d0d7de; border-radius:10px; margin-bottom:12px; overflow:hidden; }
.card h2 { margin:0; padding:10px 14px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; background:#f6f8fa; border-bottom:1px solid #d0d7de; color:#57606a; }
.card .body { padding:12px 14px; }
.flags-row { display:flex; flex-wrap:wrap; gap:4px; align-items:center; }
table.grid { border-collapse:collapse; width:100%; font-size:12.5px; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; }
.grid th { position:sticky; top:53px; background:#f6f8fa; text-align:left; padding:8px 10px; border-bottom:1px solid #d0d7de; white-space:nowrap; z-index:5; }
.grid td { padding:6px 10px; border-bottom:1px solid #f0f2f4; vertical-align:top; word-break:break-word; }
.grid tr:hover td { background:rgba(175,184,193,.12); }
.grid tr { cursor:pointer; }
.grid tr.selected td { background:rgba(9,105,218,.1); }
.grid td.key { color:#0550ae; font-weight:600; white-space:nowrap; width:1%; }
.grid td.sec { color:#57606a; white-space:nowrap; width:1%; }
.grid td.ln { color:#8b949e; width:1%; text-align:right; font-variant-numeric:tabular-nums; }
pre.block { margin:0; padding:10px 12px; background:#f6f8fa; border-radius:8px; white-space:pre-wrap; word-break:break-word; max-height:40vh; overflow:auto; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:12px; }
.mono { font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:12px; }
.detail-kv { display:grid; grid-template-columns:140px 1fr; gap:4px 12px; font-size:12.5px; }
.detail-kv .k { color:#57606a; }
.table-wrap { overflow:auto; }
@media (prefers-color-scheme: dark) {
  body { background:#0d1117; color:#e6edf3; }
  header.bar { background:#161b22; border-bottom-color:#30363d; }
  header.bar .fname, header.bar .meta, .hint, .paste-box label, .stat .lbl, .detail-kv .k { color:#8b949e; }
  button, select, input[type=text], textarea, #paste, .tarea { background:#21262d; color:#e6edf3; border-color:#30363d; }
  button:hover { background:#30363d; }
  #drop { border-color:#30363d; color:#8b949e; } #drop strong { color:#e6edf3; }
  #drop.hover { border-color:#4493f8; color:#4493f8; }
  .stat { background:#161b22; border-color:#30363d; }
  .card { border-color:#30363d; }
  .card h2 { background:#161b22; border-bottom-color:#30363d; color:#8b949e; }
  .grid th { background:#161b22; border-bottom-color:#30363d; }
  .grid td { border-bottom-color:#21262d; }
  .grid tr:hover td { background:rgba(110,118,129,.12); }
  .grid tr.selected td { background:rgba(31,111,235,.2); }
  .grid td.key { color:#79c0ff; }
  .grid td.sec { color:#8b949e; }
  .grid td.ln { color:#6e7681; }
  .badge { border-color:#30363d; }
  .badge.bad { background:#3d1418; border-color:#f85149; color:#ff7b72; }
  .badge.warn { background:#3a2f00; border-color:#b58900; color:#e3b341; }
  .badge.ok { background:#12261e; border-color:#238636; color:#3fb950; }
  .badge.info { background:#121d2f; border-color:#1f6feb; color:#58a6ff; }
  pre.block { background:#161b22; }
  #notice { background:#3a2f00; color:#e3b341; border-bottom-color:#b58900; }
  #err { border-color:#f85149; color:#ff7b72; background:rgba(248,81,73,.08); }
  #loading { background:rgba(13,17,23,.75); }
  .spinner { border-color:#30363d; border-top-color:#4493f8; }
}
</style>
</head>
<body>

<header class="bar">
  <h1>KSI Tools Policy Viewer</h1>
  <span class="fname" id="fname"></span>
  <span class="meta" id="meta"></span>
  <input type="text" id="search" placeholder="Filter mode / name / kind…" disabled>
  <button id="copy" disabled title="Copy a plain-English summary">Copy summary</button>
  <button id="savejson" disabled>Save .json</button>
  <button id="savecsv" disabled>Save .csv</button>
  <button id="pick" onclick="document.getElementById('file').click()">Open file</button>
</header>
<input type="file" id="file" accept=".yaml,.yml,.rego,.txt,text/plain,text/yaml,application/x-yaml" style="display:none">

<div id="drop">
  <strong>Drop a policy file here</strong>
  or click to choose · Kyverno · Gatekeeper · OPA Rego · ValidatingAdmissionPolicy
  <div class="hint" style="margin-top:10px">Accepts .yaml .yml .rego .txt. Paste OK. Limit 10 MB. Parsed locally for migration &amp; cluster policy review — nothing is uploaded.</div>
</div>

<div class="paste-box">
  <label for="paste">Or paste policy YAML / Rego:</label>
  <textarea id="paste" class="tarea" spellcheck="false" placeholder="apiVersion: kyverno.io/v1&#10;kind: ClusterPolicy&#10;metadata:&#10;  name: require-labels&#10;spec:&#10;  validationFailureAction: Enforce&#10;  rules:&#10;    - name: check-label&#10;      match:&#10;        any:&#10;          - resources:&#10;              kinds: [Pod]&#10;      validate:&#10;        message: label required&#10;        pattern:&#10;          metadata:&#10;            labels:&#10;              app: &quot;?*&quot;"></textarea>
  <div style="margin-top:8px"><button id="goBtn">Analyze paste</button></div>
</div>

<div id="err"></div>
<div id="notice"></div>
<div class="stats" id="stats"></div>
<div class="panel" id="panel"></div>

<div id="loading"><div class="spinner"></div><div id="loadingmsg">Loading…</div></div>

<script>
(function () {

const MAX_BYTES = 10 * 1024 * 1024;

function getYaml() {
  if (typeof jsyaml !== 'undefined' && jsyaml.load) return jsyaml;
  if (typeof exports !== 'undefined' && exports.load) return exports;
  throw new Error('js-yaml failed to load');
}

const drop = document.getElementById('drop');
const errBox = document.getElementById('err');
const noticeEl = document.getElementById('notice');
const fname = document.getElementById('fname');
const metaEl = document.getElementById('meta');

const searchIn = document.getElementById('search');
const loadingEl = document.getElementById('loading');
const loadingMsg = document.getElementById('loadingmsg');
const statsEl = document.getElementById('stats');
const panel = document.getElementById('panel');
const btns = {
  copy: document.getElementById('copy'),
  savejson: document.getElementById('savejson'),
  savecsv: document.getElementById('savecsv')
};

let currentName = 'policy';
let currentFileName = '';
let rawText = '';
let rawLines = [];
let state = null;

function showLoading(m) { loadingMsg.textContent = m || 'Loading…'; loadingEl.classList.add('show'); }
function hideLoading() { loadingEl.classList.remove('show'); }
function afterPaint(fn) { requestAnimationFrame(() => requestAnimationFrame(fn)); }
function showError(m) { errBox.style.display = 'block'; errBox.textContent = m; }
function clearError() { errBox.style.display = 'none'; errBox.textContent = ''; }
function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: type || 'text/plain' }));
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}
function csvEsc(v) {
  const s = String(v ?? '');
  return /["\n,]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function fmtBytes(n) {
  if (n >= 1024 * 1024) return (n / (1024 * 1024)).toFixed(1) + ' MB';
  if (n >= 1024) return (n / 1024).toFixed(1) + ' KB';
  return n + ' bytes';
}
function wireDrop(loadFn) {
  drop.onclick = () => fileInput.click();
  fileInput.onchange = () => { if (fileInput.files[0]) loadFn(fileInput.files[0]); fileInput.value = ''; };
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('hover'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('hover'); }));
  drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) loadFn(f); });
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => {
    if (e.target.closest && e.target.closest('#drop')) return;
    e.preventDefault();
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) loadFn(f);
  });

function pushFlag(flags, t, l, detail) {
  if (!flags.some(f => f.t === t && f.l === l)) flags.push({ t, l, detail: detail || '' });
}

  if (x == null) return [];
  return Array.isArray(x) ? x : [x];
}
function uniq(arr) {
  return Array.from(new Set(arr.filter(Boolean)));
}

const KYVERNO_KINDS = new Set([
  'Policy', 'ClusterPolicy', 'PolicyException', 'ClusterPolicyException',
  'CleanupPolicy', 'ClusterCleanupPolicy', 'ValidatingPolicy', 'ImageValidatingPolicy',
  'MutatingPolicy', 'GeneratingPolicy', 'DeletingPolicy'
]);
const GK_TEMPLATE_API = /templates\.gatekeeper\.sh/i;
const GK_CONSTRAINT_API = /constraints\.gatekeeper\.sh/i;
const KYVERNO_API = /kyverno\.io/i;
const VAP_API = /admissionregistration\.k8s\.io/i;

function looksLikeRego(text, filename) {
  if (filename && /\.rego$/i.test(filename)) return true;
  const t = String(text || '').replace(/^\uFEFF/, '').trimStart();
  return /^package\s+[\w.\/]+/m.test(t.split(/\r?\n/).slice(0, 40).join('\n'));
}

function summarizeMatch(match) {
  if (!match || typeof match !== 'object') return { kinds: [], namespaces: [], summary: '' };
  const kinds = [];
  const namespaces = [];
  function walk(node) {
    if (!node || typeof node !== 'object') return;
    if (Array.isArray(node)) { node.forEach(walk); return; }
    if (node.resources) {
      asArr(node.resources.kinds).forEach(k => kinds.push(String(k)));
      asArr(node.resources.namespaces).forEach(n => namespaces.push(String(n)));
      asArr(node.resources.namespaceSelector && node.resources.namespaceSelector.matchExpressions).forEach(() => {});
    }
    if (node.kinds) asArr(node.kinds).forEach(k => kinds.push(String(k)));
    if (node.namespaces) asArr(node.namespaces).forEach(n => namespaces.push(String(n)));
    if (node.any) asArr(node.any).forEach(walk);
    if (node.all) asArr(node.all).forEach(walk);
  }
  walk(match);
  const uk = uniq(kinds);
  const un = uniq(namespaces);
  const parts = [];
  if (uk.length) parts.push('kinds=' + uk.join('|'));
  if (un.length) parts.push('ns=' + un.join('|'));
  return { kinds: uk, namespaces: un, summary: parts.join(' ') || '(match)' };
}

function hasWildcard(arr) {
  return (arr || []).some(x => String(x) === '*' || String(x).includes('*'));
}

function findDocStartLine(text, docIndex, docs) {
  // Approximate: count --- separators
  const lines = String(text || '').split(/\r?\n/);
  let idx = 0;
  let doc = 0;
  for (let i = 0; i < lines.length; i++) {
    if (/^---\s*$/.test(lines[i])) {
      if (doc === docIndex) return i + 2; // next line after ---
      doc++;
    } else if (i === 0 && docIndex === 0) {
      return 1;
    }
  }
  if (docIndex === 0) return 1;
  // fallback: scan for kind/name
  return 1;
}

function detectDocMode(doc, filename, text) {
  if (!doc || typeof doc !== 'object') return null;
  const api = String(doc.apiVersion || '');
  const kind = String(doc.kind || '');
  if (KYVERNO_API.test(api) || KYVERNO_KINDS.has(kind)) return 'kyverno';
  if (GK_TEMPLATE_API.test(api) || kind === 'ConstraintTemplate') return 'gatekeeper-template';
  if (GK_CONSTRAINT_API.test(api) || (kind && api && !KYVERNO_API.test(api) && doc.spec && doc.spec.enforcementAction != null && doc.spec.match)) {
    // Heuristic: Constraint CRDs live under constraints.gatekeeper.sh
    if (GK_CONSTRAINT_API.test(api) || (doc.spec && (doc.spec.enforcementAction != null || doc.spec.match))) {
      if (GK_CONSTRAINT_API.test(api) || kind !== 'ConstraintTemplate') {
        if (GK_CONSTRAINT_API.test(api)) return 'gatekeeper-constraint';
      }
    }
  }
  if (GK_CONSTRAINT_API.test(api)) return 'gatekeeper-constraint';
  if (VAP_API.test(api) && /ValidatingAdmissionPolicy/.test(kind)) return 'vap';

}

        pushFlag(flags, 'warn', 'wildcard * in match', name + '/' + rname);
      }
    } else if (rule.generate) {
      types.push('generate');
      typeSet.add('generate');
      ruleDetails.push({
        name: rname, types, validateStyles: [],
        matchSummary: matchInfo.summary, excludeSummary: excludeInfo.summary,
        matchKinds: matchInfo.kinds, matchNamespaces: matchInfo.namespaces
      });
    } else if (rule.verifyImages) {
      types.push('verifyImages');
      typeSet.add('verifyImages');
      const imgs = asArr(rule.verifyImages);
      const missingAttestors = imgs.some(img => {
        const att = img.attestors || img.attestations;
        return !att || (Array.isArray(att) && !att.length);
      });
      if (missingAttestors) {
        pushFlag(flags, 'info', 'verifyImages without attestors detail', name + '/' + rname);
      }
      ruleDetails.push({
        name: rname, types, validateStyles: [],
        matchSummary: matchInfo.summary, excludeSummary: excludeInfo.summary,
        matchKinds: matchInfo.kinds, matchNamespaces: matchInfo.namespaces
      });
    } else {
      ruleDetails.push({
        name: rname, types: ['(other)'], validateStyles: [],
        matchSummary: matchInfo.summary, excludeSummary: excludeInfo.summary,
        matchKinds: matchInfo.kinds, matchNamespaces: matchInfo.namespaces
      });
    }
    if (rule.context) typeSet.add('context');
  }

  const rulesSummary = ruleDetails.map(r => {
    const vs = r.validateStyles && r.validateStyles.length ? ':' + r.validateStyles.join('+') : '';
    return r.name + '[' + r.types.join('+') + vs + ']' + (r.matchSummary ? ' ' + r.matchSummary : '');
  }).join('; ') || '(no rules)';

  return {
    mode: 'kyverno',
    docIndex,
    line: lineHint || 1,
    name,
    namespace: ns,
    kind,
    packageOrKind: kind + (ns ? ' @' + ns : ''),
    action: action || '—',
    rulesSummary,
    ruleCount: rules.length,
    ruleTypes: Array.from(typeSet),
    rules: ruleDetails,
    flags,
    raw: doc
  };
}

function analyzeGatekeeperTemplate(doc, docIndex, lineHint) {
  const md = doc.metadata || {};
  const name = String(md.name || '(unnamed)');
  const spec = doc.spec || {};
  const crd = spec.crd || {};
  const crdKind = (crd.spec && crd.spec.names && crd.spec.names.kind) || (crd.names && crd.names.kind) || '';
  const targets = asArr(spec.targets);
  const targetLangs = targets.map(t => String(t.target || t.rego ? (t.target || 'admission.k8s.gatekeeper.sh') : '')).filter(Boolean);
  const langs = [];
  let pkg = '';
  for (const t of targets) {
    if (t.rego) {
      langs.push(t.code ? String(t.code) : 'rego');
      const m = /package\s+([\w.]+)/.exec(String(t.rego));
      if (m && !pkg) pkg = m[1];
    }
    if (t.code) langs.push(String(t.code));
  }
  const flags = [];
  if (!crdKind) pushFlag(flags, 'info', 'ConstraintTemplate missing CRD kind', name);
  if (!targets.length) pushFlag(flags, 'warn', 'ConstraintTemplate missing targets', name);

  const rulesSummary = 'targets=' + (uniq(langs).join('|') || targetLangs.join('|') || '—') +
    (pkg ? ' package=' + pkg : '') +
    (crdKind ? ' CRD=' + crdKind : '');

  return {
    mode: 'gatekeeper',
    subtype: 'template',
    docIndex,
    line: lineHint || 1,
    name,
    namespace: '',
    kind: 'ConstraintTemplate',
    packageOrKind: crdKind ? 'CRD ' + crdKind : 'ConstraintTemplate',
    action: '—',
    rulesSummary,
    ruleCount: targets.length,
    ruleTypes: uniq(langs),
    crdKind,
    package: pkg,
    targets: targets.map(t => ({ target: t.target || '', code: t.code || (t.rego ? 'rego' : '') })),
    flags,
    raw: doc
  };
}

function analyzeGatekeeperConstraint(doc, docIndex, lineHint) {
  const md = doc.metadata || {};
  const name = String(md.name || '(unnamed)');
  const kind = String(doc.kind || 'Constraint');
  const spec = doc.spec || {};
  const action = String(spec.enforcementAction || 'deny');
  const matchInfo = summarizeMatch(spec.match || {});
  const flags = [];
  if (/^deny$/i.test(action)) pushFlag(flags, 'info', 'enforcementAction: deny', name);
  if (/^dryrun$/i.test(action)) pushFlag(flags, 'info', 'enforcementAction: dryrun', name);
  if (hasWildcard(matchInfo.kinds) || hasWildcard(matchInfo.namespaces)) {
    pushFlag(flags, 'warn', 'wildcard * in match', name);
  }

  return {
    mode: 'gatekeeper',
    subtype: 'constraint',
    docIndex,
    line: lineHint || 1,
    name,
    namespace: md.namespace ? String(md.namespace) : '',
    kind,
    packageOrKind: kind,
    action,
    rulesSummary: matchInfo.summary || '(no match)',
    ruleCount: 0,
    ruleTypes: [],
    matchKinds: matchInfo.kinds,
    matchNamespaces: matchInfo.namespaces,
    flags,
    raw: doc
  };
}

function analyzeVap(doc, docIndex, lineHint) {
  const md = doc.metadata || {};
  const name = String(md.name || '(unnamed)');
  const kind = String(doc.kind || 'ValidatingAdmissionPolicy');
  const spec = doc.spec || {};
  const action = String(spec.failurePolicy || 'Fail');
  const validations = asArr(spec.validations);
  const matchConstraints = spec.matchConstraints || {};
  const rules = asArr(matchConstraints.resourceRules);
  const kinds = [];
  for (const r of rules) {
    asArr(r.resources).forEach(x => kinds.push(String(x)));
    asArr(r.apiGroups).forEach(x => kinds.push('apiGroup:' + x));
  }
  const flags = [];
  if (/^Fail$/i.test(action)) pushFlag(flags, 'info', 'failurePolicy: Fail', name);
  const rulesSummary = validations.length + ' validation(s); match=' + (uniq(kinds).slice(0, 8).join('|') || '—');

  return {
    mode: 'vap',
    docIndex,
    line: lineHint || 1,
    name,
    namespace: '',
    kind,
    packageOrKind: kind,
    action,
    rulesSummary,
    ruleCount: validations.length,
    ruleTypes: ['cel'],
    flags,
    raw: doc
  };
}

function analyzeRego(text, filename) {
  const lines = String(text || '').replace(/^\uFEFF/, '').split(/\r?\n/);
  let pkg = '';
  const imports = [];
  const ruleNames = [];
  const flags = [];
  let denyCount = 0;
  let violationCount = 0;
  let allowCount = 0;

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const trimmed = line.trim();
    if (!pkg) {
      const pm = /^package\s+([\w.\/]+)/.exec(trimmed);
      if (pm) pkg = pm[1];
    }
    const im = /^import\s+(\S+)/.exec(trimmed);
    if (im) imports.push(im[1]);

    // top-level rule names (heuristic)
    const rm = /^([\w.]+)(?:\s*(?:\[|\(|:=|=|:)|$)/.exec(trimmed);
    if (rm && !/^(package|import|else|if|some|every|not|with|as|default)$/.test(rm[1])) {
      // only count if it looks like a rule head (not continuation)
      if (/^[\w.]+(\s*[\[(=:]|\s*$)/.test(trimmed) && !trimmed.startsWith('#') && line.match(/^\S/)) {
        if (!ruleNames.includes(rm[1]) && !/^(package|import)$/.test(rm[1])) {
          // filter out assignments that are clearly not rules - keep common ones + heads with { or if
          if (/\{|:|=|:=|\[/.test(trimmed) || /^(allow|deny|violation|warn)/.test(rm[1])) {
            if (!ruleNames.includes(rm[1])) ruleNames.push(rm[1]);
          }
        }
      }
    }

    if (/\bdeny\s*\[/.test(line) || /^deny\s*(\[|=|:)/.test(trimmed)) denyCount++;
    if (/\bviolation\s*\[/.test(line) || /^violation\s*(\[|=|:)/.test(trimmed)) violationCount++;
    if (/\ballow\b/.test(line) && /(allow\s*=|allow\s*:=|default\s+allow|^allow\s*\{)/.test(trimmed)) allowCount++;

    if (/allow\s*=\s*true\b/.test(trimmed) || /default\s+allow\s*(:=|=)\s*true\b/.test(trimmed)) {
      pushFlag(flags, 'warn', 'bare allow = true', 'line ' + (i + 1));
    }
    if (/#\s*TODO\b/i.test(line)) {
      pushFlag(flags, 'info', '# TODO', 'line ' + (i + 1));
    }
    if (/\bhttp\.send\b/.test(line)) {
      pushFlag(flags, 'info', 'http.send (external)', 'line ' + (i + 1));
    }
  }

  // Ensure common rule names are captured
  const textAll = lines.join('\n');
  ['allow', 'deny', 'violation', 'warn'].forEach(n => {
    const re = new RegExp('(?:^|\\n)\\s*(?:default\\s+)?' + n + '\\b');
    if (re.test(textAll) && !ruleNames.includes(n)) ruleNames.push(n);
  });
  // Custom rule heads: lines starting with ident then [ or {
  for (const line of lines) {
    const m = /^([a-zA-Z_]\w*)\s*[\[{]/.exec(line);
    if (m && !ruleNames.includes(m[1]) && !/^(package|import)$/.test(m[1])) ruleNames.push(m[1]);
  }

  if (!pkg) pushFlag(flags, 'warn', 'missing package', filename || '(rego)');
  if (!flags.length) pushFlag(flags, 'ok', 'no major flags', '');

  const rulesSummary = ruleNames.slice(0, 12).join(', ') +
    (ruleNames.length > 12 ? '…' : '') +
    ' · deny=' + denyCount + ' violation=' + violationCount + ' allow=' + allowCount;

  return {
    mode: 'rego',
    docIndex: 0,
    line: 1,
    name: pkg || (filename || 'policy.rego'),
    namespace: '',
    kind: 'Rego',
    packageOrKind: pkg ? 'package ' + pkg : 'Rego',
    action: denyCount || violationCount ? 'deny/violation' : (allowCount ? 'allow' : '—'),
    rulesSummary,
    ruleCount: ruleNames.length,
    ruleTypes: ruleNames.slice(),
    package: pkg,
    imports,
    denyCount,
    violationCount,
    allowCount,
    flags,
    raw: { package: pkg, imports, rules: ruleNames }
  };
}

function splitYamlDocs(text) {
  const yaml = getYaml();
  const docs = [];
  try {
    const loaded = yaml.loadAll(text);
    for (const d of loaded) {
      if (d != null) docs.push(d);
    }
  } catch (e) {
    // try single load
    try {
      const one = yaml.load(text);
      if (one != null) docs.push(one);
    } catch (e2) {
      throw e;
    }
  }
  return docs;
}

function estimateDocLines(text) {
  const lines = String(text || '').split(/\r?\n/);
  const starts = [1];
  for (let i = 0; i < lines.length; i++) {
    if (/^---\s*$/.test(lines[i])) starts.push(i + 2);
  }
  return starts;
}

function parsePolicies(text, filename) {
  const name = filename || '';
  const trimmed = String(text || '').replace(/^\uFEFF/, '');
  if (!trimmed.trim()) throw new Error('Empty input.');

  // Rego path
  if (looksLikeRego(trimmed, name)) {
    // If it's clearly rego and not YAML k8s, analyze as rego
    const maybeYaml = /^\s*(apiVersion|kind)\s*:/m.test(trimmed);
    if (!maybeYaml || /\.rego$/i.test(name)) {
      const item = analyzeRego(trimmed, name);
      const allFlags = item.flags.slice();
      return {
        items: [item],
        flags: allFlags,
        summary: {
          filename: name || '(paste)',
          modes: { kyverno: 0, gatekeeper: 0, rego: 1, vap: 0, other: 0 },
          total: 1,
          enforceCount: 0,
          mutateCount: 0
        }
      };
    }
  }

  const docs = splitYamlDocs(trimmed);
  if (!docs.length) throw new Error('No YAML documents found.');

  const docLines = estimateDocLines(trimmed);
  const items = [];
  const allFlags = [];
  const modes = { kyverno: 0, gatekeeper: 0, rego: 0, vap: 0, other: 0 };
  let enforceCount = 0;
  let mutateCount = 0;

  docs.forEach((doc, i) => {
    if (!doc || typeof doc !== 'object') {
      modes.other++;
      return;
    }
    const line = docLines[i] || 1;
    let mode = detectDocMode(doc, name, trimmed);
    // Gatekeeper constraint heuristic when api is constraints.* or kind looks custom with enforcementAction
    if (!mode && doc.spec && doc.spec.enforcementAction != null && doc.spec.match && doc.kind && doc.kind !== 'ConstraintTemplate') {
      mode = 'gatekeeper-constraint';
    }
    // Embedded rego in random YAML?
    if (!mode && doc.apiVersion && doc.kind) {
      mode = 'other';
    }

    let item = null;
    if (mode === 'kyverno') {
      item = analyzeKyverno(doc, i, line);
      modes.kyverno++;
      if (/^enforce$/i.test(item.action)) enforceCount++;
      if (item.ruleTypes.includes('mutate')) mutateCount++;
    } else if (mode === 'gatekeeper-template') {
      item = analyzeGatekeeperTemplate(doc, i, line);
      modes.gatekeeper++;
    } else if (mode === 'gatekeeper-constraint') {
      item = analyzeGatekeeperConstraint(doc, i, line);
      modes.gatekeeper++;
      if (/^deny$/i.test(item.action)) enforceCount++;
    } else if (mode === 'vap') {
      item = analyzeVap(doc, i, line);
      modes.vap++;
    } else {
      // Unknown k8s-ish doc
      const md = doc.metadata || {};
      item = {
        mode: 'other',
        docIndex: i,
        line,
        name: String(md.name || doc.kind || '(doc ' + (i + 1) + ')'),
        namespace: md.namespace ? String(md.namespace) : '',
        kind: String(doc.kind || 'Unknown'),
        packageOrKind: String(doc.kind || 'Unknown'),
        action: '—',
        rulesSummary: 'apiVersion=' + String(doc.apiVersion || ''),
        ruleCount: 0,
        ruleTypes: [],
        flags: [{ t: 'info', l: 'unrecognized policy kind', detail: String(doc.kind || '') }],
        raw: doc
      };
      modes.other++;
    }
    items.push(item);
    for (const f of item.flags) pushFlag(allFlags, f.t, f.l, f.detail);
  });

  if (!items.length) throw new Error('No policy documents recognized.');
  if (!allFlags.length) pushFlag(allFlags, 'ok', 'no major flags', '');

  return {
    items,
    flags: allFlags,
    summary: {
      filename: name || '(paste)',
      modes,
      total: items.length,
      enforceCount,
      mutateCount
    }
  };
}

function plainSummary(st) {
  const s = st.summary;
  const lines = [];
  lines.push('KSI Tools Policy Viewer — summary');
  lines.push('File: ' + (s.filename || currentFileName || '(paste)'));
  lines.push('Documents: ' + s.total);
  lines.push('Modes: Kyverno=' + s.modes.kyverno +
    ' Gatekeeper=' + s.modes.gatekeeper +
    ' Rego=' + s.modes.rego +
    ' VAP=' + s.modes.vap +
    (s.modes.other ? ' Other=' + s.modes.other : ''));
  if (s.enforceCount) lines.push('Enforce/deny count: ' + s.enforceCount);
  if (s.mutateCount) lines.push('Policies with mutate: ' + s.mutateCount);
  lines.push('');
  lines.push('Flags:');
  for (const f of st.flags) {
    lines.push('  [' + f.t + '] ' + f.l + (f.detail ? ' — ' + f.detail : ''));
  }
  lines.push('');
  lines.push('Inventory:');
  for (const it of st.items) {
    lines.push('  [' + it.mode + '] ' + it.name + ' · ' + it.packageOrKind +
      ' · action=' + it.action + ' · ' + it.rulesSummary);
  }
  return lines.join('\n');
}

function exportJson(st) {
  return {
    summary: st.summary,
    flags: st.flags.map(f => ({ level: f.t, label: f.l, detail: f.detail })),
    items: st.items.map(it => ({
      mode: it.mode,
      subtype: it.subtype || null,
      docIndex: it.docIndex,
      line: it.line,
      name: it.name,
      namespace: it.namespace,
      kind: it.kind,
      packageOrKind: it.packageOrKind,
      action: it.action,
      rulesSummary: it.rulesSummary,
      ruleCount: it.ruleCount,
      ruleTypes: it.ruleTypes,
      rules: it.rules || null,
      package: it.package || null,
      imports: it.imports || null,
      crdKind: it.crdKind || null,
      flags: it.flags
    }))
  };
}

function highlight(text, q) {
  if (!q) return esc(text);
  const s = String(text ?? '');
  const low = s.toLowerCase();
  const idx = low.indexOf(q);
  if (idx < 0) return esc(s);
  return esc(s.slice(0, idx)) + '<span class="hit">' + esc(s.slice(idx, idx + q.length)) + '</span>' + esc(s.slice(idx + q.length));
}

function filteredItems() {
  if (!state) return [];
  const q = searchIn.value.trim().toLowerCase();
  if (!q) return state.items;
  return state.items.filter(it =>
    (it.mode + ' ' + it.name + ' ' + it.kind + ' ' + it.packageOrKind + ' ' + it.action + ' ' + it.rulesSummary + ' ' + (it.namespace || ''))
      .toLowerCase().includes(q)
  );
}

function detailHtml(it) {
  let h = '<div class="detail-kv">';
  const rows = [
    ['Mode', it.mode + (it.subtype ? ' / ' + it.subtype : '')],
    ['Name', it.name],
    ['Kind', it.kind],
    ['Namespace', it.namespace || '—'],
    ['Action', it.action],
    ['Package/Kind', it.packageOrKind],
    ['Rules', String(it.ruleCount)],
    ['Types', (it.ruleTypes || []).join(', ') || '—'],
    ['Doc #', String((it.docIndex || 0) + 1)],
    ['Line', String(it.line || 1)]
  ];
  if (it.package) rows.push(['Rego package', it.package]);
  if (it.imports && it.imports.length) rows.push(['Imports', it.imports.join(', ')]);
  if (it.crdKind) rows.push(['CRD kind', it.crdKind]);
  if (it.denyCount != null) rows.push(['deny[ count', String(it.denyCount)]);
  if (it.violationCount != null) rows.push(['violation[ count', String(it.violationCount)]);
  for (const [k, v] of rows) {
    h += '<div class="k">' + esc(k) + '</div><div class="mono">' + esc(v) + '</div>';
  }
  h += '</div>';
  h += '<div style="margin-top:10px;font-size:12.5px"><strong>Rules summary</strong></div>';
  h += '<pre class="block">' + esc(it.rulesSummary) + '</pre>';
  if (it.rules && it.rules.length) {
    h += '<div style="margin-top:10px;font-size:12.5px"><strong>Rule detail</strong></div>';
    h += '<pre class="block">' + esc(JSON.stringify(it.rules, null, 2)) + '</pre>';
  }
  if (it.flags && it.flags.length) {
    h += '<div style="margin-top:10px" class="flags-row">';
    for (const f of it.flags) {
      h += '<span class="badge ' + esc(f.t) + '" title="' + esc(f.detail || '') + '">' + esc(f.l) + '</span>';
    }
    h += '</div>';
  }
  try {
    const yaml = getYaml();
    if (it.raw && it.mode !== 'rego' && yaml.dump) {
      h += '<div style="margin-top:10px;font-size:12.5px"><strong>Document</strong></div>';
      h += '<pre class="block">' + esc(yaml.dump(it.raw, { lineWidth: -1, noRefs: true })) + '</pre>';
    } else if (it.mode === 'rego') {
      h += '<div style="margin-top:10px;font-size:12.5px"><strong>Source (excerpt)</strong></div>';
      h += '<pre class="block">' + esc(rawText.split(/\r?\n/).slice(0, 80).join('\n')) + '</pre>';
    }
  } catch (e) { /* ignore */ }
  return h;
}

function draw() {
  if (!state) return;
  const q = searchIn.value.trim().toLowerCase();
  const list = filteredItems();
  const s = state.summary;

  const cards = [];
  cards.push({ lbl: 'Documents', val: String(s.total) });
  if (s.modes.kyverno) cards.push({ lbl: 'Kyverno', val: String(s.modes.kyverno) });
  if (s.modes.gatekeeper) cards.push({ lbl: 'Gatekeeper', val: String(s.modes.gatekeeper) });
  if (s.modes.rego) cards.push({ lbl: 'OPA Rego', val: String(s.modes.rego) });
  if (s.modes.vap) cards.push({ lbl: 'VAP', val: String(s.modes.vap) });
  if (s.modes.other) cards.push({ lbl: 'Other', val: String(s.modes.other) });
  if (s.enforceCount) cards.push({ lbl: 'Enforce/deny', val: String(s.enforceCount) });
  if (s.mutateCount) cards.push({ lbl: 'Mutate', val: String(s.mutateCount) });
  cards.push({ lbl: 'Flags', val: String(state.flags.filter(f => f.t !== 'ok').length) });

  statsEl.style.display = 'flex';
  statsEl.innerHTML = cards.map(c =>
    '<div class="stat"><span class="lbl">' + esc(c.lbl) + '</span><b>' + esc(c.val) + '</b></div>'
  ).join('');

  const warnCount = state.flags.filter(f => f.t === 'bad' || f.t === 'warn').length;
  metaEl.textContent = s.total + ' doc' + (s.total === 1 ? '' : 's') +
    (warnCount ? ' · ' + warnCount + ' flag' + (warnCount === 1 ? '' : 's') : '') +
    (q ? ' · ' + list.length + ' shown' : '');

  noticeEl.style.display = warnCount ? 'block' : 'none';
  if (warnCount) {
    noticeEl.textContent = warnCount + ' heuristic flag(s) for policy review (Enforce, mutate, wildcards, Rego allow). Not a live admission evaluation.';
  }

  let html = '';
  html += '<div class="card"><h2>Flags</h2><div class="body"><div class="flags-row">';
  for (const f of state.flags) {
    html += '<span class="badge ' + esc(f.t) + '" title="' + esc(f.detail || '') + '">' + esc(f.l) + '</span>';
  }
  html += '</div>';
  html += '<ul style="margin:10px 0 0;padding-left:18px;font-size:12.5px;color:inherit">';
  for (const f of state.flags) {
    if (f.t === 'ok') continue;
    html += '<li><strong>' + esc(f.l) + '</strong>' + (f.detail ? ' — ' + esc(f.detail) : '') + '</li>';
  }
  html += '</ul></div></div>';

  html += '<div class="card"><h2>Policies / rules</h2><div class="body" style="padding:0"><div class="table-wrap">';
  html += '<table class="grid"><thead><tr><th>Line/Doc</th><th>Mode</th><th>Name</th><th>Kind/Package</th><th>Action</th><th>Rules summary</th></tr></thead><tbody id="tbody">';
  list.forEach((it, idx) => {
    const realIdx = state.items.indexOf(it);
    html += '<tr data-idx="' + realIdx + '">' +
      '<td class="ln">' + esc(String(it.line)) + '/#' + (it.docIndex + 1) + '</td>' +
      '<td class="sec">' + highlight(it.mode, q) + '</td>' +
      '<td class="key">' + highlight(it.name, q) + '</td>' +
      '<td>' + highlight(it.packageOrKind, q) + '</td>' +
      '<td>' + highlight(it.action, q) + '</td>' +
      '<td>' + highlight(it.rulesSummary, q) + '</td></tr>';
  });
  if (!list.length) {
    html += '<tr><td colspan="6" style="color:#8b949e;padding:16px">No rows match the filter.</td></tr>';
  }
  html += '</tbody></table></div></div></div>';

  html += '<div class="card" id="detailcard" style="display:none"><h2>Detail</h2><div class="body" id="detailbody"></div></div>';

  panel.innerHTML = html;
  panel.classList.add('show');

  const tbody = document.getElementById('tbody');
  if (tbody) {
    tbody.addEventListener('click', e => {
      const tr = e.target.closest('tr[data-idx]');
      if (!tr) return;
      tbody.querySelectorAll('tr.selected').forEach(x => x.classList.remove('selected'));
      tr.classList.add('selected');
      const idx = +tr.getAttribute('data-idx');
      const it = state.items[idx];
      const card = document.getElementById('detailcard');
      const body = document.getElementById('detailbody');
      if (card && body && it) {
        card.style.display = 'block';
        body.innerHTML = detailHtml(it);
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    });
  }
}

function render(text, name) {
  showLoading('Parsing policies…');
  afterPaint(() => {
    try {
      clearError();
      getYaml(); // ensure loaded
      const parsed = parsePolicies(text, name);
      rawText = text;
      rawLines = String(text || '').split(/\r?\n/);
      currentFileName = name || '(paste)';
      currentName = (name || 'policy').replace(/\.(ya?ml|rego|txt)$/i, '').replace(/[^a-zA-Z0-9._-]+/g, '_') || 'policy';
      state = parsed;

      fname.textContent = currentFileName;
      document.title = currentName + ' — KSI Tools Policy Viewer';
      drop.style.display = 'none';
      document.querySelector('.paste-box').style.display = 'none';
      searchIn.disabled = false;
      Object.values(btns).forEach(b => { b.disabled = false; });
      searchIn.value = '';
      draw();
    } catch (e) {
      showError(e.message || String(e));
      statsEl.style.display = 'none';
      panel.classList.remove('show');
    }
    hideLoading();
  });
}

function loadFile(file) {
  if (!file) return;
  if (file.size > MAX_BYTES) {
    showError('That file is ' + fmtBytes(file.size) + ', over the ' + fmtBytes(MAX_BYTES) + ' limit.');
    return;
  }
  showLoading('Reading ' + file.name + '…');
  const r = new FileReader();
  r.onload = () => {
    const t = String(r.result || '');
    if (new Blob([t]).size > MAX_BYTES) { hideLoading(); showError('Input exceeds 10 MB limit'); return; }
    render(t, file.name);
  };
  r.onerror = () => { hideLoading(); showError('Could not read the file.'); };
  r.readAsText(file);
}

wireDrop(loadFile);
document.getElementById('goBtn').onclick = () => {
  const t = pasteEl.value;
  if (!t.trim()) { showError('Paste a policy first.'); return; }
  if (new Blob([t]).size > MAX_BYTES) { showError('Input exceeds 10 MB limit'); return; }
  render(t, '(paste)');
};
searchIn.addEventListener('input', () => { clearTimeout(searchIn._t); searchIn._t = setTimeout(draw, 120); });

btns.copy.onclick = async () => {
  if (!state) return;
  try {
    await navigator.clipboard.writeText(plainSummary(state));
    const old = btns.copy.textContent;
    btns.copy.textContent = 'Copied!';
    setTimeout(() => { btns.copy.textContent = old; }, 1200);
  } catch (e) {
    alert('Copy failed — browser blocked clipboard access.');
  }
};

btns.savejson.onclick = () => {
  if (!state) return;
  download(currentName + '.json', JSON.stringify(exportJson(state), null, 2), 'application/json');
};

btns.savecsv.onclick = () => {
  if (!state) return;
  const rows = filteredItems();
  const lines = ['line,doc,mode,name,kind_or_package,action,rules_summary'].concat(
    rows.map(r => [csvEsc(r.line), csvEsc(r.docIndex + 1), csvEsc(r.mode), csvEsc(r.name),
      csvEsc(r.packageOrKind), csvEsc(r.action), csvEsc(r.rulesSummary)].join(','))
  );
  download(currentName + '.csv', lines.join('\n'), 'text/csv');
};

// Expose for smoke tests / automation
globalThis.KSIPolicyAPI = {
  getYaml,
  parsePolicies,
  analyzeKyverno,
  analyzeGatekeeperTemplate,
  analyzeGatekeeperConstraint,
  analyzeRego,
  analyzeVap,
  detectDocMode,
  looksLikeRego,
  plainSummary,
  exportJson,
  MAX_BYTES
};

})();
</script>
