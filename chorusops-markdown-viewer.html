<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChorusOps Markdown Viewer</title>
<style id="appcss">
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.6; background:#fff; color:#1f2328; }
header.bar { position:sticky; top:0; z-index:10; display:flex; gap:12px; align-items:center;
  padding:10px 16px; background:#f6f8fa; border-bottom:1px solid #d0d7de; }
header.bar h1 { font-size:15px; margin:0; font-weight:600; flex:0 0 auto; }
header.bar .fname { color:#57606a; font-size:13px; flex:1 1 auto;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
button { font:inherit; font-size:13px; padding:6px 12px; border:1px solid #d0d7de;
  border-radius:6px; background:#fff; color:#1f2328; cursor:pointer; }
button:hover { background:#f3f4f6; } button:disabled { opacity:.5; cursor:default; }
#drop { max-width:900px; margin:48px auto; padding:60px 24px; text-align:center;
  border:2px dashed #d0d7de; border-radius:12px; color:#57606a; cursor:pointer; }
#drop.hover { border-color:#0969da; background:rgba(9,105,218,.05); color:#0969da; }
#drop strong { display:block; font-size:18px; margin-bottom:6px; color:#1f2328; }
.md-wrap { max-width:900px; margin:0 auto; padding:32px 28px 80px; }
h1,h2,h3,h4,h5,h6 { font-weight:600; line-height:1.25; margin:1.4em 0 .6em; }
.md-wrap h1 { font-size:2em; border-bottom:1px solid #d0d7de; padding-bottom:.3em; }
.md-wrap h2 { font-size:1.5em; border-bottom:1px solid #d0d7de; padding-bottom:.3em; }
.md-wrap h3 { font-size:1.25em; }
p { margin:0 0 1em; } a { color:#0969da; text-decoration:none; } a:hover { text-decoration:underline; }
code { font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:85%;
  background:rgba(175,184,193,.2); padding:.2em .4em; border-radius:6px; }
pre { background:#f6f8fa; border-radius:8px; padding:14px 16px; overflow:auto; }
pre code { background:none; padding:0; font-size:90%; }
blockquote { margin:0 0 1em; padding:0 1em; color:#57606a; border-left:.25em solid #d0d7de; }
table { border-collapse:collapse; margin:0 0 1em; display:block; overflow:auto; }
th,td { border:1px solid #d0d7de; padding:6px 13px; } th { background:#f6f8fa; font-weight:600; }
tr:nth-child(2n) { background:#f6f8fa; }
ul,ol { margin:0 0 1em; padding-left:2em; } li { margin:.25em 0; }
li input[type=checkbox] { margin-right:.5em; }
hr { border:none; border-top:1px solid #d0d7de; margin:1.6em 0; } img { max-width:100%; }
@media (prefers-color-scheme: dark) {
  body { background:#0d1117; color:#e6edf3; }
  header.bar { background:#161b22; border-bottom-color:#30363d; }
  header.bar .fname { color:#8b949e; }
  button { background:#21262d; color:#e6edf3; border-color:#30363d; } button:hover { background:#30363d; }
  #drop { border-color:#30363d; color:#8b949e; } #drop strong { color:#e6edf3; }
  #drop.hover { border-color:#4493f8; color:#4493f8; }
  .md-wrap h1,.md-wrap h2 { border-bottom-color:#30363d; }
  a { color:#4493f8; } code { background:rgba(110,118,129,.4); } pre { background:#161b22; }
  blockquote { color:#8b949e; border-left-color:#30363d; }
  th,td { border-color:#30363d; } th,tr:nth-child(2n) { background:#161b22; } hr { border-color:#30363d; }
}

/* ---- Print / Save as PDF ---- */
@media print {
  /* Hide the app chrome so only the document prints */
  header.bar, #drop { display:none !important; }
  /* Force light theme on paper regardless of OS dark mode */
  body { background:#fff !important; color:#000 !important; }
  .md-wrap { max-width:none; margin:0; padding:0; }
  a { color:#000 !important; text-decoration:underline; }
  pre, code { background:#f2f2f2 !important; }
  blockquote { color:#333 !important; }
  th, tr:nth-child(2n) { background:#f2f2f2 !important; }
  /* Keep tables/borders visible when printing */
  th, td { border-color:#999 !important; }

  /* Page-break control */
  h1, h2, h3, h4, h5, h6 { break-after:avoid; break-inside:avoid;
    page-break-after:avoid; page-break-inside:avoid; }
  pre, blockquote, table, img, li { break-inside:avoid; page-break-inside:avoid; }
  tr, thead { break-inside:avoid; page-break-inside:avoid; }
  thead { display:table-header-group; }   /* repeat table headers across pages */
  p { orphans:3; widows:3; }               /* avoid single dangling lines */
}
@page { margin:0.6in; }
</style>
</head>
<body>
<header class="bar">
  <h1>ChorusOps Markdown Viewer</h1>
  <span class="fname" id="fname"></span>
  <button id="pdf" disabled title="Opens the print dialog — choose 'Save as PDF' as the destination">Save as PDF</button>
  <button id="word" disabled title="Downloads a Word-compatible .doc that opens in Microsoft Word">Save as Word</button>
  <button id="save" disabled>Save as .html</button>
  <button id="pick" onclick="document.getElementById('file').click()">Open file</button>
</header>
<input type="file" id="file" accept=".md,.markdown,.txt" style="display:none">
<div id="drop">
  <strong>Drop a Markdown file here</strong>
  or click to choose &middot; renders instantly in your browser
</div>
<div class="md-wrap" id="content" style="display:none"></div>

<script>
const marked = window.marked;
const DOMPurify = window.DOMPurify;
marked.setOptions({ gfm: true, breaks: false, headerIds: true, mangle: false });

const drop = document.getElementById('drop');
const wrap = document.getElementById('content');
const fname = document.getElementById('fname');
const saveBtn = document.getElementById('save');
const pdfBtn = document.getElementById('pdf');
const wordBtn = document.getElementById('word');
const fileInput = document.getElementById('file');
let currentName = 'document';

function render(text, name) {
  currentName = (name || 'document').replace(/\.(md|markdown|txt)$/i, '');
  const dirty = marked.parse(text);
  const clean = DOMPurify.sanitize(dirty);
  wrap.innerHTML = clean;
  wrap.style.display = 'block';
  drop.style.display = 'none';
  fname.textContent = name || '';
  saveBtn.disabled = false;
  pdfBtn.disabled = false;
  wordBtn.disabled = false;
  document.title = currentName + ' — ChorusOps Markdown Viewer';
}

function readFile(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = e => render(e.target.result, file.name);
  r.readAsText(file);
}

// Trigger a browser download of a Blob under a given filename.
function download(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

// Save the rendered view as a standalone .html (styles inlined).
saveBtn.addEventListener('click', () => {
  const css = document.getElementById('appcss').textContent;
  const html = '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">'
    + '<meta name="viewport" content="width=device-width, initial-scale=1">'
    + '<title>' + currentName + '</title><style>' + css + '</style></head>'
    + '<body><div class="md-wrap">' + wrap.innerHTML + '</div></body></html>';
  download(new Blob([html], { type: 'text/html' }), currentName + '.html');
});

// Save as Word — wraps the rendered HTML in the Microsoft Office XML namespace
// header so Word opens it natively (preserving headings, tables, bold/italic,
// lists). Zero-dependency: no library, works offline. Produces a .doc that Word
// can then re-save as .docx. A print-style CSS gives it clean margins in Word.
wordBtn.addEventListener('click', () => {
  const wordCss =
    'body{font-family:Calibri,\"Segoe UI\",Arial,sans-serif;font-size:11pt;color:#000;}'
    + 'h1{font-size:20pt;}h2{font-size:16pt;}h3{font-size:13pt;}'
    + 'h1,h2,h3,h4,h5,h6{font-family:\"Segoe UI Semibold\",Calibri,Arial,sans-serif;}'
    + 'table{border-collapse:collapse;}'
    + 'th,td{border:1px solid #999;padding:4px 8px;}th{background:#f2f2f2;}'
    + 'pre{background:#f2f2f2;padding:8px;border:1px solid #ddd;'
    + 'font-family:Consolas,\"Courier New\",monospace;white-space:pre-wrap;}'
    + 'code{font-family:Consolas,\"Courier New\",monospace;}'
    + 'blockquote{border-left:3px solid #ccc;margin-left:0;padding-left:12px;color:#555;}';
  const header =
    '<html xmlns:o=\"urn:schemas-microsoft-com:office:office\" '
    + 'xmlns:w=\"urn:schemas-microsoft-com:office:word\" '
    + 'xmlns=\"http://www.w3.org/TR/REC-html40\">'
    + '<head><meta charset=\"utf-8\"><title>' + currentName + '</title>'
    + '<!--[if gte mso 9]><xml><w:WordDocument>'
    + '<w:View>Print</w:View><w:Zoom>100</w:Zoom><w:DoNotOptimizeForBrowser/>'
    + '</w:WordDocument></xml><![endif]-->'
    + '<style>@page{margin:1in;}' + wordCss + '</style></head><body>';
  const footer = '</body></html>';
  const html = header + wrap.innerHTML + footer;
  // UTF-8 BOM so Word reads special characters correctly.
  const blob = new Blob(['﻿', html], { type: 'application/msword' });
  download(blob, currentName + '.doc');
});

// Save as PDF — uses the browser's print-to-PDF. The print stylesheet hides the
// header/drop zone and controls page breaks. document.title (set in render())
// becomes the default PDF filename.
pdfBtn.addEventListener('click', () => window.print());

// Drag & drop
['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.add('hover'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.remove('hover'); }));
drop.addEventListener('drop', e => { readFile(e.dataTransfer.files[0]); });
// Drop anywhere once a doc is loaded
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]); });
// Click to pick
drop.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => readFile(e.target.files[0]));
</script>
</body>
</html>
