<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KSI Tools Network Rules</title>
<style id="appcss">
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:15px; line-height:1.5; background:#fff; color:#1f2328; }
header.bar { position:sticky; top:0; z-index:20; display:flex; gap:8px; align-items:center; padding:10px 16px; background:#f6f8fa; border-bottom:1px solid #d0d7de; flex-wrap:wrap; }
header.bar h1 { font-size:15px; margin:0; font-weight:600; }
header.bar .fname { color:#57606a; font-size:13px; flex:1; min-width:60px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
header.bar .meta { color:#57606a; font-size:12px; }
button, select, input[type=text], textarea { font:inherit; font-size:13px; padding:6px 12px; border:1px solid #d0d7de; border-radius:6px; background:#fff; color:#1f2328; }
button { cursor:pointer; } button:hover { background:#f3f4f6; } button:disabled { opacity:.45; cursor:default; }
button.toggle-on { background:#0969da; color:#fff; border-color:#0969da; }
#search { width:180px; }
#drop { max-width:900px; margin:36px auto 16px; padding:48px 24px; text-align:center; border:2px dashed #d0d7de; border-radius:12px; color:#57606a; cursor:pointer; }
#drop.hover { border-color:#0969da; background:rgba(9,105,218,.05); color:#0969da; }
#drop strong { display:block; font-size:18px; margin-bottom:6px; color:#1f2328; }
.hint { color:#8b949e; font-size:12px; }
.table-wrap { overflow:auto; padding-bottom:60px; display:none; }
table.grid { border-collapse:collapse; width:100%; font-size:12.5px; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; }
.grid th { position:sticky; top:53px; background:#f6f8fa; text-align:left; padding:8px 10px; border-bottom:1px solid #d0d7de; white-space:nowrap; }
.grid td { padding:6px 10px; border-bottom:1px solid #f0f2f4; vertical-align:top; word-break:break-word; }
.grid tr:hover td { background:rgba(175,184,193,.12); }
.grid tr { cursor:pointer; }
.grid tr.selected td { background:rgba(9,105,218,.1); }
.badge { display:inline-block; font-size:10px; font-weight:600; padding:1px 7px; border-radius:999px; border:1px solid #d0d7de; margin-right:4px; }
.badge.bad { background:#ffebe9; border-color:#ff8182; color:#cf222e; }
.badge.warn { background:#fff8c5; border-color:#f0c000; color:#7a5c00; }
.badge.ok { background:#dafbe1; border-color:#4ac26b; color:#1a7f37; }
.badge.info { background:#ddf4ff; border-color:#54aeff; color:#0969da; }
.panel { max-width:1000px; margin:12px auto; padding:0 16px 40px; display:none; }
.panel.show { display:block; }
.card { border:1px solid #d0d7de; border-radius:10px; margin-bottom:12px; overflow:hidden; }
.card h2 { margin:0; padding:10px 14px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; background:#f6f8fa; border-bottom:1px solid #d0d7de; color:#57606a; }
.card .body { padding:12px 14px; }
pre.block, .mono { font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:12px; }
pre.block { margin:0; padding:10px 12px; background:#f6f8fa; border-radius:8px; white-space:pre-wrap; word-break:break-word; max-height:40vh; overflow:auto; }
table.kv { border-collapse:collapse; width:100%; font-size:12.5px; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; }
.kv td { padding:4px 8px; border-bottom:1px solid #f0f2f4; vertical-align:top; }
.kv td.key { color:#0550ae; width:1%; white-space:nowrap; font-weight:600; }
.paste-box { max-width:900px; margin:0 auto 20px; padding:0 16px; }
.paste-box label { display:block; font-size:13px; color:#57606a; margin-bottom:6px; }
#paste, .tarea { width:100%; min-height:100px; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:12.5px; padding:10px; border:1px solid #d0d7de; border-radius:8px; resize:vertical; }
#notice { padding:7px 16px; font-size:12.5px; background:#fff8c5; color:#7a5c00; border-bottom:1px solid #f0c000; display:none; }
#err { max-width:900px; margin:24px auto; padding:16px 20px; border:1px solid #cf222e; border-radius:10px; background:rgba(207,34,46,.06); color:#cf222e; font-family:ui-monospace,monospace; font-size:13px; white-space:pre-wrap; display:none; }
#loading { position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px; background:rgba(255,255,255,.72); color:#57606a; }
#loading.show { display:flex; }
.spinner { width:38px; height:38px; border:4px solid #d0d7de; border-top-color:#0969da; border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.tree { font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:13px; line-height:1.6; padding:16px 20px 80px; }
.node { margin-left:0; }
.node > .line { padding:2px 0; cursor:default; }
.toggle { cursor:pointer; color:#57606a; margin-right:4px; user-select:none; }
.children { margin-left:1.4em; border-left:1px solid #eaeef2; padding-left:10px; }
.node.collapsed > .children { display:none; }
.k { color:#0550ae; } .s { color:#0a7d24; } .p { color:#57606a; }
@media (prefers-color-scheme: dark) {
  body { background:#0d1117; color:#e6edf3; }
  header.bar { background:#161b22; border-bottom-color:#30363d; }
  header.bar .fname, header.bar .meta, .hint, .paste-box label { color:#8b949e; }
  button, select, input[type=text], textarea, #paste, .tarea { background:#21262d; color:#e6edf3; border-color:#30363d; }
  button:hover { background:#30363d; }
  button.toggle-on { background:#1f6feb; border-color:#1f6feb; }
  #drop { border-color:#30363d; color:#8b949e; } #drop strong { color:#e6edf3; }
  #drop.hover { border-color:#4493f8; color:#4493f8; }
  .grid th { background:#161b22; border-bottom-color:#30363d; }
  .grid td, .kv td { border-bottom-color:#21262d; }
  .grid tr:hover td { background:rgba(110,118,129,.12); }
  .grid tr.selected td { background:rgba(31,111,235,.2); }
  .badge { border-color:#30363d; }
  .badge.bad { background:#3d1418; border-color:#f85149; color:#ff7b72; }
  .badge.warn { background:#3a2f00; border-color:#b58900; color:#e3b341; }
  .badge.ok { background:#12261e; border-color:#238636; color:#3fb950; }
  .badge.info { background:#121d2f; border-color:#1f6feb; color:#58a6ff; }
  .card { border-color:#30363d; }
  .card h2 { background:#161b22; border-bottom-color:#30363d; color:#8b949e; }
  pre.block { background:#161b22; }
  .kv td.key { color:#79c0ff; }
  .children { border-left-color:#30363d; }
  .k { color:#79c0ff; } .s { color:#7ee787; } .p { color:#8b949e; }
  #notice { background:#3a2f00; color:#e3b341; border-bottom-color:#b58900; }
  #err { border-color:#f85149; color:#ff7b72; background:rgba(248,81,73,.08); }
  #loading { background:rgba(13,17,23,.75); }
  .spinner { border-color:#30363d; border-top-color:#4493f8; }
}

.stats{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px;padding:0 16px}
.stat{border:1px solid #d0d7de;border-radius:8px;padding:8px 12px;font-size:12.5px;background:#f6f8fa}
.stat b{display:block;font-size:16px}
.sheetbar{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px;border-bottom:1px solid #d0d7de}
.sheetbar button.active{background:#0969da;color:#fff;border-color:#0969da}
.detail{max-width:1100px;margin:12px auto;padding:0 16px 40px}
@media(prefers-color-scheme:dark){
  .stat{background:#161b22;border-color:#30363d}
  .sheetbar{border-bottom-color:#30363d}
  .sheetbar button.active{background:#1f6feb;border-color:#1f6feb}
}
</style>
</head>
<body>

<header class="bar">
  <h1>KSI Tools Network Rules</h1>
  <span class="fname" id="fname"></span>
  <span class="meta" id="meta"></span>
  <input type="text" id="search" placeholder="Filter CIDR / port / SG…" disabled>
  <select id="dirFilter" disabled>
    <option value="">All directions</option>
    <option value="ingress">Ingress</option>
    <option value="egress">Egress</option>
  </select>
  <button id="copy" disabled>Copy summary</button>
  <button id="savecsv" disabled>Save .csv</button>
  <button id="savejson" disabled>Save .json</button>
  <button id="pick" onclick="document.getElementById('file').click()">Open file</button>
</header>
<input type="file" id="file" accept=".json,.txt,application/json" style="display:none">
<div id="drop"><strong>Drop Security Group / NSG / NACL JSON</strong>
  <div class="hint" style="margin-top:10px">AWS describe-security-groups, describe-network-acls, Azure NSG exports. Local table flattening.</div></div>
<div class="paste-box"><label>Or paste JSON:</label>
<textarea id="paste" class="tarea" placeholder='{"SecurityGroups":[...]}'></textarea>
<div style="margin-top:8px"><button id="goBtn">Analyze paste</button></div></div>
<div id="err"></div><div id="notice"></div>
<div class="stats" id="stats"></div>
<div class="table-wrap" id="tablewrap" style="display:none">
<table class="grid"><thead><tr><th>Group</th><th>Dir</th><th>Proto</th><th>Ports</th><th>Source / Dest</th><th>Flags</th><th>Description</th></tr></thead><tbody id="tbody"></tbody></table>
</div>
<div id="loading"><div class="spinner"></div><div id="loadingmsg">Loading…</div></div>


<script>

function showLoading(m){loadingMsg.textContent=m||'Loading…';loadingEl.classList.add('show');}
function hideLoading(){loadingEl.classList.remove('show');}
function afterPaint(fn){requestAnimationFrame(()=>requestAnimationFrame(fn));}
function showError(m){errBox.style.display='block';errBox.textContent=m;}
function clearError(){errBox.style.display='none';}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type||'text/plain'}));a.download=name;a.click();URL.revokeObjectURL(a.href);}
function csvEsc(v){const s=String(v??'');return /["\n,]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function wireDrop(loadFn){
  if(drop) drop.onclick=()=>fileInput.click();
  fileInput.onchange=()=>{if(fileInput.files[0])loadFn(fileInput.files[0]);fileInput.value='';};
  if(drop){
    ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('hover');}));
    ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('hover');}));
    drop.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)loadFn(f);});
  }
  document.addEventListener('dragover',e=>e.preventDefault());
  document.addEventListener('drop',e=>{if(e.target.closest&&e.target.closest('#drop'))return;e.preventDefault();const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f)loadFn(f);});
}
function arr(x){if(x==null)return[]; return Array.isArray(x)?x:[x];}
function asYamlOrJson(text){
  text=text.trim();
  if(!text) throw new Error('Empty input');
  if(text.startsWith('{')||text.startsWith('[')) return JSON.parse(text);
  if(typeof jsyaml!=='undefined') return jsyaml.load(text);
  throw new Error('YAML requires embedded js-yaml');
}

const drop=document.getElementById('drop'), errBox=document.getElementById('err'), noticeEl=document.getElementById('notice');
const fname=document.getElementById('fname'), metaEl=document.getElementById('meta'), pasteEl=document.getElementById('paste');
const fileInput=document.getElementById('file'), searchIn=document.getElementById('search'), dirFilter=document.getElementById('dirFilter');
const loadingEl=document.getElementById('loading'), loadingMsg=document.getElementById('loadingmsg');
const tbody=document.getElementById('tbody'), tableWrap=document.getElementById('tablewrap'), statsEl=document.getElementById('stats');
const btns={copy:document.getElementById('copy'), savecsv:document.getElementById('savecsv'), savejson:document.getElementById('savejson')};
let rows=[], currentName='network-rules', format='';
const MAX_BYTES=50*1024*1024, MAX_RENDER=10000;
function portRange(from,to){
  if(from==null && to==null) return 'all';
  if(from==-1||to==-1) return 'all';
  if(from==null) return String(to);
  if(to==null||from===to) return String(from);
  return from+'-'+to;
}
function flagsFor(cidr, proto, ports){
  const flags=[];
  if(cidr==='0.0.0.0/0'||cidr==='::/0'||cidr==='*') flags.push({t:'bad',l:'open world'});
  if((ports==='all'||ports==='0-65535'||ports==='1-65535') && (cidr==='0.0.0.0/0'||cidr==='::/0')) flags.push({t:'bad',l:'all ports public'});
  if(String(ports).includes('22')||ports==='22') flags.push({t:'warn',l:'ssh'});
  if(String(ports).includes('3389')) flags.push({t:'warn',l:'rdp'});
  if(String(ports).includes('445')) flags.push({t:'warn',l:'smb'});
  return flags;
}
function flattenAwsSG(data){
  const groups=data.SecurityGroups||data.securityGroups||(Array.isArray(data)?data:[data]);
  const out=[];
  for(const g of groups){
    const name=g.GroupName||g.GroupId||g.groupId||'?';
    const gid=g.GroupId||'';
    for(const dir of [['ingress', g.IpPermissions||g.ipPermissions||[]],['egress', g.IpPermissionsEgress||g.ipPermissionsEgress||[]]]){
      for(const p of dir[1]||[]){
        const proto=p.IpProtocol||p.ipProtocol||'';
        const ports=portRange(p.FromPort??p.fromPort, p.ToPort??p.toPort);
        const pr=proto==='-1'?'all':proto;
        const pairs=[];
        for(const r of (p.IpRanges||p.ipRanges||[])) pairs.push({cidr:r.CidrIp||r.cidrIp||'', desc:r.Description||r.description||''});
        for(const r of (p.Ipv6Ranges||p.ipv6Ranges||[])) pairs.push({cidr:r.CidrIpv6||r.cidrIpv6||'', desc:r.Description||''});
        for(const r of (p.UserIdGroupPairs||p.userIdGroupPairs||[])) pairs.push({cidr:'sg:'+(r.GroupId||r.groupId||''), desc:r.Description||''});
        for(const r of (p.PrefixListIds||[])) pairs.push({cidr:'pl:'+(r.PrefixListId||''), desc:r.Description||''});
        if(!pairs.length) pairs.push({cidr:'(none)', desc:''});
        for(const x of pairs){
          out.push({group:name+(gid?(' ('+gid+')'):''), dir:dir[0], proto:pr, ports, source:x.cidr, desc:x.desc, flags:flagsFor(x.cidr,pr,ports), format:'aws-sg'});
        }
      }
    }
  }
  return out;
}
function flattenAwsNACL(data){
  const acls=data.NetworkAcls||(Array.isArray(data)?data:[data]);
  const out=[];
  for(const a of acls){
    const id=a.NetworkAclId||'?';
    for(const e of (a.Entries||[])){
      const dir=e.Egress?'egress':'ingress';
      const ports=e.PortRange?portRange(e.PortRange.From,e.PortRange.To):(e.Protocol==='-1'?'all':'—');
      const proto=e.Protocol==='-1'?'all':e.Protocol;
      const cidr=e.CidrBlock||e.Ipv6CidrBlock||'';
      const flags=flagsFor(cidr,proto,ports);
      if(e.RuleAction==='deny') flags.push({t:'info',l:'deny'});
      out.push({group:id+' #'+e.RuleNumber, dir, proto, ports, source:cidr, desc:e.RuleAction||'', flags, format:'aws-nacl'});
    }
  }
  return out;
}
function flattenAzureNSG(data){
  // ARM NSG or list of securityRules
  let rules=[];
  let name='nsg';
  if(data.properties&&data.properties.securityRules){ rules=data.properties.securityRules; name=data.name||name; }
  else if(data.securityRules){ rules=data.securityRules; name=data.name||name; }
  else if(Array.isArray(data.value)){
    const out=[]; for(const n of data.value) out.push(...flattenAzureNSG(n)); return out;
  } else if(Array.isArray(data)){
    const out=[]; for(const n of data) out.push(...flattenAzureNSG(n)); return out;
  } else if(data.direction||data.properties&&data.properties.direction){ rules=[data]; }
  const out=[];
  for(const r of rules){
    const p=r.properties||r;
    const dir=String(p.direction||'').toLowerCase();
    const proto=p.protocol||'*';
    const ports=p.destinationPortRange||(arr(p.destinationPortRanges).join(','))||'*';
    const source=p.sourceAddressPrefix||arr(p.sourceAddressPrefixes).join(',')||p.destinationAddressPrefix||'';
    const flags=flagsFor(source==='*'||source==='Internet'?'0.0.0.0/0':source, proto, ports);
    if(String(p.access).toLowerCase()==='deny') flags.push({t:'info',l:'deny'});
    out.push({group:(r.name||name), dir:dir.includes('in')?'ingress':'egress', proto, ports:String(ports), source:String(source), desc:p.description||p.access||'', flags, format:'azure-nsg'});
  }
  return out;
}
function detectAndFlatten(data){
  if(data.SecurityGroups||(Array.isArray(data)&&data[0]&&(data[0].IpPermissions||data[0].GroupId))) { format='aws-sg'; return flattenAwsSG(data); }
  if(data.NetworkAcls||(Array.isArray(data)&&data[0]&&data[0].Entries&&data[0].NetworkAclId)) { format='aws-nacl'; return flattenAwsNACL(data); }
  if(data.properties&&data.properties.securityRules || data.securityRules || (data.value&&data.value[0]&&data.value[0].properties)) { format='azure-nsg'; return flattenAzureNSG(data); }
  // try SG first
  try{ const r=flattenAwsSG(data); if(r.length){format='aws-sg'; return r;} }catch(e){}
  try{ const r=flattenAzureNSG(data); if(r.length){format='azure-nsg'; return r;} }catch(e){}
  throw new Error('Unrecognized network rules JSON. Expected AWS SecurityGroups, NetworkAcls, or Azure NSG.');
}
function draw(){
  const q=searchIn.value.trim().toLowerCase();
  const d=dirFilter.value;
  const list=rows.filter(r=>{
    if(d && r.dir!==d) return false;
    if(!q) return true;
    return (r.group+' '+r.proto+' '+r.ports+' '+r.source+' '+r.desc).toLowerCase().includes(q);
  });
  const drawList=list.slice(0,MAX_RENDER);
  tbody.innerHTML='';
  for(const r of drawList){
    const tr=document.createElement('tr');
    if(r.flags.some(f=>f.t==='bad')) tr.style.background='rgba(207,34,46,.06)';
    const fl=r.flags.map(f=>`<span class="badge ${f.t}">${esc(f.l)}</span>`).join(' ')||'—';
    tr.innerHTML=`<td>${esc(r.group)}</td><td>${esc(r.dir)}</td><td>${esc(r.proto)}</td><td>${esc(r.ports)}</td><td>${esc(r.source)}</td><td>${fl}</td><td>${esc(r.desc)}</td>`;
    tbody.appendChild(tr);
  }
  const open=list.filter(r=>r.flags.some(f=>f.l.includes('open world'))).length;
  metaEl.textContent=list.length+' rules · '+format+(open?' · '+open+' world-open':'');
  noticeEl.style.display=list.length>MAX_RENDER?'block':'none';
  if(list.length>MAX_RENDER) noticeEl.textContent='Showing first '+MAX_RENDER+' rows.';
}
function render(text,name){
  showLoading('Parsing rules…');
  afterPaint(()=>{
    try{
      const data=JSON.parse(text);
      rows=detectAndFlatten(data);
      currentName=(name||'network-rules').replace(/\.(json|txt)$/i,'');
      fname.textContent=name||'(paste)'; document.title=currentName+' — KSI Tools Network Rules';
      drop.style.display='none'; tableWrap.style.display='block'; clearError();
      searchIn.disabled=false; dirFilter.disabled=false; Object.values(btns).forEach(b=>b.disabled=false);
      const open=rows.filter(r=>r.flags.some(f=>f.t==='bad')).length;
      statsEl.innerHTML=`<div class="stat"><b>${rows.length}</b>rules</div><div class="stat"><b>${open}</b>risky flags</div><div class="stat"><b>${format}</b>format</div>`;
      noticeEl.style.display='block';
      noticeEl.textContent='Heuristic risk flags only (0.0.0.0/0, SSH/RDP). Not a live cloud evaluation.';
      draw();
    }catch(e){showError(e.message||String(e));}
    hideLoading();
  });
}
function loadFile(file){if(!file)return;if(file.size>MAX_BYTES){showError('Too large');return;}const r=new FileReader();r.onload=()=>render(String(r.result||''),file.name);r.readAsText(file);}
wireDrop(loadFile);
document.getElementById('goBtn').onclick=()=>render(pasteEl.value,'(paste)');
searchIn.oninput=draw; dirFilter.onchange=draw;
function filtered(){const q=searchIn.value.trim().toLowerCase();const d=dirFilter.value;return rows.filter(r=>(!d||r.dir===d)&&(!q||(r.group+' '+r.proto+' '+r.ports+' '+r.source).toLowerCase().includes(q)));}
btns.copy.onclick=async()=>navigator.clipboard.writeText(JSON.stringify(filtered(),null,2));
btns.savejson.onclick=()=>download(currentName+'.json', JSON.stringify(filtered(),null,2),'application/json');
btns.savecsv.onclick=()=>{
  const keys=['group','dir','proto','ports','source','desc'];
  const lines=[keys.join(',')].concat(filtered().map(r=>keys.map(k=>csvEsc(r[k])).join(',')));
  download(currentName+'.csv', lines.join('\n'),'text/csv');
};

</script>
</body>
</html>
