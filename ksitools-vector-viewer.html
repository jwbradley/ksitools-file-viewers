<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KSI Tools Vector Config Viewer</title>
<style id="appcss">
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:15px; line-height:1.5; background:#fff; color:#1f2328; }
header.bar { position:sticky; top:0; z-index:20; display:flex; gap:8px; align-items:center; padding:10px 16px; background:#f6f8fa; border-bottom:1px solid #d0d7de; flex-wrap:wrap; }
header.bar h1 { font-size:15px; margin:0; font-weight:600; }
header.bar .fname { color:#57606a; font-size:13px; flex:1; min-width:60px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
header.bar .meta { color:#57606a; font-size:12px; }
button, select, input[type=text], textarea { font:inherit; font-size:13px; padding:6px 12px; border:1px solid #d0d7de; border-radius:6px; background:#fff; color:#1f2328; }
button { cursor:pointer; } button:hover { background:#f3f4f6; } button:disabled { opacity:.45; cursor:default; }
#search { width:200px; }
#drop { max-width:900px; margin:36px auto 16px; padding:48px 24px; text-align:center; border:2px dashed #d0d7de; border-radius:12px; color:#57606a; cursor:pointer; }
#drop.hover { border-color:#0969da; background:rgba(9,105,218,.05); color:#0969da; }
#drop strong { display:block; font-size:18px; margin-bottom:6px; color:#1f2328; }
.hint { color:#8b949e; font-size:12px; }
.paste-box { max-width:900px; margin:0 auto 20px; padding:0 16px; }
.paste-box label { display:block; font-size:13px; color:#57606a; margin-bottom:6px; }
#paste, .tarea { width:100%; min-height:110px; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:12.5px; padding:10px; border:1px solid #d0d7de; border-radius:8px; resize:vertical; }
#notice { padding:7px 16px; font-size:12.5px; background:#fff8c5; color:#7a5c00; border-bottom:1px solid #f0c000; display:none; }
#err { max-width:900px; margin:24px auto; padding:16px 20px; border:1px solid #cf222e; border-radius:10px; background:rgba(207,34,46,.06); color:#cf222e; font-family:ui-monospace,monospace; font-size:13px; white-space:pre-wrap; display:none; }
#loading { position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px; background:rgba(255,255,255,.72); color:#57606a; }
#loading.show { display:flex; }
.spinner { width:38px; height:38px; border:4px solid #d0d7de; border-top-color:#0969da; border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

.badge { display:inline-block; font-size:10px; font-weight:600; padding:1px 7px; border-radius:999px; border:1px solid #d0d7de; margin-right:4px; margin-bottom:4px; }
.badge.bad { background:#ffebe9; border-color:#ff8182; color:#cf222e; }
.badge.warn { background:#fff8c5; border-color:#f0c000; color:#7a5c00; }
.badge.ok { background:#dafbe1; border-color:#4ac26b; color:#1a7f37; }
.badge.info { background:#ddf4ff; border-color:#54aeff; color:#0969da; }

.stats { display:none; flex-wrap:wrap; gap:8px; margin:8px 0 12px; padding:0 16px; }
.stat { border:1px solid #d0d7de; border-radius:8px; padding:8px 12px; font-size:12.5px; background:#f6f8fa; min-width:120px; max-width:320px; }
.stat b { display:block; font-size:14px; word-break:break-word; }
.stat .lbl { color:#57606a; font-size:11px; text-transform:uppercase; letter-spacing:.03em; }

.panel { max-width:1100px; margin:12px auto; padding:0 16px 40px; display:none; }
.panel.show { display:block; }
.card { border:1px solid #d0d7de; border-radius:10px; margin-bottom:12px; overflow:hidden; }
.card h2 { margin:0; padding:10px 14px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; background:#f6f8fa; border-bottom:1px solid #d0d7de; color:#57606a; }
.card .body { padding:12px 14px; }
.flags-row { display:flex; flex-wrap:wrap; gap:4px; align-items:center; }

table.grid { border-collapse:collapse; width:100%; font-size:12.5px; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; }
.grid th { position:sticky; top:53px; background:#f6f8fa; text-align:left; padding:8px 10px; border-bottom:1px solid #d0d7de; white-space:nowrap; z-index:5; }
.grid td { padding:6px 10px; border-bottom:1px solid #f0f2f4; vertical-align:top; word-break:break-word; }
.grid tr:hover td { background:rgba(175,184,193,.12); }
.grid tr { cursor:pointer; }
.grid tr.selected td { background:rgba(9,105,218,.1); }
.grid td.key { color:#0550ae; font-weight:600; white-space:nowrap; width:1%; }
.grid td.sec { color:#57606a; white-space:nowrap; width:1%; }
.grid td.ln { color:#8b949e; width:1%; text-align:right; font-variant-numeric:tabular-nums; }
.grid td.typ { color:#0550ae; white-space:nowrap; width:1%; }
.grid td.unref { opacity:.6; }

pre.block { margin:0; padding:10px 12px; background:#f6f8fa; border-radius:8px; white-space:pre-wrap; word-break:break-word; max-height:28vh; overflow:auto; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:12px; }
.ctx-line { display:block; padding:1px 4px; border-radius:3px; }
.ctx-line.cur { background:rgba(9,105,218,.15); font-weight:600; }
.hit { background:#fff3c4; border-radius:3px; box-shadow:0 0 0 1px #f0c000; }

.comp-list { display:flex; flex-direction:column; gap:6px; }
.comp-row { display:flex; gap:8px; align-items:flex-start; padding:6px 8px; border:1px solid #d0d7de; border-radius:6px; flex-wrap:wrap; }
.comp-row.unref { background:rgba(240,192,0,.08); border-color:#f0c000; }
.comp-row.dangling { background:rgba(207,34,46,.06); border-color:#ff8182; }
.comp-row .cname { font-weight:600; color:#0550ae; min-width:140px; }
.comp-row .ctype { font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:11px; color:#57606a; background:#f6f8fa; padding:1px 6px; border-radius:4px; }
.comp-row .cdetail { flex:1; font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:11.5px; color:#57606a; word-break:break-word; min-width:200px; }
.comp-row .cedges { display:flex; flex-wrap:wrap; gap:4px; align-items:center; }
.comp-row .clabel { font-size:10px; text-transform:uppercase; letter-spacing:.03em; color:#8b949e; }
.dag-arrow { color:#8b949e; padding:0 2px; }
.badge.missing { background:#ffebe9; border-color:#ff8182; color:#cf222e; }
.badge.dead { background:#fff8c5; border-color:#f0c000; color:#7a5c00; }
.masked { font-family:"Cascadia Code","Consolas",ui-monospace,monospace; color:#8b949e; }

@media (prefers-color-scheme: dark) {
  body { background:#0d1117; color:#e6edf3; }
  header.bar { background:#161b22; border-bottom-color:#30363d; }
  header.bar .fname, header.bar .meta, .hint, .paste-box label, .stat .lbl, .clabel { color:#8b949e; }
  button, select, input[type=text], textarea, #paste, .tarea { background:#21262d; color:#e6edf3; border-color:#30363d; }
  button:hover { background:#30363d; }
  #drop { border-color:#30363d; color:#8b949e; } #drop strong { color:#e6edf3; }
  #drop.hover { border-color:#4493f8; color:#4493f8; }
  .stat { background:#161b22; border-color:#30363d; }
  .card { border-color:#30363d; }
  .card h2 { background:#161b22; border-bottom-color:#30363d; color:#8b949e; }
  .grid th { background:#161b22; border-bottom-color:#30363d; }
  .grid td { border-bottom-color:#21262d; }
  .grid tr:hover td { background:rgba(110,118,129,.12); }
  .grid tr.selected td { background:rgba(31,111,235,.2); }
  .grid td.key, .grid td.typ { color:#79c0ff; }
  .grid td.sec { color:#8b949e; }
  .grid td.ln { color:#6e7681; }
  .badge { border-color:#30363d; }
  .badge.bad { background:#3d1418; border-color:#f85149; color:#ff7b72; }
  .badge.warn { background:#3a2f00; border-color:#b58900; color:#e3b341; }
  .badge.ok { background:#12261e; border-color:#238636; color:#3fb950; }
  .badge.info { background:#121d2f; border-color:#1f6feb; color:#58a6ff; }
  pre.block { background:#161b22; }
  .ctx-line.cur { background:rgba(31,111,235,.25); }
  .hit { background:#634c00; color:#ffe08a; box-shadow:0 0 0 1px #b58900; }
  #notice { background:#3a2f00; color:#e3b341; border-bottom-color:#b58900; }
  #err { border-color:#f85149; color:#ff7b72; background:rgba(248,81,73,.08); }
  #loading { background:rgba(13,17,23,.75); }
  .spinner { border-color:#30363d; border-top-color:#4493f8; }
  .comp-row { border-color:#30363d; }
  .comp-row.unref { background:rgba(181,137,0,.1); border-color:#b58900; }
  .comp-row.dangling { background:rgba(248,81,73,.08); border-color:#f85149; }
  .comp-row .cname { color:#79c0ff; }
  .comp-row .ctype { background:#161b22; color:#8b949e; }
  .comp-row .cdetail { color:#8b949e; }
  .dag-arrow { color:#8b949e; }
  .badge.missing { background:#3d1418; border-color:#f85149; color:#ff7b72; }
  .badge.dead { background:#3a2f00; border-color:#b58900; color:#e3b341; }
  .masked { color:#8b949e; }
}
</style>
</head>
<body>

<header class="bar">
  <h1>KSI Tools Vector Config Viewer</h1>
  <span class="fname" id="fname"></span>
  <span class="meta" id="meta"></span>
  <input type="text" id="search" placeholder="Filter section / name / type / detail…" disabled>
  <button id="copy" disabled title="Copy a plain-English summary">Copy summary</button>
  <button id="savejson" disabled>Save .json</button>
  <button id="pick" onclick="document.getElementById('file').click()">Open file</button>
</header>
<input type="file" id="file" accept=".yaml,.yml,.toml,text/yaml,application/yaml,text/plain" style="display:none">

<div id="drop">
  <strong>Drop a Vector config here</strong>
  or click to choose · vector.yaml · vector.toml · .yaml · .yml · .toml
  <div class="hint" style="margin-top:10px">Parsed locally for ops review. Nothing is uploaded.</div>
</div>

<div class="paste-box">
  <label for="paste">Or paste Vector config:</label>
  <textarea id="paste" class="tarea" spellcheck="false" placeholder="sources:&#10;  my_logs:&#10;    type: file&#10;    include: [&#34;/var/log/*.log&#34;]&#10;&#10;transforms:&#10;  parse_json:&#10;    type: remap&#10;    inputs: [&#34;my_logs&#34;]&#10;    source: |&#10;      . = parse_json!(.message)&#10;&#10;sinks:&#10;  es:&#10;    type: elasticsearch&#10;    inputs: [&#34;parse_json&#34;]&#10;    endpoint: https://es.example.com"></textarea>
  <div style="margin-top:8px"><button id="goBtn">Analyze paste</button></div>
</div>

<div id="err"></div>
<div id="notice"></div>
<div class="stats" id="stats"></div>
<div class="panel" id="panel"></div>

<div id="loading"><div class="spinner"></div><div id="loadingmsg">Loading…</div></div>

    if (!k) err('expected key');
    return k;
  }
  function parseValue() {
    skipWs();
    const c = s[i];
    if (c === '"' || c === "'") return parseString();
    if (c === '[') return parseArray();
    if (c === '{') return parseInline();
    if (s.slice(i, i+4) === 'true') { i += 4; return true; }
    if (s.slice(i, i+5) === 'false') { i += 5; return false; }
    let v = '';
    while (i < n && s[i] !== '\n' && s[i] !== '\r' && s[i] !== '#' && s[i] !== ',' && s[i] !== ']') { v += s[i]; i++; }
    v = v.trim();
    if (v === '') err('expected value');
    if (/^[+-]?\d+$/.test(v)) return parseInt(v, 10);
    if (/^[+-]?\d+\.\d+([eE][+-]?\d+)?$/.test(v)) return parseFloat(v);
    return v;
  }
  function parseArray() {
    i++; const arr = [];
    while (true) {
      skipWsNl(); skipComment(); skipWsNl();
      if (i >= n) err('unterminated array');
      if (s[i] === ']') { i++; break; }
      arr.push(parseValue());
      skipWsNl(); skipComment(); skipWsNl();
      if (s[i] === ',') { i++; continue; }
      if (s[i] === ']') { i++; break; }
      err('expected , or ]');
    }
    return arr;
  }
  function parseInline() {
    i++; const o = {};
    while (true) {
      skipWs();
      if (s[i] === '}') { i++; break; }
      const k = parseKey(); skipWs();
      if (s[i] !== '=') err('expected = in inline table');
      i++; o[k] = parseValue();
      skipWs();
      if (s[i] === ',') { i++; continue; }
      if (s[i] === '}') { i++; break; }
      err('expected , or }');
    }
    return o;
  }
  function nav(parts) {
    let o = root;
    for (const p of parts) {
      if (typeof o[p] !== 'object' || o[p] === null || Array.isArray(o[p])) o[p] = {};
      o = o[p];
    }
    return o;
  }
  while (true) {
    skipWsNl(); skipComment();
    if (i >= n) break;
    if (s[i] === '[') {
      let aot = false;
      i++;
      if (s[i] === '[') { i++; aot = true; }
      skipWs();
      const parts = [parseKey()];
      skipWs();
      while (s[i] === '.') { i++; skipWs(); parts.push(parseKey()); skipWs(); }
      if (s[i] !== ']') err('expected ]');
      i++;
      if (aot) {
        if (s[i] !== ']') err('expected ]]');
        i++;
        let o = root;
        for (let k = 0; k < parts.length; k++) {
          if (k === parts.length - 1) {
            if (!Array.isArray(o[parts[k]])) o[parts[k]] = [];
            const item = {}; o[parts[k]].push(item); o = item;
          } else {
            const v = o[parts[k]];
            if (Array.isArray(v)) o = v[v.length - 1];
            else { if (typeof v !== 'object' || v === null) o[parts[k]] = {}; o = o[parts[k]]; }
          }
        }
        cur = o;
      } else {
        cur = nav(parts);
      }
      eol();
      continue;
    }
    const k = parseKey();
    skipWs();
    if (s[i] !== '=') err('expected =');
    i++; skipWs();
    cur[k] = parseValue();
    eol();
  }
  return root;
}

/** Best-effort: find the line where a top-level or nested key is declared. */
function findLine(section, name) {
  const escName = String(name).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const escSec = String(section).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  let inSec = false;
  for (let i = 0; i < rawLines.length; i++) {
    const raw = rawLines[i];
    const t = raw.replace(/\s+$/, '');
    const indent = t.match(/^\s*/)[0].length;
    const stripped = t.trim();
    if (stripped.startsWith('#')) continue;
    if (indent === 0 && new RegExp('^' + escSec + '\\s*:?\\s*$').test(stripped)) { inSec = true; continue; }
    if (inSec) {
      if (indent === 0 && /[A-Za-z0-9_-]+\s*[:=]/.test(stripped)) { inSec = false; continue; }
      const m = new RegExp('^(\\s+)(' + escName + ')\\s*[:=]').exec(raw);
      if (m) return i + 1;
    }
  }
  return null;
}

function summarizeComponent(name, typ, cfg) {
  if (cfg === null || cfg === undefined) return '(no config)';
  if (typeof cfg !== 'object') return String(cfg);
  const parts = [];
  if (cfg.endpoint) parts.push('endpoint=' + cfg.endpoint);
  if (cfg.include) parts.push('include=' + (Array.isArray(cfg.include) ? cfg.include.slice(0,2).join(',') : cfg.include));
  if (cfg.exclude) parts.push('exclude');
  if (cfg.condition) parts.push('condition=' + String(cfg.condition).slice(0, 60));
  if (cfg.source) parts.push('source=' + String(cfg.source).replace(/\s+/g, ' ').slice(0, 60) + '…');
  if (cfg.mode) parts.push('mode=' + cfg.mode);
  if (cfg.encoding) {
    if (typeof cfg.encoding === 'object' && cfg.encoding.codec) parts.push('encoding.codec=' + cfg.encoding.codec);
    else parts.push('encoding=' + cfg.encoding);
  }
  if (cfg.batch) {
    if (typeof cfg.batch === 'object') {
      if (cfg.batch.max_bytes) parts.push('batch.max_bytes=' + cfg.batch.max_bytes);
      if (cfg.batch.timeout_secs) parts.push('batch.timeout=' + cfg.batch.timeout_secs + 's');
    }
  }
  if (cfg.buffer) {
    if (typeof cfg.buffer === 'object' && cfg.buffer.type) parts.push('buffer.type=' + cfg.buffer.type);
  }
  if (cfg.tls) {
    if (typeof cfg.tls === 'object') {
      if (cfg.tls.verify_certificate === false) parts.push('tls.verify_certificate=false');
      if (cfg.tls.verify_hostname === false) parts.push('tls.verify_hostname=false');
      if (cfg.tls.ca_file) parts.push('tls.ca_file');
    }
  }
  if (cfg.auth) parts.push('auth');
  if (cfg.headers) {
    const hk = Object.keys(cfg.headers);
    if (hk.length) parts.push('headers=[' + hk.slice(0,4).join(',') + (hk.length > 4 ? ',…' : '') + ']');
  }
  if (cfg.topic) parts.push('topic=' + cfg.topic);
  if (cfg.index) parts.push('index=' + cfg.index);
  if (cfg.topics) parts.push('topics=' + (Array.isArray(cfg.topics) ? cfg.topics.join(',') : cfg.topics));
  if (cfg.compression) parts.push('compression=' + cfg.compression);
  if (cfg.healthcheck) parts.push('healthcheck=' + (typeof cfg.healthcheck === 'object' ? (cfg.healthcheck.enabled === false ? 'disabled' : 'enabled') : cfg.healthcheck));
  if (!parts.length) {
    const ks = Object.keys(cfg);
    if (ks.length) parts.push('keys=[' + ks.slice(0,6).join(',') + (ks.length > 6 ? ',…' : '') + ']');
  }
  return parts.join(' ');
}

function collectComponents(doc) {
  const out = { sources: [], transforms: [], sinks: [] };
  for (const cat of CATEGORIES) {
    const map = (doc && doc[cat] && typeof doc[cat] === 'object') ? doc[cat] : {};
    for (const [name, cfg] of Object.entries(map || {})) {
      const c = (cfg && typeof cfg === 'object') ? cfg : {};
      const typ = c.type || '(no type)';
      out[cat].push({
        name,
        type: typ,
        cfg: c,
        inputs: Array.isArray(c.inputs) ? c.inputs.slice() : [],
        detail: summarizeComponent(name, typ, c),
        line: findLine(cat, name)
      });
    }
  }
  return out;
}

/** Walk a component config and collect secret-key hits and TLS-insecure hits. */
function scanComponent(cat, name, cfg, secrets, tlsFlags) {
  if (!cfg || typeof cfg !== 'object') return;
  function walk(obj, path) {
    if (!obj || typeof obj !== 'object') return;
    if (Array.isArray(obj)) { obj.forEach((v, idx) => walk(v, path + '[' + idx + ']')); return; }
    for (const [k, v] of Object.entries(obj)) {
      const p = path ? path + '.' + k : k;
      const lk = String(k).toLowerCase();
      const isSecretKey = SECRET_KEY_RE.test(lk) || UNDERSCORE_SECRET_RE.test(k);
      if (isSecretKey && v !== null && v !== undefined && typeof v !== 'object') {
        const val = String(v);
        const isEnv = ENV_INTERP_RE.test(val.trim());
        secrets.push({ component: name, category: cat, key: p, value: val, isEnv });
      } else if (lk === 'tls' && v && typeof v === 'object') {
        if (v.verify_certificate === false) {
          tlsFlags.push({ component: name, key: 'tls.verify_certificate', value: false });
        }
        if (v.verify_hostname === false) {
          tlsFlags.push({ component: name, key: 'tls.verify_hostname', value: false });
        }
      }
      walk(v, p);
    }
  }
  walk(cfg, '');
}

function buildSummary(doc, components, filename) {
  return {
    filename: filename || '',
    sources: components.sources.length,
    transforms: components.transforms.length,
    sinks: components.sinks.length,
    total: components.sources.length + components.transforms.length + components.sinks.length,
    data_dir: (doc && doc.data_dir) || ''
  };
}

function analyzeFlags(doc, components) {
  const flags = [];
  const nameSet = new Set();
  for (const cat of CATEGORIES) for (const c of components[cat]) nameSet.add(c.name);

  // dangling inputs
  for (const cat of CATEGORIES) {
    for (const c of components[cat]) {
      for (const inp of c.inputs) {
        if (!nameSet.has(inp)) {
          flags.push({ level: 'bad', label: 'dangling input', detail: cat.slice(0,-1) + ' "' + c.name + '" references input "' + inp + '" which is not defined in sources/transforms/sinks.' });
        }
      }
    }
  }

  // orphan sources (never referenced) and sinks with no inputs
  const referenced = new Set();
  for (const cat of CATEGORIES) for (const c of components[cat]) for (const inp of c.inputs) referenced.add(inp);

  for (const c of components.sources) {
    if (!referenced.has(c.name)) {
      flags.push({ level: 'warn', label: 'orphan source', detail: 'Source "' + c.name + '" is not consumed by any transform or sink.' });
    }
  }
  for (const c of components.sinks) {
    if (!c.inputs.length) {
      flags.push({ level: 'warn', label: 'sink no inputs', detail: 'Sink "' + c.name + '" has no inputs — it will not receive any events.' });
    }
  }
  for (const c of components.transforms) {
    if (!c.inputs.length) {
      flags.push({ level: 'warn', label: 'transform no inputs', detail: 'Transform "' + c.name + '" has no inputs.' });
    } else if (!referenced.has(c.name)) {
      flags.push({ level: 'warn', label: 'orphan transform', detail: 'Transform "' + c.name + '" is not consumed by any sink or downstream transform.' });
    }
  }

  // secret scan
  const secrets = [];
  const tlsFlags = [];
  for (const cat of CATEGORIES) for (const c of components[cat]) scanComponent(cat, c.name, c.cfg, secrets, tlsFlags);

  const plaintextSecrets = secrets.filter(s => !s.isEnv);
  for (const s of plaintextSecrets) {
    flags.push({ level: 'warn', label: 'plaintext secret', detail: s.component + ': ' + s.key + ' is a literal value, not an ${ENV} interpolation.' });
  }
  for (const t of tlsFlags) {
    flags.push({ level: 'bad', label: 'insecure TLS', detail: t.component + ': ' + t.key + ' = false — certificate/hostname verification disabled.' });
  }

  // duplicate names within a category
  for (const cat of CATEGORIES) {
    const seen = new Set();
    for (const c of components[cat]) {
      if (seen.has(c.name)) flags.push({ level: 'bad', label: 'duplicate ' + cat.slice(0,-1), detail: 'Name "' + c.name + '" appears more than once in ' + cat + '.' });
      seen.add(c.name);
    }
  }

  if (!flags.length) flags.push({ level: 'ok', label: 'no major flags', detail: 'Heuristic checks found nothing loud.' });
  return { flags, secrets, tlsFlags };
}

function flattenRows(components) {
  const rows = [];
  for (const cat of CATEGORIES) {
    for (const c of components[cat]) {
      rows.push({
        section: cat,
        name: c.name,
        type: c.type,
        inputs: c.inputs.join(', '),
        detail: c.detail,
        line: c.line
      });
    }
  }
  return rows;
}

function plainSummary(st) {
  const s = st.summary;
  const lines = [];
  lines.push('KSI Tools Vector Config Viewer — summary');
  lines.push('File: ' + (s.filename || currentFileName || '(paste)'));
  lines.push('Format: ' + st.format);
  lines.push('sources:' + s.sources + ' transforms:' + s.transforms + ' sinks:' + s.sinks + ' (total ' + s.total + ')');
  if (s.data_dir) lines.push('data_dir: ' + s.data_dir);
  lines.push('');
  // pipeline chains: trace each sink back to its sources
  const byName = {};
  for (const cat of CATEGORIES) for (const c of st.components[cat]) byName[c.name] = c;
  function trace(name, seen) {
    if (seen.has(name)) return ['<cycle:' + name + '>'];
    seen.add(name);
    const c = byName[name];
    if (!c) return ['<missing:' + name + '>'];
    if (!c.inputs.length) return [name + ' (' + c.type + ')'];
    const upstream = [];
    for (const inp of c.inputs) {
      const sub = trace(inp, new Set(seen));
      for (const p of sub) upstream.push(p + ' → ' + name + ' (' + c.type + ')');
    }
    if (!upstream.length) return [name + ' (' + c.type + ')'];
    return upstream;
  }
  lines.push('Pipeline chains (source → … → sink):');
  if (!st.components.sinks.length && !st.components.transforms.length) {
    for (const c of st.components.sources) lines.push('  ' + c.name + ' (' + c.type + ') — no downstream consumers');
  } else {
    for (const sink of st.components.sinks) {
      const chains = trace(sink.name, new Set());
      for (const ch of chains) lines.push('  ' + ch);
    }
  }
  lines.push('');
  lines.push('Flags:');
  for (const f of st.flags) lines.push('  [' + f.level + '] ' + f.label + (f.detail ? ' — ' + f.detail : ''));
  if (st.secrets && st.secrets.length) {
    lines.push('');
    lines.push('Secrets (' + st.secrets.length + '):');
    for (const sec of st.secrets) lines.push('  ' + sec.component + '.' + sec.key + ' = ' + (sec.isEnv ? '(env)' : '(plaintext — masked)'));
  }
  return lines.join('\n');
}

function exportJson(st) {
  return {
    format: st.format,
    summary: st.summary,
    flags: st.flags.map(f => ({ level: f.level, label: f.label, detail: f.detail })),
    secrets: st.secrets.map(s => ({ component: s.component, key: s.key, isEnv: s.isEnv })),
    tls: st.tlsFlags,
    sources: st.components.sources,
    transforms: st.components.transforms,
    sinks: st.components.sinks
  };
}

function highlight(text, q) {
  if (!q) return esc(text);
  const s = String(text ?? '');
  const low = s.toLowerCase();
  const idx = low.indexOf(q);
  if (idx < 0) return esc(s);
  return esc(s.slice(0, idx)) + '<span class="hit">' + esc(s.slice(idx, idx + q.length)) + '</span>' + esc(s.slice(idx + q.length));
}

function contextHtml(lineNo) {
  const i = lineNo - 1;
  const from = Math.max(0, i - 3);
  const to = Math.min(rawLines.length - 1, i + 3);
  let html = '';
  for (let n = from; n <= to; n++) {
    const cur = n === i ? ' cur' : '';
    html += '<span class="ctx-line' + cur + '">' + esc(String(n + 1).padStart(4, ' ')) + ' │ ' + esc(rawLines[n]) + '</span>';
  }
  return html;
}

function filteredRows() {
  if (!state) return [];
  const q = searchIn.value.trim().toLowerCase();
  if (!q) return state.rows;
  return state.rows.filter(r => (r.section + ' ' + r.name + ' ' + r.type + ' ' + r.inputs + ' ' + r.detail).toLowerCase().includes(q));
}

function drawDag(components, flags) {
  // Build a missing-input lookup
  const nameSet = new Set();
  for (const cat of CATEGORIES) for (const c of components[cat]) nameSet.add(c.name);
  // Build outputs map (who consumes each component)
  const outputs = {};
  for (const cat of CATEGORIES) for (const c of components[cat]) outputs[c.name] = [];
  for (const cat of CATEGORIES) {
    for (const c of components[cat]) {
      for (const inp of c.inputs) {
        if (outputs[inp]) outputs[inp].push(c.name);
      }
    }
  }
  const orphanSources = new Set(components.sources.filter(c => !outputs[c.name] || !outputs[c.name].length).map(c => c.name));
  function badgeFor(n) {
    if (!nameSet.has(n)) return 'badge missing';
    return 'badge';
  }
  function renderComp(c) {
    let row = '<div class="comp-row">';
    row += '<span class="cname">' + esc(c.name) + '</span>';
    row += '<span class="ctype">' + esc(c.type) + '</span>';
    // inputs
    row += '<span class="cedges"><span class="clabel">in:</span>';
    if (!c.inputs.length) row += ' <span class="hint">—</span>';
    for (const inp of c.inputs) row += ' <span class="' + badgeFor(inp) + '" title="input">' + esc(inp) + '</span>';
    row += '</span>';
    // outputs
    const outs = outputs[c.name] || [];
    row += '<span class="cedges"><span class="clabel">out:</span>';
    if (!outs.length) {
      if (c.section === 'sources') row += ' <span class="badge dead">orphan</span>';
      else if (c.section === 'sinks') row += ' <span class="hint">—</span>';
      else row += ' <span class="badge dead">unused</span>';
    } else {
      for (const o of outs) row += ' <span class="' + badgeFor(o) + '" title="output">' + esc(o) + '</span>';
    }
    row += '</span>';
    row += '<span class="cdetail">' + esc(c.detail) + '</span>';
    row += '</div>';
    return row;
  }
  // attach section label
  for (const c of components.sources) c.section = 'sources';
  for (const c of components.transforms) c.section = 'transforms';
  for (const c of components.sinks) c.section = 'sinks';
  let html = '<div class="comp-list">';
  if (components.sources.length) {
    html += '<div class="clabel" style="margin-top:4px">Sources</div>';
    for (const c of components.sources) html += renderComp(c);
  }
  if (components.transforms.length) {
    html += '<div class="clabel" style="margin-top:8px">Transforms</div>';
    for (const c of components.transforms) html += renderComp(c);
  }
  if (components.sinks.length) {
    html += '<div class="clabel" style="margin-top:8px">Sinks</div>';
    for (const c of components.sinks) html += renderComp(c);
  }
  if (!components.sources.length && !components.transforms.length && !components.sinks.length) {
    html += '<span class="hint">No sources/transforms/sinks detected.</span>';
  }
  html += '</div>';
  return html;
}

function drawComponents(components) {
  const labels = { sources: 'Sources', transforms: 'Transforms', sinks: 'Sinks' };
  let html = '';
  for (const cat of CATEGORIES) {
    const list = components[cat];
    if (!list.length) continue;
    html += '<div class="card"><h2>' + esc(labels[cat]) + ' (' + list.length + ')</h2><div class="body" style="padding:0">';
    html += '<table class="grid"><thead><tr><th>Name</th><th>Type</th><th>Inputs</th><th>Key fields</th></tr></thead><tbody>';
    for (const c of list) {
      html += '<tr>' +
        '<td class="key">' + esc(c.name) + '</td>' +
        '<td class="typ">' + esc(c.type) + '</td>' +
        '<td>' + (c.inputs.length ? esc(c.inputs.join(', ')) : '<span class="hint">—</span>') + '</td>' +
        '<td>' + esc(c.detail) + '</td></tr>';
    }
    html += '</tbody></table></div></div>';
  }
  return html;
}

function drawSecrets(secrets, tlsFlags) {
  if (!secrets.length && !tlsFlags.length) {
    return '<div class="card"><h2>Secrets &amp; TLS</h2><div class="body"><span class="badge ok">none detected</span></div></div>';
  }
  let html = '<div class="card"><h2>Secrets &amp; TLS</h2><div class="body">';
  if (secrets.length) {
    html += '<table class="grid"><thead><tr><th>Component</th><th>Key</th><th>Value</th><th>Flag</th></tr></thead><tbody>';
    for (const s of secrets) {
      const flag = s.isEnv
        ? '<span class="badge ok">env</span>'
        : '<span class="badge warn">plaintext</span>';
      html += '<tr>' +
        '<td class="key">' + esc(s.component) + '</td>' +
        '<td>' + esc(s.key) + '</td>' +
        '<td class="masked">' + esc('\u2022'.repeat(8)) + '</td>' +
        '<td>' + flag + '</td></tr>';
    }
    html += '</tbody></table>';
  }
  if (tlsFlags.length) {
    html += '<div class="flags-row" style="margin-top:10px">';
    for (const t of tlsFlags) {
      html += '<span class="badge bad" title="' + esc(t.component) + '">' + esc(t.component) + ': ' + esc(t.key) + '=false</span>';
    }
    html += '</div>';
  }
  html += '</div></div>';
  return html;
}

function draw() {
  if (!state) return;
  const q = searchIn.value.trim().toLowerCase();
  const list = filteredRows();
  const s = state.summary;

  const cards = [];
  cards.push({ lbl: 'Format', val: state.format.toUpperCase() });
  cards.push({ lbl: 'Sources', val: String(s.sources) });
  cards.push({ lbl: 'Transforms', val: String(s.transforms) });
  cards.push({ lbl: 'Sinks', val: String(s.sinks) });
  cards.push({ lbl: 'Total components', val: String(s.total) });
  if (s.data_dir) cards.push({ lbl: 'data_dir', val: s.data_dir });
  const secretCount = state.secrets.length;
  const tlsCount = state.tlsFlags.length;
  if (secretCount) cards.push({ lbl: 'Secret keys', val: String(secretCount) });
  if (tlsCount) cards.push({ lbl: 'Insecure TLS', val: String(tlsCount) });

  statsEl.style.display = 'flex';
  statsEl.innerHTML = cards.map(c =>
    '<div class="stat"><span class="lbl">' + esc(c.lbl) + '</span><b>' + esc(c.val) + '</b></div>'
  ).join('');

  const warnCount = state.flags.filter(f => f.level === 'bad' || f.level === 'warn').length;
  metaEl.textContent = state.rows.length + ' rows · ' +
    (warnCount ? warnCount + ' flag' + (warnCount === 1 ? '' : 's') : 'no flags') +
    (q ? ' · ' + list.length + ' shown' : '');

  noticeEl.style.display = 'block';
  noticeEl.textContent = 'Heuristic Vector review; verify with `vector validate <config>` on the server.';

  let html = '';

  // flags
  html += '<div class="card"><h2>Flags</h2><div class="body"><div class="flags-row">';
  for (const f of state.flags) {
    html += '<span class="badge ' + esc(f.level) + '" title="' + esc(f.detail || '') + '">' + esc(f.label) + '</span>';
  }
  html += '</div>';
  html += '<ul style="margin:10px 0 0;padding-left:18px;font-size:12.5px;color:inherit">';
  for (const f of state.flags) {
    if (f.level === 'ok') continue;
    html += '<li><strong>' + esc(f.label) + '</strong> — ' + esc(f.detail || '') + '</li>';
  }
  html += '</ul></div></div>';

  // DAG
  html += '<div class="card"><h2>Pipeline DAG · sources → transforms → sinks</h2><div class="body">';
  html += drawDag(state.components, state.flags);
  html += '</div></div>';

  // secrets & TLS
  html += drawSecrets(state.secrets, state.tlsFlags);

  // component tables
  html += drawComponents(state.components);

  // main table
  html += '<div class="card"><h2>Components table</h2><div class="body" style="padding:0">';
  html += '<table class="grid"><thead><tr><th>Line</th><th>Section</th><th>Name</th><th>Type</th><th>Inputs</th><th>Detail</th></tr></thead><tbody id="tbody">';
  for (const r of list) {
    const lineCell = r.line ? '<td class="ln">' + r.line + '</td>' : '<td class="ln">n/a</td>';
    html += '<tr data-line="' + (r.line || '') + '"' + (r.line ? '' : ' data-na="1"') + '>' +
      lineCell +
      '<td class="sec">' + highlight(r.section, q) + '</td>' +
      '<td class="key">' + highlight(r.name, q) + '</td>' +
      '<td class="typ">' + highlight(r.type, q) + '</td>' +
      '<td>' + highlight(r.inputs, q) + '</td>' +
      '<td>' + highlight(r.detail, q) + '</td></tr>';
  }
  if (!list.length) {
    html += '<tr><td colspan="6" style="color:#8b949e;padding:16px">No rows match the filter.</td></tr>';
  }
  html += '</tbody></table></div></div>';

  html += '<div class="card" id="ctxcard" style="display:none"><h2>Line context</h2><div class="body"><pre class="block" id="ctxpre"></pre></div></div>';

  panel.innerHTML = html;
  panel.classList.add('show');

  const tbody = document.getElementById('tbody');
  if (tbody) {
    tbody.addEventListener('click', e => {
      const tr = e.target.closest('tr[data-line]');
      if (!tr) return;
      const line = +tr.getAttribute('data-line');
      if (!line) return;
      tbody.querySelectorAll('tr.selected').forEach(x => x.classList.remove('selected'));
      tr.classList.add('selected');
      const card = document.getElementById('ctxcard');
      const pre = document.getElementById('ctxpre');
      if (card && pre) {
        card.style.display = 'block';
        pre.innerHTML = contextHtml(line);
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    });
  }
}

function render(text, name) {
  showLoading('Parsing Vector config…');
  afterPaint(() => {
    try {
      clearError();
      cacheLines(text);
      const format = detectFormat(text);
      let doc;
      if (format === 'toml') {
        doc = parseToml(text);
      } else {
        if (typeof window.jsyaml === 'undefined') throw new Error('js-yaml library not loaded.');
        try { doc = window.jsyaml.load(text); } catch (ye) { throw new Error('YAML parse error: ' + (ye.message || ye)); }
      }
      if (!doc || typeof doc !== 'object') throw new Error('Config did not parse to a mapping at the top level.');
      if (!CATEGORIES.some(c => doc[c] && typeof doc[c] === 'object' && Object.keys(doc[c]).length)) {
        throw new Error('No sources/transforms/sinks maps found — not a Vector config?');
      }

      currentFileName = name || '(paste)';
      currentName = (name || 'vector-config').replace(/\.(yaml|yml|toml)$/i, '');

      const components = collectComponents(doc);
      const summary = buildSummary(doc, components, currentFileName);
      const { flags, secrets, tlsFlags } = analyzeFlags(doc, components);
      const rows = flattenRows(components);
      state = { format, summary, flags, components, secrets, tlsFlags, rows };

      fname.textContent = currentFileName;
      document.title = currentName + ' — KSI Tools Vector Config Viewer';
      drop.style.display = 'none';
      document.querySelector('.paste-box').style.display = 'none';
      searchIn.disabled = false;
      Object.values(btns).forEach(b => b.disabled = false);
      searchIn.value = '';
      draw();
    } catch (e) {
      showError(e.message || String(e));
      statsEl.style.display = 'none';
      panel.classList.remove('show');
    }
    hideLoading();
  });
}

function loadFile(file) {
  if (!file) return;
  if (file.size > MAX_BYTES) {
    showError('That file is ' + fmtBytes(file.size) + ', over the ' + fmtBytes(MAX_BYTES) + ' limit for Vector configs.');
    return;
  }
  showLoading('Reading ' + file.name + '…');
  const r = new FileReader();
  r.onload = () => render(String(r.result || ''), file.name);
  r.onerror = () => { hideLoading(); showError('Could not read the file.'); };
  r.readAsText(file);
}

wireDrop(loadFile);
document.getElementById('goBtn').onclick = () => {
  const t = pasteEl.value;
  if (!t.trim()) { showError('Paste a Vector config first.'); return; }
  render(t, '(paste)');
};
searchIn.addEventListener('input', () => { clearTimeout(searchIn._t); searchIn._t = setTimeout(draw, 120); });

btns.copy.onclick = async () => {
  if (!state) return;
  try {
    await navigator.clipboard.writeText(plainSummary(state));
    const old = btns.copy.textContent;
    btns.copy.textContent = 'Copied!';
    setTimeout(() => { btns.copy.textContent = old; }, 1200);
  } catch (e) {
    alert('Copy failed — browser blocked clipboard access.');
  }
};

btns.savejson.onclick = () => {
  if (!state) return;
  download(currentName + '.json', JSON.stringify(exportJson(state), null, 2), 'application/json');
};

// Self-test: parse the three representative samples without throwing (no DOM render).
(function selfTest() {
  try {
    const samples = [
      // 1. YAML happy path: file → remap → filter → ES with TLS
      'sources:\n  my_logs:\n    type: file\n    include: ["/var/log/*.log"]\n    ignore_older_secs: 86400\n' +
      'transforms:\n  parse_json:\n    type: remap\n    inputs: ["my_logs"]\n    source: |\n      . = parse_json!(.message)\n' +
      '  drop_noise:\n    type: filter\n    inputs: ["parse_json"]\n    condition: \'.level != "debug"\'\n' +
      'sinks:\n  es:\n    type: elasticsearch\n    inputs: ["drop_noise"]\n    endpoint: "https://es.example.com"\n' +
      '    auth: { strategy: "basic", user: "${ES_USER}", password: "${ES_PASS}" }\n    tls: { verify_certificate: true }\n' +
      'data_dir: /var/lib/vector\n',
      // 2. insecure TLS + plaintext password
      'sources:\n  s1:\n    type: stdin\ntransforms:\n  t1:\n    type: remap\n    inputs: ["s1"]\n    source: "x = 1"\n' +
      'sinks:\n  bad:\n    type: http\n    inputs: ["t1"]\n    uri: "https://insecure.example.com"\n    auth: { password: hunter2 }\n    tls: { verify_certificate: false, verify_hostname: false }\n',
      // 3. dangling input + orphan source
      'sources:\n  src_a:\n    type: file\n    include: ["/var/log/x.log"]\n  src_b:\n    type: file\n    include: ["/var/log/y.log"]\n' +
      'transforms:\n  bad_t:\n    type: filter\n    inputs: ["does_not_exist"]\n    condition: "true"\n' +
      'sinks:\n  out:\n    type: stdout\n    inputs: ["bad_t"]\n',
      // 4. TOML variant
      '[sources.my_logs]\ntype = "file"\ninclude = ["/var/log/*.log"]\n\n[transforms.parse_json]\ntype = "remap"\ninputs = ["my_logs"]\nsource = """\\n. = parse_json!(.message)\\n"""\n\n[sinks.es]\ntype = "elasticsearch"\ninputs = ["parse_json"]\nendpoint = "https://es.example.com"\n[sinks.es.tls]\nverify_certificate = true\ndata_dir = "/var/lib/vector"\n'
    ];
    for (const txt of samples) {
      const fmt = detectFormat(txt);
      const doc = (fmt === 'toml') ? parseToml(txt) : window.jsyaml.load(txt);
      if (!doc || typeof doc !== 'object') throw new Error('sample did not map');
      const comps = collectComponents(doc);
      const { flags, secrets, tlsFlags } = analyzeFlags(doc, comps);
      if (!comps.sources.length && !comps.sinks.length) throw new Error('no components parsed');
      // sanity: sample 2 should flag insecure TLS + plaintext secret
      // (not asserting hard, just ensuring no throw)
      void flags; void secrets; void tlsFlags;
    }
    window.__vectorViewerSelfTest = 'PASS';
  } catch (e) {
    window.__vectorViewerSelfTest = 'FAIL: ' + (e.message || e);
  }
})();

})();
